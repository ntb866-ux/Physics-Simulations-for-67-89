<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chuyển hoá năng lượng</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Phòng thí nghiệm năng lượng (KHTN 6): dải video thực tế, sân khấu canvas bên trái, sổ ghi chép bên phải. Điện thoại xếp một cột.
   Màu các dạng năng lượng dùng thống nhất cho cả 4 tab. */
:root{
  --bg:#eef0ec; --panel:#ffffff; --lane:#f5f6f2; --ink:#171d16; --muted:#586255; --line:#cdd3c8;
  --accent:#2f6b2a; --accent-ink:#ffffff; --ok:#1d8a4b; --warn:#c2410c;
  --space:#101a12; --star:#eaf1e8;
  --eElec:#2d6fdb; --eLight:#e6b400; --eHeat:#e0452b; --eKin:#16a06a; --ePot:#7b4fd1; --eChem:#8d5a2b; --eSound:#d23d92; --eEl:#0ea5b7;
  --sky:#cfe4f5; --ground:#a9c98a; --water:#5aa3dd; --metal:#8b96a3; --metal2:#5b6673;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f130e; --panel:#171d16; --lane:#121711; --ink:#e4ebe1; --muted:#9aa696; --line:#2c3629;
  --accent:#7cc46f; --accent-ink:#0b1f08; --ok:#47c47d; --warn:#f08a4b;
  --space:#070b07; --star:#dfe8dc;
  --eElec:#5b97ff; --eLight:#ffd23f; --eHeat:#ff6a4d; --eKin:#33cc8c; --ePot:#a585ff; --eChem:#c98b52; --eSound:#ff6bb8; --eEl:#3fd0e0;
  --sky:#1d2e3d; --ground:#3b5530; --water:#3b7fb8; --metal:#7c8794; --metal2:#a9b4c1;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f130e; --panel:#171d16; --lane:#121711; --ink:#e4ebe1; --muted:#9aa696; --line:#2c3629;
  --accent:#7cc46f; --accent-ink:#0b1f08; --ok:#47c47d; --warn:#f08a4b;
  --space:#070b07; --star:#dfe8dc;
  --eElec:#5b97ff; --eLight:#ffd23f; --eHeat:#ff6a4d; --eKin:#33cc8c; --ePot:#a585ff; --eChem:#c98b52; --eSound:#ff6bb8; --eEl:#3fd0e0;
  --sky:#1d2e3d; --ground:#3b5530; --water:#3b7fb8; --metal:#7c8794; --metal2:#a9b4c1;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(25px,3.4vw,36px);line-height:1.15;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:700}
.btn{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{min-height:40px;padding:4px 12px;font-size:14px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg .btn{border:0;border-radius:0;min-width:52px}
.seg.wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;border:0;background:none}
.seg.wide .btn{border:1px solid var(--line);border-radius:8px;text-align:left;font-size:14px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-size:15px;font-weight:600;white-space:nowrap;min-height:46px;padding:8px 14px;border:0;border-bottom:3px solid transparent;
  background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.req{margin:0;font-size:14px;color:var(--muted);max-width:110ch}
.req b{color:var(--ink);font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;align-items:start}
@media (max-width:1020px){.lab{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0}
canvas{display:block;width:100%;border-radius:8px;background:var(--lane);touch-action:pan-y;user-select:none;-webkit-user-select:none}
#cv2{touch-action:none;cursor:grab}
.hint{margin:0;font-size:14px;color:var(--muted)}
.status{margin:0;font-weight:600;min-height:1.5em}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:8px;border-radius:3px;margin-right:6px;vertical-align:middle}
.sl{display:flex;flex-direction:column;gap:2px}
.sl .top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.sl .val{font-family:var(--font-num);font-weight:600;text-align:right}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);margin:0}
.kv{display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:4px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kv dd.t{font-family:var(--font-ui);font-weight:600;white-space:normal;grid-column:1/-1;text-align:left;margin:-2px 0 4px 12px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts .btn{text-align:left;font-size:14px}
.opts .btn.picked{border:2px solid var(--accent)}
.opts .btn.right{background:color-mix(in srgb,var(--ok) 18%,var(--panel));border-color:var(--ok)}
.ans{background:var(--lane);border-left:4px solid var(--ok);padding:8px 12px;border-radius:6px;font-size:15px}
.muted{color:var(--muted);font-size:14px}
.chain{font-size:15px;font-weight:600;line-height:1.6}
.chain span{display:inline-block;padding:1px 8px;border-radius:6px;color:#fff;margin:1px 0}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:0 14px}
details[open]{padding-bottom:12px}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;font-size:15px}
details p,details ul,details ol{margin:6px 0;font-size:15px;max-width:95ch}
details ul,details ol{padding-left:22px}
details li{margin:3px 0}
.fine{font-size:13px;color:var(--muted);margin:0}
.tblwrap{overflow-x:auto}
table.log{border-collapse:collapse;width:100%;font-size:14px}
table.log th,table.log td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.log th{color:var(--muted);font-weight:600}
table.log td.n{font-family:var(--font-num);text-align:right}
/* Thanh năng lượng */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:118px minmax(0,1fr) 74px;gap:8px;align-items:center;font-size:14px}
.bar .tr{height:18px;border-radius:5px;background:var(--lane);border:1px solid var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;width:0}
.bar b{font-family:var(--font-num);font-weight:600;text-align:right;font-size:13.5px}
.bar.tot{border-top:1px dashed var(--line);padding-top:6px}
/* Phân loại nguồn */
.sort{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}
.srow .yn{display:flex;gap:4px}
.srow .btn{min-height:40px;padding:4px 10px;font-size:13.5px}
.srow .btn.good{background:color-mix(in srgb,var(--ok) 20%,var(--panel));border-color:var(--ok)}
.srow .btn.bad{background:color-mix(in srgb,var(--warn) 20%,var(--panel));border-color:var(--warn)}
.srow .why{grid-column:1/-1;font-size:13px;color:var(--muted)}
/* Ngôi nhà */
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.app{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--lane)}
.app .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.app .hd b{font-family:var(--font-num);font-size:14px;white-space:nowrap}
.app.saved{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.app.more{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
.app .seg .btn{min-width:0;font-size:13.5px;padding:6px 10px;min-height:40px}
.goal{height:22px;border-radius:6px;background:var(--lane);border:1px solid var(--line);overflow:hidden;position:relative}
.goal i{display:block;height:100%;width:0;background:var(--ok)}
.goal span{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);left:30%}
.big{font-family:var(--font-num);font-size:clamp(24px,3.6vw,34px);font-weight:600;line-height:1.1}
.meas{margin:0;padding-left:20px;font-size:14.5px}
.meas li{margin:3px 0}
.meas .up{color:var(--warn)}
/* Dải video thực tế */
.vbox{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;align-items:start;background:var(--space);color:var(--star);border-radius:var(--r);padding:12px}
.vbox.playing{grid-template-columns:minmax(0,1fr)}
@media (max-width:720px){.vbox{grid-template-columns:minmax(0,1fr)}}
.vmedia{position:relative;width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#24361f,#0b120a)}
.vbox.playing .vmedia{max-width:860px}
.thumb{all:unset;cursor:pointer;position:absolute;inset:0;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;left:10px;bottom:8px;font-size:13px;opacity:.75}
.thumb .pbtn{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#d1323b;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.thumb .pbtn::before{content:"";position:absolute;left:25px;top:20px;border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #fff}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font:600 13px var(--font-num);padding:2px 6px;border-radius:4px}
.thumb:focus-visible{outline:3px solid var(--star);outline-offset:-3px}
.player{position:absolute;inset:0}
.player video,.player iframe{width:100%;height:100%;border:0;display:block;background:#000}
.vt{display:flex;flex-direction:column;gap:4px;min-width:0}
.vt .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;font-weight:600}
.vt .ttl{font-weight:700;font-size:16px;line-height:1.3}
.vt .look{font-size:14px;opacity:.92}
.vt .src{font-size:12.5px;opacity:.7}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font:inherit;font-size:14px;font-weight:600;min-height:40px;padding:6px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;
  background:transparent;color:var(--star);border:1px solid color-mix(in srgb,var(--star) 45%,transparent)}
.chip.on{background:var(--star);color:var(--space)}
body.hideNums .num{filter:blur(7px);user-select:none}
body.hideNums .num:hover{filter:none}
footer{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="hbtns">
      <button class="btn" id="gvBtn" aria-pressed="false" data-i18n="gvBtn"></button>
      <button class="btn" id="langBtn">EN</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="1" data-i18n="tab1"></button>
    <button role="tab" data-tab="2" data-i18n="tab2"></button>
    <button role="tab" data-tab="3" data-i18n="tab3"></button>
    <button role="tab" data-tab="4" data-i18n="tab4"></button>
  </nav>

  <!-- ===================== TAB 1: CHUYỂN HOÁ VÀ HAO PHÍ ===================== -->
  <section id="t1" class="col">
    <p class="req" data-i18n-html="req1"></p>
    <div class="vbox" id="v1"></div>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint1"></p>
        <canvas id="cv1" aria-label="energy flowing into a device and splitting into useful and wasted energy"></canvas>
        <div class="controls">
          <button class="btn primary" id="run1"></button>
          <button class="btn" id="rst1" data-i18n="reset"></button>
          <div class="seg" id="spd1"></div>
          <label class="chk"><input type="checkbox" id="th1"><span data-i18n="thermal"></span></label>
        </div>
        <p class="status" id="st1"></p>
        <canvas id="sk1" aria-label="energy flow diagram"></canvas>
        <p class="fine" data-i18n="assume1"></p>
      </div>
      <div class="col">
        <div class="card" id="p1"></div>
        <div class="card"><h2 data-i18n="pickDev"></h2><div class="seg wide" id="dev1"></div><p class="chain" id="chain1"></p></div>
        <div class="card"><h2 data-i18n="data"></h2><dl class="kv" id="kv1"></dl></div>
        <div class="card" id="c1"></div>
      </div>
    </div>
    <details><summary data-i18n="whyT"></summary><div data-i18n-html="why1"></div></details>
    <details><summary data-i18n="misT"></summary><div data-i18n-html="mis1"></div></details>
    <details><summary data-i18n="wordT"></summary><div data-i18n-html="word1"></div></details>
  </section>

  <!-- ===================== TAB 2: BẢO TOÀN NĂNG LƯỢNG ===================== -->
  <section id="t2" class="col" hidden>
    <p class="req" data-i18n-html="req2"></p>
    <div class="vbox" id="v2"></div>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint2"></p>
        <canvas id="cv2" aria-label="a ball dropped on the floor, drag it up to set the drop height"></canvas>
        <div class="controls">
          <button class="btn primary" id="run2"></button>
          <button class="btn" id="rst2" data-i18n="reset"></button>
          <div class="seg" id="slow2"></div>
          <div class="seg" id="mode2"></div>
        </div>
        <canvas id="gr2" aria-label="stacked graph of energy forms against time"></canvas>
        <div class="legend" id="lg2"></div>
        <p class="fine" data-i18n="assume2"></p>
      </div>
      <div class="col">
        <div class="card" id="p2"></div>
        <div class="card"><h2 data-i18n="pickBall"></h2><div class="seg wide" id="ball2"></div></div>
        <div class="card"><h2 data-i18n="bars2"></h2><div class="bars" id="bars2"></div></div>
        <div class="card"><h2 data-i18n="data"></h2><dl class="kv" id="kv2"></dl>
          <div class="tblwrap"><table class="log" id="tb2"></table></div></div>
        <div class="card" id="p2b"></div>
        <div class="card" id="c2"></div>
      </div>
    </div>
    <details><summary data-i18n="whyT"></summary><div data-i18n-html="why2"></div></details>
    <details><summary data-i18n="misT"></summary><div data-i18n-html="mis2"></div></details>
  </section>

  <!-- ===================== TAB 3: NĂNG LƯỢNG TÁI TẠO ===================== -->
  <section id="t3" class="col" hidden>
    <p class="req" data-i18n-html="req3"></p>
    <div class="vbox" id="v3"></div>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint3"></p>
        <canvas id="cv3" aria-label="landscape with a power source and houses lit by its electricity"></canvas>
        <div class="controls">
          <button class="btn primary" id="run3"></button>
          <button class="btn" id="rst3" data-i18n="reset"></button>
          <div class="seg" id="spd3"></div>
        </div>
        <canvas id="gr3" aria-label="graph of power from each source over three days"></canvas>
        <div class="legend" id="lg3"></div>
        <p class="fine" data-i18n="assume3"></p>
      </div>
      <div class="col">
        <div class="card" id="p3"></div>
        <div class="card"><h2 data-i18n="pickSrc"></h2><div class="seg wide" id="src3"></div>
          <div id="sl3sun" class="col">
            <div class="sl"><div class="top"><span data-i18n="sN"></span><span class="val" id="sNV"></span></div><input type="range" id="sN" min="1" max="20" step="1" value="10"></div>
            <div class="sl"><div class="top"><span data-i18n="sCloud"></span><span class="val" id="sCloudV"></span></div><input type="range" id="sCloud" min="0" max="100" step="5" value="20"></div>
          </div>
          <div id="sl3wind" class="col" hidden>
            <div class="sl"><div class="top"><span data-i18n="wV"></span><span class="val" id="wVV"></span></div><input type="range" id="wV" min="0" max="28" step="0.5" value="6"></div>
          </div>
          <div id="sl3hyd" class="col" hidden>
            <div class="sl"><div class="top"><span data-i18n="hH"></span><span class="val" id="hHV"></span></div><input type="range" id="hH" min="2" max="40" step="1" value="10"></div>
            <div class="sl"><div class="top"><span data-i18n="hQ"></span><span class="val" id="hQV"></span></div><input type="range" id="hQ" min="0.02" max="0.3" step="0.01" value="0.1"></div>
            <div><div class="muted" data-i18n="hRain"></div><div class="seg" id="rain3"></div></div>
          </div>
          <div id="sl3coal" class="col" hidden>
            <div class="sl"><div class="top"><span data-i18n="cP"></span><span class="val" id="cPV"></span></div><input type="range" id="cP" min="1" max="10" step="0.5" value="5"></div>
          </div>
        </div>
        <div class="card"><h2 data-i18n="data"></h2><dl class="kv" id="kv3"></dl></div>
        <div class="card" id="c3"></div>
      </div>
    </div>
    <div class="card"><h2 data-i18n="sortT"></h2><p class="muted" data-i18n="sortHint"></p><div class="sort" id="sort3"></div><p class="status" id="sortSt"></p></div>
    <details><summary data-i18n="whyT"></summary><div data-i18n-html="why3"></div></details>
    <details><summary data-i18n="misT"></summary><div data-i18n-html="mis3"></div></details>
  </section>

  <!-- ===================== TAB 4: TIẾT KIỆM NĂNG LƯỢNG ===================== -->
  <section id="t4" class="col" hidden>
    <p class="req" data-i18n-html="req4"></p>
    <div class="vbox" id="v4"></div>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint4"></p>
        <canvas id="cv4" aria-label="a house with its electrical appliances and an electricity meter"></canvas>
        <div class="controls"><button class="btn" id="rst4" data-i18n="reset4"></button><button class="btn" id="best4" data-i18n="best4"></button></div>
        <div class="apps" id="apps4"></div>
        <p class="fine" data-i18n="assume4"></p>
      </div>
      <div class="col">
        <div class="card" id="p4"></div>
        <div class="card"><h2 data-i18n="bill4"></h2>
          <div class="big num" id="bill4"></div>
          <dl class="kv" id="kv4"></dl>
          <div class="muted" data-i18n="goal4"></div>
          <div class="goal"><i id="goal4"></i><span></span></div>

p1q:'Bóng đèn sợi đốt 60 W đang sáng. Phần lớn điện năng cung cấp cho bóng biến thành dạng nào?',p1a:'Quang năng (ánh sáng)',p1b:'Nhiệt năng (làm nóng bóng đèn và không khí)',p1c:'Mỗi dạng một nửa',
p1e:'Chỉ khoảng 5 phần trăm thành ánh sáng, khoảng 95 phần trăm thành nhiệt năng. Vì thế bóng sợi đốt rất nóng. Đèn LED sáng bằng chỉ cần 8 J mỗi giây vì ít hao phí hơn nhiều.',
c1q:'Sau khi chạy hết các thiết bị: năng lượng có ích cộng năng lượng hao phí so với năng lượng cung cấp thì thế nào? Có thiết bị nào không có hao phí không?',
c1a:'Ở mọi thiết bị, năng lượng có ích + năng lượng hao phí = năng lượng cung cấp. Năng lượng không tự mất đi mà chuyển sang dạng khác. Không có thiết bị nào không hao phí: luôn có một phần chuyển thành nhiệt năng (và âm thanh) lan ra xung quanh. Thiết bị tốt là thiết bị có phần hao phí nhỏ.',
why1:'<p><b>Cơ chế:</b> Năng lượng là đại lượng đặc trưng cho khả năng tác dụng lực, làm vật chuyển động, nóng lên, phát sáng. Khi một thiết bị hoạt động, năng lượng chuyển từ dạng này sang dạng khác (điện năng → quang năng, hoá năng → động năng) và truyền từ vật này sang vật khác (từ dây điện vào bóng đèn, từ dây đốt nóng sang nước). Trong mọi quá trình thật đều có những “lối rò”: dòng điện làm nóng dây dẫn, các bộ phận cọ xát nhau (ma sát), vật rung phát ra âm thanh. Phần năng lượng đi theo các lối này là <b>năng lượng hao phí</b>, cuối cùng hầu hết thành nhiệt năng tản ra môi trường xung quanh và rất khó gom lại để dùng tiếp.</p><p><b>Nói cho học sinh:</b> Năng lượng giống như nước rót từ bình sang cốc: phần lớn vào cốc (có ích), nhưng luôn có ít nước bắn ra ngoài (hao phí). Tổng lượng nước không đổi, chỉ là phần bắn ra thì không uống được nữa.</p><p><b>Ví dụ truyền năng lượng:</b> ấm điện truyền nhiệt năng cho nước; Mặt Trời truyền năng lượng ánh sáng cho tấm pin; cánh quạt truyền động năng cho không khí.</p>',
mis1:'<ul><li><b>“Năng lượng bị mất đi, biến mất.”</b> Không. Năng lượng hao phí vẫn còn, nó thành nhiệt năng, âm thanh lan ra xung quanh. Đếm chấm: số chấm ra luôn bằng số chấm vào.</li><li><b>“Đèn LED không toả nhiệt.”</b> LED vẫn toả nhiệt (khoảng 65 % điện năng), nhưng vì cần ít điện năng hơn nên tổng nhiệt toả ra ít hơn bóng sợi đốt nhiều.</li><li><b>“Thiết bị mới, đắt tiền thì không hao phí.”</b> Mọi thiết bị đều có hao phí; chỉ có thể làm cho hao phí nhỏ hơn.</li><li><b>“Năng lượng hao phí là năng lượng bị phá huỷ.”</b> Hao phí nghĩa là không dùng được cho mục đích của ta, chứ không phải bị phá huỷ.</li></ul>',
word1:'<ul><li><b>Năng lượng</b> (能量): <i>năng</i> 能 là “có thể, có sức làm”, <i>lượng</i> 量 là “lượng, mức đo”. Tiếng Anh <i>energy</i>, tiếng Pháp <i>énergie</i> bắt nguồn từ tiếng Hy Lạp <i>ἐνέργεια (enérgeia)</i>: <i>en</i> “ở trong” + <i>ergon</i> “việc làm”, nghĩa là “sức hoạt động ở bên trong”. Aristotle dùng từ này; năm 1807 Thomas Young dùng <i>energy</i> theo nghĩa vật lí. Tiếng Trung 能量 (néngliàng), tiếng Nhật エネルギー (mượn từ tiếng Đức <i>Energie</i>).</li><li><b>Chuyển hoá</b> (轉化): <i>chuyển</i> “dời, đổi”, <i>hoá</i> “biến thành”. Tiếng Anh <i>transformation</i> từ Latinh <i>trans</i> “qua” + <i>forma</i> “hình dạng”: đổi sang hình dạng khác.</li><li><b>Hao phí</b> (耗費): <i>hao</i> “hao mòn, tiêu tốn”, <i>phí</i> “tiêu, tốn”. Tiếng Anh <i>wasted energy</i>; nhà khoa học còn nói năng lượng bị <i>dissipated</i> (Latinh <i>dissipare</i> “rải tung ra”), đúng với hình ảnh nhiệt tản ra khắp nơi.</li></ul>',

assume2:'Giả thiết mô phỏng: bỏ qua sức cản không khí; g = 9,8 m/s². Lúc chạm sàn, bóng được coi như một lò xo có ma sát bên trong; thời gian va chạm kéo dài khoảng 15 ms (thật chỉ vài ms) và bóng được vẽ to hơn để dễ thấy. Khoảng nhiệt độ tăng tính với nhiệt dung riêng cao su khoảng 1500 J/(kg·°C), coi một nửa nhiệt năng ở lại trong bóng.',

p2be:'Bóng tennis vọt lên cao gấp vài lần! Bóng rổ nặng truyền phần lớn năng lượng của nó cho bóng tennis nhẹ (truyền năng lượng từ vật này sang vật khác), nên bóng rổ gần như nằm yên. Tổng năng lượng vẫn không tăng: xem thanh “Tổng”.',
c2q:'Khi bóng nằm yên trên sàn, năng lượng ban đầu đi đâu? Phát biểu định luật bảo toàn năng lượng.',
c2a:'Năng lượng ban đầu không mất đi: nó đã chuyển hết thành nhiệt năng (bóng, sàn, không khí nóng lên một chút) và năng lượng âm. <b>Định luật bảo toàn năng lượng:</b> Năng lượng không tự sinh ra cũng không tự mất đi, nó chỉ chuyển từ dạng này sang dạng khác, hoặc truyền từ vật này sang vật khác.',
why2:'<p><b>Cơ chế:</b> Khi rơi, thế năng hấp dẫn của bóng chuyển dần thành động năng. Lúc chạm sàn, bóng bị nén lại: động năng chuyển thành thế năng đàn hồi (như lò xo bị nén). Bóng bung ra, thế năng đàn hồi chuyển lại thành động năng và bóng nảy lên. Nhưng khi bị nén và bung, các phân tử cao su cọ xát với nhau (ma sát bên trong), sàn rung lên phát ra tiếng, nên một phần năng lượng thành nhiệt năng và năng lượng âm. Phần này tản ra, không quay về làm bóng nảy được nữa. Bóng nảy siêu bóng ít ma sát bên trong nên nảy cao; đất nặn biến dạng mà không bung lại nên gần như không nảy.</p><p><b>Lịch sử:</b> Khoảng năm 1845, James Joule đo được: cùng một lượng công cơ học luôn làm nước nóng lên cùng một lượng. Từ đó Mayer, Joule và Helmholtz (1847) phát biểu định luật bảo toàn năng lượng.</p><p><b>Nói cho học sinh:</b> Tổng năng lượng giống số tiền trong ví: em đổi tiền chẵn ra tiền lẻ (đổi dạng), cho bạn mượn (truyền sang vật khác), làm rơi vài đồng xu xuống khe ghế (hao phí). Tổng số tiền vẫn còn, chỉ là phần rơi mất thì khó lấy lại.</p>',
mis2:'<ul><li><b>“Bóng dừng lại vì hết năng lượng, năng lượng biến mất.”</b> Năng lượng chuyển thành nhiệt năng và âm thanh. Bóng nóng lên rất ít (vài phần nghìn độ) nên tay ta không cảm nhận được, nhưng tổng vẫn đủ.</li><li><b>“Bóng tennis nảy cao hơn lúc thả là tự sinh ra năng lượng.”</b> Không, nó lấy năng lượng của bóng rổ. Tổng năng lượng hai quả không tăng.</li><li><b>“Bảo toàn năng lượng nghĩa là bóng phải nảy mãi.”</b> Bảo toàn là tổng không đổi; còn phần hữu ích (để nảy) thì giảm dần vì hao phí.</li></ul>',
/* Tab 3 */
req3:'<b>Yêu cầu cần đạt (KHTN 6):</b> Lấy được ví dụ về một số loại năng lượng tái tạo thông dụng. Phân loại được năng lượng theo tiêu chí. Nêu được vật liệu giải phóng năng lượng, tạo ra nhiệt và ánh sáng khi bị đốt cháy gọi là nhiên liệu.',

assume3:'Giả thiết mô phỏng: 1 giây chạy = 1 giờ (tuỳ tốc độ). Pin mặt trời hiệu suất 20 %, nắng giữa trưa 1000 W/m². Tua bin gió nhỏ đường kính 4 m, lấy được 35 % năng lượng gió, bắt đầu quay từ 3 m/s, dừng khi gió trên 25 m/s. Thuỷ điện nhỏ hiệu suất 80 %, hồ chứa 20 000 m³. Nhà máy than hiệu suất 35 %, 1 kg than cho 24 MJ và thải khoảng 2,4 kg CO₂. Mỗi nhà trung bình 0,3 kW (khoảng 200 kWh mỗi tháng).',

p3e:'Gần như không phát, vì không có ánh sáng Mặt Trời chiếu vào. Nhưng sáng hôm sau Mặt Trời lại mọc: nguồn năng lượng này được thiên nhiên bù lại mỗi ngày, nên gọi là năng lượng tái tạo. Muốn có điện ban đêm phải tích vào pin (ắc quy) hoặc dùng thêm nguồn khác.',
c3q:'Chạy mô phỏng nhiều ngày với cả bốn nguồn. Năng lượng tái tạo khác năng lượng từ than đá ở điểm nào? Kể tên các nguồn năng lượng tái tạo em biết.',
c3a:'Năng lượng tái tạo (Mặt Trời, gió, nước, sinh khối, địa nhiệt, sóng biển...) được thiên nhiên bổ sung liên tục, dùng xong lại có, và hầu như không thải CO₂ khi phát điện. Than đá, dầu mỏ, khí đốt là nhiên liệu hoá thạch: hình thành trong hàng triệu năm, dùng đến đâu cạn đến đó, khi đốt thải nhiều CO₂. Tuy vậy, năng lượng tái tạo phụ thuộc thời tiết (đêm, lặng gió, mùa khô) nên cần kết hợp nhiều nguồn và tiết kiệm.',

srcs:[['Ánh sáng Mặt Trời',1,'Mặt Trời chiếu sáng mỗi ngày, còn hàng tỉ năm nữa.'],['Gió',1,'Gió sinh ra do Mặt Trời làm nóng không khí không đều, luôn có lại.'],['Nước sông, hồ (thuỷ điện)',1,'Mặt Trời làm nước bốc hơi, mưa xuống lại đầy hồ (vòng tuần hoàn của nước).'],['Sóng biển, thuỷ triều',1,'Do gió và lực hút của Mặt Trăng, liên tục có lại.'],['Sinh khối: rơm, củi, bã mía, phân',1,'Cây mọc lại được trong vài tháng đến vài năm, nếu trồng lại.'],['Địa nhiệt (nhiệt trong lòng đất)',1,'Nhiệt từ lòng Trái Đất gần như vô tận.'],['Than đá',0,'Hình thành từ cây cối bị vùi lấp hàng triệu năm, dùng hết là cạn.'],['Dầu mỏ (xăng, dầu)',0,'Hình thành từ sinh vật biển hàng triệu năm, dùng hết là cạn.'],['Khí đốt tự nhiên (gas)',0,'Nhiên liệu hoá thạch như dầu mỏ, có hạn.']],
why3:'<p><b>Cơ chế:</b> Hầu hết năng lượng tái tạo bắt nguồn từ Mặt Trời. Ánh sáng làm pin mặt trời sinh ra dòng điện (quang năng → điện năng). Mặt Trời đốt nóng mặt đất không đều làm không khí chuyển động thành gió (động năng của gió → động năng cánh quạt → điện năng). Mặt Trời làm nước bốc hơi, mưa xuống chỗ cao, nước chảy từ hồ xuống làm quay tua bin (thế năng của nước → động năng → điện năng). Cây quang hợp tích năng lượng ánh sáng thành hoá năng trong gỗ, rơm (sinh khối). Các nguồn này được bổ sung liên tục trong thời gian ngắn nên gọi là <b>tái tạo</b>.</p><p>Than đá, dầu mỏ, khí đốt cũng là năng lượng Mặt Trời “cất giữ” từ cây cối, sinh vật cổ đại, nhưng phải mất hàng triệu năm mới hình thành. Chúng là <b>nhiên liệu</b> (vật liệu khi bị đốt cháy giải phóng năng lượng, tạo ra nhiệt và ánh sáng) loại không tái tạo.</p><p><b>Nói cho học sinh:</b> Năng lượng tái tạo giống giếng nước có mạch ngầm, múc hôm nay mai lại đầy. Than đá giống bình nước đóng chai: uống hết là hết.</p><p><b>Nguồn gốc từ:</b> <i>tái tạo</i> (再造): <i>tái</i> “lại”, <i>tạo</i> “làm ra”. Tiếng Anh <i>renewable</i>: <i>re-</i> “lại” + <i>new</i> “mới”, nghĩa là “làm mới lại được”. <i>Hoá thạch</i> (化石) “hoá thành đá”, tiếng Anh <i>fossil</i> từ Latinh <i>fossilis</i> “được đào lên”.</p>',
mis3:'<ul><li><b>“Năng lượng tái tạo là vô hạn nên dùng thoải mái.”</b> Nguồn thì được bù lại, nhưng lượng ta thu được mỗi lúc có hạn (phụ thuộc nắng, gió, mưa) và nhà máy cũng tốn tiền, tốn tài nguyên. Vẫn cần tiết kiệm.</li><li><b>“Pin mặt trời không có hao phí.”</b> Chỉ khoảng 20 % ánh sáng thành điện, phần lớn còn lại làm nóng tấm pin.</li><li><b>“Củi, rơm không phải năng lượng tái tạo vì phải đốt.”</b> Sinh khối là tái tạo nếu được trồng lại; đốt sinh khối vẫn tạo khói nên cần dùng đúng cách.</li></ul>',

assume4:'Giả thiết mô phỏng: công suất và số giờ là số liệu điển hình của hộ gia đình Việt Nam. Điều hoà 0,9 kW ở 25 °C, mỗi độ cài thấp hơn tốn thêm khoảng 5 %, mở cửa tốn thêm 30 %. Bình nóng lạnh bật cả ngày mất thêm khoảng 1,2 kWh mỗi ngày do nhiệt tản ra. Giá điện lấy trung bình 2 500 đồng/kWh (thực tế tính theo bậc thang). Mỗi kWh điện ở Việt Nam thải khoảng 0,66 kg CO₂.',
p4q:'Tắt tivi bằng điều khiển từ xa (đèn đỏ vẫn sáng). Tivi còn tốn điện không?',p4a:'Không tốn chút nào',p4b:'Vẫn tốn một ít (chế độ chờ)',p4c:'Tốn như lúc đang xem',
p4e:'Vẫn tốn một ít. Ở chế độ chờ, tivi, đầu thu, bộ sạc vẫn dùng vài oát để giữ mạch nhận tín hiệu. Cả nhà cộng lại khoảng 10 đến 15 W, cắm suốt ngày đêm thành khoảng 6 kWh mỗi tháng. Rút phích hoặc dùng ổ cắm có công tắc sẽ hết hao phí này.',
c4q:'Em hãy đề xuất ba biện pháp tiết kiệm năng lượng ở nhà em và giải thích mỗi biện pháp làm giảm năng lượng hao phí hay giảm thời gian sử dụng.',
c4a:'Ví dụ: (1) Thay bóng sợi đốt bằng bóng LED: giảm hao phí vì LED biến nhiều điện năng thành ánh sáng hơn. (2) Đặt điều hoà 26–28 °C, đóng kín cửa: giảm năng lượng cần để làm mát và giảm nhiệt lọt vào. (3) Tắt đèn, rút phích khi không dùng: giảm thời gian dùng và hao phí ở chế độ chờ. Ngoài điện: đi bộ, đi xe đạp quãng ngắn, tắt bếp khi nấu xong, tận dụng ánh sáng và gió tự nhiên.',
why4:'<p><b>Cơ chế:</b> Năng lượng một thiết bị tiêu thụ = công suất × thời gian dùng (kWh = kW × giờ). Muốn tiết kiệm có hai hướng: <b>(1) giảm thời gian dùng khi không cần</b> (tắt đèn, rút phích, không giữ ấm cả ngày), và <b>(2) giảm năng lượng hao phí</b> bằng thiết bị hiệu quả (LED, tủ lạnh inverter) và cách dùng hợp lí (đóng cửa khi bật điều hoà, để nguội thức ăn trước khi cất tủ). Tiết kiệm năng lượng còn giảm khí CO₂ vì phần lớn điện ở Việt Nam vẫn sản xuất từ than đá và khí đốt.</p><p><b>Nói cho học sinh:</b> Tiết kiệm năng lượng không phải là không dùng điện, mà là dùng đúng lúc, đúng chỗ, chọn thiết bị ít hao phí. Mỗi “chấm năng lượng” hao phí là tiền điện của nhà em bay đi thành nhiệt.</p><p><b>1 kWh là gì?</b> “Một số điện” = năng lượng của thiết bị 1000 W chạy trong 1 giờ = 3 600 000 J.</p>',
mis4:'<ul><li><b>“Tiết kiệm năng lượng là không dùng điện.”</b> Vẫn dùng đủ, chỉ bỏ phần lãng phí.</li><li><b>“Tắt bằng điều khiển là hết tốn điện.”</b> Chế độ chờ vẫn tốn điện.</li><li><b>“Để điều hoà thật lạnh cho mau mát rồi tắt sẽ đỡ tốn.”</b> Cài càng lạnh, máy càng chạy lâu, càng tốn.</li><li><b>“Bóng LED đắt nên không tiết kiệm.”</b> Bóng LED dùng ít điện gấp khoảng 6 lần và bền hơn, nên tiền điện tiết kiệm được lớn hơn nhiều tiền mua bóng.</li></ul>',

assume1:'Model assumptions: useful/wasted shares are typical values (filament bulb about 5 % light, LED about 35 %, fan about 60 %, kettle about 85 %, motorbike engine about 20 %, solar panel about 20 %). Device temperatures are estimates. Sound energy is really tiny; it is drawn larger so you can see it.',
p1q:'A 60 W filament bulb is on. Most of the electrical energy becomes which form?',p1a:'Light energy',p1b:'Thermal energy (heating the bulb and air)',p1c:'Half each',
p1e:'Only about 5 % becomes light, about 95 % becomes thermal energy. That is why filament bulbs get very hot. An equally bright LED needs only 8 J per second because it wastes much less.',
c1q:'After trying every device: how does useful + wasted energy compare with the energy supplied? Is any device free of waste?',
c1a:'For every device, useful + wasted energy = energy supplied. Energy does not disappear; it changes form. No device is free of waste: some energy always becomes thermal energy (and sound) that spreads out. A good device is one with little waste.',
why1:'<p><b>Mechanism:</b> Energy measures the ability to exert forces, move things, heat them or make light. When a device works, energy changes form (electrical → light, chemical → kinetic) and passes from one object to another (wire to bulb, heating element to water). Every real process has “leaks”: current heats wires, moving parts rub (friction), vibrations make sound. Energy that leaks this way is <b>wasted energy</b>; it ends up mostly as thermal energy spread into the surroundings, very hard to collect and use again.</p><p><b>For students:</b> Energy is like water poured from a jug into a cup: most goes into the cup (useful), but some always splashes out (wasted). The total amount of water stays the same; the splashed part just cannot be drunk.</p><p><b>Transfer examples:</b> a kettle transfers thermal energy to water; the Sun transfers light energy to a solar panel; fan blades transfer kinetic energy to the air.</p>',
mis1:'<ul><li><b>“Energy is lost, it disappears.”</b> No. Wasted energy is still there as heat and sound. Count the dots: dots out always equal dots in.</li><li><b>“LEDs give off no heat.”</b> LEDs do (about 65 % of their input), but they need so little input that they give off far less heat than filament bulbs.</li><li><b>“New, expensive devices waste nothing.”</b> Every device wastes some energy; we can only make the waste smaller.</li><li><b>“Wasted energy is destroyed energy.”</b> Wasted means not useful for our purpose, not destroyed.</li></ul>',
word1:'<ul><li><b>Energy</b>: from Greek <i>ἐνέργεια (enérgeia)</i>, <i>en</i> “in” + <i>ergon</i> “work”, “activity within”. Used by Aristotle; Thomas Young gave it its physics meaning in 1807. Vietnamese <i>năng lượng</i> (能量): <i>năng</i> “able”, <i>lượng</i> “amount”. Chinese 能量, Japanese エネルギー (from German <i>Energie</i>).</li><li><b>Transformation</b>: Latin <i>trans</i> “across” + <i>forma</i> “shape”. Vietnamese <i>chuyển hoá</i> (轉化) “shift and become”.</li><li><b>Wasted / dissipated</b>: Latin <i>dissipare</i> “to scatter”, just like heat spreading out. Vietnamese <i>hao phí</i> (耗費) “worn away, spent”.</li></ul>',
req2:'<b>Learning outcomes (Science 6):</b> State the law of conservation of energy and give examples. Wasted energy always appears when energy is transformed or transferred.',
hint2:'Drag the ball up to a drop height and let go. Watch the bars: gravitational ↔ kinetic ↔ elastic energy, the wasted share grows, but the total stays the same. Use ×0.1 to see the ball squash.',

assume2:'Model assumptions: no air resistance; g = 9.8 m/s². On impact the ball acts like a spring with internal friction; contact lasts about 15 ms (really a few ms) and the ball is drawn larger so you can see it. The temperature rise uses rubber specific heat about 1500 J/(kg·°C), with half of the heat staying in the ball.',
p2q:'A tennis ball is dropped from 1.5 m. How high does it go on the first bounce?',p2a:'Exactly 1.5 m',p2b:'Lower than 1.5 m',p2c:'Higher than 1.5 m',
p2e:'Lower (about 0.8 m). Each impact turns some energy into thermal energy and sound (the “thud”), so the ball has less energy to rise. Only the imaginary no-waste ball returns to its drop height.',
p2bq:'Choose “Two balls stacked”: a tennis ball on top of a basketball, dropped together. How does the tennis ball bounce?',p2ba:'Lower than when dropped alone',p2bb:'Several times higher than the drop height',p2bc:'It does not bounce',
p2be:'The tennis ball shoots up several times higher! The heavy basketball passes most of its energy to the light tennis ball (energy transferred from one object to another), so the basketball nearly stops. The total still does not increase: watch the “Total” bar.',
c2q:'When the ball lies still on the floor, where has the starting energy gone? State the law of conservation of energy.',
c2a:'The energy is not lost: it has all become thermal energy (ball, floor and air slightly warmer) and sound. <b>Law of conservation of energy:</b> Energy cannot be created or destroyed; it only changes from one form to another or passes from one object to another.',
why2:'<p><b>Mechanism:</b> As the ball falls, gravitational potential energy becomes kinetic energy. On impact the ball is squashed: kinetic energy becomes elastic potential energy (like a compressed spring). The ball springs back, elastic energy becomes kinetic again and it rises. But while squashing and springing back, rubber molecules rub on each other (internal friction) and the floor vibrates and makes sound, so some energy becomes thermal energy and sound. That part spreads out and never comes back to lift the ball. A super ball has little internal friction so it bounces high; clay deforms without springing back, so it hardly bounces.</p><p><b>History:</b> Around 1845 James Joule showed the same amount of mechanical work always warms water by the same amount. Mayer, Joule and Helmholtz (1847) then stated the law of conservation of energy.</p><p><b>For students:</b> Total energy is like money in a wallet: you can change a big note into coins (change form), lend some to a friend (transfer), or drop a few coins down the sofa (waste). The total still exists; the dropped part is just hard to get back.</p>',
mis2:'<ul><li><b>“The ball stops because its energy vanished.”</b> It became thermal energy and sound. The ball warms by only thousandths of a degree, too little to feel, but the total adds up.</li><li><b>“The tennis ball going higher than its drop height creates energy.”</b> No, it takes energy from the basketball. The total of the two balls does not grow.</li><li><b>“Conservation means the ball should bounce forever.”</b> Conservation means the total stays constant; the useful part (for bouncing) shrinks because of waste.</li></ul>',

p3e:'Almost none, because no sunlight reaches it. But the Sun rises again the next morning: nature replaces this energy every day, so it is called renewable. For night-time electricity we must store energy in batteries or use another source.',
c3q:'Run several days with all four sources. How does renewable energy differ from coal? Name the renewable sources you know.',
c3a:'Renewable energy (sun, wind, water, biomass, geothermal, waves...) is replaced by nature continuously and produces almost no CO₂ when making electricity. Coal, oil and gas are fossil fuels: formed over millions of years, they run out as we use them and release much CO₂ when burned. Renewables depend on weather (night, calm days, dry season), so we combine sources and save energy.',
sortT:'Sort: which energy sources are renewable?',sortHint:'Press “Renewable” or “Non-renewable” for each source. Correct answers turn green with a reason.',yes:'Renewable',no:'Non-renewable',sortDone:'You sorted {n}/{m} correctly.',

why3:'<p><b>Mechanism:</b> Most renewable energy comes from the Sun. Light makes solar cells produce current (light → electrical). Uneven heating of the ground makes air move as wind (kinetic energy of wind → blades → electrical). The Sun evaporates water, rain falls on high ground, water flowing down turns a turbine (potential energy of water → kinetic → electrical). Plants store light energy as chemical energy in wood and straw (biomass). These are replaced quickly, so they are <b>renewable</b>.</p><p>Coal, oil and gas are also stored solar energy from ancient plants and creatures, but they take millions of years to form. They are non-renewable <b>fuels</b> (materials that release energy, heat and light when burned).</p><p><b>For students:</b> Renewable energy is like a well fed by a spring: draw water today, it is full again tomorrow. Coal is like bottled water: once drunk, it is gone.</p><p><b>Words:</b> <i>renewable</i>: <i>re-</i> “again” + <i>new</i>. Vietnamese <i>tái tạo</i> (再造) “made again”. <i>Fossil</i> from Latin <i>fossilis</i> “dug up”; Vietnamese <i>hoá thạch</i> (化石) “turned to stone”.</p>',
mis3:'<ul><li><b>“Renewable energy is unlimited, so use as much as you like.”</b> The source is replaced, but how much we can collect at a time is limited (sun, wind, rain), and power plants cost money and materials. Saving still matters.</li><li><b>“Solar panels waste nothing.”</b> Only about 20 % of the light becomes electricity; most of the rest heats the panel.</li><li><b>“Wood and straw are not renewable because they are burned.”</b> Biomass is renewable if replanted; burning it still makes smoke, so it must be used carefully.</li></ul>',

assume4:'Model assumptions: power ratings and hours are typical for a Vietnamese household. Air conditioner 0.9 kW at 25 °C, each degree colder costs about 5 % more, an open door costs 30 % more. A water heater left on all day loses about 1.2 kWh a day as heat. Average price 2,500 VND/kWh (real bills use tiers). Each kWh in Vietnam releases about 0.66 kg CO₂.',
p4q:'The TV is turned off with the remote (red light still on). Does it still use electricity?',p4a:'None at all',p4b:'A little (standby)',p4c:'As much as when watching',
p4e:'A little. On standby, TVs, set-top boxes and chargers still draw a few watts to listen for signals. A whole home adds up to about 10–15 W, day and night, about 6 kWh a month. Unplugging or using switched sockets removes this waste.',
c4q:'Propose three ways to save energy at home and say whether each one reduces wasted energy or reduces time of use.',
c4a:'For example: (1) Replace filament bulbs with LEDs: less waste, because LEDs turn more electrical energy into light. (2) Set the air conditioner to 26–28 °C and close doors: less energy needed for cooling and less heat leaking in. (3) Switch off lights and unplug devices: less time of use and no standby waste. Beyond electricity: walk or cycle short trips, turn the stove off when done, use daylight and natural breezes.',
why4:'<p><b>Mechanism:</b> Energy used by an appliance = power × time (kWh = kW × hours). There are two ways to save: <b>(1) cut time of use when not needed</b> (lights off, unplug, no all-day keep-warm), and <b>(2) cut wasted energy</b> with efficient devices (LEDs, inverter fridges) and sensible use (closing doors with air conditioning, cooling food before storing). Saving energy also cuts CO₂, since most electricity in Vietnam still comes from coal and gas.</p><p><b>For students:</b> Saving energy does not mean not using electricity; it means using it at the right time and place, with devices that waste little. Every wasted “energy dot” is your family’s money flying away as heat.</p><p><b>What is 1 kWh?</b> One “unit” = the energy of a 1000 W device running for 1 hour = 3,600,000 J.</p>',
mis4:'<ul><li><b>“Saving energy means not using electricity.”</b> We still use enough; we just cut the waste.</li><li><b>“Off with the remote means no electricity.”</b> Standby still uses some.</li><li><b>“Set the air conditioner very cold to cool faster, then switch off.”</b> The colder the setting, the longer it runs and the more it uses.</li><li><b>“LED bulbs are expensive, so they don’t save.”</b> LEDs use about 6 times less electricity and last longer, so the savings far exceed the price.</li></ul>',

<script>
'use strict';
/* ================= Tiện ích ================= */
const $=id=>document.getElementById(id);
let lang='vi';
const T=k=>{const v=I18N[lang][k];return v!=null?v:(I18N.vi[k]!=null?I18N.vi[k]:k);};
const Tf=(k,o)=>T(k).replace(/\{(\w+)\}/g,(_,n)=>o[n]);
const nf=(x,d=2,mn=0)=>{if(!isFinite(x))x=0;if(Math.abs(x)<0.5*Math.pow(10,-d))x=0;return new Intl.NumberFormat(lang==='vi'?'vi-VN':'en-US',{maximumFractionDigits:d,minimumFractionDigits:mn}).format(x);};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const TAU=Math.PI*2;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const isPhone=()=>innerWidth<640;
let CS={};
function readColors(){const s=getComputedStyle(document.documentElement);
  ['bg','panel','lane','ink','muted','line','accent','ok','warn','space','star','eElec','eLight','eHeat','eKin','ePot','eChem','eSound','eEl','sky','ground','water','metal','metal2']
  .forEach(k=>CS[k]=s.getPropertyValue('--'+k).trim());}
readColors();
const FCOL=f=>({elec:CS.eElec,light:CS.eLight,heat:CS.eHeat,kin:CS.eKin,chem:CS.eChem,sound:CS.eSound,pot:CS.ePot,el:CS.eEl}[f]);
function fit(cv,asp,minH,maxH){const w=Math.max(260,cv.clientWidth|0);let h=Math.round(w*asp);if(minH)h=Math.max(h,minH);if(maxH)h=Math.min(h,maxH);
  const d=Math.min(2.5,window.devicePixelRatio||1);
  if(cv._w!==w||cv._h!==h||cv._d!==d){cv.width=Math.round(w*d);cv.height=Math.round(h*d);cv.style.height=h+'px';cv._w=w;cv._h=h;cv._d=d;}
  const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);return{c,w,h};}
function txt(c,s,x,y,o={}){c.save();c.font=`${o.w||600} ${o.sz||13}px ${o.mono?'"IBM Plex Mono",monospace':'"Be Vietnam Pro",system-ui,sans-serif'}`;
  c.textAlign=o.al||'center';c.textBaseline=o.bl||'middle';
  if(o.bg){const m=c.measureText(s),pw=m.width+10,ph=(o.sz||13)+8;let bx=x-(o.al==='left'?0:o.al==='right'?pw-5:pw/2)-(o.al==='left'?5:0);
    c.fillStyle=o.bg;c.globalAlpha=o.bga||.85;c.beginPath();c.roundRect(bx,y-ph/2,pw,ph,5);c.fill();c.globalAlpha=1;}
  c.fillStyle=o.col||CS.ink;c.fillText(s,x,y);c.restore();}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}
function fmtE(J){const a=Math.abs(J);if(a<1000)return nf(J,a<10?2:a<100?1:0)+' J';if(a<1e6)return nf(J/1000,J<1e4?2:1)+' kJ';return nf(J/1e6,2)+' MJ';}
function fmtT(s){if(s<60)return nf(s,1)+' s';const m=Math.floor(s/60),r=Math.floor(s%60);return m+' min '+String(r).padStart(2,'0')+' s';}
function kv(el,rows){el.innerHTML=rows.map(r=>r.t?`<dd class="t">${r.t}</dd>`:`<dt>${r[0]}</dt><dd class="num">${r[1]}</dd>`).join('');}
function lerpCol(a,b,t){const pa=a.match(/\w\w/g).map(h=>parseInt(h,16)),pb=b.match(/\w\w/g).map(h=>parseInt(h,16));return 'rgb('+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(',')+')';}
function heatCol(Tc){const S=[[20,'1b2a8a'],[35,'7b2fbf'],[50,'d0305a'],[70,'f05a1a'],[100,'ffa01a'],[140,'ffe65a'],[220,'ffffff']];
  if(Tc<=S[0][0])return '#'+S[0][1];for(let i=1;i<S.length;i++)if(Tc<=S[i][0])return lerpCol(S[i-1][1],S[i][1],(Tc-S[i-1][0])/(S[i][0]-S[i-1][0]));return '#ffffff';}
function segBtns(el,items,cur,on){el.innerHTML=items.map(([k,l])=>`<button class="btn" data-k="${k}" aria-pressed="${k===cur}">${l}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(b)on(b.dataset.k);};}

/* ================= Dự đoán và kết luận ================= */
const PRED={p1:{q:'p1q',o:['p1a','p1b','p1c'],c:1,e:'p1e'},p2:{q:'p2q',o:['p2a','p2b','p2c'],c:1,e:'p2e'},p2b:{q:'p2bq',o:['p2ba','p2bb','p2bc'],c:1,e:'p2be'},
  p3:{q:'p3q',o:['p3a','p3b','p3c'],c:2,e:'p3e'},p4:{q:'p4q',o:['p4a','p4b','p4c'],c:1,e:'p4e'}};
function predHTML(P){return `<h2>${T('predTitle')}</h2><p>${T(P.q)}</p><div class="opts">${P.o.map((k,i)=>`<button class="btn ${P.pick===i?'picked':''} ${P.show&&i===P.c?'right':''}" data-i="${i}">${T(k)}</button>`).join('')}</div>`+
  (P.pick==null?'':`<p class="muted">${T('predThen')}</p><div><button class="btn sm rv">${T(P.show?'hideAns':'showAns')}</button></div>`)+(P.show?`<div class="ans">${T(P.e)}</div>`:'');}
function renderPred(id){$(id).innerHTML=predHTML(PRED[id]);}
Object.keys(PRED).forEach(id=>$(id).addEventListener('click',e=>{const P=PRED[id],b=e.target.closest('button');if(!b)return;if(b.classList.contains('rv'))P.show=!P.show;else if(b.dataset.i!=null)P.pick=+b.dataset.i;renderPred(id);}));
const CONC={c1:{q:'c1q',a:'c1a'},c2:{q:'c2q',a:'c2a'},c3:{q:'c3q',a:'c3a'},c4:{q:'c4q',a:'c4a'}};
function renderConc(id){const C=CONC[id];$(id).innerHTML=`<h2>${T('conclTitle')}</h2><p>${T(C.q)}</p><div><button class="btn sm">${T(C.show?'hideAns':'showAns')}</button></div>${C.show?`<div class="ans">${T(C.a)}</div>`:''}`;}
Object.keys(CONC).forEach(id=>$(id).addEventListener('click',e=>{if(e.target.closest('button')){CONC[id].show=!CONC[id].show;renderConc(id);}}));

/* =====================================================================
   TAB 1: CHUYỂN HOÁ VÀ HAO PHÍ
   Mỗi thiết bị: công suất cung cấp P (J/s), dạng năng lượng vào, các phần ra (dạng, tỉ lệ, có ích?).
   Năng lượng: E_vào = P·t; E_ra,k = tỉ lệ_k·E_vào. Tổng tỉ lệ = 1 → bảo toàn.
   ===================================================================== */
const DEV={
  inc:{P:60,src:'elec',out:[{f:'light',p:.05,u:1},{f:'heat',p:.95,u:0}],Tss:130},
  led:{P:8,src:'elec',out:[{f:'light',p:.35,u:1},{f:'heat',p:.65,u:0}],Tss:45},
  fan:{P:50,src:'elec',out:[{f:'kin',p:.60,u:1},{f:'heat',p:.39,u:0},{f:'sound',p:.01,u:0}],Tss:42},
  ket:{P:1800,src:'elec',out:[{f:'heat',p:.85,u:1},{f:'heat',p:.14,u:0},{f:'sound',p:.01,u:0}],Tss:62},
  moto:{P:7000,src:'chem',out:[{f:'kin',p:.20,u:1},{f:'heat',p:.79,u:0},{f:'sound',p:.01,u:0}],Tss:95},
  sol:{P:1600,src:'light',out:[{f:'elec',p:.20,u:1},{f:'heat',p:.75,u:0},{f:'light',p:.05,u:0}],Tss:55}};
const S1={dev:'inc',t:0,run:false,spd:1,th:false,pk:[],acc:[],emit:0,nIn:0,nOut:[],ang:0,road:0,msg:''};
const RATE1=10; // chấm mỗi giây (thời gian thực)
function reset1(){const D=DEV[S1.dev];S1.t=0;S1.pk=[];S1.acc=D.out.map(()=>0);S1.nOut=D.out.map(()=>0);S1.nIn=0;S1.emit=0;S1.msg='';}
function Tw1(){return Math.min(100,25+0.85*DEV.ket.P*S1.t/(4200*1.5));}
function Tdev1(){const D=DEV[S1.dev];if(S1.dev==='ket')return 25+(Tw1()-25)*0.55;return 25+(D.Tss-25)*(1-Math.exp(-S1.t/60));}
function lay1(w,h){return{src:S1.dev==='sol'?{x:.13*w,y:.22*h}:{x:.1*w,y:.62*h},dev:{x:.47*w,y:.56*h},tgt:{x:(isPhone()?.8:.86)*w,y:.56*h},R:Math.min(w,h)};}
function step1(dtR){if(!S1.run)return;const D=DEV[S1.dev];S1.t+=dtR*S1.spd;
  if(S1.dev==='ket'&&Tw1()>=100){S1.run=false;S1.msg=T('kettleOff');ui1();}
  S1.ang+=dtR*(S1.dev==='fan'?14:S1.dev==='moto'?10:0);S1.road+=dtR*(S1.dev==='moto'?120:0);
  S1.emit+=dtR*RATE1;while(S1.emit>=1){S1.emit-=1;S1.pk.push({ph:0,s:0,j:(Math.random()-.5)});S1.nIn++;}
  for(const p of S1.pk){p.s+=dtR/(p.ph===0?0.9:1.2);
    if(p.ph===0&&p.s>=1){let k=0,best=-1;D.out.forEach((o,i)=>{S1.acc[i]+=o.p;});S1.acc.forEach((a,i)=>{if(a>best){best=a;k=i;}});S1.acc[k]-=1;
      p.ph=1;p.s=0;p.k=k;const o=D.out[k];p.a=o.f==='sound'?(Math.random()<.5?-0.15:Math.PI+0.15)+(Math.random()-.5)*.6:(-Math.PI/2+(Math.random()-.5)*2.6);}
    else if(p.ph===1&&p.s>=1){p.dead=1;S1.nOut[p.k]++;}}

  if(!ph){txt(c,nf(avgW,0)+' W',mx,my+mr+16,{sz:14,col:CS.ink,mono:1});txt(c,lang==='vi'?'trung bình':'average',mx,my+mr+32,{sz:11,col:CS.muted});}}
function ui4lang(){ui4();}

const VSEL={1:0,2:0,3:0,4:0},VPLAY={};
function renderVideo(n){const list=VIDEOS[n],V=list[VSEL[n]],el=$('v'+n),pl=!!VPLAY[n];el.classList.toggle('playing',pl);
  const dur=V.d==='?'?T('vDurUnk'):V.d,ch=V.c==='?'?T('vChUnk'):V.c;
  el.innerHTML=`<div class="vmedia">${pl?`<div class="player" id="pl${n}"></div>`:`<button class="thumb" data-play="${n}" aria-label="${esc(V.t)}"><span class="ph">${T('vNoThumb')}</span><img alt="" src="media/${V.file.replace('.mp4','.jpg')}"><span class="pbtn"></span>${V.d!=='?'?`<span class="dur">${V.d}</span>`:''}</button>`}</div>
  <div class="vt"><span class="lbl">${T('vLbl')} · ${T('vt_'+V.type)} · ${esc(ch)} · ${dur}</span><span class="ttl">${esc(V.t)}</span>
  <span class="look"><b>${T('vLook')}</b> ${esc(V.look[lang])}</span>
  <div class="vchips">${list.map((x,i)=>`<button class="chip ${i===VSEL[n]?'on':''}" data-vsel="${n}:${i}">${T('vNo')} ${i+1}</button>`).join('')}<a class="chip" href="https://www.youtube.com/watch?v=${V.id}" target="_blank" rel="noopener">YouTube ↗</a></div>
  <span class="src">${T('vNote')}</span></div>`;
  const img=el.querySelector('img');if(img){img.onerror=()=>{if(!img.dataset.t){img.dataset.t=1;img.src='https://i.ytimg.com/vi/'+V.id+'/hqdefault.jpg';}else img.remove();};}
  if(pl){const box=$('pl'+n),vid=document.createElement('video');vid.controls=true;vid.autoplay=true;vid.playsInline=true;
    vid.onerror=()=>{const f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+V.id+'?autoplay=1&rel=0&playsinline=1';
      f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.title=V.t;box.replaceChildren(f);};
    vid.src='media/'+V.file;box.replaceChildren(vid);}}
document.addEventListener('click',e=>{const p=e.target.closest('[data-play]'),s=e.target.closest('[data-vsel]');
  if(p){VPLAY[+p.dataset.play]=true;renderVideo(+p.dataset.play);}
  else if(s){const [n,i]=s.dataset.vsel.split(':').map(Number);VSEL[n]=i;VPLAY[n]=false;renderVideo(n);}});
function renderMedia(){let h=`<thead><tr><th>${T('mTab')}</th><th>${T('mFile')}</th><th>${T('mVideo')}</th><th>${T('mDur')}</th><th>${T('mType')}</th></tr></thead><tbody>`;
  for(const n of [1,2,3,4])VIDEOS[n].forEach((V,i)=>{h+=`<tr><td>${n} · ${T('vNo')} ${i+1}</td><td><code>media/${V.file}</code></td><td><a href="https://www.youtube.com/watch?v=${V.id}" target="_blank" rel="noopener">${esc(V.t)}</a> · ${esc(V.c)}</td><td>${V.d}</td><td>${T('vt_'+V.type)}</td></tr>`;});
  $('mediaTbl').innerHTML=h+'</tbody>';}

/* ================= Tab, ngôn ngữ, chế độ GV ================= */
let tab=1;
function setTab(n){tab=n;document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.tab===n));
  for(let k=1;k<=4;k++)$('t'+k).hidden=k!==n;store.set('nl6-tab',String(n));}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>setTab(+b.dataset.tab));
$('gvBtn').onclick=()=>{const on=!document.body.classList.contains('hideNums');document.body.classList.toggle('hideNums',on);$('gvBtn').setAttribute('aria-pressed',on);};
function applyLang(){document.documentElement.lang=lang;document.title=lang==='vi'?'Chuyển hoá năng lượng':'Energy transfers';
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=T(el.dataset.i18nHtml));
  $('langBtn').textContent=lang==='vi'?'EN':'VI';
  Object.keys(PRED).forEach(renderPred);Object.keys(CONC).forEach(renderConc);[1,2,3,4].forEach(renderVideo);renderMedia();
  ui1(true);ui2(true);ui3(true);ui4();}
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi';applyLang();};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>readColors());

/* ================= Vòng lặp ================= */
reset1();build2();reset3();
let last=performance.now(),dataT=0;
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;dataT+=dt;
  if(tab===1){step1(dt);draw1();drawSankey1();if(dataT>.1)data1();}
  else if(tab===2){step2(dt);draw2();drawGr2();if(dataT>.1)bars2();}
  else if(tab===3){step3(dt);if(!S3.run)S3.P=powers3();draw3();drawGr3();if(dataT>.1)data3();}
  else{draw4(dt);}
  if(dataT>.1)dataT=0;requestAnimationFrame(loop);}
applyLang();setTab(+(store.get('nl6-tab')||1)||1);requestAnimationFrame(loop);
</script>
