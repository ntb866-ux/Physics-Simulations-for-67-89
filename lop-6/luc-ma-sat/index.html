<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lực ma sát</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Phòng thí nghiệm ma sát: sân khấu canvas bên trái, sổ ghi chép bên phải. Điện thoại xếp một cột. */
:root{
  --bg:#eef1ee; --panel:#ffffff; --lane:#f4f7f5; --ink:#16211c; --muted:#56655d; --line:#cbd5ce;
  --accent:#14606b; --accent-ink:#ffffff; --ok:#1d8a4b; --warn:#c2410c;
  --force:#d1323b; --fric:#7a3fc2; --normal:#1f6fd1; --vel:#1f6fd1; --bond:#e07b00;
  --matA:#9a8e7c; --matA2:#6f6455; --matB:#7f9db5; --matB2:#4f6f88; --oil:rgba(232,176,40,.55);
  --road:#5b6168; --mark:#f3f3f3; --sky:#dbe9f3; --grass:#8fb77a;
  --water:rgba(64,140,214,.30); --air:rgba(170,200,225,.16);
  --laneA:#0f7c8a; --laneB:#d0661c; --react:#e7b416; --brake:#d1323b;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --panel:#17201c; --lane:#121a17; --ink:#e3ebe6; --muted:#97a89f; --line:#2b3933;
  --accent:#4fb8c4; --accent-ink:#04252a; --ok:#47c47d; --warn:#f08a4b;
  --force:#ff5f67; --fric:#b28cff; --normal:#5aa2ff; --vel:#5aa2ff; --bond:#ffa630;
  --matA:#7d7363; --matA2:#a99c86; --matB:#5d7c94; --matB2:#9cc0dc; --oil:rgba(232,176,40,.5);
  --road:#3c4147; --mark:#d8d8d8; --sky:#1a2833; --grass:#3d5a33;
  --water:rgba(80,150,230,.30); --air:rgba(150,180,210,.10);
  --laneA:#3cc3d2; --laneB:#ff9a4d; --react:#e8c13a; --brake:#ff5f67;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --panel:#17201c; --lane:#121a17; --ink:#e3ebe6; --muted:#97a89f; --line:#2b3933;
  --accent:#4fb8c4; --accent-ink:#04252a; --ok:#47c47d; --warn:#f08a4b;
  --force:#ff5f67; --fric:#b28cff; --normal:#5aa2ff; --vel:#5aa2ff; --bond:#ffa630;
  --matA:#7d7363; --matA2:#a99c86; --matB:#5d7c94; --matB2:#9cc0dc; --oil:rgba(232,176,40,.5);
  --road:#3c4147; --mark:#d8d8d8; --sky:#1a2833; --grass:#3d5a33;
  --water:rgba(80,150,230,.30); --air:rgba(150,180,210,.10);
  --laneA:#3cc3d2; --laneB:#ff9a4d; --react:#e8c13a; --brake:#ff5f67;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(25px,3.4vw,36px);line-height:1.15;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:700}
.btn{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg .btn{border:0;border-radius:0;min-width:52px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-size:15px;font-weight:600;white-space:nowrap;min-height:46px;padding:8px 14px;border:0;border-bottom:3px solid transparent;
  background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.req{margin:0;font-size:14px;color:var(--muted);max-width:110ch}
.req b{color:var(--ink);font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:1020px){.lab{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0}
canvas{display:block;width:100%;border-radius:8px;background:var(--lane);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hint{margin:0;font-size:14px;color:var(--muted)}
.status{margin:0;font-weight:600;min-height:1.5em}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:6px;vertical-align:middle}
.sl{display:flex;flex-direction:column;gap:4px}
.sl .top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.sl .val{font-family:var(--font-num);font-weight:600}
.sl .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);margin:0}
select{font:inherit;font-size:15px;min-height:44px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right}
.bigfig{font-family:var(--font-num);font-size:clamp(22px,2.6vw,30px);font-weight:600;line-height:1.2}
.bar{height:16px;border-radius:8px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.opts{display:flex;flex-direction:column;gap:6px}
.opts .btn{text-align:left;font-size:14px}
.opts .btn.picked{border:2px solid var(--accent)}
.opts .btn.right{background:color-mix(in srgb,var(--ok) 18%,var(--panel));border-color:var(--ok)}
.ans{background:var(--lane);border-left:4px solid var(--ok);padding:8px 12px;border-radius:6px;font-size:15px}
.muted{color:var(--muted);font-size:14px}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:0 14px}
details[open]{padding-bottom:12px}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;font-size:15px}
details p,details ul{margin:6px 0;font-size:15px}
details ul{padding-left:20px}
.tagline{font-size:13px;color:var(--muted);font-style:italic}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.lanehdr{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.lanehdr i{width:12px;height:12px;border-radius:50%;display:inline-block}
.fine{font-size:13px;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
    </div>
    <button class="btn" id="langBtn">EN</button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="1" data-i18n="tab1"></button>
    <button role="tab" data-tab="2" data-i18n="tab2"></button>
    <button role="tab" data-tab="3" data-i18n="tab3"></button>
    <button role="tab" data-tab="4" data-i18n="tab4"></button>
  </nav>

  <!-- ===================== TAB 1: VÌ SAO CÓ MA SÁT ===================== -->
  <section id="t1" class="col">
    <p class="req" data-i18n-html="req1"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint1"></p>
        <canvas id="cv1" aria-label="micro view"></canvas>
        <p class="status" id="st1"></p>
        <div class="controls">
          <button class="btn primary" id="push1" data-i18n="push1"></button>
          <button class="btn" id="rst1" data-i18n="reset"></button>
          <label class="chk"><input type="checkbox" id="bond1" checked> <span data-i18n="showBonds"></span></label>
          <label class="chk"><input type="checkbox" id="lube1"> <span data-i18n="lube"></span></label>
        </div>
        <div class="legend">
          <span><i style="background:var(--bond)"></i><span data-i18n="lgContact"></span></span>
          <span><i style="background:var(--force)"></i><span data-i18n="lgPull"></span></span>
          <span><i style="background:var(--fric)"></i><span data-i18n="lgFric"></span></span>
          <span><i style="background:var(--normal)"></i><span data-i18n="lgPress"></span></span>
        </div>
        <p class="fine" data-i18n="assume1"></p>
      </div>
      <div class="col">
        <div class="card">
          <div class="sl"><div class="top"><span data-i18n="rough"></span><span class="val" id="roughV"></span></div>
            <input type="range" id="rough" min="0" max="1" step="0.01" value="0.6">
            <div class="ends"><span data-i18n="smoothEnd"></span><span data-i18n="roughEnd"></span></div></div>
          <div class="sl"><div class="top"><span data-i18n="press"></span><span class="val" id="pressV"></span></div>
            <input type="range" id="press" min="5" max="40" step="5" value="10">
            <div class="ends"><span id="pressN"></span></div><p class="fine" data-i18n="pressHint"></p></div>
        </div>
        <div class="card">
          <h2 data-i18n="obs"></h2>
          <dl class="kv">
            <dt data-i18n="nContacts"></dt><dd id="o1n"></dd>
            <dt data-i18n="realArea"></dt><dd id="o1a"></dd>
            <dt data-i18n="slideDist"></dt><dd id="o1d"></dd>
          </dl>
          <div><p class="muted" data-i18n="fricRel"></p>
            <div class="bar"><i id="barM" style="background:var(--matB2)"></i><i id="barA" style="background:var(--bond)"></i></div>
            <div class="legend" style="margin-top:6px"><span><i style="background:var(--matB2)"></i><span data-i18n="partMech"></span></span><span><i style="background:var(--bond)"></i><span data-i18n="partAdh"></span></span></div>
          </div>
        </div>
        <div class="card"><h2 data-i18n="trialsT"></h2><p class="muted" data-i18n="trialsHint"></p><dl class="kv" id="trials1"></dl></div>
        <div class="card" id="p1c"></div>
        <div class="card" id="p1"></div>
        <div class="card" id="p1b"></div>
      </div>
    </div>
    <details open><summary data-i18n="mechT"></summary><div data-i18n-html="mech1"></div></details>
    <details><summary data-i18n="simpleT"></summary><div data-i18n-html="simple1"></div></details>
    <details><summary data-i18n="wordT"></summary><div data-i18n-html="word1"></div></details>
  </section>

  <!-- ===================== TAB 2: MA SÁT NGHỈ, MA SÁT TRƯỢT ===================== -->
  <section id="t2" class="col" hidden>
    <p class="req" data-i18n-html="req2"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint2"></p>
        <canvas id="cv2" aria-label="spring scale"></canvas>
        <p class="status" id="st2"></p>
        <div class="controls">
          <button class="btn primary" id="pull2" data-i18n="pull2"></button>
          <button class="btn" id="run2"></button>
          <button class="btn" id="stepB2" data-i18n="step"></button>
          <button class="btn" id="rst2" data-i18n="reset"></button>
          <div class="seg" role="group" id="spd2"></div>
        </div>
        <canvas id="g2" aria-label="graph"></canvas>
        <div class="legend">
          <span><i style="background:var(--force)"></i><span data-i18n="lgScale"></span></span>
          <span><i style="background:var(--fric)"></i><span data-i18n="lgFric"></span></span>
        </div>
        <p class="fine" data-i18n="assume2"></p>
      </div>
      <div class="col">
        <div class="card">
          <div class="sl"><div class="top"><span data-i18n="surface"></span></div><select id="surf2"></select></div>
          <div class="sl"><div class="top"><span data-i18n="mass"></span><span class="val" id="massV"></span></div>
            <input type="range" id="mass" min="0.2" max="5" step="0.1" value="1"></div>
          <div class="sl"><div class="top"><span data-i18n="face"></span></div>
            <div class="seg" id="face2"><button class="btn" data-f="wide" data-i18n="faceWide"></button><button class="btn" data-f="narrow" data-i18n="faceNarrow"></button></div></div>
          <label class="chk"><input type="checkbox" id="pn2"> <span data-i18n="showPN"></span></label>
        </div>
        <div class="card">
          <h2 data-i18n="obs"></h2>
          <div class="bigfig" id="o2F"></div>
          <dl class="kv">
            <dt data-i18n="fricNow"></dt><dd id="o2f"></dd>
            <dt data-i18n="fricKind"></dt><dd id="o2k"></dd>
            <dt data-i18n="weight"></dt><dd id="o2P"></dd>
            <dt data-i18n="peak"></dt><dd id="o2pk"></dd>
            <dt data-i18n="slideF"></dt><dd id="o2sl"></dd>
          </dl>
        </div>
        <div class="card" id="p2"></div>
        <div class="card" id="p2b"></div>
      </div>
    </div>
    <details open><summary data-i18n="mechT"></summary><div data-i18n-html="mech2"></div></details>
    <details><summary data-i18n="simpleT"></summary><div data-i18n-html="simple2"></div></details>
  </section>

  <!-- ===================== TAB 3: GIAO THÔNG ===================== -->
  <section id="t3" class="col" hidden>
    <p class="req" data-i18n-html="req3"></p>
    <div class="lab">
      <div class="stage">
        <div class="seg" id="mode3"><button class="btn" data-m="brake" data-i18n="modeBrake"></button><button class="btn" data-m="start" data-i18n="modeStart"></button></div>
        <p class="hint" id="hint3"></p>
        <canvas id="cv3" aria-label="road"></canvas>
        <p class="status" id="st3"></p>
        <div class="controls">
          <button class="btn primary" id="run3"></button>
          <button class="btn" id="rst3" data-i18n="reset"></button>
          <div class="seg" role="group" id="spd3"></div>
        </div>
        <canvas id="g3" aria-label="graph"></canvas>
        <p class="fine" data-i18n="assume3"></p>
      </div>
      <div class="col">
        <div class="card">
          <div class="sl"><div class="top"><span data-i18n="roadT"></span></div><select id="road3"></select></div>
          <div class="sl"><div class="top"><span id="spdLbl3"></span><span class="val" id="vV"></span></div>
            <input type="range" id="v3" min="10" max="100" step="5" value="50"></div>
          <div class="sl" id="trBox"><div class="top"><span data-i18n="react"></span><span class="val" id="trV"></span></div>
            <input type="range" id="tr3" min="0.5" max="2.5" step="0.1" value="1"></div>
        </div>
        <div class="card">
          <h2 data-i18n="obs"></h2>
          <dl class="kv" id="o3"></dl>
        </div>
        <div class="card" id="p3"></div>
        <div class="card" id="p3b"></div>
      </div>
    </div>
    <details open><summary data-i18n="mechT"></summary><div data-i18n-html="mech3"></div></details>
    <details><summary data-i18n="simpleT"></summary><div data-i18n-html="simple3"></div></details>
  </section>

  <!-- ===================== TAB 4: LỰC CẢN CỦA NƯỚC, KHÔNG KHÍ ===================== -->
  <section id="t4" class="col" hidden>
    <p class="req" data-i18n-html="req4"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint4"></p>
        <canvas id="cv4" aria-label="tubes"></canvas>
        <p class="status" id="st4"></p>
        <div class="controls">
          <button class="btn primary" id="run4"></button>
          <button class="btn" id="rst4" data-i18n="reset"></button>
          <div class="seg" role="group" id="spd4"></div>
          <label class="chk"><input type="checkbox" id="fb4"> <span data-i18n="showFb"></span></label>
        </div>
        <canvas id="g4" aria-label="graph"></canvas>
        <canvas id="g4f" aria-label="drag graph"></canvas>
        <div class="legend"><span><i style="background:var(--laneA)"></i><span data-i18n="lgDragA"></span></span><span><i style="background:var(--laneB)"></i><span data-i18n="lgDragB"></span></span><span><i style="background:repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 8px)"></i><span data-i18n="lgWnet"></span></span></div>
        <p class="fine" data-i18n="assume4"></p>
      </div>
      <div class="col">
        <div class="card">
          <div class="two">
            <div class="sl"><div class="lanehdr"><i style="background:var(--laneA)"></i><span data-i18n="laneA"></span></div>
              <select id="medA"></select><select id="objA"></select></div>
            <div class="sl"><div class="lanehdr"><i style="background:var(--laneB)"></i><span data-i18n="laneB"></span></div>
              <select id="medB"></select><select id="objB"></select></div>
          </div>
          <div class="controls">
            <button class="btn" id="pre4a" data-i18n="pre4a"></button>
            <button class="btn" id="pre4b" data-i18n="pre4b"></button>
            <button class="btn" id="pre4c" data-i18n="pre4c"></button>
          </div>
        </div>
        <div class="card">
          <h2 data-i18n="obs"></h2>
          <dl class="kv" id="o4"></dl>
        </div>
        <div class="card" id="p4"></div>
        <div class="card" id="p4b"></div>
      </div>
    </div>
    <details open><summary data-i18n="mechT"></summary><div data-i18n-html="mech4"></div></details>
    <details><summary data-i18n="simpleT"></summary><div data-i18n-html="simple4"></div></details>
  </section>
</div>

<script>
"use strict";
/* ================= I18N ================= */
const I18N={
vi:{
eyebrow:'KHTN 6 · Lực · Mô phỏng',title:'Lực ma sát: vì sao có, khi nào có lợi, khi nào có hại',
tab1:'1. Vì sao có ma sát?',tab2:'2. Ma sát nghỉ và ma sát trượt',tab3:'3. Ma sát và giao thông',tab4:'4. Lực cản của nước, không khí',
obs:'Quan sát',run:'▶ Chạy',pause:'⏸ Tạm dừng',step:'Bước',reset:'Đặt lại',
mechT:'Cơ chế (giải thích khoa học)',simpleT:'Nói cho học sinh dễ hiểu',wordT:'Nguồn gốc từ “ma sát”',
predTitle:'Dự đoán trước',predThen:'Giờ hãy làm thí nghiệm trong mô phỏng để kiểm tra.',showAns:'Xem đáp án',hideAns:'Ẩn đáp án',
lgPull:'lực kéo',lgFric:'lực ma sát',lgPress:'lực ép (trọng lượng)',lgContact:'chỗ hai mặt chạm nhau thật',lgScale:'số chỉ lực kế (lực kéo)',

p1be:'Đáp án: giảm lúc đầu rồi lại tăng. Khi mặt quá nhẵn, rất nhiều chỗ áp sát nhau nên các phân tử hai bên hút nhau mạnh hơn. Hai tấm kính thật phẳng và sạch ép vào nhau rất khó trượt; các khối căn mẫu bằng thép đánh bóng có thể “dính” vào nhau.',
mech1:`<p><b>1. Bề mặt nào cũng nhấp nhô.</b> Dù trông nhẵn, mọi bề mặt đều có các gờ cao thấp cỡ micrômét (phần nghìn milimét). Đặt khối gỗ lên bàn thì hai mặt chỉ chạm nhau ở đỉnh các gờ. Phần diện tích chạm nhau thật rất nhỏ so với diện tích nhìn thấy.</p>
<p><b>2. Gờ cài vào nhau.</b> Muốn khối trượt, các gờ phải được nâng lên vượt qua nhau, hoặc bị đè bẹp, bị mài gãy. Việc đó cần lực. Kéo trên hình để thấy khối gỗ bị nâng lên hạ xuống khi gờ vượt qua gờ.</p>
<p><b>3. Phân tử ở chỗ chạm hút nhau.</b> Ở các chỗ chạm thật, hạt của hai vật ở rất gần nhau nên hút nhau (lực liên kết giữa các phân tử, có khi tạo thành “mối hàn” rất nhỏ). Muốn trượt phải bứt các liên kết này ra. Chúng đứt rồi lại nối ở chỗ chạm mới, liên tục, nên năng lượng chuyển thành nhiệt: xoa hai bàn tay thấy ấm.</p>
<p><b>4. Hệ quả.</b> Ép mạnh hơn thì các gờ bẹp thêm, số chỗ chạm thật tăng, nên ma sát tăng. Bôi dầu thì lớp dầu tách hai mặt ra, ít chỗ chạm, ma sát giảm. Mặt quá nhẵn và sạch thì chỗ chạm rất nhiều, lực hút phân tử lớn, ma sát lại tăng.</p>
<p><b>Lực ma sát là lực tiếp xúc:</b> nó chỉ xuất hiện ở bề mặt tiếp xúc giữa hai vật, vì chỉ ở đó các gờ và các phân tử của hai vật mới tác dụng lên nhau.</p>`,
simple1:`<ul><li>Hãy úp hai bàn chải đánh răng vào nhau rồi kéo: lông của chúng cài vào nhau nên khó kéo. Bề mặt mọi vật, nhìn thật gần, cũng “lởm chởm” như vậy.</li>
<li>Ở mỗi chỗ chạm có rất nhiều “miếng băng dính tí hon” (các hạt hút nhau). Kéo vật đi là phải giật đứt các miếng băng dính đó.</li>
<li>Ấn mạnh thì nhiều chỗ chạm hơn, nhiều băng dính hơn, nên khó kéo hơn. Bôi dầu giống như chèn một lớp trơn ở giữa, các gờ ít chạm nhau.</li>
<li>Câu cần nhớ: <b>lực ma sát xuất hiện ở chỗ hai vật tiếp xúc, do bề mặt hai vật “bám” và “cài” vào nhau.</b></li></ul>`,
word1:`<p><b>Ma sát</b> là từ Hán Việt 摩擦. <b>Ma</b> (摩) nghĩa là xoa, mài, chà (như trong <i>ma luyện</i>: mài giũa, rèn luyện); <b>sát</b> (擦) nghĩa là chà, cọ, lau. Ghép lại: cọ xát vào nhau. Tiếng Trung hiện đại vẫn dùng 摩擦 (mócā), tiếng Nhật là 摩擦 (masatsu), tiếng Hàn 마찰 (machal), cùng một gốc chữ Hán.</p>
<p><b>Friction</b> (tiếng Anh), <b>frottement</b> (tiếng Pháp), <b>Reibung</b> (tiếng Đức) đều mang nghĩa “chà xát”. Từ friction đến từ tiếng Latinh <i>frictio</i>, gốc là động từ <i>fricare</i>: chà, xoa. Ngành khoa học nghiên cứu ma sát, mài mòn và bôi trơn tên là <b>tribology</b> (ma sát học), từ tiếng Hy Lạp <i>τρίβω</i> (tribō): cọ xát, mài.</p>
<p>Điểm chung: mọi ngôn ngữ đều đặt tên hiện tượng theo hành động <b>cọ hai bề mặt vào nhau</b>, đúng với cơ chế ở trên: ma sát sinh ra ở chỗ hai bề mặt tiếp xúc.</p>`,

p2e:'Đáp án: giảm xuống. Lực ma sát nghỉ lớn nhất (lúc sắp trượt) lớn hơn lực ma sát trượt. Khi đã trượt, các chỗ chạm không kịp “bám chặt” và khối hơi nảy trên đỉnh các gờ, nên cần lực nhỏ hơn để giữ cho khối tiếp tục trượt. (Riêng Teflon thì hai giá trị gần bằng nhau.)',

mech2:`<p><b>Ma sát nghỉ</b> xuất hiện khi có lực kéo (hoặc đẩy) mà vật vẫn đứng yên. Nó giữ cho vật không trượt và luôn có độ lớn bằng lực kéo, ngược chiều. Kéo mạnh thêm thì ma sát nghỉ cũng tăng theo, cho tới một giá trị lớn nhất. Trong mô phỏng, đó là lúc đồ thị đỏ và đồ thị tím trùng nhau và cùng đi lên.</p>
<p><b>Ma sát trượt</b> xuất hiện khi vật trượt trên bề mặt vật khác. Nó ngược chiều chuyển động và gần như không đổi khi tốc độ thay đổi. Thường thì ma sát trượt nhỏ hơn ma sát nghỉ lớn nhất: các chỗ chạm chỉ tồn tại rất ngắn nên liên kết phân tử chưa kịp hình thành nhiều.</p>
<p><b>Ma sát phụ thuộc vào gì?</b> Vào chất liệu và tình trạng hai bề mặt (thử đổi “Hai mặt tiếp xúc”) và vào lực ép hai mặt vào nhau (thử đổi khối lượng). Ma sát hầu như không phụ thuộc diện tích mặt tiếp xúc nhìn thấy.</p>
<p><b>Hiện tượng “dính – trượt”:</b> ngoài đời, nếu kéo rất chậm bằng dây mềm, khối có thể trượt giật cục: trượt một đoạn rồi dừng, lặp lại. Đó là vì ma sát nghỉ lớn nhất lớn hơn ma sát trượt, và cũng là lí do bản lề cửa kêu cót két, phanh xe rít, dây đàn vĩ cầm phát ra tiếng. (Lực kế trong mô phỏng có giảm chấn nên số chỉ ổn định nhanh.)</p>`,
simple2:`<ul><li><b>Ma sát nghỉ</b> = ma sát “giữ”: em đẩy cái tủ mà tủ chưa nhúc nhích, vì ma sát nghỉ giữ nó lại.</li>
<li><b>Ma sát trượt</b> = ma sát “cản”: tủ đã trượt rồi mà vẫn bị sàn cản lại.</li>
<li>Đẩy tủ, lúc đầu phải gồng hết sức, khi tủ đã nhích đi thì đẩy nhẹ hơn: vì ma sát nghỉ lớn nhất lớn hơn ma sát trượt.</li>
<li>Muốn đo lực ma sát trượt: kéo vật bằng lực kế cho nó trượt <b>đều</b>; lúc đó số chỉ lực kế bằng lực ma sát trượt.</li></ul>`,

p3q:'Xe đang chạy 30 km/h thì phanh. Nếu xe chạy 60 km/h (gấp đôi), quãng đường PHANH (sau khi đạp phanh) sẽ…',p3a:'Gấp đôi',p3b:'Gấp bốn',p3c:'Không đổi',
p3e:'Đáp án: gấp bốn. Quãng đường phanh tỉ lệ với bình phương tốc độ. Thử 30 rồi 60 km/h trên đường khô: khoảng 4,4 m thành khoảng 17,7 m. Vì vậy chạy nhanh rất nguy hiểm, nhất là khi đường ướt.',
p3bq:'Khi xe khởi hành và chạy nhanh dần, lực ma sát của mặt đường tác dụng lên bánh xe chủ động hướng về đâu?',p3ba:'Ngược chiều chuyển động (cản xe lại)',p3bb:'Cùng chiều chuyển động (đẩy xe đi tới)',p3bc:'Không có ma sát',
p3be:'Đáp án: cùng chiều chuyển động. Bánh xe quay, đẩy mặt đường về phía sau; mặt đường đẩy lại bánh xe về phía trước bằng lực ma sát. Không có ma sát (đường băng) thì bánh chỉ quay tít tại chỗ. Bước chân đi bộ cũng vậy.',
mech3:`<p><b>Ma sát thúc đẩy chuyển động.</b> Khi động cơ làm bánh xe quay, chỗ lốp chạm đất có xu hướng trượt về phía sau. Ma sát nghỉ giữa lốp và mặt đường chống lại xu hướng đó nên hướng về phía trước và đẩy xe đi. Người đi bộ cũng thế: chân đạp đất về sau, ma sát đẩy người về trước. Ma sát nghỉ chỉ lớn tới một giới hạn; nếu xe đòi lực lớn hơn (đường băng, nhấn ga quá mạnh) thì bánh quay trượt.</p>
<p><b>Ma sát cản trở chuyển động.</b> Khi phanh, ma sát giữa lốp và mặt đường hướng ngược chiều chuyển động và làm xe chậm dần rồi dừng. Ma sát càng lớn, xe dừng càng nhanh.</p>
<p><b>An toàn giao thông.</b> Tổng quãng đường dừng xe gồm quãng đi trong lúc người lái phản ứng (tỉ lệ với tốc độ) và quãng đường phanh (tỉ lệ với bình phương tốc độ, tỉ lệ nghịch với độ bám). Nước mưa, sỏi cát, dầu loang hay băng làm giảm số chỗ bám giữa lốp và đường, nên quãng đường phanh dài ra nhiều lần. Lốp mòn hết rãnh không thoát được nước nên trơn hơn. Người lái mệt, dùng điện thoại hay uống rượu bia thì phản ứng chậm.</p>`,
simple3:`<ul><li>Không có ma sát thì xe không chạy được và cũng không dừng được: bánh xe chỉ quay tít như trên mặt băng.</li>
<li>Ma sát có lợi: giúp ta đi, giúp xe chạy, giúp phanh xe. Ma sát có hại: làm mòn lốp, mòn phanh, tốn nhiên liệu.</li>
<li>Trời mưa đường trơn: phải đi chậm, giữ khoảng cách xa hơn với xe trước.</li>
<li>Chạy nhanh gấp đôi thì cần đoạn đường phanh dài gấp bốn!</li></ul>`,

p4e:'Đáp án: trong không khí. Nước cản mạnh hơn không khí rất nhiều (nước đặc hơn không khí khoảng 800 lần), nên trong nước viên bi nhanh chóng đạt một tốc độ không tăng thêm được (đồ thị nằm ngang). Đó là bằng chứng có lực cản của nước.',
p4bq:'Thả cùng lúc tờ giấy phẳng và tờ giấy giống hệt nhưng đã vo tròn, trong không khí. Kết quả?',p4ba:'Hai tờ chạm đất cùng lúc vì cùng khối lượng',p4bb:'Tờ phẳng chạm đất trước',p4bc:'Tờ vo tròn chạm đất trước',
p4be:'Đáp án: tờ vo tròn chạm trước. Cùng trọng lượng, nhưng tờ phẳng có mặt cản không khí lớn hơn nên lực cản lớn hơn. Thử đổi ống A thành chân không: trong chân không không có lực cản, mọi vật rơi nhanh như nhau.',
mech4:`<p><b>Vì sao có lực cản?</b> Khi vật chuyển động trong nước hay không khí, nó phải đẩy các hạt chất lỏng, chất khí ra khỏi đường đi và kéo lớp chất lỏng sát mặt vật đi theo. Chất lỏng, chất khí tác dụng ngược lại lên vật một lực ngược chiều chuyển động: đó là lực cản.</p>
<p><b>Lực cản lớn khi:</b> vật chuyển động nhanh (lực cản tăng rất nhanh theo tốc độ), vật có mặt hứng lớn hoặc hình dạng không thuôn, chất lưu đặc (nước đặc hơn không khí khoảng 800 lần).</p>
<p><b>Tốc độ giới hạn.</b> Khi vật rơi nhanh dần, lực cản tăng dần tới khi bằng trọng lượng (trừ lực đẩy của chất lỏng). Từ đó vật rơi đều, đồ thị tốc độ nằm ngang. Trong chân không không có lực cản, mọi vật rơi như nhau.</p>
<p><b>Liên hệ ma sát.</b> Lực cản của nước và không khí cũng là một lực cản trở chuyển động như ma sát, nhưng không do gờ cài vào nhau mà do vật phải đẩy chất lưu ra và do các lớp chất lưu trượt lên nhau (ma sát nhớt).</p>`,
simple4:`<ul><li>Đi bộ dưới hồ bơi rất mệt vì nước cản mạnh hơn không khí.</li>
<li>Thả tờ giấy phẳng thì nó bay lả tả, vo tròn lại thì rơi nhanh: cùng nặng như nhau, nhưng tờ phẳng “hứng” nhiều không khí hơn.</li>
<li>Cá, tàu thuỷ, máy bay có dạng thuôn để giảm lực cản. Dù (dù nhảy) có mặt rất rộng để tăng lực cản, rơi chậm và an toàn.</li></ul>`
},

p1q:'The table and the block look perfectly flat. Under a very powerful microscope, what would you see?',p1a:'Perfectly flat, touching everywhere',p1b:'Hills and valleys, touching only at a few peaks',p1c:'The surfaces do not touch at all',
p1e:'Answer: hills and valleys. Every surface, even glass, is bumpy at the micrometre scale. The objects really touch only at the tips of the bumps, and friction is produced at those contacts.',
p1bq:'If both surfaces are polished very smooth (slide roughness to the left), friction will…',p1ba:'Keep decreasing, almost to zero',p1bb:'Decrease at first, then rise again when extremely smooth',p1bc:'Stay the same',
p1be:'Answer: decrease, then rise again. Extremely smooth surfaces touch in very many places, so the molecules attract more strongly. Two flat clean glass plates pressed together are hard to slide; polished steel gauge blocks can “wring” together.',
mech1:`<p><b>1. Every surface is bumpy.</b> Even smooth-looking surfaces have peaks and valleys about a micrometre high. Put the block on the table and they touch only at the tips of the bumps. The real contact area is tiny compared with the visible area.</p>
<p><b>2. Bumps interlock.</b> To slide, the bumps must be lifted over one another, squashed or broken off. That takes force. Drag the picture and watch the block rise and fall as bumps ride over bumps.</p>
<p><b>3. Molecules attract at the contacts.</b> At the real contacts the particles of the two objects are very close, so they attract (intermolecular bonds, sometimes tiny “cold welds”). Sliding means tearing these bonds. They break and re-form at new contacts again and again, turning energy into heat: rub your hands and they get warm.</p>
<p><b>4. Consequences.</b> Press harder: bumps flatten more, there are more real contacts, so more friction. Add oil: the film separates the surfaces, fewer contacts, less friction. Make surfaces too smooth and clean: lots of contact, strong attraction, friction rises again.</p>
<p><b>Friction is a contact force:</b> it appears only at the surface between the two objects, because only there do their bumps and molecules act on each other.</p>`,
simple1:`<ul><li>Press two toothbrushes together bristle to bristle and pull: the bristles catch on each other. Seen up close, every surface is “bristly” like that.</li>
<li>Every contact point has lots of “tiny sticky tapes” (particles attracting). Moving the object means ripping those tapes.</li>
<li>Press harder: more contacts, more tape, harder to pull. Oil is like a slippery layer in between, so the bumps hardly touch.</li>
<li>Key sentence: <b>friction appears where two objects touch, because their surfaces stick to and catch on each other.</b></li></ul>`,
word1:`<p>The Vietnamese word <b>ma sát</b> is Sino-Vietnamese 摩擦: <b>ma</b> (摩) means to rub or grind, <b>sát</b> (擦) means to scrub or wipe; together, “rubbing against each other”. Chinese 摩擦 (mócā), Japanese 摩擦 (masatsu) and Korean 마찰 (machal) share the same characters.</p>
<p><b>Friction</b> comes from Latin <i>frictio</i>, from the verb <i>fricare</i>, “to rub”. French <b>frottement</b> and German <b>Reibung</b> also mean “rubbing”. The science of friction, wear and lubrication is <b>tribology</b>, from Greek <i>τρίβω</i> (tribō), “to rub”.</p>
<p>All these languages name the phenomenon after <b>rubbing two surfaces together</b>, which matches the mechanism: friction arises where the surfaces touch.</p>`,

p2e:'Answer: it drops. Maximum static friction (just before sliding) is larger than kinetic friction. Once sliding, contacts have no time to “grip” and the block skims over the bump tips, so less force keeps it going. (For Teflon the two are almost equal.)',

p2be:'Answer: about the same. The visible area is smaller, but each contact is pressed harder and flattens more. The REAL contact area depends almost only on the pressing force, not on which face is down. This is Amontons’ law (1699), approximately true for ordinary solids.',
mech2:`<p><b>Static friction</b> appears when a pull (or push) acts but the object stays still. It stops the object sliding and always equals the pull, in the opposite direction. Pull harder and static friction grows too, up to a maximum. In the simulation the red and purple graphs overlap and rise together.</p>
<p><b>Kinetic (sliding) friction</b> appears when an object slides over another. It opposes the motion and stays nearly constant with speed. Usually it is smaller than maximum static friction: each contact lasts so briefly that fewer molecular bonds form.</p>
<p><b>What does friction depend on?</b> The materials and condition of the surfaces (change “Surfaces in contact”) and how hard they are pressed together (change the mass). It hardly depends on the visible contact area.</p>
<p><b>Stick–slip:</b> in real life, pulled very slowly through a soft string, a block may jerk: slide a little, stop, repeat. That happens because maximum static friction exceeds kinetic friction, and it is why hinges creak, brakes squeal and violin strings sing. (The simulated spring scale is damped, so its reading settles quickly.)</p>`,
simple2:`<ul><li><b>Static friction</b> = “holding” friction: you push a wardrobe and it does not budge, because static friction holds it.</li>
<li><b>Kinetic friction</b> = “resisting” friction: the wardrobe slides but the floor still drags on it.</li>
<li>You strain to get the wardrobe moving, then it gets easier: maximum static friction is larger than kinetic friction.</li>
<li>To measure kinetic friction: pull with a spring scale so the object slides <b>steadily</b>; the reading then equals the kinetic friction.</li></ul>`,

p3q:'A car brakes from 30 km/h. At 60 km/h (twice as fast), the BRAKING distance (after the brake is pressed) will be…',p3a:'Twice as long',p3b:'Four times as long',p3c:'The same',
p3e:'Answer: four times. Braking distance grows with the square of speed. Try 30 then 60 km/h on a dry road: about 4.4 m becomes about 17.7 m. That is why speeding is so dangerous, especially in the wet.',
p3bq:'As a car pulls away and speeds up, which way does the road’s friction on the driven wheels point?',p3ba:'Against the motion (slowing the car)',p3bb:'Along the motion (pushing the car forward)',p3bc:'There is no friction',
p3be:'Answer: along the motion. The turning wheel pushes the road backwards; the road pushes the wheel forwards through friction. With no friction (ice) the wheel just spins. Walking works the same way.',
mech3:`<p><b>Friction drives motion.</b> When the engine turns the wheel, the tyre patch on the road tends to slip backwards. Static friction opposes that tendency, so it points forwards and pushes the car. Walking is the same: your foot pushes the ground back, friction pushes you forward. Static friction has a limit; demand more (ice, flooring the pedal) and the wheels spin.</p>
<p><b>Friction hinders motion.</b> When braking, tyre–road friction points against the motion and slows the car to a stop. More friction, shorter stop.</p>
<p><b>Road safety.</b> Stopping distance = distance during the driver’s reaction (proportional to speed) + braking distance (proportional to speed squared, inversely to grip). Rain, gravel, spilled oil or ice reduce grip, so braking distance becomes several times longer. Bald tyres cannot clear water. Tired, distracted or drunk drivers react later.</p>`,
simple3:`<ul><li>Without friction a car could neither go nor stop: the wheels would just spin, as on ice.</li>
<li>Helpful friction: lets us walk, lets cars move and brake. Harmful friction: wears tyres and brakes, wastes fuel.</li>
<li>Wet roads are slippery: drive slower and keep a bigger gap.</li>
<li>Twice the speed needs four times the braking distance!</li></ul>`,

mech4:`<p><b>Why is there drag?</b> An object moving through water or air must push the fluid’s particles out of its way and drags the layer next to its surface along. The fluid pushes back on the object with a force opposite to its motion: drag.</p>
<p><b>Drag is large when</b> the object moves fast (drag rises steeply with speed), has a large or blunt front, or moves through a dense fluid (water is about 800 times denser than air).</p>
<p><b>Terminal speed.</b> As the object speeds up, drag grows until it equals the weight (minus buoyancy). Then it falls at constant speed and the speed graph goes flat. In a vacuum there is no drag and everything falls alike.</p>
<p><b>Link to friction.</b> Drag also resists motion like friction, but it comes from pushing fluid aside and from fluid layers sliding over each other (viscous friction), not from interlocking bumps.</p>`,

function size(cv,ratio,maxH){
  const w=cv.clientWidth||300; let h=Math.round(w*ratio); if(maxH)h=Math.min(h,maxH); h=Math.max(h,160);
  if(cv._h!==h){cv.style.height=h+'px';cv._h=h;}
  const d=window.devicePixelRatio||1,W=Math.round(w*d),H=Math.round(h*d);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);return {ctx,w,h};
}
function txt(ctx,s,x,y,col,sz=14,wt=600,al='left',bl='middle',font=FONT){ctx.fillStyle=col;ctx.font=`${wt} ${sz}px ${font}`;ctx.textAlign=al;ctx.textBaseline=bl;ctx.fillText(s,x,y);}
function pill(ctx,s,x,y,col,sz=13,al='center'){ctx.font=`700 ${sz}px ${FONT}`;const tw=ctx.measureText(s).width;let x0=al==='center'?x-tw/2:al==='right'?x-tw:x;
  ctx.fillStyle=C.panel;ctx.globalAlpha=.88;ctx.beginPath();ctx.roundRect(x0-5,y-sz*.75,tw+10,sz*1.5,5);ctx.fill();ctx.globalAlpha=1;txt(ctx,s,x0,y,col,sz,700,'left');}
function arrow(ctx,x1,y1,x2,y2,col,lw=4){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<3)return;const ux=dx/L,uy=dy/L,hl=Math.min(14,L*.7),hw=hl*.55;
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-ux*hl*.8,y2-uy*hl*.8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-ux*hl-uy*hw,y2-uy*hl+ux*hw);ctx.lineTo(x2-ux*hl+uy*hw,y2-uy*hl-ux*hw);ctx.closePath();ctx.fill();
}
function niceStep(range,n=5){const r=range/n,p=10**Math.floor(Math.log10(r)),m=r/p;return (m<1.5?1:m<3?2:m<7?5:10)*p;}
function graph(cv,series,o){
  const {ctx,w,h}=size(cv,R(.3,.55),240);
  const L=52,Rr=12,Tt=14,B=36,pw=w-L-Rr,ph=h-Tt-B;
  const x0=o.x0||0,x1=o.x1,y0=o.y0||0,y1=o.y1;
  const X=x=>L+(x-x0)/(x1-x0)*pw,Y=y=>Tt+ph-(y-y0)/(y1-y0)*ph;
  ctx.strokeStyle=C.line;ctx.lineWidth=1;
  const sx=niceStep(x1-x0,R(6,4)),sy=niceStep(y1-y0,4);
  for(let x=Math.ceil(x0/sx)*sx;x<=x1+1e-9;x+=sx){ctx.beginPath();ctx.moveTo(X(x),Tt);ctx.lineTo(X(x),Tt+ph);ctx.stroke();txt(ctx,nf(x,sx<1?1:0),X(x),Tt+ph+12,C.muted,12,500,'center');}
  for(let y=Math.ceil(y0/sy)*sy;y<=y1+1e-9;y+=sy){ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+pw,Y(y));ctx.stroke();txt(ctx,nf(y,sy<1?1:0),L-6,Y(y),C.muted,12,500,'right');}
  txt(ctx,o.xl,L+pw,Tt+ph+28,C.muted,12,600,'right');
  ctx.save();ctx.translate(13,Tt+ph/2);ctx.rotate(-Math.PI/2);txt(ctx,o.yl,0,0,C.muted,12,600,'center');ctx.restore();
  ctx.save();ctx.beginPath();ctx.rect(L,Tt-2,pw,ph+4);ctx.clip();
  series.forEach(s=>{if(!s.d.length)return;ctx.strokeStyle=s.c;ctx.lineWidth=s.lw||2.5;ctx.setLineDash(s.dash||[]);ctx.beginPath();
    s.d.forEach((p,i)=>{const px=X(p[0]),py=Y(p[1]);i?ctx.lineTo(px,py):ctx.moveTo(px,py);});ctx.stroke();});
  ctx.setLineDash([]);ctx.restore();
}

const S1={rough:.6,load:10,lube:false,bonds:true,off:0,v:0,drag:null,sparks:[],prevSegs:[],stretch:0,xm:0,vm:0,x0:null,dist:null,coast:false,trials:[]};
const F_PUSH=15,T_PUSH=.15,T_APP=.35,T_RET=.6,OFF_PER_M=300; // tay đẩy luôn 15 N trong 0,15 s; dịch hình phóng to theo quãng đường (px/m, chỉ để nhìn)
const PROF=(x,s)=>.15*Math.sin(x*.012+s)+.35*Math.sin(x*.061+2.1*s)+.3*Math.sin(x*.113+3.7*s)+.25*Math.sin(x*.171+5.3*s)+.18*Math.sin(x*.237+.7*s);
function micro(zw){
  const A=6+50*S1.rough,st=3,n=Math.ceil(zw/st)+1,pb=new Float32Array(n),pt=new Float32Array(n);
  let mx=-1e9;
  for(let i=0;i<n;i++){const x=i*st;pb[i]=A*PROF(x,1.3);pt[i]=A*PROF(x-S1.off,4.1);mx=Math.max(mx,pb[i]+pt[i]);}
  // lực ép càng lớn, các gờ càng bẹp (delta), số chỗ chạm thật càng nhiều; dầu đỡ phần lớn tải, chỉ còn vài đỉnh cao nhất chạm nhau
  const delta=.45*S1.load**.7*(1+A/40),film=S1.lube?Math.max(0,2-.05*S1.load):0,y0=mx-(S1.lube?delta*.2:delta)+film;
  const segs=[];let cur=null,cnt=0;
  for(let i=0;i<n;i++){const gap=y0-pt[i]-pb[i];if(gap<0){cnt++;if(!cur){cur={a:i,b:i};segs.push(cur);}else cur.b=i;}else cur=null;}
  const fc=cnt/n;
  const lubeK=S1.lube?(segs.length?.5:.12):1;
  const mech=.75*S1.rough*(S1.load/40)*lubeK, adh=2.5*fc;
  return {A,st,n,pb,pt,y0,segs,fc,mech,adh,film};
}
// Hệ số ma sát "hiệu dụng" lấy trung bình từ mô hình vi mô (độ nhám, lực ép, dầu); lực ép = trọng lượng nên gia tốc hãm a = μ·g
function calcMu(){const off=S1.off;let mech=0,adh=0;for(let k=0;k<16;k++){S1.off=k*37;const M=micro(600);mech+=M.mech;adh+=M.adh;}S1.off=off;
  mech/=16;adh/=16;S1.mech=mech;S1.adh=adh;S1.mu=Math.max(.08,.7*(mech+adh)*40/S1.load);}
function addTrial(){S1.resetT=5;S1.dist=Math.abs(S1.xm-S1.x0);S1.trials.unshift({r:S1.rough,l:S1.load,o:S1.lube,d:S1.dist});S1.trials=S1.trials.slice(0,6);renderTrials();}
// Bàn tay: tiến tới (app) → đẩy với lực không đổi F_PUSH trong T_PUSH giây (push) → rút về (ret). Lực ép = trọng lượng nên m = P/g.
function t1Frame(dt){
  const H=S1.hand,m=S1.load/g,fk=S1.mu*S1.load,fsMax=1.2*fk;
  if(H){H.t+=dt;
    if(H.ph==='app'&&H.t>=T_APP){H.ph='push';H.t=0;S1.x0=S1.xm;S1.dist=null;S1.stuck=F_PUSH<=fsMax;}
    else if(H.ph==='push'&&H.t>=T_PUSH){H.ph='ret';H.t=0;H.relX=S1.xm;if(S1.stuck)addTrial();else S1.coast=true;}
    else if(H.ph==='ret'&&H.t>=T_RET)S1.hand=null;}
  // 5 s sau khi khối dừng: dời mốc "vị trí ban đầu" về chính giữa khối, sẵn sàng cho lần đẩy sau
  if(S1.resetT>0&&!H&&!S1.coast){S1.resetT-=dt;if(S1.resetT<=0){S1.resetT=0;S1.x0=S1.xm;}}
  const pushing=H&&H.ph==='push'&&!S1.stuck;
  if(pushing){S1.vm+=H.dir*(F_PUSH-fk)/m*dt;}
  else if(S1.coast){const d=Math.sign(S1.vm);S1.vm-=d*S1.mu*g*dt;if(Math.sign(S1.vm)!==d){S1.vm=0;S1.coast=false;addTrial();}}
  if(pushing||S1.coast){S1.xm+=S1.vm*dt;S1.off+=S1.vm*dt*OFF_PER_M;}
  S1.v=S1.vm*OFF_PER_M;
  S1.stretch=clamp(S1.v*.05,-7,7);
  S1.sparks=S1.sparks.filter(p=>(p.t-=dt)>0);S1.sparks.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;});
}
function renderT1(){
  const cv=$('cv1');const {ctx,w,h}=size(cv,R(.6,1.05),innerHeight*.66);
  const KF=R(2,1.5); // tỉ xích chung cho mọi lực ở tab 1: px trên 1 N
  const hm=Math.round(h*R(.27,.3)),zx=10,zy=hm+Math.round(40*KF)+30,zw=w-20,zh=h-zy-10;
  const M=micro(zw);const moving=Math.abs(S1.v)>8,PXM=R(320,170);
  // ---- dải vĩ mô ----
  const ty=hm-20;ctx.fillStyle=C.matA;ctx.fillRect(0,ty,w,20);
  // camera đi theo khối: bàn trượt ngược lại, có vạch chia 0,5 m
  const SX=m=>w/2+(m-S1.xm)*PXM;
  ctx.strokeStyle=C.matA2;ctx.lineWidth=1;const sh=((-S1.xm*PXM)%30+30)%30;
  for(let x=-30+sh;x<w;x+=30){ctx.beginPath();ctx.moveTo(x,ty+4);ctx.lineTo(x+12,ty+16);ctx.stroke();}
  for(let m=Math.floor((S1.xm-w/2/PXM)*2)/2;m<=S1.xm+w/2/PXM;m+=.5){const x=SX(m);ctx.fillStyle='#fff';ctx.fillRect(x,ty,1.5,7);txt(ctx,nf(m,1)+' m',x+3,ty+13,'#fff',10,600);}
  if(S1.x0!=null){const x=SX(S1.x0);ctx.strokeStyle=C.accent;ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(x,ty);ctx.lineTo(x,ty-hm*.62);ctx.stroke();ctx.setLineDash([]);
    pill(ctx,T('lbStart'),x,ty-hm*.62,C.accent,11);}
  const bw=Math.min(150,w*.34),bh=Math.min(40,hm*.3),bx=w/2-bw/2,by=ty-bh;
  ctx.fillStyle=C.matB;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,4);ctx.fill();
  txt(ctx,T('lbBlock'),w/2,by+bh*.68,'#fff',13,700,'center');
  // quả nặng chồng lên khối: mỗi quả 5 N, khối 5 N
  const nW=Math.round((S1.load-5)/5),dh=Math.min(9,(hm-bh-34)/7),dw=bw*.46;
  for(let k=0;k<nW;k++){const y=by-(k+1)*(dh+1);ctx.fillStyle=C.matA2;ctx.beginPath();ctx.roundRect(w/2-dw/2,y,dw,dh,2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(w/2-dw/2+3,y+1,dw-6,Math.max(1,dh*.25));}
  if(nW>0){ctx.fillStyle=C.matA2;ctx.fillRect(w/2-2,by-nW*(dh+1)-6,4,6);
    pill(ctx,T('lbWeights').replace('{n}',nW),w/2+dw/2+8,by-nW*(dh+1)/2,C.ink,11,'left');}
  // lực ép của khối lên bàn: điểm đặt trên mặt bàn (chỗ tiếp xúc), phương thẳng đứng, chiều xuống, dài theo tỉ xích; mỗi vạch = 5 N
  {const ax=w/2-bw/4,L=S1.load*KF;arrow(ctx,ax,ty,ax,ty+L,C.normal,4);ctx.fillStyle=C.normal;ctx.beginPath();ctx.arc(ax,ty,4,0,7);ctx.fill();
    ctx.strokeStyle=C.panel;ctx.lineWidth=2;for(let f=5;f<S1.load;f+=5){ctx.beginPath();ctx.moveTo(ax-5,ty+f*KF);ctx.lineTo(ax+5,ty+f*KF);ctx.stroke();}
    pill(ctx,T('lbPress').replace('{F}',nf(S1.load,0)),ax,ty+L+16,C.normal,12);
    pill(ctx,T('lbScale'),ax,ty+L+36,C.muted,11);}
  const H=S1.hand,ay=by+bh*.5;
  if(H){const d=H.dir;let tip,al=1;
    if(H.ph==='app'){const k=H.t/T_APP;tip=w/2-d*bw/2-d*(1-k)*70;al=Math.min(1,k*3);}
    else if(H.ph==='push')tip=w/2-d*bw/2+(S1.stuck?d*Math.sin(H.t*90):0);
    else{const k=H.t/T_RET;tip=SX(H.relX)-d*bw/2-d*k*60;al=1-k;}
    ctx.globalAlpha=al;drawHand(ctx,tip,ay,d,bh/40);ctx.globalAlpha=1;
    if(H.ph==='push'){const fx=w/2-d*bw/2,py=by+bh*.3;arrow(ctx,fx,py,fx+d*F_PUSH*KF,py,C.force,4);ctx.fillStyle=C.force;ctx.beginPath();ctx.arc(fx,py,3.5,0,7);ctx.fill();
      pill(ctx,T('lbPush'),fx+d*20,by-12,C.force,12);
      if(S1.stuck){arrow(ctx,w/2,ty-3,w/2-d*F_PUSH*KF,ty-3,C.fric,4);pill(ctx,T('lbFmsN').replace('{F}',nf(F_PUSH,0)),w/2+bw/2+8,ty+12,C.fric,11,'left');}}}
  if(moving){const d=Math.sign(S1.v);
    if(S1.coast&&!(H&&H.ph==='push'))pill(ctx,T('lbInertia'),12,14,C.ink,12,'left');
    const fk=S1.mu*S1.load;arrow(ctx,w/2,ty-3,w/2-d*Math.max(10,fk*KF),ty-3,C.fric,4);pill(ctx,T('lbFmsN').replace('{F}',nf(fk,1)),w/2+bw/2+8,ty+12,C.fric,11,'left');}
  // kính lúp
  const lx=w/2,ly=ty;ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();ctx.arc(lx,ly,12,0,7);ctx.stroke();

    if(S3.phase==='brake'){S3.v-=mu*g*dt;if(S3.v<=0){S3.v=0;S3.done=true;S3.phase=S3.hit!=null?'hit':'stop';if(!S3.ped)S3.running=false;}}

  [x+L*.2,x+L*.8].forEach(cx=>{ctx.fillStyle='#222';ctx.beginPath();ctx.arc(cx,y-r,r,0,7);ctx.fill();ctx.strokeStyle='#bbb';ctx.lineWidth=2;
    for(let k=0;k<3;k++){const a=wheel+k*2.094;ctx.beginPath();ctx.moveTo(cx,y-r);ctx.lineTo(cx+Math.cos(a)*r*.75,y-r+Math.sin(a)*r*.75);ctx.stroke();}});
}
function drawPerson(ctx,x,y,s){ctx.strokeStyle=C.warn;ctx.fillStyle=C.warn;ctx.lineWidth=Math.max(2,s*.12);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(x,y-s*.88,s*.12,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x,y-s*.75);ctx.lineTo(x,y-s*.38);ctx.lineTo(x-s*.18,y);ctx.moveTo(x,y-s*.38);ctx.lineTo(x+s*.18,y);
  ctx.moveTo(x-s*.22,y-s*.6);ctx.lineTo(x+s*.22,y-s*.6);ctx.stroke();}
function renderT3(){
  const cv=$('cv3');const {ctx,w,h}=size(cv,R(.28,.62),innerHeight*.48);const pl=plan3();
  const L=pl.L,off0=15+Math.max(0,56-CARL*(w-30)/L),PX=(w-off0-15)/L,X=m=>off0+m*PX,ry=h*.62;S3.PX=PX;S3.off0=off0;
  ctx.fillStyle=C.sky;ctx.fillRect(0,0,w,ry-22);ctx.fillStyle=C.grass;ctx.fillRect(0,ry-26,w,6);
  const rc=[C.road,'#4b5560','#8b7b62','#b9d4e3'][S3.ri];ctx.fillStyle=rc;ctx.fillRect(0,ry-20,w,34);
  if(S3.ri===1){ctx.fillStyle='rgba(120,170,230,.35)';for(let x=10;x<w;x+=46)ctx.fillRect(x,ry-6,24,4);}
  if(S3.ri===2){ctx.fillStyle='#c9b48e';for(let x=5;x<w;x+=9)ctx.fillRect(x,ry-12+((x*7)%13),3,3);}
  ctx.fillStyle=C.mark;for(let m=0;m<L;m+=6)ctx.fillRect(X(m),ry-4,Math.max(2,3*PX),3);
  // vạch thước
  const tick=niceStep(L,R(8,5));for(let m=0;m<=L;m+=tick){ctx.fillStyle=C.muted;ctx.fillRect(X(m),ry+14,1.5,6);txt(ctx,nf(m,0)+' m',X(m),ry+28,C.muted,11,500,'center');}
  // dải phản ứng / phanh
  if(S3.mode==='brake'&&S3.phase!=='ready'){const yb=ry+40;const e1=S3.s1!=null?S3.s1:S3.x;
    ctx.fillStyle=C.react;ctx.fillRect(X(CARL),yb,(e1)*PX,12);if(e1*PX>50)txt(ctx,T('lbReact'),X(CARL)+e1*PX/2,yb+24,C.muted,12,700,'center');
    if(S3.s1!=null){ctx.fillStyle=C.brake;ctx.fillRect(X(CARL+S3.s1),yb,(S3.x-S3.s1)*PX,12);if((S3.x-S3.s1)*PX>40)txt(ctx,T('lbBrake'),X(CARL+S3.s1)+(S3.x-S3.s1)*PX/2,yb+24,C.muted,12,700,'center');}}
  // vật cản
  if(S3.mode==='brake'){const ox=X(S3.D);ctx.setLineDash([4,4]);ctx.strokeStyle=C.warn;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ox,ry-80);ctx.lineTo(ox,ry+14);ctx.stroke();ctx.setLineDash([]);
    const P=S3.ped;if(P){const PY=Math.max(PX,22);pedDraw(ctx,X(P.x)+10,ry-8-P.y*PY,46,P.rot);}
    else{drawPerson(ctx,ox+10,ry-8,46);ctx.setLineDash([3,3]);ctx.strokeStyle=C.warn;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(ox+10,ry-30,22,30,0,0,7);ctx.stroke();ctx.setLineDash([]);}
    pill(ctx,T('lbObst')+' · '+nf(S3.D,0)+' m',ox+10,ry-70,C.warn,12);}
  // xe
  const cl=Math.max(CARL*PX,56),cx=X(S3.x+CARL)-cl;drawCar(ctx,cx,ry-6,cl,S3.wheel,1);
  if(S3.spin&&!S3.done){ctx.fillStyle=C.muted;ctx.globalAlpha=.4;for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(cx+cl*.2-10-k*9-Math.random()*4,ry-12-k*3,5+k*2,0,7);ctx.fill();}ctx.globalAlpha=1;}
  // lực ma sát ở bánh
  const wy=ry-2;
  if(S3.mode==='brake'&&S3.phase==='brake'){arrow(ctx,cx+cl*.5,wy,cx+cl*.5-60,wy,C.fric,5);pill(ctx,T('lbFmsBack'),cx+cl*.5-30,wy+20,C.fric,12);}
  if(S3.mode==='start'&&S3.phase==='go'&&!S3.done){const len=S3.spin?18:60;arrow(ctx,cx+cl*.2,wy,cx+cl*.2+len,wy,C.fric,5);pill(ctx,T('lbFmsFwd'),cx+cl*.2+30,wy+20,C.fric,12);}
  // đồ thị
  const tmax=Math.max(4,S3.t*1.1),vmax=Math.max(S3.vk*1.1,10);
  graph($('g3'),[{d:S3.hist,c:C.vel,lw:3}],{x0:0,x1:tmax,y0:0,y1:vmax,xl:T('gt'),yl:T('gvk')});
  // trạng thái
  let st=T('st3Ready');if(S3.mode==='brake'){if(S3.hit!=null)st=T('st3Hit');else if(S3.phase==='react')st=T('st3React');else if(S3.phase==='brake')st=T('st3Brake');else if(S3.phase==='stop')st=T('st3Stop');else if(S3.phase==='hit')st=T('st3Hit');}
  else if(S3.phase==='go')st=S3.done?T('st3Done'):S3.spin?T('st3Spin'):T('st3Go');
  $('st3').textContent=st;
  const kv=[];const fv=v=>nf(v*3.6,0)+' km/h';
  if(S3.mode==='brake'){kv.push(['o3v',fv(S3.v)]);
    if(S3.done){const p=plan3();kv.push(['o3s1',nf(p.s1,1)+' m'],['o3s2',nf(p.s2,1)+' m'],['o3tot',nf(p.tot,1)+' m']);
      kv.push(['o3res',S3.hit!=null?T('resHit').replace('{v}',nf(S3.hit*3.6,0)):T('resSafe').replace('{d}',nf(S3.D-CARL-S3.x,1))]);}
    else kv.push(['o3s1','—'],['o3s2','—'],['o3tot','—']);}
  else{kv.push(['o3v',fv(S3.v)],['o3slip',S3.phase==='go'?T(S3.spin?'spin':'grip'):'—'],['o3d',nf(S3.x,1)+' m'],['o3t',S3.tReach!=null?nf(S3.tReach,1)+' s':'—']);}
  $('o3').innerHTML=kv.map(([k,v])=>`<dt>${T(k)}</dt><dd>${v}</dd>`).join('');
}
function upd3(){$('run3').textContent=T(S3.running?'pause':'run');$('vV').textContent=nf(S3.vk,0)+' km/h';$('trV').textContent=nf(S3.tr,1)+' s';
  $('spdLbl3').textContent=T(S3.mode==='brake'?'spdBrake':'spdStart');$('hint3').textContent=T(S3.mode==='brake'?'hint3Brake':'hint3Start');
  $('trBox').hidden=S3.mode!=='brake';$('mode3').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===S3.mode));}
$('mode3').querySelectorAll('button').forEach(b=>b.onclick=()=>{S3.mode=b.dataset.m;reset3();});
$('road3').onchange=e=>{S3.ri=+e.target.value;reset3();};
$('v3').oninput=e=>{S3.vk=+e.target.value;reset3();};
$('tr3').oninput=e=>{S3.tr=+e.target.value;reset3();};
$('run3').onclick=()=>{if(S3.done)reset3();S3.running=!S3.running;upd3();};
$('rst3').onclick=reset3;
(()=>{const cv=$('cv3');let on=false;
  const toM=e=>{const r=cv.getBoundingClientRect();return (e.clientX-r.left-S3.off0)/S3.PX;};
  // kéo thả người đi đường (khi xe chưa chạy hoặc đã xong); giữ nguyên tỉ lệ đường trong lúc kéo
  cv.addEventListener('pointerdown',e=>{if(S3.mode!=='brake'||S3.running)return;const m=toM(e);
    if(Math.abs(m-S3.D)*S3.PX<45||(S3.ped&&Math.abs(m-S3.ped.x)*S3.PX<45)){if(S3.phase!=='ready')reset3();S3.Lfix=plan3().L;on=true;cv.setPointerCapture(e.pointerId);}});
  cv.addEventListener('pointermove',e=>{if(!on)return;const L=S3.Lfix;S3.D=clamp(Math.round(toM(e)-10/S3.PX),CARL+2,L-4);});
  const up=()=>{if(!on)return;on=false;S3.Lfix=0;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);})();

/* ================= TAB 4: lực cản ================= */
const MED=[{k:'mVac',rho:0,eta:0},{k:'mAir',rho:1.2,eta:1.8e-5},{k:'mWater',rho:1000,eta:1.0e-3}];
const ball=(k,r,rho,cd=.47)=>{const V=4/3*Math.PI*r**3;return {k,shape:'ball',m:rho*V,V,S:Math.PI*r*r,Cd:cd,r};};
const OBJ=[ball('oSteel',.01,7800),ball('oGlass',.008,2500),ball('oClayBall',.0121,1600),
  {k:'oClayFlat',shape:'plate',m:.01186,V:.01186/1600,S:.0025,Cd:1.17,r:Math.sqrt(.0025/Math.PI)},
  {k:'oPaperFlat',shape:'plate',m:.0025,V:.0025/750,S:.0311,Cd:1.17,r:Math.sqrt(.0311/Math.PI)},
  {k:'oPaperBall',shape:'crumple',m:.0025,V:4/3*Math.PI*.02**3,S:Math.PI*.02*.02,Cd:.8,r:.02}];
const H4=1.5;
const S4={speed:.5,running:false,showFb:false,lanes:[{med:1,obj:0},{med:2,obj:0}]};
function reset4(){S4.running=false;S4.t=0;S4.lastRec=-1;S4.lanes.forEach(l=>Object.assign(l,{y:0,v:0,done:false,tHit:null,vHit:null,float:false,hist:[[0,0,0]],Fd:0,Fb:0,a:0,Wn:OBJ[l.obj].m*g-MED[l.med].rho*OBJ[l.obj].V*g}));upd4();}
function forces(l){const o=OBJ[l.obj],md=MED[l.med];const W=o.m*g,Fb=md.rho*o.V*g,Fd=.5*md.rho*o.Cd*o.S*l.v*Math.abs(l.v)+6*Math.PI*md.eta*o.r*l.v;return {W,Fb,Fd,m:o.m};}
function step4(dt){
  S4.lanes.forEach(l=>{if(l.done||l.float)return;const f=forces(l);let a=(f.W-f.Fb-f.Fd)/f.m;
    if(l.y<=0&&l.v<=0&&a<=0){l.float=true;l.v=0;l.y=0;l.Fb=f.Fb;l.Fd=0;return;}
    l.v+=a*dt;l.y+=l.v*dt;if(l.y<0){l.y=0;l.v=0;}l.Fd=f.Fd;l.Fb=f.Fb;l.a=a;l.Wn=f.W-f.Fb;
    if(l.y>=H4){l.y=H4;l.done=true;l.tHit=S4.t+dt;l.vHit=l.v;l.hist.push([S4.t+dt,l.v,l.Fd]);}});
  S4.t+=dt;
  if(S4.t-S4.lastRec>=1/60){S4.lastRec=S4.t;S4.lanes.forEach(l=>{if(!l.done&&!l.float)l.hist.push([S4.t,l.v,l.Fd]);});}
  if(S4.lanes.every(l=>l.done||l.float)){S4.running=false;upd4();}
}
function phase4(l){return l.a>.03*g?'phAcc':l.a<-.03*g?'phDec':'phUni';}
function drawObj(ctx,o,x,y,col){ctx.fillStyle=col;ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;
  if(o.shape==='ball'){const r=o.k==='oClayBall'?11:o.k==='oSteel'?9:8;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();}
  else if(o.shape==='plate'){const wd=o.k==='oPaperFlat'?52:26;ctx.beginPath();ctx.rect(x-wd/2,y-2.5,wd,5);ctx.fill();ctx.stroke();}
  else{ctx.beginPath();for(let k=0;k<12;k++){const a=k/12*Math.PI*2,r=12+(k%3?2:-3);ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.stroke();}}
function renderT4(){
  const cv=$('cv4');const {ctx,w,h}=size(cv,R(.62,1.15),innerHeight*.62);
  const top=58,bot=h-22,PX=(bot-top)/H4,tw=Math.min(130,w*.24);
  S4.lanes.forEach((l,i)=>{const cx=w*(i?.72:.28),md=MED[l.med],o=OBJ[l.obj],col=i?C.laneB:C.laneA;
    ctx.fillStyle=md.rho>100?C.water:md.rho>0?C.air:C.panel;ctx.fillRect(cx-tw/2,top,tw,bot-top);
    if(md.rho>100){ctx.strokeStyle=C.normal;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-tw/2,top);ctx.lineTo(cx+tw/2,top);ctx.stroke();}
    ctx.strokeStyle=C.ink;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(cx-tw/2,top-10);ctx.lineTo(cx-tw/2,bot);ctx.lineTo(cx+tw/2,bot);ctx.lineTo(cx+tw/2,top-10);ctx.stroke();
    if(md.rho===0){ctx.setLineDash([3,5]);ctx.strokeStyle=C.muted;ctx.lineWidth=1;ctx.strokeRect(cx-tw/2+4,top,tw-8,bot-top-4);ctx.setLineDash([]);}
    txt(ctx,T(i?'laneB':'laneA')+': '+T(md.k),cx,14,col,14,700,'center');
    if(md.rho===0)txt(ctx,T('lbVac'),cx,32,C.muted,11,500,'center');
    for(let m=0;m<=H4+1e-9;m+=.5){ctx.fillStyle=C.muted;ctx.fillRect(cx+tw/2,top+m*PX,6,1.5);txt(ctx,nf(m,1)+' m',cx+tw/2+9,top+m*PX,C.muted,11,500);}
    let oy=top+12+l.y*PX*(bot-top-22)/(bot-top);drawObj(ctx,o,cx,oy,col);
    // vectơ
    const W=o.m*g,sc=46/W,ax=cx-tw/2-16;oy=Math.min(oy,bot-50);
    arrow(ctx,ax,oy,ax,oy+W*sc,C.force,3.5);txt(ctx,T('lbW'),ax-6,oy+W*sc,C.force,12,700,'right');
    if(l.Fd>W*.01){arrow(ctx,ax-10,oy,ax-10,oy-l.Fd*sc,C.fric,3.5);txt(ctx,T('lbDrag'),ax-16,oy-l.Fd*sc,C.fric,12,700,'right');}
    if(S4.showFb&&l.Fb>W*.01){arrow(ctx,ax+8,oy,ax+8,oy-l.Fb*sc,C.normal,3);txt(ctx,T('lbFb'),ax+12,oy-l.Fb*sc-8,C.normal,12,700);}
    if(l.float)pill(ctx,T('o4float'),cx,top+40,C.ink,12);
    else if(S4.t>0)pill(ctx,T(phase4(l)),cx+tw/2-4,Math.max(top+12,oy-20),col,12,'right');
  });
  txt(ctx,T('lbBig'),w/2,h-8,C.muted,11,500,'center');
  const tmax=Math.max(1,S4.t*1.08,...S4.lanes.map(l=>l.tHit||0)),vmax=Math.max(1,...S4.lanes.flatMap(l=>l.hist.map(p=>p[1])))*1.15;
  graph($('g4'),S4.lanes.map((l,i)=>({d:l.hist,c:i?C.laneB:C.laneA,lw:3})),{x0:0,x1:tmax,y0:0,y1:vmax,xl:T('gt'),yl:T('gv')});
  const live=S4.lanes.filter(l=>!l.float),fmax=Math.max(1,...live.map(l=>l.Wn*1000),...live.flatMap(l=>l.hist.map(p=>p[2]*1000)))*1.15;
  graph($('g4f'),S4.lanes.flatMap((l,i)=>l.float?[]:[{d:l.hist.map(p=>[p[0],p[2]*1000]),c:i?C.laneB:C.laneA,lw:3},{d:[[0,l.Wn*1000],[tmax,l.Wn*1000]],c:i?C.laneB:C.laneA,lw:1.5,dash:[6,4]}]),
    {x0:0,x1:tmax,y0:0,y1:fmax,xl:T('gt'),yl:T('gFd')});
  $('o4').innerHTML=S4.lanes.map((l,i)=>`<dt style="color:${i?C.laneB:C.laneA};font-weight:700">${T(i?'laneB':'laneA')}</dt><dd></dd>
    <dt>${T('o4t')}</dt><dd>${l.float?T('o4float'):l.tHit!=null?nf(l.tHit,2)+' s':(S4.t>0?T('o4run'):'—')}</dd>
    <dt>${T('o4v')}</dt><dd>${l.vHit!=null?nf(l.vHit,2)+' m/s':'—'}</dd><dt>${T('o4d')}</dt><dd>${nf(l.Fd*1000,1)} mN</dd><dt>${T('o4ph')}</dt><dd>${l.float||S4.t===0?'—':T(phase4(l))}</dd>`).join('');
  $('st4').textContent=(S4.running?T('st4Run'):S4.t>0?T('st4Done'):T('st4Ready'))+(S4.t>0?' '+T('st4Explain'):'');
}
function upd4(){$('run4').textContent=S4.running?T('pause'):T('drop');
  ['A','B'].forEach((L,i)=>{fillSelect($('med'+L),MED,S4.lanes[i].med);fillSelect($('obj'+L),OBJ,S4.lanes[i].obj);});}
['A','B'].forEach((L,i)=>{$('med'+L).onchange=e=>{S4.lanes[i].med=+e.target.value;reset4();};$('obj'+L).onchange=e=>{S4.lanes[i].obj=+e.target.value;reset4();};});
const preset=(a,b)=>{S4.lanes[0].med=a[0];S4.lanes[0].obj=a[1];S4.lanes[1].med=b[0];S4.lanes[1].obj=b[1];reset4();};
$('pre4a').onclick=()=>preset([1,0],[2,0]);$('pre4b').onclick=()=>preset([1,4],[1,5]);$('pre4c').onclick=()=>preset([2,2],[2,3]);
$('fb4').onchange=e=>S4.showFb=e.target.checked;
$('run4').onclick=()=>{if(S4.lanes.every(l=>l.done||l.float))reset4();S4.running=!S4.running;upd4();};
$('rst4').onclick=reset4;

/* ================= Ngôn ngữ ================= */
function applyLang(){document.documentElement.lang=lang;document.title=I18N[lang].title.split(':')[0];
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=T(el.dataset.i18nHtml));
  $('langBtn').textContent=lang==='vi'?'EN':'VI';
  Object.keys(PRED).forEach(renderPred);
  fillSelect($('surf2'),SURF,S2.si);fillSelect($('road3'),ROADS,S3.ri);
  speedSeg('spd2',S2,[.25,.5,1]);speedSeg('spd3',S3,[.5,1,2]);speedSeg('spd4',S4,[.25,.5,1]);
  upd1();upd2();upd3();upd4();renderTrials();}
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi';applyLang();};

/* ================= Vòng lặp ================= */
reset2();reset3();reset4();applyLang();renderTrials();setTab(1);
let last=performance.now(),acc=0;
function loop(now){const dt=Math.min((now-last)/1000,.1);last=now;
  try{
    if(tab===1){t1Frame(dt);renderT1();}
    else{const S=[0,0,S2,S3,S4][tab],st=[0,0,step2,step3,step4][tab];
      if(S.running){acc+=dt*S.speed;let n=0;while(acc>=DT&&n<3000){st(DT);acc-=DT;n++;}}else acc=0;
      [0,0,renderT2,renderT3,renderT4][tab]();}
  }catch(err){console.error(err);}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
