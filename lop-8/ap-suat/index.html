 A_exp_cup:`Không khí gồm vô số phân tử chuyển động hỗn loạn, va vào mọi bề mặt (thành cốc, tờ giấy) và gây ra áp suất khí quyển khoảng 101 kPa, ép vuông góc với bề mặt theo mọi phương. Cột nước cao 10 cm trong cốc chỉ gây áp suất d·h = 10 000 N/m³ × 0,1 m = 1 000 Pa, nhỏ hơn khoảng 100 lần. Áp suất khí quyển ép tờ giấy từ dưới lên lớn hơn áp suất của cột nước nên tờ giấy không rơi; nước ở chỗ cao nhất trong cốc có áp suất p₀ − d·h, nhỏ hơn p₀ một chút. Hút bớt không khí thì phân tử thưa dần, va chạm ít đi, áp suất giảm; khi p₀ nhỏ hơn d·h thì tờ giấy rơi.`,
 A_q_box:`Hút bớt không khí trong hộp sữa kín. Hộp sẽ thế nào và vì sao?`,
 A_o_box:[`Phồng lên vì còn ít khí`,`Bị ép bẹp vì khí bên ngoài ép mạnh hơn khí bên trong`,`Không đổi vì khí quyển ép đều hai phía`],
 A_exp_box:`Hút khí ra thì số phân tử trong hộp giảm, mật độ giảm, chúng va vào thành hộp ít hơn nên áp suất trong hộp nhỏ. Bên ngoài vẫn là khoảng 101 kPa từ mọi phía. Chênh lệch áp suất hai phía tạo ra lực ép hộp bẹp lại: lực = chênh lệch áp suất × diện tích mặt hộp.`,
 A_q_alt:`Lên cao hơn thì áp suất khí quyển thay đổi thế nào?`,
 A_o_alt:[`Tăng vì gần Mặt Trời hơn`,`Giảm vì không khí phía trên mỏng hơn, phân tử thưa hơn`,`Không đổi`],
 A_exp_alt:`Càng lên cao, lớp không khí phía trên càng ít và các phân tử càng thưa, nên mỗi giây có ít phân tử va vào cùng một diện tích hơn: áp suất giảm. Cột thuỷ ngân trong ống Torricelli cũng thấp xuống (từ 760 mmHg ở mực nước biển).`,
 A_pw:`Áp suất của cột nước d·h`, A_ptop:`Áp suất của nước ở chỗ cao nhất trong cốc`, A_dens:`Mật độ phân tử so với mực nước biển`,
 c_hud:`So sánh áp suất`, c_hud_air:`Không khí p₀`, c_hud_col:`Cột nước d·h`, c_hud_top:`Nước ở đỉnh cốc`,
 c_card_hold:`p₀ lớn hơn d·h rất nhiều nên tờ giấy không rơi`, c_card_edge:`p₀ chỉ lớn hơn d·h một chút, tờ giấy sắp rơi`, c_card_fall:`p₀ nhỏ hơn d·h nên tờ giấy rơi`, c_inframe:`phân tử trong khung`,
 c_bell:`chuông thuỷ tinh (hút khí qua van ở đế)`,
 A_assume:`Cốc đầy nước 250 g, miệng cốc đường kính 7 cm, cao 10 cm; tờ giấy nhẹ (khoảng 30 Pa). Hình 3D vẽ rất ít phân tử (thực tế khoảng 10²⁵ phân tử trong mỗi m³) và cho chuyển động chậm để dễ quan sát. Áp suất theo độ cao tính gần đúng p = p₀·e^(−h/8000 m); thực tế còn phụ thuộc nhiệt độ, thời tiết.`,
 /* ---- Tab 4: áp kế ---- */
 G_yccd:`Liệt kê được một số đơn vị đo áp suất thông dụng (Pa, kPa, atm, bar, mmHg). Mở rộng: ý nghĩa của mmHg và nguyên lí hoạt động của một số áp kế.`,
 G_mode:`Thí nghiệm`, G_m_mmhg:`mmHg là gì?`, G_m_baro:`Ống Torricelli`, G_m_utube:`Áp kế chữ U`, G_m_bourdon:`Áp kế kim loại`,
 G_hint_mmhg:`Kéo thanh trượt để đổi chiều cao cột thuỷ ngân. Huyết áp thường ghi "120/80 mmHg": số lớn là huyết áp tâm thu, số nhỏ là tâm trương.`,
 G_hint_baro:`Đổi áp suất khí quyển (hoặc chọn nơi: Đà Lạt, Fansipan, Everest). Phân tử không khí ép lên mặt thuỷ ngân trong chậu và đẩy cột thuỷ ngân lên trong ống.`,
 G_hint_utube:`Đổi áp suất khí trong bình. Khí ép mạnh hơn khí quyển thì mực chất lỏng ở nhánh nối bình bị đẩy xuống; ép yếu hơn thì mực ở nhánh đó dâng lên.`,
 G_hint_bourdon:`Tăng áp suất khí nén. Ống dẹt, cong bị căng phồng rồi duỗi thẳng ra, kéo kim quay. Quan sát cả tiết diện ống ở góc trên bên phải.`,
 G_h:`Chiều cao cột thuỷ ngân h`, G_pre80:`Tâm trương 80`, G_pre120:`Tâm thu 120`, G_pre760:`Khí quyển 760`,
 G_patm:`Áp suất khí quyển p₀`, G_preSea:`Mực nước biển`, G_preDL:`Đà Lạt`, G_preFan:`Fansipan`, G_preEv:`Everest`,
 G_pg:`Áp suất khí trong bình hơn khí quyển (p − p₀)`, G_pb:`Áp suất khí nén (so với khí quyển)`,
 G_p:`Áp suất p = d·h`, G_hw:`Cột nước cho cùng áp suất`, G_units:`Đổi đơn vị`, G_h2:`Cột thuỷ ngân`, G_atmx:`Tính theo atm`,
 G_pgas:`Áp suất khí trong bình p`, G_dp:`Chênh lệch p − p₀`, G_dh:`Độ chênh mực chất lỏng Δh`, G_dmm:`Chênh lệch tính theo mmHg`, G_cmp:`So với khí quyển`,
 G_higher:`Lớn hơn p₀`, G_lower:`Nhỏ hơn p₀`, G_equal:`Bằng p₀`,
 G_pb2:`Áp suất khí nén`, G_bar:`Tính theo bar`, G_atm2:`Tính theo atm`, G_mm:`Tính theo mmHg`, G_str:`Ống đã duỗi (so với tối đa)`,
 G_sensor:`cảm biến áp suất ở đáy cột`,
 G_def:`mmHg (milimét thuỷ ngân) là đơn vị đo áp suất: 1 mmHg là áp suất do cột thuỷ ngân cao 1 mm gây ra ở đáy cột.`,
 G_def2:`d = 133 322 N/m³ ⇒ p = d·h = 133 322 × 0,001 = 133,3 Pa`,
 G_baro_txt:`Chất lỏng đứng yên, các điểm cùng độ cao có cùng áp suất. Mặt thuỷ ngân trong chậu chịu áp suất khí quyển p₀, nên ở cùng mức đó trong ống áp suất cũng bằng p₀.`,
 G_baro_txt2:`Phía trên cột thuỷ ngân là chân không (không có phân tử khí), nên p₀ chỉ cân bằng với áp suất cột thuỷ ngân: p₀ = d·h.`,
 G_u_txt:`Hai điểm cùng độ cao trong chất lỏng đứng yên có áp suất bằng nhau, nên áp suất khí trong bình lớn hơn khí quyển một lượng bằng áp suất của cột chất lỏng cao Δh:`,
 G_b_txt:`Áp suất trong ống tăng thì ống dẹt phồng gần tròn. Thành ngoài của ống cong dài hơn thành trong nên chịu lực lớn hơn, ống duỗi thẳng ra, đầu tự do kéo kim quay. Áp suất giảm thì ống đàn hồi cong lại.`,
 G_gasin:`khí nén đi vào`, G_sect:`tiết diện ống`, G_inner:`thành trong (ngắn)`, G_outer:`thành ngoài (dài)`,
 c_dish:`chậu thuỷ ngân`, c_flask:`bình khí`, c_open:`nhánh hở thông với khí quyển`,
 G_q_mmhg:`"1 mmHg" là gì?`,
 G_o_mmhg:[`Đơn vị chiều dài, bằng 1 mm`,`Đơn vị áp suất, bằng áp suất của cột thuỷ ngân cao 1 mm (khoảng 133 Pa)`,`Đơn vị khối lượng của thuỷ ngân`],
 G_exp_mmhg:`mmHg là đơn vị áp suất: 1 mmHg là áp suất do cột thuỷ ngân cao 1 mm gây ra ở đáy cột. Vì p = d·h, với d của thuỷ ngân là 133 322 N/m³ và h = 0,001 m nên 1 mmHg ≈ 133,3 Pa. Áp suất khí quyển chuẩn 101 325 Pa ứng với cột thuỷ ngân cao 760 mm nên 1 atm = 760 mmHg. Huyết áp 120 mmHg khoảng 16 kPa, bằng áp suất của cột nước cao khoảng 1,6 m (vì thuỷ ngân nặng gấp 13,6 lần nước).`,
 G_q_baro:`Phía trên cột thuỷ ngân trong ống Torricelli là chân không. Vậy cái gì giữ cột thuỷ ngân cao 760 mm không tụt xuống?`,
 G_o_baro:[`Chân không "hút" cột thuỷ ngân lên`,`Áp suất khí quyển ép lên mặt thuỷ ngân trong chậu`,`Lực dính giữa thuỷ ngân và thuỷ tinh`],
 G_exp_baro:`Chất lỏng đứng yên thì các điểm cùng độ cao có áp suất bằng nhau. Ngoài ống, mặt thuỷ ngân trong chậu chịu áp suất khí quyển p₀; ở cùng mức đó trong ống, áp suất là áp suất của cột thuỷ ngân d·h (phía trên là chân không). Cân bằng nên p₀ = d·h, tức h = p₀/d ≈ 760 mm. Khí quyển giảm thì cột thuỷ ngân thấp xuống, vì vậy ống Torricelli là một áp kế đo áp suất khí quyển (khí áp kế).`,
 G_q_utube:`Áp kế chữ U có một nhánh nối với bình khí, nhánh kia hở. Mực chất lỏng ở nhánh nối với bình thấp hơn nhánh hở. Khí trong bình có áp suất thế nào so với khí quyển?`,
 G_o_utube:[`Nhỏ hơn`,`Bằng nhau`,`Lớn hơn`],
 G_exp_utube:`Chất lỏng ở nhánh hở chịu áp suất khí quyển p₀, nhánh còn lại chịu áp suất khí p. Khi p > p₀ chất lỏng bị đẩy xuống ở nhánh nối bình và dâng lên ở nhánh hở. Hai điểm cùng độ cao trong chất lỏng đứng yên có áp suất bằng nhau nên p = p₀ + d·Δh, trong đó Δh là độ chênh mực chất lỏng. Dùng chất lỏng nhẹ (nước, dầu) để đo chênh lệch áp suất nhỏ, dùng thuỷ ngân để đo chênh lệch lớn.`,
 G_q_bourdon:`Áp kế kim loại (áp kế Bourdon) hoạt động nhờ điều gì?`,
 G_o_bourdon:[`Cột chất lỏng dâng lên`,`Ống kim loại dẹt, cong bị duỗi ra khi áp suất tăng và kéo kim quay`,`Dòng điện chạy qua dây dẫn`],
 G_exp_bourdon:`Ống Bourdon là ống kim loại dẹt, uốn cong, một đầu nối với nguồn khí, đầu kia bịt kín và nối với kim qua bộ đòn bẩy. Khi áp suất trong ống tăng, thành ngoài (dài hơn, diện tích lớn hơn) chịu lực lớn hơn thành trong, ống phồng gần tròn và duỗi thẳng ra; đầu tự do dịch chuyển kéo kim quay. Áp suất giảm thì ống đàn hồi cong lại. Loại áp kế này đo được áp suất lớn (đến hàng trăm bar), gọn, dùng cho bình gas, nồi hơi, bơm lốp xe.`,
 G_assume_mmhg:`Tab này dùng g = 9,80665 N/kg (giá trị chuẩn) để 1 mmHg đúng bằng 133,322 Pa; nếu dùng g = 10 N/kg cho tròn số thì 1 mmHg ≈ 136 Pa, lệch khoảng 2%. Áp suất tính theo p = d·h (d là trọng lượng riêng), bỏ qua áp suất hơi thuỷ ngân.`,
 G_assume_baro:`Dùng g = 9,80665 N/kg; áp suất khí quyển theo nơi tính gần đúng p = p₀·e^(−h/8000 m). Số phân tử vẽ rất ít so với thực tế và chuyển động chậm để dễ quan sát.`,
 G_assume_utube:`Dùng g = 9,80665 N/kg; coi nhiệt độ không đổi và bỏ qua thể tích khí trong ống so với bình. Độ chênh mực tối đa 0,6 m. Số phân tử vẽ chỉ để minh hoạ mật độ tăng giảm theo áp suất.`,
 G_assume_bourdon:`Mô phỏng định tính: ống duỗi theo tỉ lệ thuận với áp suất (ống thật đàn hồi gần như tuyến tính trong giới hạn đo). Kim chỉ áp suất dư, tức hơn áp suất khí quyển. Số phân tử vẽ chỉ để minh hoạ.`
},
en:{
 sub:`Science 8 · Density and pressure · g = 10 N/kg`,
 tab_gauge:`Gauges`,
 L_yccd:`Content "Pressure in liquids": a liquid exerts pressure on the bottom and walls of its container and on objects inside it, in all directions; pressure increases with depth. Also: list common units of pressure.`,
 L_hint:`Drag the probe (round dot) up and down in the tank. The arrows show the liquid pressure on the walls and the bottom: deeper means a longer arrow, and the same depth means the same length.`,
 L_walls:`Show pressure on walls and bottom`, L_lid:`Tank lid`, lid_open:`Open`, lid_closed:`Sealed, pump in gas`,
 L_dp:`Extra gas pressure above the surface Δp`,
 L_rho:`Density ρ`, L_d:`Weight density γ = ρ·g`, L_depth:`Probe depth h`,
 L_pl:`Liquid pressure p = ρ·g·h`, L_ptot:`Gauge reading`, L_pbot:`Pressure on the bottom`, L_units:`Unit conversion`, L_jetLbl:`Why does the jet behave like this?`,
 L_jet_o0:`Open tank: at a hole only the pressure ρ·g·h pushes the water out.`,
 L_jet_o1:`Open tank: inside the hole there is p₀ + ρ·g·h, outside the hole there is also p₀. Only ρ·g·h is left, so the jet does not change.`,
 L_jet_c0:`Sealed tank: inside the hole there is Δp + ρ·g·h, outside is the atmosphere. The compressed gas makes the jet stronger.`,
 L_jet_c1:`Sealed tank: inside the hole there is p₀ + Δp + ρ·g·h, outside there is p₀. The net is Δp + ρ·g·h, so compressed gas strengthens the jet while p₀ cancels out.`,
 L_leg_atm:`p₀ (atmosphere)`, L_leg_dp:`Δp (compressed gas)`, L_leg_dh:`ρ·g·h (liquid)`, L_formula:`p = ρ · g · h`,
 c_gaspa:`compressed gas p₀ + Δp`, c_gasdp:`compressed gas Δp`,
 L_assume:`The liquid is at rest; g = 10 N/kg. The level stays constant while jets flow (assume it is topped up). The formula p = ρ·g·h is an extension; the 2018 curriculum only requires a qualitative understanding. In an open tank the atmosphere pushes both inside the hole (transmitted through the liquid) and outside the hole, so the jet does not change when p₀ is switched on or off; only a sealed tank with extra compressed gas gives a stronger jet.`,
 L_q:`Keep the probe at the same depth and turn its membrane in different directions. What happens to the gauge reading?`,
 P_W:`Car weight W = m·g (g = 10 N/kg)`, P_scale:`All force vectors use one scale`, P_ratioNote:`F₂ is # times F₁`,
 P_hint_press:`Increase F₁ or change areas S₁, S₂ to lift the car. The three gauges always show the same value. All force vectors use the same scale, so F₂ is longer than F₁ by exactly S₂/S₁.`,
 A_hint_cup:`Drag on the picture to rotate the 3D view; turn the glass with the slider. The dots are air molecules moving randomly; red flashes mark where they hit the glass. Pump air out of the bell jar to see the molecules thin out.`,
 A_hint_box:`Suck air out of the carton: the molecules inside thin out and hit the walls less often, so the pressure inside drops and the outside air crushes the carton.`,
 A_hint_alt:`Drag the altitude: air molecules move randomly but crowd near the ground. The red frame counts the molecules at the chosen height: higher means sparser and lower pressure.`,
 A_q_cup:`A full glass of water is covered with a card and turned upside down, then turned in many directions. What happens to the card?`,
 A_o_cup:[`Falls when fully upside down`,`Falls when sideways`,`Stays in every direction`],
 A_exp_cup:`Air is made of countless molecules moving randomly. They hit every surface (glass, card) and produce atmospheric pressure of about 101 kPa, pushing perpendicular to the surface in all directions. The 10 cm column of water in the glass produces only ρ·g·h = 10 000 N/m³ × 0.1 m = 1 000 Pa, about 100 times smaller. The air pushes the card upward harder than the water column pushes down, so the card stays; the water at the highest point of the glass has pressure p₀ − ρ·g·h, a little less than p₀. Pumping air out makes the molecules sparser, so there are fewer collisions and the pressure falls; when p₀ drops below ρ·g·h the card falls.`,
 A_q_box:`Air is sucked out of a sealed milk carton. What happens to the carton, and why?`,
 A_o_box:[`It swells because less gas is left`,`It is crushed because outside air pushes harder than inside air`,`Nothing, since the atmosphere pushes equally on both sides`],
 A_exp_box:`Removing air lowers the number of molecules inside, so they hit the walls less often and the inside pressure is low. Outside it is still about 101 kPa from every side. The pressure difference crushes the carton: force = pressure difference × area of the face.`,
 A_q_alt:`How does atmospheric pressure change as you go higher?`,
 A_o_alt:[`Increases, we are closer to the Sun`,`Decreases, the air above is thinner and the molecules are sparser`,`Does not change`],
 A_exp_alt:`The higher you go, the less air is above and the sparser the molecules, so fewer molecules hit the same area each second: the pressure drops. The mercury column in a Torricelli tube also gets shorter (from 760 mmHg at sea level).`,
 A_pw:`Pressure of the water column ρ·g·h`, A_ptop:`Water pressure at the highest point in the glass`, A_dens:`Molecule density relative to sea level`,
 c_hud:`Pressure comparison`, c_hud_air:`Air p₀`, c_hud_col:`Water column ρ·g·h`, c_hud_top:`Water at top of glass`,
 c_card_hold:`p₀ is far larger than ρ·g·h, so the card stays`, c_card_edge:`p₀ is only slightly larger than ρ·g·h, the card is about to fall`, c_card_fall:`p₀ is smaller than ρ·g·h, so the card falls`, c_inframe:`molecules in frame`,
 c_bell:`glass bell jar (air pumped out through the valve in the base)`,
 A_assume:`Glass full of 250 g of water, mouth 7 cm across, 10 cm tall; light card (about 30 Pa). The 3D view draws very few molecules (in reality about 10²⁵ per m³) and moves them slowly so they can be seen. Pressure with altitude uses p = p₀·e^(−h / 8000 m); in reality it also depends on temperature and weather.`,
 G_yccd:`List common units of pressure (Pa, kPa, atm, bar, mmHg). Extension: what mmHg means and how some pressure gauges work.`,
 G_mode:`Experiment`, G_m_mmhg:`What is mmHg?`, G_m_baro:`Torricelli tube`, G_m_utube:`U-tube gauge`, G_m_bourdon:`Metal gauge`,
 G_hint_mmhg:`Drag the slider to change the mercury column height. Blood pressure is written like "120/80 mmHg": the larger number is systolic, the smaller is diastolic.`,
 G_hint_baro:`Change the atmospheric pressure (or pick a place: Da Lat, Fansipan, Everest). Air molecules push on the mercury in the dish and push the mercury column up the tube.`,
 G_hint_utube:`Change the gas pressure in the flask. Gas pushing harder than the atmosphere pushes the liquid down in the flask arm; pushing less makes it rise.`,
 G_hint_bourdon:`Raise the compressed gas pressure. The flat curved tube swells and straightens, pulling the pointer round. Also watch the tube cross-section at the top right.`,
 G_h:`Mercury column height h`, G_pre80:`Diastolic 80`, G_pre120:`Systolic 120`, G_pre760:`Atmosphere 760`,
 G_patm:`Atmospheric pressure p₀`, G_preSea:`Sea level`, G_preDL:`Da Lat`, G_preFan:`Fansipan`, G_preEv:`Everest`,
 G_pg:`Flask pressure above atmosphere (p − p₀)`, G_pb:`Compressed gas pressure (above atmosphere)`,
 G_p:`Pressure p = d·h`, G_hw:`Water column for the same pressure`, G_units:`Unit conversion`, G_h2:`Mercury column`, G_atmx:`In atm`,
 G_pgas:`Gas pressure in the flask p`, G_dp:`Difference p − p₀`, G_dh:`Liquid level difference Δh`, G_dmm:`Difference in mmHg`, G_cmp:`Compared with atmosphere`,
 G_higher:`Greater than p₀`, G_lower:`Less than p₀`, G_equal:`Equal to p₀`,
 G_pb2:`Compressed gas pressure`, G_bar:`In bar`, G_atm2:`In atm`, G_mm:`In mmHg`, G_str:`Tube straightened (of maximum)`,
 G_sensor:`pressure sensor at the bottom of the column`,
 G_def:`mmHg (millimetre of mercury) is a unit of pressure: 1 mmHg is the pressure produced at the bottom of a mercury column 1 mm tall.`,
 G_def2:`γ = 133 322 N/m³ ⇒ p = γ·h = 133 322 × 0.001 = 133.3 Pa`,
 G_baro_txt:`In a liquid at rest, points at the same height have the same pressure. The mercury in the dish feels the atmospheric pressure p₀, so at the same level inside the tube the pressure is also p₀.`,
 G_baro_txt2:`Above the mercury column is a vacuum (no gas molecules), so p₀ is balanced only by the pressure of the mercury column: p₀ = γ·h.`,
 G_u_txt:`Two points at the same height in a liquid at rest have equal pressure, so the gas pressure exceeds the atmosphere by the pressure of a liquid column of height Δh:`,
 G_b_txt:`When the pressure in the tube rises, the flat tube swells toward a round shape. The outer wall of the curve is longer than the inner wall, so it feels a larger force and the tube straightens, pulling the pointer round. When pressure falls the elastic tube curls back.`,
 G_gasin:`compressed gas enters`, G_sect:`tube cross-section`, G_inner:`inner wall (short)`, G_outer:`outer wall (long)`,
 c_dish:`mercury dish`, c_flask:`gas flask`, c_open:`open arm, connected to the atmosphere`,
 G_q_mmhg:`What is "1 mmHg"?`,
 G_o_mmhg:[`A unit of length, equal to 1 mm`,`A unit of pressure, equal to the pressure of a 1 mm mercury column (about 133 Pa)`,`A unit of mass of mercury`],
 G_exp_mmhg:`mmHg is a unit of pressure: 1 mmHg is the pressure produced at the bottom of a mercury column 1 mm tall. Since p = γ·h, with γ of mercury 133 322 N/m³ and h = 0.001 m, 1 mmHg ≈ 133.3 Pa. Standard atmospheric pressure of 101 325 Pa supports a 760 mm mercury column, so 1 atm = 760 mmHg. A blood pressure of 120 mmHg is about 16 kPa, the pressure of a water column about 1.6 m tall (mercury is 13.6 times denser than water).`,
 G_q_baro:`Above the mercury in a Torricelli tube is a vacuum. So what keeps the 760 mm column from falling?`,
 G_o_baro:[`The vacuum "sucks" the mercury up`,`Atmospheric pressure pushing on the mercury in the dish`,`Adhesion between mercury and glass`],
 G_exp_baro:`In a liquid at rest, points at the same height have equal pressure. Outside the tube, the mercury surface in the dish feels atmospheric pressure p₀; at the same level inside the tube the pressure is that of the mercury column γ·h (a vacuum above). In balance p₀ = γ·h, so h = p₀/γ ≈ 760 mm. When the atmosphere weakens the column falls, which is why a Torricelli tube is a barometer.`,
 G_q_utube:`A U-tube gauge has one arm joined to a gas flask and the other open. The liquid in the flask arm is lower than in the open arm. How does the gas pressure compare with the atmosphere?`,
 G_o_utube:[`Smaller`,`Equal`,`Greater`],
 G_exp_utube:`The liquid in the open arm feels atmospheric pressure p₀, the other arm feels the gas pressure p. When p > p₀ the liquid is pushed down in the flask arm and rises in the open arm. Two points at the same height in a liquid at rest have equal pressure, so p = p₀ + γ·Δh, where Δh is the level difference. Light liquids (water, oil) measure small pressure differences; mercury measures large ones.`,
 G_q_bourdon:`How does a metal (Bourdon) pressure gauge work?`,
 G_o_bourdon:[`A liquid column rises`,`A flat curved metal tube straightens as pressure rises and pulls the pointer`,`An electric current flows through a wire`],
 G_exp_bourdon:`A Bourdon tube is a flat, curved metal tube, joined to the gas supply at one end, sealed at the other end and linked to the pointer by levers. When the pressure inside rises, the outer wall (longer, larger area) feels a larger force than the inner wall, the tube swells toward a round shape and straightens; the free end moves and turns the pointer. When pressure falls the elastic tube curls back. This gauge measures high pressures (hundreds of bar), is compact and is used on gas cylinders, boilers and tyre pumps.`,
 U_q_spray:`The can still has plenty of compressed gas. Why does the liquid squirt out when the valve is pressed?`,
 U_o_spray:[`The liquid evaporates and shoots out`,`Crowded gas molecules hit the liquid surface harder than the atmosphere does, pushing liquid up the tube`,`The outside air sucks the liquid out`],

function font(sz, w=600){ sz=sz*clamp(0.55/view.s,1,1.45); return `${w} ${sz}px "Be Vietnam Pro", system-ui, sans-serif`; }
function label(c, str, x, y, {size=18, color=C.ink, align='center', base='middle', w=600, bg=null}={}){
  c.font=font(size,w); c.textAlign=align; c.textBaseline=base;
  if(bg){ const m=c.measureText(str).width; const bx = align==='center'?x-m/2:align==='right'?x-m:x; c.fillStyle=bg; c.globalAlpha=.85; c.fillRect(bx-5,y-size*.7,m+10,size*1.4); c.globalAlpha=1; }
  c.fillStyle=color; c.fillText(str,x,y);
}
function arrow(c, x1,y1,x2,y2, color, w=4){
  const a=Math.atan2(y2-y1,x2-x1), L=Math.hypot(x2-x1,y2-y1); if(L<2) return;
  const h=Math.min(14, L*.5)+w;
  c.strokeStyle=color; c.fillStyle=color; c.lineWidth=w; c.lineCap='round';
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2-Math.cos(a)*h*.6, y2-Math.sin(a)*h*.6); c.stroke();
  c.beginPath(); c.moveTo(x2,y2); c.lineTo(x2-h*Math.cos(a-.42), y2-h*Math.sin(a-.42)); c.lineTo(x2-h*Math.cos(a+.42), y2-h*Math.sin(a+.42)); c.closePath(); c.fill();
}
function rrect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function niceMax(v){ if(v<=0) return 1; const e=Math.pow(10,Math.floor(Math.log10(v))); const m=v/e; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*e; }
function dial(c, x, y, r, val, max, unitDiv, unitTxt, title){
  c.fillStyle=C.panel; c.strokeStyle=C.ink; c.lineWidth=3; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); c.stroke();
  const a0=Math.PI*0.75, a1=Math.PI*2.25;
  c.lineWidth=2; c.strokeStyle=C.muted;
  for(let i=0;i<=10;i++){ const a=a0+(a1-a0)*i/10, r1=r*(i%5===0?.72:.82); c.beginPath(); c.moveTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1); c.lineTo(x+Math.cos(a)*r*.92,y+Math.sin(a)*r*.92); c.stroke(); }
  if(r>40){ for(let i=0;i<=2;i++){ const a=a0+(a1-a0)*i/2; label(c, fmt(max*i/2/unitDiv, 1), x+Math.cos(a)*r*.55, y+Math.sin(a)*r*.55, {size:13, color:C.muted}); } }
  const f=clamp(val/max,0,1.02), a=a0+(a1-a0)*f;
  c.strokeStyle=C.force; c.lineWidth=4; c.beginPath(); c.moveTo(x,y); c.lineTo(x+Math.cos(a)*r*.82,y+Math.sin(a)*r*.82); c.stroke();
  c.fillStyle=C.ink; c.beginPath(); c.arc(x,y,5,0,Math.PI*2); c.fill();
  if(title) label(c, title, x, y-r-14, {size:17});

}

const MMHG = 133.322;                    // Pa, 1 mmHg theo định nghĩa chuẩn
/* vectơ vẽ đúng độ dài: mũi tên nhỏ dần theo độ dài, không phình ra */
function vec(c,x1,y1,x2,y2,color,w=4){
  const L=Math.hypot(x2-x1,y2-y1); if(L<0.5) return;
  const a=Math.atan2(y2-y1,x2-x1), h=Math.min(12+w, L*0.45+2);
  c.strokeStyle=color; c.fillStyle=color; c.lineWidth=w; c.lineCap='butt';
  if(L>h*0.7){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2-Math.cos(a)*h*0.7, y2-Math.sin(a)*h*0.7); c.stroke(); }
  c.beginPath(); c.moveTo(x2,y2); c.lineTo(x2-h*Math.cos(a-.4), y2-h*Math.sin(a-.4)); c.lineTo(x2-h*Math.cos(a+.4), y2-h*Math.sin(a+.4)); c.closePath(); c.fill();
}
/* mũi tên gồm hai phần: phần đầu (gần đuôi) tô col1, phần còn lại tô col2 */
function stackArrow(c,x1,y1,x2,y2,f,col1,col2,w=4){
  const mx=x1+(x2-x1)*f, my=y1+(y2-y1)*f;
  if(f>0.001){ c.strokeStyle=col1; c.lineWidth=w; c.lineCap='butt'; c.beginPath(); c.moveTo(x1,y1); c.lineTo(mx,my); c.stroke(); }
  vec(c,mx,my,x2,y2,col2,w);
}
/* đoạn văn tự xuống dòng trong canvas */
function para(c,str,x,y,maxW,lh,o={}){
  c.font=font(o.size||17,o.w||500); c.textAlign='left'; c.textBaseline='alphabetic'; c.fillStyle=o.color||C.ink;
  const words=str.split(' '); let line='', yy=y;
  for(const w of words){ const test=line?line+' '+w:w; if(c.measureText(test).width>maxW && line){ c.fillText(line,x,yy); line=w; yy+=lh; } else line=test; }
  c.fillText(line,x,yy); return yy+lh;
}

/* ====================== PHÂN TỬ KHÍ 2D ====================== */
/* Mỗi phân tử chuyển động thẳng đều, nảy đàn hồi vào thành bình và các vùng cấm (holes). Số phân tử tỉ lệ với áp suất. */
class Gas2D{
  constructor(seed){ this.a=[]; this.r=rng(seed); }
  put(reg){ const hs=reg.holes||[];
    for(let k=0;k<40;k++){ const x=reg.x0+this.r()*(reg.x1-reg.x0), y=reg.y0+this.r()*(reg.y1-reg.y0);
      if(hs.some(h=>x>h.x0&&x<h.x1&&y>h.y0&&y<h.y1)) continue;
      if(reg.ell && ((x-reg.ell.cx)/reg.ell.rx)**2+((y-reg.ell.cy)/reg.ell.ry)**2>0.97) continue;
      const th=this.r()*6.2832, sp=(reg.v||80)*(0.55+0.9*this.r()); this.a.push({x,y,vx:Math.cos(th)*sp,vy:Math.sin(th)*sp}); return; } }
  step(dt,n,reg){
    n=Math.max(0,Math.round(n));
    for(let q=0;q<4 && this.a.length<n;q++) this.put(reg);
    for(let q=0;q<4 && this.a.length>n;q++) this.a.pop();
    const hs=reg.holes||[];
    for(const m of this.a){
      if(reg.g) m.vy+=reg.g*dt;
      const ovx=m.vx, ovy=m.vy;
      m.x+=m.vx*dt; m.y+=m.vy*dt;
      if(m.x<reg.x0){ m.x=2*reg.x0-m.x; m.vx=Math.abs(m.vx); } else if(m.x>reg.x1){ m.x=2*reg.x1-m.x; m.vx=-Math.abs(m.vx); }
      if(m.y<reg.y0){ m.y=2*reg.y0-m.y; m.vy=Math.abs(m.vy); } else if(m.y>reg.y1){ m.y=2*reg.y1-m.y; m.vy=-Math.abs(m.vy); }
      m.x=clamp(m.x,reg.x0,reg.x1); m.y=clamp(m.y,reg.y0,reg.y1);
      for(const h of hs){ if(m.x>h.x0&&m.x<h.x1&&m.y>h.y0&&m.y<h.y1){
        const dl=m.x-h.x0, dr=h.x1-m.x, du=m.y-h.y0, dd=h.y1-m.y, mn=Math.min(dl,dr,du,dd);
        if(mn===dl){ m.x=h.x0; m.vx=-Math.abs(m.vx)+2*Math.min(0,h.vx||0); } else if(mn===dr){ m.x=h.x1; m.vx=Math.abs(m.vx)+2*Math.max(0,h.vx||0); }
        if(h.vx){ const sp=Math.hypot(m.vx,m.vy), v0=reg.v||80; if(sp>2*v0){ m.vx*=1.2*v0/sp; m.vy*=1.2*v0/sp; } }
        else if(mn===du){ m.y=h.y0; m.vy=-Math.abs(m.vy); } else { m.y=h.y1; m.vy=Math.abs(m.vy); } } }
      if(reg.ell){ const e=reg.ell, ux=(m.x-e.cx)/e.rx, uy=(m.y-e.cy)/e.ry, q=ux*ux+uy*uy;
        if(q>1){ const sq=Math.sqrt(q); m.x=e.cx+ux/sq*e.rx*0.999; m.y=e.cy+uy/sq*e.ry*0.999;
          let nx=ux/e.rx, ny=uy/e.ry; const nl=Math.hypot(nx,ny); nx/=nl; ny/=nl; const vn=m.vx*nx+m.vy*ny; if(vn>0){ m.vx-=2*vn*nx; m.vy-=2*vn*ny; } } }
      if(reg.hit && (m.vx!==ovx || m.vy!==ovy)) reg.hit(m);
    }
  }
  draw(c,color,rad=3){ c.fillStyle=color; c.globalAlpha=.9; for(const m of this.a){ c.beginPath(); c.arc(m.x,m.y,rad,0,Math.PI*2); c.fill(); } c.globalAlpha=1; }
}

/* ====================== 3D NHẸ BẰNG CANVAS ====================== */
/* chiếu phối cảnh: quay quanh trục y (yaw) rồi quanh trục x (pitch); đơn vị thế giới là cm */
function P3(cam,x,y,z){
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw), cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const X=x*cy+z*sy, Z0=-x*sy+z*cy, Y=y*cp-Z0*sp, Z=y*sp+Z0*cp;
  const k=cam.f/(cam.dist-Z);
  return {x:cam.cx+X*k, y:cam.cy-Y*k, z:Z, k};
}
function polyPath(c,pts){ c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)); c.closePath(); }

const LIQ=[{k:'liq_water',rho:1000,col:'#3a86c8'},{k:'liq_sea',rho:1030,col:'#23899a'},{k:'liq_oil',rho:920,col:'#d9a520'},{k:'liq_alc',rho:790,col:'#86b9dc'},{k:'liq_hg',rho:13600,col:'#9aa5b1'}];

/* ---------- 1. Áp suất chất lỏng ---------- */
const liquid = {
  id:'liquid', X0:180, X1:500, TOP:50, BOT:450, PX:200, FLOOR:490,
  reset(){ this.s={liq:0, level:1.6, angle:270, walls:true, holes:false, atm:false, lid:'open', dp:20, px:340, py:330, t:0}; },
  hint(){ return t('L_hint'); },
  controls(){ const s=this.s; return [
    {type:'seg', id:'liq', k:'L_liq', opts:LIQ.map((l,i)=>[i,l.k])},
    {type:'slider', id:'level', k:'L_level', min:0.4, max:1.8, step:0.05, unit:' m', d:2},
    {type:'slider', id:'angle', k:'L_angle', min:0, max:360, step:5, unit:'°', d:0},
    {type:'toggle', id:'walls', k:'L_walls'},
    {type:'toggle', id:'holes', k:'L_holes'},
    {type:'toggle', id:'atm', k:'L_atm'},
    {type:'seg', id:'lid', k:'L_lid', opts:[['open','lid_open'],['closed','lid_closed']]},
    {type:'slider', id:'dp', k:'L_dp', min:0, max:60, step:1, unit:' kPa', d:0, show:()=>s.lid==='closed'},
    {type:'button', k:'reset', ghost:true, on:()=>{ this.reset(); buildControls(); }} ]; },
  surf(){ return this.BOT - this.s.level*this.PX; },
  depth(){ return Math.max(0, (this.s.py - this.surf())/this.PX); },
  D(){ return LIQ[this.s.liq].rho; },                    // khối lượng riêng D (kg/m³)
  dsp(){ return this.D()*G; },                            // trọng lượng riêng d = 10·D (N/m³)
  p0s(){ return this.s.lid==='closed' ? this.s.dp*1000 : 0; },   // áp suất khí nén thêm trên mặt thoáng
  pAt(h){ return this.p0s() + this.dsp()*h; },
  pl(){ return this.pAt(this.depth()); },
  jetV(dep){ return Math.sqrt(Math.max(0, 2*(this.p0s()/this.D() + G*dep))); },
  update(dt){ this.s.t += dt; },
  down(p){ return Math.hypot(p.x-this.s.px, p.y-this.s.py) < 42; },
  move(p){ this.s.px=clamp(p.x,this.X0+22,this.X1-22); this.s.py=clamp(p.y,this.TOP+20,this.BOT-18); },
  readouts(){ const s=this.s, d=this.depth(), pl=this.pl(), at=s.atm?P0:0, tot=pl+at;
    const rows=[ ['L_rho', fmt(this.D(),0)+' kg/m³'], ['L_d', fmt(this.dsp(),0)+' N/m³'], ['L_depth', fmtF(d,2)+' m'],
      ['L_pl', fmtP(pl)], ['L_ptot', fmtP(tot)], ['L_pbot', fmtP(this.pAt(s.level)+at)], ['L_units', unitLine(tot), 'wide'] ];
    if(s.holes) rows.push(['L_jetLbl', t(s.lid==='closed' ? (s.atm?'L_jet_c1':'L_jet_c0') : (s.atm?'L_jet_o1':'L_jet_o0')), 'wide']);
    return rows; },
  draw(c){
    const s=this.s, {X0,X1,TOP,BOT,PX,FLOOR}=this, L=LIQ[s.liq], sy=this.surf(), d=this.depth(), pl=this.pl();
    const closed=s.lid==='closed', at=s.atm?P0:0, base=at+this.p0s(), vi=lang==='vi';
    const pscale=Math.max(1, base + this.dsp()*1.8);            // một tỉ lệ cho mọi mũi tên áp suất
    const LEN=p=>clamp(72*p/pscale, 3, 96);
    // sàn, chân bàn
    c.strokeStyle=C.muted; c.lineWidth=3; c.beginPath(); c.moveTo(20,FLOOR); c.lineTo(790,FLOOR); c.stroke();
    c.fillStyle=C.line; c.fillRect(X0-10,BOT,X1-X0+20,8); c.fillRect(X0+10,BOT+8,10,FLOOR-BOT-8); c.fillRect(X1-20,BOT+8,10,FLOOR-BOT-8);
    // chất lỏng

      const pb=this.pAt(s.level)+at, Lb=LEN(pb), fb=base/pb;

/* ---------- 3. Áp suất khí quyển ---------- */
const JR=9.5, JH=24;                       // chuông thuỷ tinh: bán kính, chiều cao (cm)
const CUP={H:10, rm:3.5, rb:2.8};          // cốc: cao 10 cm, miệng r = 3,5 cm, đáy r = 2,8 cm
const DB=0.0007;                           // mật độ phân tử 2D ở chế độ hộp sữa
const atm = {
  id:'atm',
  reset(){
    this.s={mode:'cup', ang:180, pout:101.3, fallen:false, ft:0, pin:101.3, h:0, t:0, nwin:0, cam:{yaw:-0.62, pitch:0.32, dist:70, f:1020, cx:330, cy:268}};
    this.mol=[]; this.flash=[]; this.drops=[]; this.rr=rng(99);

    const gauss=()=>{ let u=0; for(let i=0;i<6;i++) u+=r(); return (u-3)*1.4142; };
    for(let i=0;i<300;i++){ const ya=-Hs*Math.log(1-r()*(1-Math.exp(-L/Hs))); A.push({x:190+r()*120, y:460-ya, vx:gauss()*sg, vy:gauss()*sg}); } },
  hint(){ return t({cup:'A_hint_cup', box:'A_hint_box', alt:'A_hint_alt'}[this.s.mode]); },
  controls(){ const s=this.s; return [
    {type:'seg', id:'mode', k:'A_mode', opts:[['cup','A_cup'],['box','A_box'],['alt','A_alt']]},
    {type:'slider', id:'ang', k:'A_angle', min:0, max:360, step:5, unit:'°', d:0, show:()=>s.mode==='cup'},
    {type:'slider', id:'pout', k:'A_pout', min:0, max:101.3, step:0.1, unit:' kPa', d:1, show:()=>s.mode==='cup'},
    {type:'slider', id:'pin', k:'A_pin', min:10, max:101.3, step:0.1, unit:' kPa', d:1, show:()=>s.mode==='box'},
    {type:'slider', id:'h', k:'A_h', min:0, max:8849, step:1, unit:' m', d:0, show:()=>s.mode==='alt'},
    {type:'button', k:'reset', ghost:true, on:()=>{ const m=s.mode, cam=s.cam; this.reset(); this.s.mode=m; this.s.cam=cam; buildControls(); }} ]; },
  palt(){ return P0*Math.exp(-this.s.h/8000); },
  down(){ return this.s.mode==='cup' ? 'orbit' : false; },
  orbit(dx,dy){ const cam=this.s.cam; cam.yaw+=dx*0.008; cam.pitch=clamp(cam.pitch+dy*0.008,-0.15,1.25); },
  /* ---- hình học cốc ---- */
  axes(){ const th=this.s.ang*Math.PI/180; return {eA:[Math.sin(th),-Math.cos(th),0], p1:[Math.cos(th),Math.sin(th),0], p2:[0,0,1]}; },
  solid(P,ax,m){                           // điểm P có nằm trong cốc (mở rộng thêm m) không? Trả về pháp tuyến đẩy ra và độ xuyên.
    const {H,rm,rb}=CUP, eA=ax.eA, o=[P[0]+eA[0]*H/2, P[1]+eA[1]*H/2, P[2]];
    const a=o[0]*eA[0]+o[1]*eA[1]+o[2]*eA[2];
    if(a<-m || a>H+m) return null;
    const rv=[o[0]-a*eA[0], o[1]-a*eA[1], o[2]-a*eA[2]], rho=Math.hypot(rv[0],rv[1],rv[2]);
    const r=rm+(rb-rm)*clamp(a,0,H)/H;
    if(rho>r+m) return null;
    const k=(rm-rb)/H, kk=Math.sqrt(1+k*k), dLat=(r+m-rho)/kk, dMouth=a+m, dBot=H+m-a;

  /* chiều cao lớn nhất của nước so với tâm miệng cốc, áp suất của nước ở chỗ cao nhất */
  geom(){ const s=this.s, {H,rm,rb}=CUP, eAy=-Math.cos(s.ang*Math.PI/180), sn=Math.sqrt(Math.max(0,1-eAy*eAy));
    const dh=Math.max(rm*sn, H*eAy+rb*sn)/100;                 // m

  stepMol(dt){
    const s=this.s, ax=this.axes(), n=Math.round(150*s.pout/101.3), M=this.mol, rr=this.rr;
    for(let q=0;q<3 && M.length<n;q++){
      for(let k=0;k<30;k++){ const an=rr()*6.283, rad=Math.sqrt(rr())*(JR-0.6), y=(rr()-.5)*(JH-1.2), P=[Math.cos(an)*rad,y,Math.sin(an)*rad];

    for(let it=0;it<sub;it++) for(const m of M){
      const P=m.p, V=m.v;
      P[0]+=V[0]*h; P[1]+=V[1]*h; P[2]+=V[2]*h;
      const rc=Math.hypot(P[0],P[2]);
      if(rc>lim){ const nx=-P[0]/rc, nz=-P[2]/rc, vn=V[0]*nx+V[2]*nz; if(vn<0){ V[0]-=2*vn*nx; V[2]-=2*vn*nz; } P[0]*=lim/rc; P[2]*=lim/rc; }
      if(P[1]>yl){ P[1]=yl; V[1]=-Math.abs(V[1]); } else if(P[1]<-yl){ P[1]=-yl; V[1]=Math.abs(V[1]); }
      const hit=this.solid(P,ax,0.4);
      if(hit){ const n3=hit.n; P[0]+=n3[0]*hit.pen; P[1]+=n3[1]*hit.pen; P[2]+=n3[2]*hit.pen;
        const vn=V[0]*n3[0]+V[1]*n3[1]+V[2]*n3[2];
        if(vn<0){ V[0]-=2*vn*n3[0]; V[1]-=2*vn*n3[1]; V[2]-=2*vn*n3[2];

    }
  },
  update(dt){ const s=this.s; s.t+=dt;
    if(s.mode==='cup'){
      const g=this.geom();
      if(!s.fallen && g.ptop<0){ s.fallen=true; s.ft=0; const ax=this.axes(), M0=[-ax.eA[0]*CUP.H/2,-ax.eA[1]*CUP.H/2,0];
        this.drops=[]; for(let i=0;i<22;i++){ const a=this.rr()*6.283, r=Math.sqrt(this.rr())*CUP.rm*0.9; this.drops.push({p:[M0[0]+r*Math.cos(a)*ax.p1[0], M0[1]+r*Math.cos(a)*ax.p1[1], M0[2]+r*Math.sin(a)], v:[(this.rr()-.5)*6, -this.rr()*20, (this.rr()-.5)*6]}); } }
      if(s.fallen){ s.ft+=dt; for(const d of this.drops){ d.v[1]-=981*dt; for(let k=0;k<3;k++) d.p[k]+=d.v[k]*dt; if(d.p[1]<-JH/2){ d.p[1]=-JH/2; d.v=[0,0,0]; } } }
      this.stepMol(dt);
      this.flash=this.flash.filter(f=>(f.t-=dt)>0);
    } else if(s.mode==='box'){
      const g=this.boxGeom();
      const out={x0:30,y0:20,x1:770,y1:480,v:85,holes:[{x0:g.x0-4,y0:g.y0-4,x1:g.x1+4,y1:g.y1+4}]};
      const inn={x0:g.x0+10+g.b*0.5, x1:g.x1-10-g.b*0.5, y0:g.y0+10+g.b*0.3, y1:g.y1-10-g.b*0.3, v:85};
      this.gBox.out.step(dt, (740*460-(g.w+8)*(g.h+8))*DB, out);
      this.gBox.inn.step(dt, (inn.x1-inn.x0)*(inn.y1-inn.y0)*DB*s.pin/101.3, inn);
    } else {
      this.gAlt.step(dt, 300, {x0:188,x1:312,y0:60,y1:460,g:75*75/361.6});
      const yw=460-s.h/8849*400; let n=0; for(const m of this.gAlt.a) if(m.y>yw-16&&m.y<yw+16) n++;

  readouts(){ const s=this.s;
    if(s.mode==='cup'){ const g=this.geom(), S=Math.PI*0.035*0.035;
      return [['A_Fair', fmt(s.pout*1000*S,1)+' N'], ['A_W', fmt(0.25*G,1)+' N'], ['A_pw', fmt(g.pcol,0)+' Pa'], ['A_ptop', fmtF(g.ptop/1000,2)+' kPa'], ['A_card', t(s.fallen?'A_fall':'A_stay'), s.fallen?'bad':'good']]; }

    const p=this.palt(); return [['A_p', fmtP(p)], ['A_dens', fmt(p/P0*100,0)+' %'], ['A_hg', fmt(p/MMHG,0)+' mmHg'], ['A_units', unitLine(p), 'wide']]; },
  draw(c){ ({cup:this.drawCup, box:this.drawBox, alt:this.drawAlt})[this.s.mode].call(this,c); },
  /* ---- cốc nước úp ngược trong chuông: 3D ---- */
  drawCup(c){
    const s=this.s, cam=s.cam, ax=this.axes(), {H,rm,rb}=CUP, eA=ax.eA, p1=ax.p1;
    const pr=P=>P3(cam,P[0],P[1],P[2]), items=[], NS=28, wf=s.fallen?clamp(1-s.ft*1.6,0,1):1, g=this.geom();

    // chuông thuỷ tinh: mâm đế, hai vành và các đường đứng
    const basePts=[]; for(let i=0;i<40;i++){ const a=i/40*6.2832; basePts.push(pr([Math.cos(a)*(JR+1.2),-JH/2,Math.sin(a)*(JR+1.2)])); }
    c.fillStyle=C.line; c.globalAlpha=.9; polyPath(c,basePts); c.fill(); c.globalAlpha=1;
    c.strokeStyle=C.glass; c.lineWidth=2; c.globalAlpha=.7;
    for(const y of [-JH/2,JH/2]){ const rp=[]; for(let i=0;i<40;i++){ const a=i/40*6.2832; rp.push(pr([Math.cos(a)*JR,y,Math.sin(a)*JR])); } polyPath(c,rp); c.stroke(); }
    for(let i=0;i<10;i++){ const a=i/10*6.2832, A=pr([Math.cos(a)*JR,-JH/2,Math.sin(a)*JR]), B=pr([Math.cos(a)*JR,JH/2,Math.sin(a)*JR]); c.beginPath(); c.moveTo(A.x,A.y); c.lineTo(B.x,B.y); c.stroke(); }
    c.globalAlpha=1;
    // thành cốc (có nước)
    for(let i=0;i<NS;i++){ const f0=i/NS*6.2832, f1=(i+1)/NS*6.2832;
      const q=[pr(ring(0,rm,f0)),pr(ring(0,rm,f1)),pr(ring(H,rb,f1)),pr(ring(H,rb,f0))];
      items.push({z:(q[0].z+q[1].z+q[2].z+q[3].z)/4, fn:()=>{ c.fillStyle=`rgba(58,134,200,${0.10+0.26*wf})`; polyPath(c,q); c.fill(); c.strokeStyle=C.glass; c.lineWidth=1; c.globalAlpha=.6; c.stroke(); c.globalAlpha=1; }}); }
    const bq=[]; for(let i=0;i<NS;i++) bq.push(pr(ring(H,rb,i/NS*6.2832)));
    items.push({z:bq.reduce((a,p)=>a+p.z,0)/NS, fn:()=>{ c.fillStyle=`rgba(58,134,200,${0.12+0.2*wf})`; polyPath(c,bq); c.fill(); c.strokeStyle=C.glass; c.lineWidth=2; c.stroke(); }});
    // tờ giấy che miệng cốc
    const off=s.fallen?[s.ft*3, -0.5*981*Math.min(s.ft,0.45)**2, 0]:[0,0,0], cq=[];
    for(let i=0;i<NS;i++){ const P=ring(0,rm+0.7,i/NS*6.2832); cq.push(pr([P[0]+off[0],Math.max(-JH/2,P[1]+off[1]),P[2]+off[2]])); }

    // giọt nước rơi khi tờ giấy rơi
    if(s.fallen) for(const d of this.drops){ const q=pr(d.p), al=clamp(1-s.ft*0.7,0,1); items.push({z:q.z, fn:()=>{ c.fillStyle=`rgba(58,134,200,${al})`; c.beginPath(); c.arc(q.x,q.y,0.38*q.k,0,6.2832); c.fill(); }}); }

    if(showArrows && s.pout>0.3){
      const La=1.2+3.4*s.pout/101.3, kk=(rm-rb)/H, kn=Math.sqrt(1+kk*kk), arr=(P,n)=>{ const tip=[P[0]+n[0]*0.4,P[1]+n[1]*0.4,P[2]+n[2]*0.4], tail=[P[0]+n[0]*(0.4+La),P[1]+n[1]*(0.4+La),P[2]+n[2]*(0.4+La)], A=pr(tail), B=pr(tip);

      if(!s.fallen) for(const [r,ph] of [[0,0],[rm*0.6,0.5],[rm*0.6,2.6],[rm*0.6,4.6]]) arr(ring(0,r,ph),[-eA[0],-eA[1],-eA[2]]);

    c.fillStyle=C.canvas; c.globalAlpha=.92; rrect(c,hx,hy,hw,206,10); c.fill(); c.globalAlpha=1; c.strokeStyle=C.line; c.lineWidth=1.5; rrect(c,hx,hy,hw,206,10); c.stroke();

    const row=(y,txt,val,w,col)=>{ label(c,txt,hx+12,y,{size:14,align:'left'}); label(c,teacher?'?':val,hx+hw-12,y,{size:14,align:'right',w:700}); c.fillStyle=C.line; c.fillRect(hx+12,y+9,bw,8); c.fillStyle=col; c.fillRect(hx+12,y+9,Math.max(2,Math.min(bw,w)),8); };

    row(hy+90, t('c_hud_col'), fmtF(ck,2)+' kPa', ck*sc, C.force);
    row(hy+132, t('c_hud_top'), fmtF(Math.max(tk,0),1)+' kPa', Math.max(tk,0)*sc, C.air);
    if(!teacher) para(c, s.fallen?t('c_card_fall'):(pk<4*ck?t('c_card_edge'):t('c_card_hold')), hx+12, hy+170, hw-24, 18, {size:14, w:700, color:s.fallen?C.bad:C.good});
  },
  /* ---- hộp sữa bị bẹp ---- */
  boxGeom(){ const s=this.s, cx=400, cy=270, w=160, h=240, b=clamp((101.3-s.pin)/91.3,0,1)*46; return {cx,cy,w,h,b,x0:cx-w/2,x1:cx+w/2,y0:cy-h/2,y1:cy+h/2}; },
  drawBox(c){

  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(actx.sampleRate*0.005));
  const src=actx.createBufferSource(); src.buffer=b; const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1500; const g=actx.createGain(); g.gain.value=0.9;

const ear = {

    {type:'button', k:'E_swallow', on:()=>this.equalize()},
    {type:'button', k: s.auto?'E_stop':(s.sc==='plane'?'E_autoPlane':'E_autoDive'), ghost:true, on:()=>{ s.auto=!s.auto; s.at=0; buildControls(); }},
    {type:'button', k:'reset', ghost:true, on:()=>{ const sc=s.sc; this.reset(); this.s.sc=sc; buildControls(); }} ]; },

  equalize(){ this.s.open=0.7; this.s.pop=1; popSound(); },
  update(dt){ const s=this.s; s.t+=dt;
    if(s.auto){ s.at+=dt; const a=s.at;
      if(s.sc==='plane'){ s.h = a<20? a/20*2400 : a<28? 2400 : a<44? 2400*(1-(a-28)/16) : 0; if(a>46){ s.auto=false; buildControls(); } syncSlider('h'); }
      else { s.dep = a<12? a/12*10 : a<18? 10 : a<30? 10*(1-(a-18)/12) : 0; if(a>32){ s.auto=false; buildControls(); } syncSlider('dep'); } }

    const s=this.s, cx=400, ceil=150, dw=40+s.D*16, dh=26+s.D*4, fy=s.fy;
    c.fillStyle=C.line; c.fillRect(40,104,720,ceil-104); label(c, t('c_ceiling'), 100, 127, {size:15, color:C.muted});
    c.strokeStyle=C.muted; c.lineWidth=2; c.beginPath(); c.moveTo(40,470); c.lineTo(760,470); c.stroke();
    this.g.co.draw(c, C.air, 3);
    c.save(); c.translate(0,fy);
    // giác mút (vòm)
    c.fillStyle=C.accent; c.beginPath(); c.moveTo(cx-dw/2,ceil); c.quadraticCurveTo(cx,ceil+dh*2,cx+dw/2,ceil); c.closePath(); c.fill();
    c.fillStyle=C.canvas; c.globalAlpha=.6; c.beginPath(); c.moveTo(cx-dw/2+10,ceil); c.quadraticCurveTo(cx,ceil+dh*1.4,cx+dw/2-10,ceil); c.closePath(); c.fill(); c.globalAlpha=1;
    // khí còn lại bên trong
    this.g.ci.draw(c, C.air, 3);
    // móc, dây, vật
    const by=310, bs=26+Math.cbrt(Math.max(s.m,0.1))*18;
    c.strokeStyle=C.ink; c.lineWidth=3; c.beginPath(); c.moveTo(cx,ceil+dh); c.lineTo(cx,by); c.stroke();
    c.fillStyle=C.muted; rrect(c, cx-bs/2, by, bs, bs, 6); c.fill(); label(c, `${fmt(s.m,1)} kg`, cx-bs/2-10, by+bs/2, {size:15, w:700, align:'right'});
    if(showArrows){ const F=this.Fcup(), W=s.m*G, K=95/Math.max(F,W,1);
      // áp lực khí quyển ép vuông góc lên mặt ngoài giác mút (minh hoạ)
      [-0.35,0.35].forEach(f=>{ const x=cx+f*dw, yb=ceil+dh*(1-(2*f)**2); arrow(c, x, yb+40, x, yb+5, C.force, 3); });
      // hai vectơ cùng tỉ lệ, cùng nằm trên đường thẳng đứng qua tâm: F đặt ở điểm giữa giác mút, P đặt ở tâm vật
      const yF=ceil+dh*0.5, yP=by+bs/2;
      vec(c, cx, yF, cx, yF-F*K, C.force, 5); c.fillStyle=C.force; c.beginPath(); c.arc(cx,yF,5,0,6.2832); c.fill();
      label(c, teacher?'F = ?':`F = ${fmt(F,0)} N`, cx+14, yF-F*K*0.5-8, {size:17, w:700, color:C.force, align:'left', bg:C.canvas});
      vec(c, cx, yP, cx, yP+W*K, C.ink, 5); c.fillStyle=C.ink; c.beginPath(); c.arc(cx,yP,5,0,6.2832); c.fill();
      label(c, teacher?'P = ?':`P = ${fmt(W,0)} N`, cx+bs/2+12, yP+Math.max(W*K*0.5,18), {size:17, w:700, align:'left', bg:C.canvas}); }
    c.restore();
    // khung phóng to: cùng một diện tích, so mật độ phân tử
    const on=s.fy<1, pin=on?101.3*s.res/100:101.3;
    label(c, t('U_zoom'), 676, 236, {size:14, color:C.muted, w:700});
    [[578,'U_zOut',101.3,this.g.ia],[684,'U_zIn',pin,this.g.ib]].forEach(([x,k,p,gg])=>{
      c.fillStyle=C.panel; c.fillRect(x,272,90,130); gg.draw(c, C.air, 3); c.strokeStyle=C.ink; c.lineWidth=2; c.strokeRect(x,272,90,130);
      label(c, t(k), x+45, 258, {size:14, w:700});
      label(c, teacher&&k==='U_zIn'?'p = ?':`p = ${fmt(p,1)} kPa`, x+45, 418, {size:14, w:700});
      label(c, `${gg.a.length} ${t('U_mol')}`, x+45, 440, {size:13, color:C.muted}); });
  },
  drawSpray(c){
    const s=this.s, x0=230, x1=370, y0=150, y1=440, h=y1-y0, ly=y1-h*(s.liq/300);
    // khí và chất lỏng
    c.globalAlpha=.5; c.fillStyle='#d9a520'; c.fillRect(x0,ly,x1-x0,y1-ly); c.globalAlpha=1;
    this.g.so.draw(c, C.air, 3); this.g.si.draw(c, C.air, 3);
    c.strokeStyle=C.ink; c.lineWidth=5; rrect(c, x0, y0, x1-x0, h, 18); c.stroke();
    c.beginPath(); c.moveTo(x0+20,y0); c.quadraticCurveTo(300,y0-40,x1-20,y0); c.stroke();
    // ống hút, van, vòi
    c.strokeStyle=C.muted; c.lineWidth=5; c.beginPath(); c.moveTo(300,y1-12); c.lineTo(300,y0-26); c.stroke();
    const press=s.pressing?6:0; c.fillStyle=C.accent; rrect(c, 270, 96+press, 60, 26, 6); c.fill(); c.fillRect(330,106+press,40,10);
    label(c, t('c_gas'), 300, Math.max(y0+20,(y0+ly)/2), {size:15, w:700, bg:C.canvas});
    label(c, t('c_liquid'), 300, Math.min(y1-14,(ly+y1)/2), {size:15, w:700, bg:C.canvas});
    if(showArrows && s.pgas>101.3){ const L=12+40*(s.pgas-101.3)/400; [255,345].forEach(x=>arrow(c, x, Math.max(y0+10,ly-L-6), x, ly-2, C.force, 4)); if(s.pressing && s.liq>0) arrow(c, 312, y1-60, 312, y0+10, C.force, 3); }
    // tia xịt
    c.fillStyle='#d9a520'; for(const d of s.spr){ c.globalAlpha=clamp(d.life*2,0,1); c.beginPath(); c.arc(d.x,d.y,3,0,Math.PI*2); c.fill(); } c.globalAlpha=1;
    label(c, `p = ${teacher?'?':fmtF(s.pgas,0)+' kPa'}`, 580, 400, {size:18, w:700});
    label(c, `p₀ = ${fmt(101.3,1)} kPa`, 580, 430, {size:16, color:C.muted});
    label(c, t('U_sprNote'), 580, 300, {size:14, color:C.muted});
    label(c, `${t('U_inCan')}: ${this.g.si.a.length} ${t('U_mol')}`, 580, 330, {size:15, w:700});
  },
  drawHover(c){
    const s=this.s, wy=390, hullW=260, hullH=46, skirt=26, by=wy-skirt-s.gap, x=s.x, L=this.lift(), W=s.M*G;
    // nước
    c.globalAlpha=.45; c.fillStyle='#3a86c8'; c.fillRect(0,wy,800,110); c.globalAlpha=1;
    // không khí bên ngoài (phân tử bay sau thân tàu không vẽ, không vẽ trong đệm khí)
    { const xa=x-hullW/2-14, xb=x+hullW/2+14; c.fillStyle=C.air; c.globalAlpha=.9; for(const m of this.g.ho.a){ if(m.x>xa&&m.x<xb&&m.y>by-hullH-34) continue; c.beginPath(); c.arc(m.x,m.y,3,0,6.2832); c.fill(); } c.globalAlpha=1; }
    c.strokeStyle='#3a86c8'; c.lineWidth=2; c.beginPath(); for(let X=0;X<=800;X+=8){ const Y=wy+Math.sin(X/30+s.t*2)*2; X?c.lineTo(X,Y):c.moveTo(X,Y); } c.stroke();
    // đệm khí (vùng áp suất cao)
    if(s.dpf>0){ c.globalAlpha=.10+0.15*clamp(s.dpf/4000,0,1); c.fillStyle=C.air; c.fillRect(x-hullW/2+10, by, hullW-20, wy-by); c.globalAlpha=1; }
    c.save(); c.translate(x,0); this.g.hi.draw(c, C.air, 3); c.restore();
    // váy cao su
    c.fillStyle=C.ink; c.beginPath(); c.moveTo(x-hullW/2,by-2); c.lineTo(x-hullW/2-14,wy-s.gap*0.3); c.lineTo(x-hullW/2+12,wy-s.gap*0.3); c.lineTo(x-hullW/2+16,by); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(x+hullW/2,by-2); c.lineTo(x+hullW/2+14,wy-s.gap*0.3); c.lineTo(x+hullW/2-12,wy-s.gap*0.3); c.lineTo(x+hullW/2-16,by); c.closePath(); c.fill();
    // thân tàu
    c.fillStyle=C.accent; rrect(c, x-hullW/2, by-hullH, hullW, hullH, 12); c.fill();
    c.fillStyle=C.panel; rrect(c, x-60, by-hullH-30, 110, 32, 10); c.fill(); c.strokeStyle=C.accent; c.lineWidth=3; c.stroke();
    // quạt
    const fx=x-hullW/2+40, fy=by-hullH-26; c.strokeStyle=C.ink; c.lineWidth=3; c.beginPath(); c.arc(fx,fy,24,0,Math.PI*2); c.stroke();
    const rot=s.t*(s.dpf/200); for(let i=0;i<3;i++){ const a=rot+i*2.094; c.beginPath(); c.moveTo(fx,fy); c.lineTo(fx+Math.cos(a)*20, fy+Math.sin(a)*20); c.stroke(); }
    if(showArrows){ const K=120/Math.max(L,W,1);
      // áp suất đệm khí ép đều lên đáy (mũi tên mảnh, minh hoạ)
      if(s.dpf>0) [-0.38,-0.2,0.2,0.38].forEach(f=>arrow(c, x+f*hullW, wy-3, x+f*hullW, by+3, C.force, 2));
      // hai vectơ cùng tỉ lệ: F (hợp lực đẩy của đệm khí) đặt ở giữa đáy tàu, P đặt ở tâm tàu; vẽ lệch nhẹ để không chồng nhau
      const yc=by-hullH/2;
      if(L>0){ vec(c, x-8, by, x-8, by-L*K, C.force, 5); c.fillStyle=C.force; c.beginPath(); c.arc(x-8,by,5,0,6.2832); c.fill();
        label(c, teacher?'F = ?':`F = ${fmt(L,0)} N`, x-20, by-L*K+10, {size:16, w:700, align:'right', color:C.force, bg:C.canvas}); }
      vec(c, x+8, yc, x+8, yc+W*K, C.ink, 5); c.fillStyle=C.ink; c.beginPath(); c.arc(x+8,yc,5,0,6.2832); c.fill();
      label(c, teacher?'P = ?':`P = ${fmt(W,0)} N`, x+20, yc+W*K-8, {size:16, w:700, align:'left', bg:C.canvas}); }
    label(c, t('c_cushion'), x-62, by+(wy-by)/2+2, {size:14, w:700, bg:C.canvas});
    label(c, `Δp = ${teacher?'?':fmt(s.dpf,0)+' Pa'}`, 20, 40, {size:18, w:700, align:'left'});
    label(c, `S = 6 m × 3 m = 18 m²`, 20, 70, {size:16, color:C.muted, align:'left'});
    para(c, t('U_hovNote').replace('#', fmtF(s.dpf/P0*100,1)), 20, 100, 380, 20, {size:14, color:C.muted});
    if(s.gap>2 && s.dpf>0){ c.fillStyle=C.panel; for(let i=0;i<8;i++){ const q=((s.t*2+i/8)%1); c.globalAlpha=1-q; c.beginPath(); c.arc(x-hullW/2-16-q*40, wy-4-q*20+(i%2)*6, 3,0,Math.PI*2); c.fill(); c.beginPath(); c.arc(x+hullW/2+16+q*40, wy-4-q*20+(i%3)*5, 3,0,Math.PI*2); c.fill(); } c.globalAlpha=1; }
  }
};

/* ====================== GIAO DIỆN ====================== */
const TABS=[liquid, pascal, atm, gauge, ear, apps];
TABS.forEach(T=>{ T.reset(); T.preds={}; });
let cur = liquid;
const PRED = {liquid:['L_q','L_o',1,'L_exp'], pascal:['P_q','P_o',1,'P_exp'],
  atm:()=>{ const m=atm.s.mode; return ['A_q_'+m,'A_o_'+m,{cup:2,box:1,alt:1}[m],'A_exp_'+m]; },
  gauge:()=>{ const m=gauge.s.mode; return ['G_q_'+m,'G_o_'+m,{mmhg:1,baro:1,utube:2,bourdon:1}[m],'G_exp_'+m]; },
  ear:['E_q','E_o',1,'E_exp'], apps:()=>{ const m=apps.s.mode; return m==='cup'?['U_q','U_o',2,'U_exp']:['U_q_'+m,'U_o_'+m,{spray:1,hover:2}[m],'U_exp_'+m]; }};
const YCCD = {liquid:'L_yccd', pascal:'P_yccd', atm:'A_yccd', gauge:'G_yccd', ear:'E_yccd', apps:'U_yccd'};
const ASSUME = {liquid:'L_assume', pascal:'P_assume', atm:'A_assume', gauge:()=>'G_assume_'+gauge.s.mode, ear:'E_assume', apps:'U_assume'};

function buildTabs(){
  const nav=$('#tabs'); nav.innerHTML='';
  TABS.forEach((T,i)=>{ const b=document.createElement('button'); b.role='tab'; b.id='tab-'+T.id; b.setAttribute('aria-selected', T===cur);
    b.innerHTML=`<span class="n">${i+1}</span>${t('tab_'+T.id)}`; b.onclick=()=>{ cur=T; try{localStorage.setItem('apsuat-tab',T.id);}catch(e){} renderAll(); }; nav.appendChild(b); });
}
function predState(){ const m=(cur.id==='atm'||cur.id==='gauge'||cur.id==='apps')?cur.s.mode:'x'; return cur.preds[m]||(cur.preds[m]={choice:null, open:false}); }
function refreshText(){
  $('#hint').textContent=cur.hint(); $('#yccd').textContent=t(YCCD[cur.id]);
  const a=ASSUME[cur.id]; $('#assume').textContent=t(typeof a==='function'?a():a); buildPred();
}
function buildPred(){
  const spec=typeof PRED[cur.id]==='function'?PRED[cur.id]():PRED[cur.id], [qk,ok,right,ek]=spec, P=predState(), box=$('#predCard');
  box.innerHTML=`<h2>${t('predict')}</h2><p class="q">${t(qk)}</p><div class="opts"></div>`;
  const opts=box.querySelector('.opts');
  t(ok).forEach((o,i)=>{ const b=document.createElement('button'); b.textContent=String.fromCharCode(65+i)+'. '+o;
    if(P.choice===i) b.classList.add('chosen'); if(P.open && i===right) b.classList.add('right');
    b.onclick=()=>{ P.choice=i; buildPred(); }; opts.appendChild(b); });
  if(P.choice!==null){ const p=document.createElement('p'); p.className='small'; p.textContent=t('chosen'); box.appendChild(p); }
  const eb=document.createElement('button'); eb.className='act ghost'; eb.textContent=t(P.open?'hideExp':'showExp'); eb.onclick=()=>{ P.open=!P.open; buildPred(); }; box.appendChild(eb);
  if(P.open){ const e=document.createElement('p'); e.className='exp'; e.textContent=t(ek); box.appendChild(e); }
}
function buildControls(){
  const box=$('#controls'); box.innerHTML=''; const s=cur.s;
  let btnRow=null;
  for(const c of cur.controls()){
    if(c.show && !c.show()) continue;
    if(c.type!=='button' && c.type!=='hold') btnRow=null;
    if(c.type==='slider'){
      const w=document.createElement('div'), mn=typeof c.min==='function'?c.min():c.min, mx=typeof c.max==='function'?c.max():c.max; w.className='ctl';
      w.innerHTML=`<div class="row"><label for="in-${cur.id}-${c.id}">${t(c.k)}</label><output id="out-${cur.id}-${c.id}"></output></div><input type="range" id="in-${cur.id}-${c.id}" min="${mn}" max="${mx}" step="${c.step}" value="${s[c.id]}">`;
      const inp=w.querySelector('input'), out=w.querySelector('output'), show=()=>out.textContent=fmt(s[c.id],c.d)+c.unit;
      inp.oninput=()=>{ s[c.id]=+inp.value; show(); c.on&&c.on(); }; show(); inp._show=show; box.appendChild(w);
    } else if(c.type==='seg'){
      const w=document.createElement('div'); w.className='ctl'; w.innerHTML=`<label>${t(c.k)}</label><div class="seg"></div>`;
      const sg=w.querySelector('.seg');
      c.opts.forEach(([v,k])=>{ const b=document.createElement('button'); b.textContent=t(k); b.setAttribute('aria-pressed', s[c.id]===v);
        b.onclick=()=>{ s[c.id]=v; c.on&&c.on(); buildControls(); refreshText(); }; sg.appendChild(b); });
      box.appendChild(w);
    } else if(c.type==='toggle'){
      const l=document.createElement('label'); l.className='tog'; l.innerHTML=`<input type="checkbox" id="in-${cur.id}-${c.id}" ${s[c.id]?'checked':''}> ${t(c.k)}`;
      l.querySelector('input').onchange=e=>{ s[c.id]=e.target.checked; }; box.appendChild(l);
    } else {
      if(!btnRow){ btnRow=document.createElement('div'); btnRow.className='btnrow'; box.appendChild(btnRow); }
      const b=document.createElement('button'); b.className='act'+(c.ghost?' ghost':''); b.textContent=t(c.k);
      if(c.type==='hold'){ const on=e=>{ e.preventDefault(); s[c.id]=true; b.setPointerCapture&&e.pointerId!==undefined&&b.setPointerCapture(e.pointerId); }, off=()=>{ s[c.id]=false; };
        b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('lostpointercapture',off);
        b.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); s[c.id]=true; } }); b.addEventListener('keyup',off);
      } else b.onclick=()=>c.on&&c.on();
      btnRow.appendChild(b);
    }
  }
}
function syncSlider(id){ const el=document.getElementById(`in-${cur.id}-${id}`); if(el){ el.value=cur.s[id]; el._show&&el._show(); } }
function renderReadouts(){
  const box=$('#readouts'); let h='';
  if(teacher) h+=`<div class="wide" style="font-family:var(--f-body)">${t('teacherHidden')}</div>`;
  for(const [k,v,cls] of cur.readouts()){
    if(cls==='wide'){ h+=`<div class="k" style="grid-column:1/-1">${t(k)}</div><div class="wide">${teacher?'?':v}</div>`; continue; }
    h+=`<div class="k">${t(k)}</div><div class="v ${teacher?'':(cls||'')}">${teacher?'?':v}</div>`;
  }
  box.innerHTML=h;
}
function applyStatic(){
  document.documentElement.lang=lang;
  $('#title').textContent=t('title'); $('#sub').textContent=t('sub');
  $('#teach').textContent=t('teacher'); $('#arrows').textContent=t('arrows'); $('#lang').textContent=lang==='vi'?'EN':'VI';
  $('#ctlLbl').textContent=t('controls'); $('#dataLbl').textContent=t('data');
  $('#yccdLbl').textContent=t('yccd'); $('#assumeLbl').textContent=t('assume');
}
function renderAll(){
  applyStatic(); buildTabs(); buildPred(); buildControls(); renderReadouts();
  refreshText();
  cv.setAttribute('aria-label', t('tab_'+cur.id));
}
$('#lang').onclick=()=>{ lang=lang==='vi'?'en':'vi'; renderAll(); };
$('#teach').onclick=e=>{ teacher=!teacher; e.currentTarget.setAttribute('aria-pressed',teacher); renderReadouts(); };
$('#arrows').onclick=e=>{ showArrows=!showArrows; e.currentTarget.setAttribute('aria-pressed',showArrows); };

/* kéo thả */
let dragging=false;
let lastPt=null;
cv.addEventListener('pointerdown', e=>{ const p=toWorld(e); const r=cur.down?cur.down(p):false; if(r){ dragging=r; lastPt={x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId); if(r===true && cur.move) cur.move(p); e.preventDefault(); } });
cv.addEventListener('pointermove', e=>{ const p=toWorld(e); if(dragging===true && cur.move) cur.move(p);
  if(dragging==='orbit' && lastPt && cur.orbit){ cur.orbit(e.clientX-lastPt.x, e.clientY-lastPt.y); lastPt={x:e.clientX,y:e.clientY}; } cv.style.cursor = (cur.down && !dragging && cur.id==='liquid' && Math.hypot(p.x-cur.s.px,p.y-cur.s.py)<42) ? 'grab' : (dragging?'grabbing':(cur.id==='atm'&&cur.s.mode==='cup'?'move':'default')); });
const endDrag=()=>{ if(dragging==='hold' && cur.up) cur.up(); dragging=false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

/* vòng lặp */
let last=performance.now(), lastRO=0, lastCol=0;
function frame(now){
  const dt=Math.min((now-last)/1000, 0.05); last=now;
  if(now-lastCol>500){ readColors(); lastCol=now; }
  cur.update(dt);
  const c=ctx; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,cv.width,cv.height);
  c.setTransform(view.dpr*view.s,0,0,view.dpr*view.s,view.dpr*view.ox,view.dpr*view.oy);
  cur.draw(c);
  if(now-lastRO>150){ renderReadouts(); lastRO=now; }
  requestAnimationFrame(frame);
}
try{ const saved=localStorage.getItem('apsuat-tab'); const f=TABS.find(T=>T.id===saved); if(f) cur=f; }catch(e){}
const hash=location.hash.slice(1); const fh=TABS.find(T=>T.id===hash); if(fh) cur=fh;
readColors(); resize(); renderAll(); requestAnimationFrame(frame);
</script>
