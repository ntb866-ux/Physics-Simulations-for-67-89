<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sự nở vì nhiệt và băng kép</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Sự nở vì nhiệt, băng kép, đo năng lượng nhiệt (KHTN 8). Cùng hệ màu, phông với bộ mô phỏng KHTN 6–9. */
/* Phòng thí nghiệm đồ thị quãng đường – thời gian (KHTN 7): dải video thực tế, sân khấu canvas bên trái, sổ ghi chép bên phải. Điện thoại xếp một cột.
   Cùng hệ màu, phông với bộ mô phỏng KHTN 6–9 (Lực hấp dẫn, Lực ma sát). */
:root{
  --bg:#edf0f3; --panel:#ffffff; --lane:#f4f6f9; --ink:#141c26; --muted:#556170; --line:#c9d1db;
  --accent:#1d5fa8; --accent-ink:#ffffff; --ok:#1d8a4b; --warn:#c2410c;
  --force:#d1323b; --vel:#1f6fd1; --mass:#7a3fc2; --spring:#5d6b7a; --spring2:#e07b00;
  --earth:#2f78c4; --land:#4f9a5b; --moon:#a9adb3; --space:#0d1626; --star:#e9eef7;
  --gold:#c99a2e; --metal:#8b96a3; --metal2:#5b6673; --wood:#b07a45;
  --laneA:#0f7c8a; --laneB:#d0661c; --c3:#7a3fc2; --c4:#1d8a4b; --c5:#b8326a;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --panel:#161e28; --lane:#111821; --ink:#e3e9f0; --muted:#97a3b2; --line:#2a3644;
  --accent:#5ea6ec; --accent-ink:#04182c; --ok:#47c47d; --warn:#f08a4b;
  --force:#ff5f67; --vel:#5aa2ff; --mass:#b28cff; --spring:#9aa8b8; --spring2:#ffa630;
  --earth:#3b86d4; --land:#4c8a55; --moon:#8d9197; --space:#060a12; --star:#cfd8e6;
  --gold:#e0b24a; --metal:#7c8794; --metal2:#a9b4c1; --wood:#9a6a3c;
  --laneA:#3cc3d2; --laneB:#ff9a4d; --c3:#b28cff; --c4:#47c47d; --c5:#f06aa2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --panel:#161e28; --lane:#111821; --ink:#e3e9f0; --muted:#97a3b2; --line:#2a3644;
  --accent:#5ea6ec; --accent-ink:#04182c; --ok:#47c47d; --warn:#f08a4b;
  --force:#ff5f67; --vel:#5aa2ff; --mass:#b28cff; --spring:#9aa8b8; --spring2:#ffa630;
  --earth:#3b86d4; --land:#4c8a55; --moon:#8d9197; --space:#060a12; --star:#cfd8e6;
  --gold:#e0b24a; --metal:#7c8794; --metal2:#a9b4c1; --wood:#9a6a3c;
  --laneA:#3cc3d2; --laneB:#ff9a4d; --c3:#b28cff; --c4:#47c47d; --c5:#f06aa2;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(25px,3.4vw,36px);line-height:1.15;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:700}
.btn{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg .btn{border:0;border-radius:0;min-width:52px}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.places .btn{font-size:14px;padding:6px 8px;line-height:1.25}
.places .btn small{display:block;font-family:var(--font-num);font-size:12px;font-weight:500;opacity:.8}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-size:15px;font-weight:600;white-space:nowrap;min-height:46px;padding:8px 14px;border:0;border-bottom:3px solid transparent;
  background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.req{margin:0;font-size:14px;color:var(--muted);max-width:110ch}
.req b{color:var(--ink);font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:1020px){.lab{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0}
canvas{display:block;width:100%;border-radius:8px;background:var(--lane);touch-action:pan-y;user-select:none;-webkit-user-select:none}
canvas.drag{touch-action:none}
.hint{margin:0;font-size:14px;color:var(--muted)}
.status{margin:0;font-weight:600;min-height:1.5em}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:6px;vertical-align:middle}
.sl{display:flex;flex-direction:column;gap:4px}
.sl .top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.sl .val{font-family:var(--font-num);font-weight:600;text-align:right}
.sl .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);margin:0}
select{font:inherit;font-size:15px;min-height:44px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.bigfig{font-family:var(--font-num);font-size:clamp(22px,2.6vw,30px);font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.cmp{font-size:15px;background:var(--lane);border-radius:8px;padding:8px 12px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts .btn{text-align:left;font-size:14px}
.opts .btn.picked{border:2px solid var(--accent)}
.opts .btn.right{background:color-mix(in srgb,var(--ok) 18%,var(--panel));border-color:var(--ok)}
.ans{background:var(--lane);border-left:4px solid var(--ok);padding:8px 12px;border-radius:6px;font-size:15px}
.muted{color:var(--muted);font-size:14px}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:0 14px}
details[open]{padding-bottom:12px}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;font-size:15px}
details p,details ul{margin:6px 0;font-size:15px;max-width:95ch}
details ul{padding-left:20px}
.fine{font-size:13px;color:var(--muted);margin:0}
.two4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.two4{grid-template-columns:1fr}}
.tblwrap{overflow-x:auto}
table.log{border-collapse:collapse;width:100%;font-size:14px}
table.log th,table.log td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.log th:first-child,table.log td:first-child{text-align:left}
table.log td{font-family:var(--font-num);font-variant-numeric:tabular-nums}
table.log th{color:var(--muted);font-weight:600}
.kv dd.t,table.log td.t{font-family:var(--font-ui)}
/* Dải video thực tế */
.video{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--space);color:var(--star);
  border-radius:var(--r);padding:12px 14px}
.video .play{width:52px;height:52px;border-radius:50%;background:var(--force);display:grid;place-items:center;flex:none}
.video .play::before{content:"";border-style:solid;border-width:10px 0 10px 17px;border-color:transparent transparent transparent #fff;margin-left:4px}
.video .vt{display:flex;flex-direction:column;gap:2px;min-width:0}
.video .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;font-weight:600}
.video .ttl{font-weight:700;font-size:16px;line-height:1.3}
.video .look{font-size:14px;opacity:.9}
.video .links{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.video a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:6px 14px;border-radius:8px;font-weight:700;font-size:15px;text-decoration:none;
  background:var(--star);color:var(--space);white-space:nowrap}
.video a.alt{background:transparent;color:var(--star);border:1px solid color-mix(in srgb,var(--star) 45%,transparent);font-weight:600;font-size:14px}
.video .src{font-size:13px;opacity:.75}
@media (max-width:720px){.video{grid-template-columns:auto minmax(0,1fr)}.video .links{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.video a{flex:1 1 160px}}
/* Chế độ giáo viên: che số liệu để lớp dự đoán */
body.hideNums .num{filter:blur(7px);user-select:none}
body.hideNums .num:hover{filter:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* Bảng số liệu ngang, câu hỏi đọc đồ thị, thử thách */
table.log.hz th,table.log.hz td{text-align:center;min-width:44px}
table.log.hz th:first-child,table.log.hz td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
.quiz{display:flex;flex-direction:column;gap:12px}
.qz{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.qz:first-child{border-top:0;padding-top:0}
.qz .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qz input{font:inherit;font-family:var(--font-num);font-size:16px;width:110px;min-height:44px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.qz .unit{font-family:var(--font-num);color:var(--muted)}
.qz .res{font-weight:700}
.qz .res.ok{color:var(--ok)} .qz .res.no{color:var(--warn)}
.stars{font-size:28px;letter-spacing:4px;color:var(--gold)}
.big{font-family:var(--font-num);font-size:clamp(30px,5vw,48px);font-weight:600;line-height:1}
.count{font-size:15px;color:var(--muted)}
/* Thêm cho mô phỏng này */
.i{display:inline}
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}
.vc{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;background:var(--space);color:var(--star);border-radius:var(--r);padding:10px;align-items:center}
@media (max-width:420px){.vc{grid-template-columns:110px minmax(0,1fr)}}
.vth{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#22324a,#101a2a);border:0;padding:0;cursor:pointer;width:100%}
.vth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vth::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(209,50,59,.92)}
.vth::before{content:"";position:absolute;z-index:1;left:50%;top:50%;margin:-9px 0 0 -6px;border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent #fff}
.vc .kind{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;font-weight:700}
.vc .ttl{font-weight:700;font-size:15px;line-height:1.3;margin:2px 0}
.vc .look{font-size:13.5px;opacity:.92}
.vc .meta{font-size:12.5px;opacity:.7;margin-top:4px}
.vc a{color:var(--star);font-size:13px}
.vplay{background:var(--space);border-radius:var(--r);padding:8px;color:var(--star)}
.vplay video,.vplay iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:6px;background:#000;display:block}
.vplay .row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:6px;font-size:13px;flex-wrap:wrap}
.pred{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--lane)}
.pred p{margin:6px 0 8px}
.opts .btn.wrong{background:color-mix(in srgb,var(--warn) 16%,var(--panel));border-color:var(--warn)}
.concl{border-left:4px solid var(--accent);background:var(--lane);padding:10px 14px;border-radius:6px}
.concl p{margin:4px 0}
.lock{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--lane);border:1px solid var(--line);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.cl{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel)}
.cl p{margin:0 0 8px;font-size:15px}
.cl .row{display:flex;gap:6px;flex-wrap:wrap}
.cl .fb{margin-top:6px;font-size:14px}
.cl.done{background:var(--lane)}
.warnbox{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--panel));padding:8px 12px;border-radius:6px;font-size:15px}
.etym td{padding:3px 10px 3px 0;vertical-align:top;font-size:15px}
.etym td:first-child{font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow"><span class="i" data-vi="KHTN 8 · Nhiệt · thí nghiệm, hiện tượng, ứng dụng" data-en="Grade 8 science · Heat · experiments, phenomena, applications"></span></div>
      <h1><span class="i" data-vi="Sự nở vì nhiệt, băng kép và đo năng lượng nhiệt" data-en="Thermal expansion, the bimetallic strip and measuring thermal energy"></span></h1>
    </div>
    <div class="hbtns">
      <button class="btn" id="gvBtn" aria-pressed="false"></button>
      <button class="btn" id="langBtn">EN</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section class="tab col" data-n="1" id="t1"></section>
  <section class="tab col" data-n="2" id="t2" hidden></section>
  <section class="tab col" data-n="3" id="t3" hidden></section>
  <section class="tab col" data-n="4" id="t4" hidden></section>
  <section class="tab col" data-n="5" id="t5" hidden></section>
  <section class="tab col" data-n="6" id="t6" hidden></section>
  <footer class="fine" id="foot"></footer>
</div>
<script>
"use strict";
/* ============ Tiện ích chung ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
let lang='vi'; try{ if(localStorage.getItem('nvn_lang')==='en') lang='en'; }catch(e){}
const t=(vi,en)=>lang==='vi'?vi:en;
const nf=(x,d=1)=>new Intl.NumberFormat(lang==='vi'?'vi-VN':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d}).format(x);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const I=(vi,en)=>'<span class="i" data-vi="'+esc(vi)+'" data-en="'+esc(en)+'"></span>';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const FONT='"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const MONO='"IBM Plex Mono",ui-monospace,Consolas,monospace';
function applyI(root){ $$('.i',root||document).forEach(e=>{e.innerHTML=e.dataset[lang];}); }

/* Màu đọc từ biến CSS (có chế độ tối) */
const COL={};
function readCol(){
  const cs=getComputedStyle(document.documentElement);
  ['bg','panel','lane','ink','muted','line','accent','ok','warn','force','vel','mass','space','star','laneA','laneB','c3','c4','c5','gold','metal','metal2','wood','earth'].forEach(k=>{COL[k]=cs.getPropertyValue('--'+k).trim();});
}
readCol();
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readCol); }catch(e){}

/* Canvas có toạ độ logic cố định LW×LH, tự co theo bề rộng */
function mkCanvas(cv,LW,LH){
  const o={cv,LW,LH,ctx:cv.getContext('2d'),s:1};
  cv.fitObj=function(){o.fit();};
  o.fit=function(){
    const w=cv.clientWidth||LW, dpr=window.devicePixelRatio||1;
    cv.width=Math.round(w*dpr); cv.height=Math.round(w*LH/LW*dpr);
    cv.style.height=(w*LH/LW)+'px'; o.s=cv.width/LW;
  };
  o.begin=function(){ o.ctx.setTransform(o.s,0,0,o.s,0,0); o.ctx.clearRect(0,0,LW,LH); o.ctx.lineJoin='round'; return o.ctx; };
  o.pt=function(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*LW/r.width,y:(e.clientY-r.top)*LH/r.height}; };
  o.fit();
  if(window.ResizeObserver) new ResizeObserver(o.fit).observe(cv); else window.addEventListener('resize',o.fit);
  return o;
}
function tx(c,s,x,y,o){
  o=o||{}; c.font=(o.w||500)+' '+(o.size||14)+'px '+(o.mono?MONO:FONT);
  c.fillStyle=o.color||COL.ink; c.textAlign=o.align||'left'; c.textBaseline=o.base||'alphabetic'; c.fillText(s,x,y);
}
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

/* Trục toạ độ + lưới; trả về hàm đổi giá trị -> pixel */
function axes(c,b,xa,ya,xl,yl,dx,dy){
  const X=v=>b.x+(v-xa[0])/(xa[1]-xa[0])*b.w, Y=v=>b.y+b.h-(v-ya[0])/(ya[1]-ya[0])*b.h;
  c.lineWidth=1; c.strokeStyle=COL.line; c.fillStyle=COL.muted;
  for(let v=xa[0];v<=xa[1]+1e-9;v+=xa[2]){ c.beginPath(); c.moveTo(X(v),b.y); c.lineTo(X(v),b.y+b.h); c.stroke(); tx(c,nf(v,dx||0),X(v),b.y+b.h+16,{size:12,color:COL.muted,align:'center'}); }
  for(let v=ya[0];v<=ya[1]+1e-9;v+=ya[2]){ c.beginPath(); c.moveTo(b.x,Y(v)); c.lineTo(b.x+b.w,Y(v)); c.stroke(); tx(c,nf(v,dy||0),b.x-6,Y(v)+4,{size:12,color:COL.muted,align:'right'}); }
  c.strokeStyle=COL.ink; c.lineWidth=1.6; c.beginPath(); c.moveTo(b.x,b.y); c.lineTo(b.x,b.y+b.h); c.lineTo(b.x+b.w,b.y+b.h); c.stroke();
  tx(c,xl,b.x+b.w,b.y+b.h+32,{size:13,color:COL.ink,align:'right',w:600});
  tx(c,yl,b.x,b.y-8,{size:13,color:COL.ink,align:'left',w:600});
  return {X,Y};
}

    I('Khi nóng đến mức đã đặt, băng kép cong đủ để tách tiếp điểm và ngắt mạch. Nguội đi, nó cong lại và nối mạch: nhiệt độ được giữ gần mức đặt.','At the set temperature the strip bends enough to separate the contacts and break the circuit. As it cools it bends back and reconnects: the temperature stays near the setting.'))+'</div>'+
  concl('4','<p>'+I('1) Băng kép gồm hai kim loại có hệ số nở dài khác nhau dán chặt vào nhau. Khi nóng lên nó cong về phía kim loại nở ít hơn, khi lạnh đi cong ngược lại.','1) A bimetallic strip is two metals with different expansion bonded together. Heated, it bends towards the metal that expands less; cooled, it bends the other way.')+'</p><p>'+I('2) Hai kim loại càng khác nhau nhiều (đồng thau–invar) thì băng kép càng cong; hai thanh giống nhau (sắt–sắt) thì không cong.','2) The more different the metals (brass–invar), the more it bends; two identical bars (iron–iron) do not bend.')+'</p>')+
  '<div id="cc4bbox" hidden>'+concl('4b','<p>'+I('Băng kép là công tắc tự động theo nhiệt độ: nóng thì cong, ngắt mạch; nguội thì cong lại, nối mạch. Nhờ vậy bàn là, ấm điện, nồi cơm giữ được nhiệt độ. Nếu hỏng băng kép, bàn là nóng mãi và nguy hiểm.','The bimetallic strip is a temperature-operated switch: hot, it bends and breaks the circuit; cooled, it bends back and reconnects. That is how irons, kettles and rice cookers hold a temperature. If it fails the iron keeps heating and becomes dangerous.')+'</p>')+'</div>',
 mech:
  '<p>'+I('Hai thanh kim loại dài như nhau ở nhiệt độ ban đầu được dán chặt vào nhau. Khi nóng lên, thanh có α lớn muốn dài hơn thanh có α nhỏ, nhưng vì dính vào nhau nên cả băng kép phải cong: bên nở nhiều nằm ở phía ngoài vòng cung (dài hơn), bên nở ít ở phía trong. Độ cong tăng khi hiệu hai hệ số nở và độ tăng nhiệt độ tăng, và giảm khi băng mỏng. Trong rơ le, độ cong này làm tách hoặc nối tiếp điểm điện.','Two metal bars of equal length at the starting temperature are bonded together. When heated, the bar with the larger α wants to become longer than the other, but because they are stuck together the whole strip must curve: the metal that expands more lies on the outside of the arc (longer), the other on the inside. The curvature grows with the difference of the two coefficients and with the temperature rise, and is larger for a thinner strip. In a thermostat this bending separates or joins an electrical contact.')+'</p>',
 simple:
  '<p>'+I('Hai người chạy cạnh nhau, tay nắm tay, một người bước dài hơn một người bước ngắn. Hai người bị kéo vòng ra: người bước dài đi vòng ngoài, người bước ngắn ở trong. Băng kép cũng vậy: kim loại “bước dài” (nở nhiều) nằm ngoài, nên băng cong về phía kim loại nở ít.','Two people run side by side holding hands, one with longer steps. They swing round in an arc: the long-stepper takes the outside track and the short-stepper the inside. The strip is the same: the metal that “steps longer” (expands more) is on the outside, so the strip bends towards the metal that expands less.')+'</p>',
 wrong:

 word:
  '<table class="etym"><tr><td>bimetal</td><td>'+I('Latinh bi- (hai) + metallum, từ Hy Lạp metallon (mỏ quặng, kim loại). Tiếng Việt “băng kép”: băng = dải mỏng, kép = đôi.','Latin bi- (two) + metallum, from Greek metallon (mine, metal). Vietnamese “băng kép”: băng = thin strip, kép = double.')+'</td></tr><tr><td>thermostat</td><td>'+I('Hy Lạp thermē (nhiệt) + statos (đứng yên, ổn định): “giữ nhiệt độ đứng yên”.','Greek thermē (heat) + statos (standing, steady): “keeping the heat steady”.')+'</td></tr><tr><td>'+I('rơ le','relay')+'</td><td>'+I('Từ tiếng Pháp relais, “trạm đổi ngựa” ngày xưa, nghĩa là chuyển tiếp. Hán Việt: 繼電器 (kế điện khí).','From French relais, the old “station for changing horses”, i.e. passing on. Sino-Vietnamese: 繼電器 (kế điện khí).')+'</td></tr><tr><td>invar</td><td>'+I('Rút từ Latinh invariabilis (không đổi): hợp kim sắt–niken nở rất ít, α ≈ 1,2·10⁻⁶ K⁻¹.','Short for Latin invariabilis (unchanging): an iron–nickel alloy that hardly expands, α ≈ 1.2·10⁻⁶ K⁻¹.')+'</td></tr></table>'
});

TABS[4]=(function(){
  const MET={cu:{vi:'Đồng',en:'Copper',a:17,col:'laneB'},fe:{vi:'Sắt',en:'Iron',a:12,col:'metal2'},al:{vi:'Nhôm',en:'Aluminium',a:23,col:'laneA'},br:{vi:'Đồng thau',en:'Brass',a:19,col:'gold'},iv:{vi:'Invar',en:'Invar',a:1.2,col:'c3'}};
  const PAIRS=[['cu','fe'],['al','fe'],['br','iv'],['fe','fe']];
  const A=mkCanvas($('#cv4a'),640,380), B=mkCanvas($('#cv4b'),640,260);
  const S={mode:0,pair:0,flip:false,Tt:20,T:20,acc:0,
           // rơ le
           Tp:20,Tset:120,on:true,broken:false,sp:10,hist:[],tsim:0,hacc:0,switches:0,sw:null};
  const top=()=>MET[PAIRS[S.pair][S.flip?1:0]], bot=()=>MET[PAIRS[S.pair][S.flip?0:1]];
  function kap(top,bot,T){ return 1.5*(top.a-bot.a)*1e-6*(T-20)/1.0; } // 1/mm, h = 1 mm
  function tip(top,bot,T){ const k=kap(top,bot,T); if(Math.abs(k)<1e-10) return 0; return (1-Math.cos(k*200))/k; }
  const sg=mkSeg($('#sg4'),()=>[t('Băng kép','Bimetallic strip'),t('Rơ le bàn là','Iron thermostat')],0,k=>{
    S.mode=k; $('#c4a').hidden=!!k; $('#c4b').hidden=!k; $('#pr4box').hidden=!!k; $('#pr4box2').hidden=!k; $('#cc4bbox').hidden=!k; hint(); readout(); });
  const sp=mkSeg($('#sp4'),()=>PAIRS.map(p=>t(MET[p[0]].vi,MET[p[0]].en)+' – '+t(MET[p[1]].vi,MET[p[1]].en)+(p[0]===p[1]?t(' (đối chứng)',' (control)'):'')),0,k=>{S.pair=k;readout();});
  $('#sp4').style.flexDirection='column'; $('#sp4').style.display='flex';
  const sl=mkSlider($('#sl4a'),{vi:'Nhiệt độ nguồn (đích)',en:'Heat-source temperature (target)',min:-20,max:150,step:1,val:20,unit:'°C',cb:v=>{S.Tt=v;}});
  const sb=mkSlider($('#sl4b'),{vi:'Núm đặt nhiệt độ bàn là',en:'Iron temperature dial',min:60,max:200,step:5,val:120,unit:'°C',cb:v=>{S.Tset=v;}});
  const ss=mkSeg($('#sp4s'),()=>['×1','×10','×30'],1,k=>{S.sp=[1,10,30][k];});
  $('#b4flip').onclick=()=>{S.flip=!S.flip;readout();};
  $('#b4hot').onclick=()=>{S.Tt=100;sl.set(100);}; $('#b4ice').onclick=()=>{S.Tt=-10;sl.set(-10);}; $('#b4rt').onclick=()=>{S.Tt=20;sl.set(20);};
  $('#k4broken').onchange=e=>{S.broken=e.target.checked;};
  function rst(){ S.Tp=20;S.on=true;S.hist=[];S.tsim=0;S.hacc=0;S.switches=0; }
  $('#b4rst').onclick=rst;
  function hint(){
    $('#h4').textContent=S.mode===0?t('Chọn cặp kim loại, đổi nhiệt độ nguồn (hơ nóng hoặc chườm đá) và xem băng kép cong thế nào. Băng được vẽ dày hơn thực tế để dễ nhìn.','Choose a pair of metals, change the source temperature (heat or ice) and see how the strip bends. The strip is drawn thicker than in reality.'):
      t('Bàn là có đế nhôm được dây điện đốt (1000 W). Băng kép gắn vào đế; khi nóng đến mức đặt, nó cong đủ để tách tiếp điểm. Đặt núm nhiệt độ, chọn tốc độ thời gian và quan sát đồ thị.','An iron with an aluminium sole plate is heated by a 1000 W element. The strip is attached to the plate; at the set temperature it bends enough to separate the contacts. Set the dial, choose the time speed and watch the graph.');
    $('#as4').textContent=S.mode===0?t('Giả thiết: hai lớp cùng độ dày (tổng 1 mm), cùng mô-đun đàn hồi, dài 200 mm; công thức cong của Timoshenko; băng nhiệt độ đều. Mô hình đơn giản, chỉ dùng để vẽ; học sinh chỉ cần nhận ra chiều cong.','Assumptions: both layers equally thick (1 mm total), same elastic modulus, 200 mm long, uniform temperature; Timoshenko bending. A simple model used for drawing; students only need the bending direction.'):
      t('Giả thiết: đế bàn là C = 600 J/K, hao phí ra không khí 3 W/K, băng kép đồng thau–invar dài 60 mm cùng nhiệt độ với đế, công tắc ngắt khi nhiệt độ đạt mức đặt và nối lại khi thấp hơn 2 K.','Assumptions: sole plate C = 600 J/K, loss to air 3 W/K, a 60 mm brass–invar strip at the plate temperature, the switch opens at the dial value and closes again 2 K lower.');
  }
  function rect(c,x,y,w,h,col,r){ rr(c,x,y,w,h,r||3); c.fillStyle=col; c.fill(); c.strokeStyle='rgba(0,0,0,.45)'; c.lineWidth=1.2; c.stroke(); }
  function drawStrip(){
    const c=A.begin(); c.fillStyle=COL.lane; c.fillRect(0,0,640,380);
    const tp=top(),bt=bot(),k=kap(tp,bt,S.T),ax=110,ay=170,PX=1.8,hp=7;
    rect(c,60,ay-60,50,120,COL.metal2,4);
    c.setLineDash([6,4]); c.strokeStyle=COL.muted; c.lineWidth=1.2; c.beginPath(); c.moveTo(ax,ay); c.lineTo(ax+380,ay); c.stroke(); c.setLineDash([]);
    tx(c,t('vị trí thẳng ở 20 °C','straight position at 20 °C'),ax+380,ay-8,{size:12,color:COL.muted,align:'right'});
    function P(s,off){ const th=Math.abs(k)<1e-10?0:k*s, x=Math.abs(k)<1e-10?s:Math.sin(th)/k, y=Math.abs(k)<1e-10?0:(1-Math.cos(th))/k;
      return [ax+(x+(-Math.sin(th))*off/PX)*PX, ay+(y+Math.cos(th)*off/PX)*PX]; }
    function layer(o0,o1,col){ c.beginPath(); for(let i=0;i<=40;i++){ const p=P(i*5,o0); i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]); } for(let i=40;i>=0;i--){ const p=P(i*5,o1); c.lineTo(p[0],p[1]); } c.closePath(); c.fillStyle=col; c.fill(); c.strokeStyle='rgba(0,0,0,.5)'; c.lineWidth=1.2; c.stroke(); }
    layer(-hp,0,COL[tp.col]); layer(0,hp,COL[bt.col]);
    const e=P(200,0); const tipmm=(e[1]-ay)/PX;
    tx(c,t(tp.vi,tp.en)+' (α = '+tp.a+')',ax+14,ay-18,{size:14,w:700,color:COL[tp.col]});
    tx(c,t(bt.vi,bt.en)+' (α = '+bt.a+')',ax+14,ay+hp+22,{size:14,w:700,color:COL[bt.col]});
    // nguồn nhiệt / đá
    if(S.Tt>40){ for(let k2=0;k2<4;k2++){ const fx=ax+80+k2*60, fl=Math.sin(S.ph*9+k2)*3; c.beginPath(); c.moveTo(fx-12,350); c.quadraticCurveTo(fx-14,325+fl,fx,300+fl); c.quadraticCurveTo(fx+14,325-fl,fx+12,350); c.fillStyle='#ff8a1e'; c.globalAlpha=clamp((S.Tt-40)/80,.3,1); c.fill(); c.globalAlpha=1; } }
    else if(S.Tt<5){ for(let k2=0;k2<5;k2++){ c.fillStyle='#e6f4ffcc'; rr(c,ax+60+k2*55,320+(k2%2)*8,34,30,5); c.fill(); c.strokeStyle='#7fb6e0'; c.stroke(); } }
    tx(c,nf(S.T,0)+' °C',ax+380,350,{size:20,w:700,mono:true,align:'right',color:S.T>60?COL.warn:(S.T<5?COL.accent:COL.ink)});
    return {k,tipmm,tp,bt};
  }
  function drawIron(){
    const c=A.begin(); c.fillStyle=COL.lane; c.fillRect(0,0,640,380);
    const T=S.Tp, g=clamp((T-80)/300,0,1);
    // đế
    rr(c,90,300,440,34,6); c.fillStyle='rgb('+Math.round(lerp(139,230,g))+','+Math.round(lerp(150,80,g))+','+Math.round(lerp(163,50,g))+')'; c.fill(); c.strokeStyle='rgba(0,0,0,.5)'; c.lineWidth=1.5; c.stroke();
    tx(c,t('Đế bàn là (nhôm)','Sole plate (aluminium)'),310,322,{size:13,w:700,color:'#fff',align:'center'});
    // dây đốt
    c.strokeStyle=S.on?'#ff4020':COL.muted; c.lineWidth=S.on?3:2; c.beginPath(); for(let i=0;i<=18;i++){ const x=130+i*20, y=346+(i%2?8:-8); i?c.lineTo(x,y):c.moveTo(x,y);} c.stroke();
    tx(c,t('dây đốt 1000 W','1000 W heating element'),310,372,{size:12.5,color:COL.muted,align:'center'});
    // băng kép (đồng thau trên, invar dưới)
    const dpm=0.060, gmm=(S.Tset-20)*dpm, dfree=S.broken?0:dpm*(T-20), PX=4, ax=170, ay=220;
    const closed=S.on;
    const tipy=S.broken?0:Math.max(dfree,gmm); // vị trí đầu băng (mm xuống)
    const k=S.broken?0:(2*tipy)/(60*60); // 1/mm (xấp xỉ)
    function P(s,off){ const th=k*s, x=Math.abs(k)<1e-10?s:Math.sin(th)/k, y=Math.abs(k)<1e-10?0:(1-Math.cos(th))/k; return [ax+(x-Math.sin(th)*off/PX)*PX, ay+(y+Math.cos(th)*off/PX)*PX]; }
    function layer(o0,o1,col){ c.beginPath(); for(let i=0;i<=30;i++){ const p=P(i*2,o0); i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]); } for(let i=30;i>=0;i--){ const p=P(i*2,o1); c.lineTo(p[0],p[1]); } c.closePath(); c.fillStyle=col; c.fill(); c.strokeStyle='rgba(0,0,0,.5)'; c.lineWidth=1.2; c.stroke(); }
    rect(c,128,ay-30,42,60,COL.metal2,4);
    if(S.broken) { rect(c,ax,ay-2.5,240,5,COL.metal2,2); } else { layer(-1.6,0,COL.gold); layer(0,1.6,COL.c3); }
    const e=P(60,0);
    // vít chỉnh (tiếp điểm cố định) ở trên đầu băng
    const sx=ax+240, sy=ay+gmm*PX-4;
    rect(c,sx-4,ay-90,8,sy-(ay-90),COL.metal,2);
    rect(c,sx-14,sy-6,28,8,closed?COL.ok:COL.warn,2);
    rect(c,sx-18,ay-96,36,10,COL.metal2,3);
    tx(c,t('núm chỉnh','dial screw'),sx,ay-102,{size:12.5,color:COL.muted,align:'center'});
    tx(c,closed?t('tiếp điểm ĐÓNG','contact CLOSED'):t('tiếp điểm MỞ','contact OPEN'),sx+36,ay-30,{size:14,w:700,color:closed?COL.ok:COL.warn});
    tx(c,t('băng kép đồng thau–invar','brass–invar strip'),ax+10,ay-36,{size:13,color:COL.muted});
    // đèn báo
    c.beginPath(); c.arc(560,240,14,0,Math.PI*2); c.fillStyle=S.on?'#ff9f1a':'#555'; c.fill(); c.strokeStyle='rgba(0,0,0,.5)'; c.lineWidth=2; c.stroke();
    tx(c,t('đèn báo','lamp'),560,272,{size:12.5,color:COL.muted,align:'center'});
    tx(c,nf(T,0)+' °C',560,200,{size:24,w:700,mono:true,align:'center',color:T>200?COL.warn:COL.ink});
    if(S.broken&&T>250) tx(c,t('QUÁ NHIỆT!','OVERHEATING!'),310,80,{size:28,w:800,color:COL.warn,align:'center'});
  }
  function drawGraph0(info){
    const g=B.begin(); g.fillStyle=COL.lane; g.fillRect(0,0,640,260);

  const SUBS=[{vi:'Nước',en:'Water',c:4180,rho:1000,liq:1,col:'#4aa3e0'},{vi:'Dầu ăn',en:'Cooking oil',c:2000,rho:920,liq:1,col:'#e2b53a'},{vi:'Nhôm',en:'Aluminium',c:880,rho:2700,liq:0,col:'#a8bacd'},{vi:'Đồng',en:'Copper',c:385,rho:8960,liq:0,col:'#d9803a'}];
  const A=mkCanvas($('#cv6a'),640,350), G=mkCanvas($('#cv6b'),640,280);
  const S={a:{sub:0,m:0.5,T:20,h:[]},b:{sub:2,m:0.5,T:20,h:[]},P:50,E:0,t:0,run:false,sp:60,ins:false,rows:[],stopped:false,acc:0,ha:0};
  mkSeg($('#sa6'),()=>SUBS.map(s=>t(s.vi,s.en)),0,k=>{S.a.sub=k;rst();});
  mkSeg($('#sb6'),()=>SUBS.map(s=>t(s.vi,s.en)),2,k=>{S.b.sub=k;rst();});
  mkSlider($('#sl6a'),{vi:'Khối lượng A',en:'Mass of A',min:0.1,max:1,step:0.1,val:0.5,dec:1,unit:'kg',cb:v=>{S.a.m=v;rst();}});
  mkSlider($('#sl6b'),{vi:'Khối lượng B',en:'Mass of B',min:0.1,max:1,step:0.1,val:0.5,dec:1,unit:'kg',cb:v=>{S.b.m=v;rst();}});
  mkSlider($('#sl6p'),{vi:'Công suất dây đốt P',en:'Heater power P',min:12,max:50,step:2,val:50,unit:'W',cb:v=>{S.P=v;rst();}});
  mkSeg($('#sp6'),()=>['×1','×10','×60','×300'],2,k=>{S.sp=[1,10,60,300][k];});
  $('#k6ins').onchange=e=>{S.ins=e.target.checked;rst();};
  function rst(){ S.a.T=20;S.b.T=20;S.a.h=[];S.b.h=[];S.E=0;S.t=0;S.run=false;S.stopped=false;S.rows=[];S.ha=0; label(); readout(); }
  function label(){ $('#b6go').textContent=S.run?t('Tạm dừng','Pause'):t('Bắt đầu','Start'); }
  $('#b6go').onclick=()=>{ if(S.stopped) return; S.run=!S.run; label(); };
  $('#b6rst').onclick=rst;
  $('#b6rec').onclick=()=>{ if(S.t<=0) return; S.rows.push({t:S.t,E:S.E,Ta:S.a.T,Tb:S.b.T}); if(S.rows.length>=3) unlock('6'); readout(); };
  const k=()=>S.ins?0.08:0.8;
  function step(dt){
    [S.a,S.b].forEach(o=>{ const s=SUBS[o.sub]; o.T+=(S.P-k()*(o.T-20))/(o.m*s.c)*dt; });
    S.E+=S.P*dt; S.t+=dt;
  }
  function sample(c,o,cx,name){
    const s=SUBS[o.sub], base=300, T=o.T;
    if(s.liq){
      const V=o.m/s.rho*1000, h=24+V*72; // lít -> px
      rr(c,cx-62,base-124,124,124,6); c.fillStyle='rgba(255,255,255,.18)'; c.fill();
      c.fillStyle=s.col; c.globalAlpha=.8; c.fillRect(cx-60,base-h,120,h-2); c.globalAlpha=1;
      c.strokeStyle=COL.ink; c.lineWidth=2.5; c.beginPath(); c.moveTo(cx-62,base-124); c.lineTo(cx-62,base); c.lineTo(cx+62,base); c.lineTo(cx+62,base-124); c.stroke();
    } else {
      const side=Math.cbrt(o.m/s.rho)*100*13; // cm -> px
      rr(c,cx-side/2,base-side,side,side,5); c.fillStyle=s.col; c.fill(); c.strokeStyle='rgba(0,0,0,.5)'; c.lineWidth=2; c.stroke();
      c.fillStyle='rgba(0,0,0,.35)'; c.fillRect(cx-side*0.3,base-side,5,side*0.45); c.fillRect(cx+side*0.15,base-side,5,side*0.45);
    }
    const hot=clamp((T-20)/75,0,1);
    // dây đốt (đỏ) và nhiệt kế
    c.strokeStyle='rgb('+Math.round(lerp(120,255,hot))+','+Math.round(lerp(120,50,hot))+',40)'; c.lineWidth=5; c.beginPath(); c.moveTo(cx-24,base-140); c.lineTo(cx-24,base-30); c.stroke();
    c.strokeStyle=COL.ink; c.lineWidth=3; c.beginPath(); c.moveTo(cx+24,base-146); c.lineTo(cx+24,base-24); c.stroke();
    c.fillStyle='#d6362f'; c.fillRect(cx+22,base-24-clamp((T-10)/90,0,1)*96,4,clamp((T-10)/90,0,1)*96);
    if(S.ins){ c.setLineDash([6,4]); c.strokeStyle=COL.muted; c.lineWidth=5; c.strokeRect(cx-76,base-138,152,142); c.setLineDash([]); }
    tx(c,name+': '+t(s.vi,s.en)+' '+nf(o.m,1)+' kg',cx,334,{size:15,w:700,align:'center'});
    tx(c,nf(T,1)+' °C',cx,base-158,{size:22,w:700,mono:true,align:'center',color:T>60?COL.warn:COL.ink});
  }
  function drawScene(){
    const c=A.begin(); c.fillStyle=COL.lane; c.fillRect(0,0,640,350); c.fillStyle=COL.line; c.fillRect(0,301,640,6);
    // joulemeter
    rr(c,245,22,150,100,10); c.fillStyle=COL.space; c.fill(); c.strokeStyle=COL.metal; c.lineWidth=2.5; c.stroke();
    tx(c,'JOULEMETER',320,40,{size:12,w:700,color:COL.star,align:'center'});
    tx(c,nf(S.E,0)+' J',320,78,{size:28,w:700,mono:true,align:'center',color:'#7dffa1'});
    tx(c,'P = '+nf(S.P,0)+' W · t = '+nf(S.t,0)+' s',320,104,{size:13,mono:true,align:'center',color:COL.star});
    c.strokeStyle=S.run?'#ff4020':COL.muted; c.lineWidth=3; c.beginPath(); c.moveTo(290,122); c.bezierCurveTo(290,170,150,120,142,160); c.moveTo(350,122); c.bezierCurveTo(350,170,490,120,498,160); c.stroke();
    sample(c,S.a,150,'A'); sample(c,S.b,490,'B');
  }
  function drawGraph(){
    const g=G.begin(); g.fillStyle=COL.lane; g.fillRect(0,0,640,280);
    const xm=Math.max(10,Math.ceil(S.E/1000*1.25/5)*5), Tm=Math.max(40,Math.ceil(Math.max(S.a.T,S.b.T)*1.1/10)*10);
    const ax=axes(g,{x:64,y:30,w:540,h:196},[0,xm,xm/5],[20,Tm,(Tm-20)/4],t('E (kJ)','E (kJ)'),t('T (°C)','T (°C)'),0,0);
    [[S.a,COL.laneA,'A'],[S.b,COL.laneB,'B']].forEach(([o,col,nm])=>{
      g.strokeStyle=col; g.lineWidth=3; g.beginPath(); o.h.forEach((p,i)=>{ const x=ax.X(p[0]/1000),y=ax.Y(p[1]); i?g.lineTo(x,y):g.moveTo(x,y); }); g.stroke();
      g.beginPath(); g.arc(ax.X(S.E/1000),ax.Y(o.T),6,0,Math.PI*2); g.fillStyle=col; g.fill(); g.strokeStyle=COL.ink; g.lineWidth=1.5; g.stroke();
      tx(g,nm+' = '+t(SUBS[o.sub].vi,SUBS[o.sub].en),84,50+(nm==='A'?0:20),{size:13,w:700,color:col});
    });
    S.rows.forEach(r=>{ [[r.Ta,COL.laneA],[r.Tb,COL.laneB]].forEach(([T,col])=>{ g.beginPath(); g.rect(ax.X(r.E/1000)-4,ax.Y(T)-4,8,8); g.fillStyle=col; g.fill(); g.strokeStyle=COL.ink; g.lineWidth=1.5; g.stroke(); }); });
  }
  function readout(){
    const qa=S.a.m*SUBS[S.a.sub].c*(S.a.T-20), qb=S.b.m*SUBS[S.b.sub].c*(S.b.T-20);
    kv($('#o6'),[['Số chỉ joulemeter E','Joulemeter reading E',nf(S.E,0)+' J'],['Thời gian','Time',nf(S.t,0)+' s'],['Nhiệt độ A','Temperature A',nf(S.a.T,1)+' °C (+'+nf(S.a.T-20,1)+')'],['Nhiệt độ B','Temperature B',nf(S.b.T,1)+' °C (+'+nf(S.b.T-20,1)+')']]);
    $('#tb6').innerHTML='<tr><th>#</th><th>t (s)</th><th>E (J)</th><th>T A (°C)</th><th>T B (°C)</th></tr>'+(S.rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+nf(r.t,0)+'</td><td>'+nf(r.E,0)+'</td><td>'+nf(r.Ta,1)+'</td><td>'+nf(r.Tb,1)+'</td></tr>').join('')||'<tr><td colspan="5" class="t">'+t('Chưa ghi lần nào.','Nothing recorded yet.')+'</td></tr>');
    const fq=(q)=>nf(q,0);
    $('#tb6x').innerHTML='<tr><th></th><th>E (J)</th><th>Q = m·c·Δt (J)</th><th>'+t('hao phí (J)','lost (J)')+'</th></tr>'+
      [['A',qa],['B',qb]].map(x=>'<tr><td class="t">'+x[0]+'</td><td>'+fq(S.E)+'</td><td>'+fq(x[1])+'</td><td>'+fq(S.E-x[1])+'</td></tr>').join('');
    $('#st6').textContent=S.stopped?t('Đã dừng vì một vật đạt 95 °C. Bấm “Đặt lại” để làm lại.','Stopped because a sample reached 95 °C. Press “Reset” to start again.'):
      (S.t<=0?t('Bấm “Bắt đầu” để đun.','Press “Start” to heat.'):(S.E<2000?t('Quan sát: E tăng thì nhiệt độ hai vật tăng, nhưng không như nhau.','Notice: as E grows both temperatures rise, but not equally.'):t('Ghi vài số liệu rồi so sánh độ tăng nhiệt độ của A và B với cùng E.','Record a few readings and compare the temperature rise of A and B for the same E.')));
  }
  label(); readout();
  return {refresh(){label();readout();},
    frame(dt){
      if(S.run&&!S.stopped){
        let rem=dt*S.sp; while(rem>1e-9){ const st=Math.min(rem,1); rem-=st; step(st); S.ha+=st;
          if(S.ha>=Math.max(1,S.sp/6)||S.a.h.length===0){ S.ha=0; S.a.h.push([S.E,S.a.T]); S.b.h.push([S.E,S.b.T]); if(S.a.h.length>2500){S.a.h.shift();S.b.h.shift();} }
          if(S.a.T>=95||S.b.T>=95){ S.run=false; S.stopped=true; label(); break; } }
      }
      drawScene(); drawGraph(); if((S.acc+=dt)>0.15){S.acc=0;readout();}
    }};
})();

/* ============ Khởi động ============ */
applyLang();
showTab(1);
requestAnimationFrame(t0=>{ last=t0; loop(t0); });
</script>
</body>
