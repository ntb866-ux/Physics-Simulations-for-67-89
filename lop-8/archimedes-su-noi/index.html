<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Archimedes và sự nổi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Phòng thí nghiệm khối lượng riêng, lực đẩy Archimedes và sự nổi (KHTN 8).
   Cùng hệ màu, phông, bố cục với bộ mô phỏng KHTN (Lực hấp dẫn lớp 6): dải video trên cùng, sân khấu canvas bên trái, sổ ghi chép bên phải.
   Mất mạng vẫn chạy: phông rơi về phông hệ thống, video đọc từ thư mục media/. */
:root{
  --bg:#edf0f3; --panel:#ffffff; --lane:#f4f6f9; --ink:#141c26; --muted:#556170; --line:#c9d1db;
  --accent:#1d5fa8; --accent-ink:#ffffff; --ok:#1d8a4b; --warn:#c2410c;
  --force:#d1323b; --vel:#1f6fd1; --mass:#7a3fc2; --spring:#5d6b7a; --spring2:#e07b00;
  --earth:#2f78c4; --land:#4f9a5b; --moon:#a9adb3; --space:#0d1626; --star:#e9eef7;
  --gold:#c99a2e; --metal:#8b96a3; --metal2:#5b6673; --wood:#b07a45;
  --laneA:#0f7c8a; --laneB:#d0661c; --c3:#7a3fc2; --c4:#1d8a4b; --c5:#b8326a;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --panel:#161e28; --lane:#111821; --ink:#e3e9f0; --muted:#97a3b2; --line:#2a3644;
  --accent:#5ea6ec; --accent-ink:#04182c; --ok:#47c47d; --warn:#f08a4b;
  --force:#ff5f67; --vel:#5aa2ff; --mass:#b28cff; --spring:#9aa8b8; --spring2:#ffa630;
  --earth:#3b86d4; --land:#4c8a55; --moon:#8d9197; --space:#060a12; --star:#cfd8e6;
  --gold:#e0b24a; --metal:#7c8794; --metal2:#a9b4c1; --wood:#9a6a3c;
  --laneA:#3cc3d2; --laneB:#ff9a4d; --c3:#b28cff; --c4:#47c47d; --c5:#f06aa2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --panel:#161e28; --lane:#111821; --ink:#e3e9f0; --muted:#97a3b2; --line:#2a3644;
  --accent:#5ea6ec; --accent-ink:#04182c; --ok:#47c47d; --warn:#f08a4b;
  --force:#ff5f67; --vel:#5aa2ff; --mass:#b28cff; --spring:#9aa8b8; --spring2:#ffa630;
  --earth:#3b86d4; --land:#4c8a55; --moon:#8d9197; --space:#060a12; --star:#cfd8e6;
  --gold:#e0b24a; --metal:#7c8794; --metal2:#a9b4c1; --wood:#9a6a3c;
  --laneA:#3cc3d2; --laneB:#ff9a4d; --c3:#b28cff; --c4:#47c47d; --c5:#f06aa2;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(25px,3.4vw,36px);line-height:1.15;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:700}
.btn{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg .btn{border:0;border-radius:0;min-width:52px}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.places .btn{font-size:14px;padding:6px 8px;line-height:1.25}
.places .btn small{display:block;font-family:var(--font-num);font-size:12px;font-weight:500;opacity:.8}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-size:15px;font-weight:600;white-space:nowrap;min-height:46px;padding:8px 14px;border:0;border-bottom:3px solid transparent;
  background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.req{margin:0;font-size:14px;color:var(--muted);max-width:110ch}
.req b{color:var(--ink);font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:1020px){.lab{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0}
canvas{display:block;width:100%;border-radius:8px;background:var(--lane);touch-action:pan-y;user-select:none;-webkit-user-select:none}
canvas.drag{touch-action:none}
.hint{margin:0;font-size:14px;color:var(--muted)}
.status{margin:0;font-weight:600;min-height:1.5em}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:6px;vertical-align:middle}
.sl{display:flex;flex-direction:column;gap:4px}
.sl .top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.sl .val{font-family:var(--font-num);font-weight:600;text-align:right}
.sl .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);margin:0}
select{font:inherit;font-size:15px;min-height:44px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.bigfig{font-family:var(--font-num);font-size:clamp(22px,2.6vw,30px);font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.cmp{font-size:15px;background:var(--lane);border-radius:8px;padding:8px 12px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts .btn{text-align:left;font-size:14px}
.opts .btn.picked{border:2px solid var(--accent)}
.opts .btn.right{background:color-mix(in srgb,var(--ok) 18%,var(--panel));border-color:var(--ok)}
.ans{background:var(--lane);border-left:4px solid var(--ok);padding:8px 12px;border-radius:6px;font-size:15px}
.muted{color:var(--muted);font-size:14px}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:0 14px}
details[open]{padding-bottom:12px}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;font-size:15px}
details p,details ul{margin:6px 0;font-size:15px;max-width:95ch}
details ul{padding-left:20px}
.fine{font-size:13px;color:var(--muted);margin:0}
.two4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.two4{grid-template-columns:1fr}}
.tblwrap{overflow-x:auto}
table.log{border-collapse:collapse;width:100%;font-size:14px}
table.log th,table.log td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.log th:first-child,table.log td:first-child{text-align:left}
table.log td{font-family:var(--font-num);font-variant-numeric:tabular-nums}
table.log th{color:var(--muted);font-weight:600}
.kv dd.t,table.log td.t{font-family:var(--font-ui)}
/* Dải video thực tế: ảnh thu nhỏ + "Để ý gì khi xem"; phát tại chỗ khi có media/ hoặc khi trang chạy trên web */
.vids{display:flex;flex-direction:column;gap:10px;background:var(--space);color:var(--star);border-radius:var(--r);padding:12px 14px}
.vids details{border:0;background:none;padding:0;color:inherit}
.vids details[open]{padding:0}
.vids summary.vhead{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;min-height:44px;cursor:pointer;list-style:none;margin:0}
.vids summary.vhead::-webkit-details-marker{display:none}
.vids summary.vhead b::before{content:"▸ "}.vids details[open] summary.vhead b::before{content:"▾ "}
.vids .vbody{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.vhead b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.vhead span{font-size:13px;opacity:.75;font-weight:400}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.vcard{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:start}
.thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#1f3150,#0b1220);
  border:1px solid color-mix(in srgb,var(--star) 25%,transparent);padding:0;cursor:pointer;width:100%;color:var(--star);font:inherit}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb .pl{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:var(--force);box-shadow:0 2px 10px rgba(0,0,0,.45)}
.thumb .pl::before{content:"";position:absolute;left:17px;top:13px;border-style:solid;border-width:10px 0 10px 16px;border-color:transparent transparent transparent #fff}
.thumb .tag{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.7);color:#fff;padding:1px 7px;border-radius:4px}
.vtx{display:flex;flex-direction:column;gap:2px;min-width:0}
.vtx .ttl{font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.vtx .ch{font-size:12px;opacity:.75}
.vtx .look{font-size:14px;opacity:.95}
.vtx .flag{font-size:12px;color:#ffd27a}
.vtx a{color:var(--star);font-size:13px;font-weight:600}
.vplayer{position:relative;background:#000;border-radius:8px;overflow:hidden}
.vplayer video,.vplayer iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.vplayer .vmsg{padding:14px 56px 14px 14px;font-size:15px;color:#fff}
.vplayer .vmsg a{color:#9fd0ff}
.vplayer .vclose{position:absolute;right:6px;top:6px;z-index:2;min-height:40px;background:rgba(255,255,255,.92);color:#000}
@media (max-width:440px){.vlist{grid-template-columns:1fr}.vcard{grid-template-columns:118px minmax(0,1fr)}.thumb .pl{width:34px;height:34px}.thumb .pl::before{left:13px;top:9px;border-width:8px 0 8px 12px}.thumb .tag{font-size:10px;padding:0 5px}}
.place2{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.place2 .btn{font-size:14px;padding:6px 8px;line-height:1.25;text-align:left}
.place2 .btn small{display:block;font-family:var(--font-num);font-size:12px;font-weight:500;opacity:.8}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab h3{display:flex;align-items:center;gap:8px}
.ab h3 i{display:inline-block;width:14px;height:14px;border-radius:3px}
@media (max-width:480px){.ab{grid-template-columns:1fr}}
table.cmp3{border-collapse:collapse;width:100%;font-size:15px}
table.cmp3 th,table.cmp3 td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right}
table.cmp3 th:first-child,table.cmp3 td:first-child{text-align:left;color:var(--muted);font-weight:500;font-family:var(--font-ui)}
table.cmp3 td{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.verdict{font-weight:700;font-size:16px;border-radius:8px;padding:8px 12px;background:var(--lane)}
.verdict.float{border-left:5px solid var(--ok)} .verdict.sink{border-left:5px solid var(--force)} .verdict.hover{border-left:5px solid var(--warn)}
/* Chế độ giáo viên: che số liệu để lớp dự đoán */
body.hideNums .num{filter:blur(7px);user-select:none}
body.hideNums .num:hover{filter:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="hbtns">
      <div class="seg" id="gSeg" title="g"></div>
      <button class="btn" id="gvBtn" aria-pressed="false" data-i18n="gvBtn"></button>
      <button class="btn" id="langBtn">EN</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="1" data-i18n="tab1"></button>
    <button role="tab" data-tab="2" data-i18n="tab2"></button>
    <button role="tab" data-tab="3" data-i18n="tab3"></button>
    <button role="tab" data-tab="4" data-i18n="tab4"></button>
    <button role="tab" data-tab="5" data-i18n="tab5"></button>
    <button role="tab" data-tab="6" data-i18n="tab6"></button>
  </nav>

  <!-- ===================== TAB 1: KHỐI LƯỢNG RIÊNG ===================== -->
  <section id="t1" class="col">
    <p class="req" data-i18n-html="req1"></p>
    <div class="vids" id="v1"></div>
    <div class="lab">
      <div class="stage">
        <div class="seg" id="m1Seg"></div>
        <p class="hint" id="hint1"></p>
        <canvas id="cv1" class="drag" aria-label="density lab"></canvas>
        <p class="status" id="st1"></p>
        <p class="fine" data-i18n="assume1"></p>
      </div>
      <div class="col">
        <div class="card">
          <div id="c1box" class="col">
            <label for="mat1"><h2 data-i18n="matT"></h2></label>
            <select id="mat1"></select>
            <div class="sl"><div class="top"><span data-i18n="sideA"></span><span class="val" id="a1V"></span></div><input type="range" id="a1" min="1" max="10" step="0.5" value="4"></div>
            <div class="sl"><div class="top"><span data-i18n="sideB"></span><span class="val" id="b1V"></span></div><input type="range" id="b1" min="1" max="10" step="0.5" value="3"></div>
            <div class="sl"><div class="top"><span data-i18n="sideC"></span><span class="val" id="c1V"></span></div><input type="range" id="c1" min="1" max="10" step="0.5" value="2"></div>
          </div>
          <div id="c1irr" class="col" hidden>
            <label for="obj1"><h2 data-i18n="objT"></h2></label>
            <select id="obj1"></select>
            <button class="btn" id="out1" data-i18n="takeOut"></button>
          </div>
          <div id="c1liq" class="col" hidden>
            <label for="liq1"><h2 data-i18n="liqT"></h2></label>
            <select id="liq1"></select>
            <div class="sl"><div class="top"><span data-i18n="pourV"></span><span class="val" id="vl1V"></span></div><input type="range" id="vl1" min="0" max="200" step="5" value="100"></div>
            <button class="btn" id="tare1" aria-pressed="false" data-i18n="tare"></button>
          </div>
        </div>
        <div class="card">
          <h2 data-i18n="obs"></h2>
          <dl class="kv">
            <dt data-i18n="o1m"></dt><dd class="num" id="o1m"></dd>
            <dt data-i18n="o1V"></dt><dd class="num" id="o1V"></dd>
          </dl>
          <div><div class="muted" data-i18n="o1D"></div><div class="bigfig num" id="o1D"></div></div>
          <p class="cmp num" id="o1f"></p>
          <div class="controls"><button class="btn primary" id="rec1" data-i18n="rec"></button><button class="btn" id="clr1" data-i18n="clr"></button></div>
        </div>
        <div class="card" id="p1"></div>
        <div class="card" id="p1b"></div>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="tbl1T"></h2>
      <div class="two4">
        <div class="tblwrap"><table class="log" id="tb1"></table></div>
        <canvas id="g1" aria-label="m-V graph"></canvas>
      </div>
      <p class="fine" data-i18n="g1note"></p>
    </div>
    <details><summary data-i18n="unitT"></summary><div data-i18n-html="unit1"></div></details>
    <details open><summary data-i18n="mechT"></summary><div data-i18n-html="mech1"></div></details>
    <details><summary data-i18n="simpleT"></summary><div data-i18n-html="simple1"></div></details>
    <details><summary data-i18n="wordT"></summary><div data-i18n-html="word1"></div></details>
  </section>

  <!-- ===================== TAB 2: LỰC ĐẨY ARCHIMEDES ===================== -->
  <section id="t2" class="col" hidden>
    <p class="req" data-i18n-html="req2"></p>
    <div class="vids" id="v2"></div>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint2"></p>
        <canvas id="cv2" class="drag" aria-label="spring balance and overflow can"></canvas>
        <p class="status" id="st2"></p>
        <div class="legend">
          <span><i style="background:var(--force)"></i><span data-i18n="lgP"></span></span>
          <span><i style="background:var(--vel)"></i><span data-i18n="lgFA"></span></span>
          <span><i style="background:var(--c3)"></i><span data-i18n="lgPress"></span></span>
        </div>
        <p class="fine" data-i18n="assume2"></p>
      </div>
      <div class="col">
        <div class="card">
          <label for="mat2"><h2 data-i18n="matT"></h2></label>
          <select id="mat2"></select>
          <div class="sl"><div class="top"><span data-i18n="volT"></span><span class="val" id="V2V"></span></div><input type="range" id="V2" min="20" max="250" step="10" value="100"></div>
          <label for="liq2"><span data-i18n="liqT"></span></label>
          <select id="liq2"></select>
          <label class="chk"><input type="checkbox" id="pr2"><span data-i18n="showPress"></span></label>
          <button class="btn" id="rst2" data-i18n="refill"></button>
        </div>
        <div class="card">
          <h2 data-i18n="obs"></h2>
          <dl class="kv">
            <dt data-i18n="o2P"></dt><dd class="num" id="o2P"></dd>
            <dt data-i18n="o2F"></dt><dd class="num" id="o2F"></dd>
            <dt data-i18n="o2Vs"></dt><dd class="num" id="o2Vs"></dd>
            <dt data-i18n="o2Vc"></dt><dd class="num" id="o2Vc"></dd>
            <dt data-i18n="o2Pc"></dt><dd class="num" id="o2Pc"></dd>
          </dl>
          <div><div class="muted" data-i18n="o2FA"></div><div class="bigfig num" id="o2FA"></div></div>
          <p class="cmp num" id="o2f"></p>
          <div class="controls"><button class="btn primary" id="rec2" data-i18n="rec"></button><button class="btn" id="clr2" data-i18n="clr"></button></div>
        </div>
        <div class="card" id="p2"></div>
        <div class="card" id="p2b"></div>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="tbl2T"></h2>
      <div class="two4">
        <div class="tblwrap"><table class="log" id="tb2"></table></div>
        <canvas id="g2" aria-label="buoyant force vs depth"></canvas>
      </div>
    </div>

th1:['Vật / chất','m (g)','V (cm³)','D (g/cm³)','D (kg/m³)'],gx1:'V (cm³)',gy1:'m (g)',
unit1:'<ul><li>Đơn vị SI: <b>kilôgam trên mét khối (kg/m³)</b>.</li><li>Thường dùng: <b>g/cm³</b>, <b>g/mL</b>, <b>kg/L</b>, <b>tấn/m³</b>. Bốn đơn vị này bằng nhau: 1 g/cm³ = 1 g/mL = 1 kg/L = 1 t/m³ = <b>1000 kg/m³</b>.</li><li>Một số chất (kg/m³): gỗ thông ≈ 500–600; nước đá 917; dầu ăn ≈ 920; nước 1000; nước biển ≈ 1025; nhôm 2700; sắt 7800; đồng 8900; chì 11 300; thuỷ ngân 13 534; vàng 19 300.</li><li>Trọng lượng riêng d = P/V = g·D (N/m³), nên d ≈ 10·D. Ví dụ nước: d ≈ 10 000 N/m³.</li></ul>',
mech1:'<p><b>Khối lượng riêng</b> D = m/V là khối lượng của một đơn vị thể tích chất. Nó phụ thuộc khối lượng mỗi hạt (nguyên tử, phân tử) và các hạt xếp sít đến đâu, nên là <b>đặc trưng của chất</b>, không phụ thuộc vật to hay nhỏ. Cùng một chất thì m tỉ lệ thuận với V: đồ thị m–V là đường thẳng qua gốc, độ dốc chính là D.</p><p><b>Đo thể tích vật bất kì bằng cách cho vật chiếm chỗ nước:</b> vật chìm hoàn toàn chiếm chỗ một lượng nước đúng bằng thể tích của nó, nên V = V₂ − V₁ (hoặc bằng lượng nước tràn ra khỏi bình tràn). Cách này chỉ đúng khi vật không thấm nước và chìm hẳn. Vật nổi phải dùng kim ấn chìm, vật xốp phải bọc kín.</p><p><b>Chất lỏng:</b> phải trừ khối lượng cốc (trừ bì), nếu không D đo được sẽ lớn hơn giá trị thật. Đọc ống đong ngang tầm mắt, ở đáy mặt khum.</p><p>D thay đổi nhẹ theo nhiệt độ: nước 1000 kg/m³ ở 4 °C, 998 kg/m³ ở 20 °C.</p>',
simple1:'<p>Khối lượng riêng cho biết chất đó “đặc” đến mức nào. Một khối nhỏ cỡ hạt xúc xắc (1 cm³) bằng sắt nặng 7,8 g, cùng cỡ đó bằng gỗ chỉ nặng khoảng 0,6 g.</p><p>Cắt đôi miếng sắt thì khối lượng giảm một nửa, thể tích cũng giảm một nửa, nên khối lượng riêng <b>không đổi</b>.</p><p><b>Hay hiểu sai:</b> “Vật nặng hơn thì có khối lượng riêng lớn hơn.” Sai: khúc gỗ 10 kg vẫn có khối lượng riêng nhỏ hơn chiếc đinh sắt 5 g. Nặng hay nhẹ là chuyện <b>khối lượng</b>, đặc hay xốp là chuyện <b>khối lượng riêng</b>.</p>',
word1:'<ul><li>Tiếng Anh <b>density</b> ← Latinh <i>densitas</i>, từ <i>densus</i> “dày, đặc, chen chúc”. Pháp <i>masse volumique</i> (“khối lượng theo thể tích”), Đức <i>Dichte</i> (“độ đặc”).</li><li>Trung, Nhật: <b>密度</b> (mìdù / mitsudo), Hán Việt “mật độ”: 密 mật = dày, kín; 度 độ = mức.</li><li>Tiếng Việt dùng “khối lượng riêng”: “riêng” nghĩa là đặc trưng riêng của từng chất.</li><li>Kí hiệu: SGK Việt Nam dùng <b>D</b> (chữ đầu của density); sách quốc tế dùng <b>ρ</b> (rho, chữ cái Hy Lạp).</li></ul>',
p1q:'Cắt khối nhôm làm đôi. Khối lượng riêng của mỗi nửa so với cả khối thế nào?',p1a:'Nhỏ bằng một nửa',p1b:'Không đổi',p1c:'Lớn gấp đôi',

mech2:'<p><b>Nguồn gốc lực đẩy là áp suất chất lỏng.</b> Áp suất tăng theo độ sâu: p = d·h (= ρgh). Mặt dưới của vật ở sâu hơn mặt trên nên bị nước ép mạnh hơn. Lực ép lên các mặt bên cùng độ sâu thì cân bằng nhau. Hợp lực còn lại hướng thẳng đứng lên trên:</p><p style="text-align:center"><b>F<sub>A</sub> = (p<sub>dưới</sub> − p<sub>trên</sub>)·S = d·h<sub>vật</sub>·S = d·V</b></p><p>Khi vật đã chìm hẳn, đưa sâu thêm thì p<sub>trên</sub> và p<sub>dưới</sub> cùng tăng một lượng như nhau, hiệu không đổi, nên F<sub>A</sub> không đổi. Bật “Hiện lực ép của nước” để thấy điều này.</p><p><b>Lập luận “khối nước thay thế”:</b> thay vật bằng một khối nước có cùng hình dạng. Khối nước này đứng yên, nên nước xung quanh phải đẩy nó lên bằng đúng trọng lượng của nó. Nước xung quanh không “biết” bên trong là nước hay sắt, nên lực đẩy lên vật cũng bằng trọng lượng của phần nước bị vật chiếm chỗ.</p><p><b>Định luật Archimedes:</b> Một vật nhúng vào chất lỏng bị chất lỏng đẩy thẳng đứng từ dưới lên với lực có độ lớn bằng trọng lượng của phần chất lỏng mà vật chiếm chỗ. F<sub>A</sub> = d·V, trong đó d là trọng lượng riêng của chất lỏng (N/m³), V là thể tích phần chất lỏng bị vật chiếm chỗ (m³). Đo bằng lực kế: F<sub>A</sub> = P − F.</p>',
simple2:'<p>Nước ở dưới sâu ép mạnh hơn nước ở gần mặt. Mặt dưới của vật bị đẩy lên mạnh hơn mặt trên bị ép xuống, nên còn dư một lực đẩy lên. Vật chiếm chỗ càng nhiều nước thì lực đẩy càng lớn, và lực đẩy đúng bằng trọng lượng phần nước bị vật chiếm chỗ, chính là lượng nước tràn sang cốc hứng.</p><p><b>Hay hiểu sai:</b> “Vật càng ở sâu thì lực đẩy càng lớn.” Chỉ đúng khi vật đang chìm dần. Khi đã chìm hẳn, đồ thị nằm ngang: lực đẩy không đổi.</p><p><b>Hay hiểu sai:</b> “Vật trong nước nhẹ đi, khối lượng giảm.” Khối lượng không đổi. Lực kế chỉ ít hơn vì nước đỡ bớt một phần.</p>',
word2:'<ul><li><b>Archimedes</b> (Ἀρχιμήδης, khoảng 287–212 TCN, thành Syracuse): ἀρχι- “đứng đầu” + μῆδος “mưu trí, suy tính”. Sách tiếng Việt cũ phiên theo tiếng Pháp <i>Archimède</i> thành “Ác-si-mét” (Acsimet).</li><li>Chuyện “<b>Eureka!</b>” (εὕρηκα, “tôi tìm ra rồi”) và chiếc vương miện do Vitruvius kể lại khoảng 200 năm sau. Galileo (<i>La Bilancetta</i>, 1586) cho rằng Archimedes nhiều khả năng đã dùng cân trong nước, tức là đo chính lực đẩy, chứ không đo nước tràn. Định luật được viết trong sách “Về các vật nổi” (Περὶ τῶν ὀχουμένων).</li><li><b>Lực đẩy:</b> Anh <i>buoyancy</i> (từ <i>buoy</i> “cái phao”, gốc Hà Lan cổ <i>boeie</i>, có lẽ từ Latinh <i>boia</i> “dây xích” vì phao được xích neo) hoặc <i>upthrust</i>; Pháp <i>poussée d’Archimède</i>; Đức <i>Auftrieb</i> (“đẩy lên”); Trung, Nhật <b>浮力</b> “phù lực”, nghĩa là lực làm nổi (浮 phù = nổi).</li></ul>',
p2q:'Nhúng dần vật vào nước. Số chỉ lực kế sẽ thế nào?',p2a:'Tăng',p2b:'Giảm',p2c:'Không đổi',
p2e:'Nước đẩy vật lên, lực kế chỉ còn phải giữ phần còn lại: F = P − F_A. Phần chìm càng nhiều thì F_A càng lớn, F càng nhỏ.',
p2bq:'Vật đã chìm hẳn. Kéo vật sâu thêm thì lực đẩy F_A sẽ thế nào?',p2ba:'Tăng',p2bb:'Không đổi',p2bc:'Giảm',
p2be:'Thể tích nước bị chiếm chỗ không đổi, nên F_A không đổi. Áp suất ở mặt trên và mặt dưới cùng tăng, hiệu giữa chúng giữ nguyên. Xem đoạn nằm ngang trên đồ thị.',

mech3:'<p>Trong công thức F<sub>A</sub> = d·V chỉ có hai đại lượng: <b>trọng lượng riêng của chất lỏng</b> d và <b>thể tích phần chìm</b> V. Không có khối lượng của vật, chất làm vật, hình dạng hay độ sâu (khi vật đã chìm hẳn).</p><ul><li><b>Cùng thể tích, khác chất</b> (sắt và nhôm 100 cm³): F<sub>A</sub> bằng nhau, khoảng 0,98 N. Vật sắt chỉ “nhẹ đi” 13% trọng lượng, vật nhôm “nhẹ đi” 37%, nên dễ tưởng nhầm là lực đẩy khác nhau.</li><li><b>Cùng khối lượng, khác chất</b> (780 g): nhôm có thể tích 289 cm³, gấp 2,9 lần sắt, nên lực đẩy lên nhôm lớn gấp 2,9 lần.</li><li><b>Cùng vật, khác chất lỏng:</b> F<sub>A</sub> tỉ lệ với d. Trong nước muối đặc lớn hơn trong nước 20%, trong dầu ăn nhỏ hơn 8%.</li><li><b>Cùng vật, khác độ sâu:</b> khi đã chìm hẳn thì F<sub>A</sub> như nhau.</li></ul>',
simple3:'<p>Nước chỉ “để ý” vật chiếm chỗ bao nhiêu nước, không để ý vật làm bằng gì hay nặng bao nhiêu.</p><p><b>Hay hiểu sai:</b> “Vật nặng hơn thì bị nước đẩy mạnh hơn” và “Ở sâu hơn thì bị đẩy mạnh hơn.” Bấm hai nút mẫu đầu tiên và nút cuối cùng để kiểm tra.</p>',

mech4:'<p>Vật thả trong chất lỏng chịu hai lực: trọng lực P hướng xuống và lực đẩy F<sub>A</sub> hướng lên. Xét lúc vật chìm hoàn toàn:</p><ul><li><b>P &gt; F<sub>A</sub></b>: vật chìm xuống đáy.</li><li><b>P = F<sub>A</sub></b>: vật lơ lửng trong chất lỏng.</li><li><b>P &lt; F<sub>A</sub></b>: vật nổi lên. Khi nổi trên mặt, phần chìm giảm dần tới lúc F<sub>A</sub> = P thì đứng yên.</li></ul><p>Vì P = d<sub>vật</sub>·V và F<sub>A</sub> = d<sub>lỏng</sub>·V (cùng V), ta so sánh được ngay khối lượng riêng: <b>D<sub>vật</sub> &gt; D<sub>lỏng</sub> thì chìm, bằng thì lơ lửng, nhỏ hơn thì nổi.</b> Khi nổi yên, V<sub>chìm</sub>/V = D<sub>vật</sub>/D<sub>lỏng</sub>: nước đá 917 kg/m³ chìm 92% trong nước ngọt, 89% trong nước biển.</p><p>Vật rỗng hoặc ghép từ nhiều chất (trứng, quả táo có khe khí, tàu, người) thì dùng <b>khối lượng riêng trung bình</b> = m/V. Hoà muối làm D của nước tăng nên trứng nổi lên. Sắt (7800) nổi trên thuỷ ngân (13 534).</p>',
simple4:'<p>Thử tưởng tượng một “khối nước” to đúng bằng vật. Vật <b>nặng hơn</b> khối nước đó thì chìm, <b>nhẹ hơn</b> thì nổi.</p><p>Khúc gỗ 8 kg: khối nước cùng cỡ nặng 13 kg, gỗ nhẹ hơn nên nổi. Bi sắt 30 g: khối nước cùng cỡ chỉ nặng 3,8 g, bi nặng hơn nên chìm.</p><p><b>Hay hiểu sai:</b> “Vật nặng thì chìm, vật nhẹ thì nổi.” Bấm nút “Gỗ 8 kg và bi sắt 30 g”: vật nặng gấp 270 lần lại nổi. Cái quyết định là khối lượng riêng so với chất lỏng.</p>',
word4:'<ul><li>Hán Việt: <b>浮 phù</b> = nổi, <b>沈 trầm</b> = chìm (“phù trầm” là nổi chìm, “thăng trầm” là lên xuống); “lơ lửng” là từ thuần Việt.</li><li>Anh <i>float</i> (tiếng Anh cổ <i>flotian</i>), <i>sink</i> (<i>sincan</i>); vật lơ lửng gọi là <i>neutrally buoyant</i> (“nổi trung hoà”). Pháp <i>flotter</i> / <i>couler</i>; Latinh <i>fluitare</i> “trôi nổi”.</li></ul>',
p4q:'Thả khúc gỗ 8 kg và viên bi sắt 30 g vào nước. Điều gì xảy ra?',p4a:'Gỗ chìm vì nặng, bi nổi vì nhẹ',p4b:'Gỗ nổi, bi sắt chìm',p4c:'Cả hai đều chìm',
p4e:'Gỗ có D ≈ 600 kg/m³, nhỏ hơn nước nên nổi. Sắt có D = 7800 kg/m³, lớn hơn nước nên chìm. Khối lượng không quyết định.',
p4bq:'Quả trứng chìm trong nước ngọt. Làm thế nào để trứng nổi lên?',p4ba:'Đổ thêm nước vào cốc',p4bb:'Hoà thêm muối vào nước',p4bc:'Thả trứng thật nhẹ tay',
p4be:'Muối làm D của nước tăng. Khoảng 11% muối thì D ≈ 1080 kg/m³, bằng D của trứng: trứng lơ lửng. Nhiều muối hơn thì trứng nổi. Thử chọn “Nước muối tự pha”.',

mech5:'<p>Đất nặn (hay thép) đặc có D lớn hơn nước nên chìm. Dàn mỏng thành đĩa đặc vẫn chìm, vì thể tích chiếm chỗ vẫn chỉ là 37,5 cm³ đất nặn.</p><p>Khi nặn thành <b>thuyền rỗng</b>, phần thuyền nằm dưới mặt nước gồm cả <b>khoảng không khí trong lòng thuyền</b>. Thể tích chiếm chỗ tối đa bây giờ là thể tích bao ngoài của thân thuyền, lớn hơn nhiều lần thể tích đất nặn. Khối lượng riêng trung bình của “đất nặn + không khí + hàng” nhỏ hơn D của nước nên thuyền nổi.</p><p>Thêm hàng thì thuyền chìm sâu dần (mớn nước tăng) để F<sub>A</sub> tăng theo P. Khi mớn nước vượt chiều cao thành, nước tràn vào chiếm chỗ không khí, D trung bình tăng vọt và thuyền chìm. Tàu thật có <b>vạch Plimsoll</b> sơn trên thân để báo mớn nước tối đa (khác nhau cho nước ngọt, nước biển, mùa hè, mùa đông).</p><p>Ví dụ gần đúng: một tàu chở hàng vỏ thép có khối lượng cả tàu lẫn hàng 50 000 tấn, phần thân dưới boong có thể tích khoảng 120 000 m³, nên D trung bình chỉ khoảng 420 kg/m³.</p>',
simple5:'<p>Cục đất nặn vo tròn chỉ chiếm chỗ một ít nước, nên lực đẩy nhỏ hơn trọng lượng và nó chìm. Nặn thành thuyền thì vẫn chừng ấy đất nhưng “ôm” thêm cả không khí, nên chiếm chỗ được nhiều nước hơn hẳn. Lực đẩy đủ lớn để đỡ cả thuyền lẫn hàng.</p><p><b>Hay hiểu sai:</b> “Tàu thép nổi được vì thép trên tàu nhẹ” hoặc “vì nước biển đẩy mạnh vật to”. Thép vẫn là thép. Tàu nổi vì cả con tàu rỗng có khối lượng riêng trung bình nhỏ hơn nước.</p>',

p5e:'Đĩa vẫn đặc: thể tích chiếm chỗ vẫn là 37,5 cm³, F_A vẫn nhỏ hơn P. Cần tạo khoang rỗng chứa không khí thì mới nổi.',
p5bq:'Con tàu vỏ thép nặng 50 000 tấn nổi được trên biển là vì…',p5ba:'Thép làm tàu đã được làm nhẹ đi',p5bb:'Vỏ tàu rỗng chứa không khí, nên thể tích chiếm chỗ trong nước rất lớn',p5bc:'Nước biển đẩy mạnh các vật to',
p5be:'Thể tích phần vỏ tàu dưới nước rất lớn, nên trọng lượng nước bị chiếm chỗ (F_A) bằng được trọng lượng cả con tàu. D trung bình của tàu nhỏ hơn nước biển.',

mech6:'<p><b>Tàu ngầm.</b> Thể tích vỏ không đổi nên khi đã lặn hẳn, F<sub>A</sub> = d·V không đổi. Tàu thay đổi <b>trọng lượng</b> bằng két dằn: mở van cho nước biển tràn vào thì P &gt; F<sub>A</sub>, tàu lặn; dùng khí nén đẩy nước ra thì P &lt; F<sub>A</sub>, tàu nổi lên; chỉnh cho P = F<sub>A</sub> thì tàu lơ lửng ở một độ sâu. (Tàu thật còn dùng két cân bằng nhỏ và bánh lái ngang.)</p><p><b>Khinh khí cầu.</b> Không khí cũng là chất lưu nên cũng có lực đẩy Archimedes: F<sub>A</sub> bằng trọng lượng không khí bị chiếm chỗ, với 2800 m³ là khoảng 3,4 tấn! Đốt nóng làm khí bên trong nở ra, một phần thoát qua miệng, nên khí nóng còn lại nhẹ hơn. Khi tổng trọng lượng (vỏ, giỏ, người, khí nóng) nhỏ hơn F<sub>A</sub> thì khí cầu bay lên. Càng lên cao không khí càng loãng, F<sub>A</sub> giảm, nên khí cầu dừng ở độ cao cân bằng.</p><p><b>Tỉ trọng kế.</b> Vật nổi luôn có F<sub>A</sub> = P không đổi, nên d<sub>lỏng</sub>·V<sub>chìm</sub> = P. Chất lỏng có D nhỏ thì V<sub>chìm</sub> lớn: tỉ trọng kế chìm sâu hơn. Vì V<sub>chìm</sub> tỉ lệ nghịch với D, vạch chia trên thân <b>không đều</b>: số lớn ở dưới, các vạch sít dần về phía dưới. Dùng để đo nồng độ cồn, độ mặn, độ sạc của ắc quy, kiểm tra sữa có pha nước không.</p>',
simple6:'<p>Tàu ngầm “uống” nước vào bụng để nặng thêm và lặn xuống, “nhả” nước ra để nhẹ đi và nổi lên. Khinh khí cầu chứa khí nóng nhẹ hơn không khí xung quanh nên được không khí đẩy lên, giống quả bóng gỗ được nước đẩy lên. Tỉ trọng kế càng chìm sâu thì chất lỏng càng nhẹ.</p><p><b>Hay hiểu sai:</b> “Khinh khí cầu bay lên vì lửa thổi lên.” Lửa chỉ làm nóng khí. Lực nâng là lực đẩy Archimedes của không khí.</p>',
word6:'<ul><li><b>Tàu ngầm</b>: Hán 潛水艇 “tiềm thuỷ đĩnh” (潛 tiềm = lặn, ẩn). Anh <i>submarine</i> ← Latinh <i>sub</i> “dưới” + <i>marinus</i> “thuộc về biển”.</li><li><b>Khinh khí cầu</b> 輕氣球: quả cầu (球) chứa khí (氣) nhẹ (輕). Trong Hán Việt cũ, “khinh khí” còn là tên khí hiđrô (khí nhẹ nhất); khí cầu của Jacques Charles năm 1783 bơm hiđrô, còn khí cầu của anh em Montgolfier cùng năm dùng khí nóng (tiếng Pháp <i>montgolfière</i>). Anh <i>balloon</i> ← Ý <i>pallone</i> “quả bóng lớn”.</li><li><b>Tỉ trọng kế</b> 比重計: dụng cụ đo (計 kế) tỉ trọng (比重), tức khối lượng riêng so với nước. Anh <i>hydrometer</i> ← Hy Lạp ὕδωρ <i>hydōr</i> “nước” + μέτρον <i>metron</i> “thước đo”. Dụng cụ này đã được mô tả trong thư của Synesius gửi nhà toán học Hypatia (khoảng năm 400).</li></ul>',
p6q:'Tàu ngầm đang nổi muốn lặn xuống thì phải làm gì?',p6a:'Bơm nước biển vào két dằn',p6b:'Bơm nước ra khỏi két dằn',p6c:'Chạy chân vịt nhanh hơn',
p6e:'Nước vào két làm P tăng, còn F_A (phụ thuộc thể tích vỏ) không đổi. Khi P > F_A thì tàu chìm xuống.',
p6bq:'Thả cùng một tỉ trọng kế vào nhiều chất lỏng. Nó chìm sâu nhất trong chất lỏng nào?',p6ba:'Chất lỏng có khối lượng riêng lớn nhất',p6bb:'Chất lỏng có khối lượng riêng nhỏ nhất',p6bc:'Chìm sâu như nhau',
p6be:'Tỉ trọng kế nổi trong mọi chất lỏng nên F_A = P không đổi. d nhỏ thì cần V chìm lớn mới đủ lực đẩy, nên nó chìm sâu hơn.'

unit1:'<ul><li>SI unit: <b>kilogram per cubic metre (kg/m³)</b>.</li><li>Also common: <b>g/cm³</b>, <b>g/mL</b>, <b>kg/L</b>, <b>t/m³</b>. These four are equal: 1 g/cm³ = 1 g/mL = 1 kg/L = 1 t/m³ = <b>1000 kg/m³</b>.</li><li>Some values (kg/m³): pine ≈ 500–600; ice 917; cooking oil ≈ 920; water 1000; sea water ≈ 1025; aluminium 2700; iron 7800; copper 8900; lead 11 300; mercury 13 534; gold 19 300.</li><li>Specific weight d = W/V = g·ρ (N/m³), so d ≈ 10·ρ. Water: d ≈ 10 000 N/m³.</li></ul>',
mech1:'<p><b>Density</b> ρ = m/V is the mass of one unit of volume of a substance. It depends on the mass of each particle (atom, molecule) and how tightly the particles are packed, so it is <b>a property of the substance</b>, not of the size of the object. For one substance m is proportional to V: the m–V graph is a straight line through the origin whose slope is ρ.</p><p><b>Volume of an irregular object by displacement:</b> a fully submerged object pushes aside exactly its own volume of water, so V = V₂ − V₁ (or the water that overflows from a eureka can). This only works if the object does not soak up water and is fully under water. Push floating objects under with a pin; wrap porous ones.</p><p><b>Liquids:</b> subtract the mass of the cup (tare), otherwise the density comes out too high. Read the cylinder at eye level, at the bottom of the meniscus.</p><p>ρ changes slightly with temperature: water is 1000 kg/m³ at 4 °C and 998 kg/m³ at 20 °C.</p>',
simple1:'<p>Density tells you how “tightly packed” a substance is. A dice-sized cube (1 cm³) of iron has a mass of 7.8 g; the same cube of wood only about 0.6 g.</p><p>Cut a piece of iron in half: the mass halves and the volume halves, so the density <b>stays the same</b>.</p><p><b>Misconception:</b> “Heavier objects have greater density.” No: a 10 kg log still has a smaller density than a 5 g iron nail. Heavy or light is about <b>mass</b>; dense or loose is about <b>density</b>.</p>',
word1:'<ul><li><b>Density</b> ← Latin <i>densitas</i>, from <i>densus</i> “thick, crowded”. French <i>masse volumique</i> (“mass per volume”), German <i>Dichte</i> (“thickness”).</li><li>Chinese/Japanese <b>密度</b> (mìdù / mitsudo; Sino-Vietnamese “mật độ”): 密 = dense, close; 度 = degree.</li><li>Vietnamese says “khối lượng riêng”, literally “own mass”: the mass that is characteristic of each substance.</li><li>Symbol: Vietnamese textbooks use <b>D</b>; international books use <b>ρ</b> (Greek rho).</li></ul>',

mech2:'<p><b>The buoyant force comes from liquid pressure.</b> Pressure increases with depth: p = d·h (= ρgh). The bottom face is deeper than the top face, so water pushes harder on it. Forces on the sides at the same depth cancel. What remains points straight up:</p><p style="text-align:center"><b>F<sub>B</sub> = (p<sub>bottom</sub> − p<sub>top</sub>)·A = d·h<sub>object</sub>·A = d·V</b></p><p>Once fully submerged, going deeper raises p<sub>top</sub> and p<sub>bottom</sub> by the same amount, so the difference, and F<sub>B</sub>, stay the same. Tick “Show the water pressure forces” to see it.</p><p><b>The “water replacement” argument:</b> replace the object by a lump of water of the same shape. That water stays still, so the surrounding water must push it up with exactly its weight. The surrounding water cannot “tell” whether water or iron is inside, so it pushes the object up with the weight of the water it displaces.</p><p><b>Archimedes’ principle:</b> an object immersed in a liquid is pushed vertically upward with a force equal to the weight of the liquid it displaces. F<sub>B</sub> = d·V, where d is the specific weight of the liquid (N/m³) and V the volume of liquid displaced (m³). With a spring balance: F<sub>B</sub> = W − F.</p>',
simple2:'<p>Deep water squeezes harder than water near the top. The bottom of the object is pushed up harder than the top is pushed down, so there is an upward push left over. The more water the object pushes aside, the bigger the push, and the push equals the weight of the water pushed aside: exactly the water that runs into the catch cup.</p><p><b>Misconception:</b> “The deeper it goes, the bigger the buoyant force.” Only while it is going under. Once fully submerged the graph is flat.</p><p><b>Misconception:</b> “Things lose mass in water.” Mass does not change. The balance reads less because the water holds up part of the weight.</p>',
word2:'<ul><li><b>Archimedes</b> (Ἀρχιμήδης, c. 287–212 BC, Syracuse): ἀρχι- “chief” + μῆδος “cunning, counsel”. Older Vietnamese books followed the French <i>Archimède</i>: “Ác-si-mét”.</li><li>The “<b>Eureka!</b>” story (εὕρηκα, “I have found it”) about the crown was told by Vitruvius some 200 years later. Galileo (<i>La Bilancetta</i>, 1586) argued Archimedes more likely weighed the crown in water, i.e. measured the buoyant force, rather than the overflow. The principle is in his book <i>On Floating Bodies</i> (Περὶ τῶν ὀχουμένων).</li><li><b>Buoyancy</b> comes from <i>buoy</i> (Middle Dutch <i>boeie</i>, perhaps from Latin <i>boia</i> “chain”, because buoys are chained down); British books also say <i>upthrust</i>. French <i>poussée d’Archimède</i>; German <i>Auftrieb</i> (“upward drive”); Chinese/Japanese <b>浮力</b> “floating force” (浮 = float).</li></ul>',
p2q:'You lower an object into water bit by bit. What happens to the spring balance reading?',p2a:'It increases',p2b:'It decreases',p2c:'It stays the same',
p2e:'The water pushes up, so the balance only has to hold the rest: F = W − F_B. More under water means bigger F_B and smaller F.',
p2bq:'The object is fully submerged. If you push it deeper, the buoyant force…',p2ba:'increases',p2bb:'stays the same',p2bc:'decreases',
p2be:'The displaced volume does not change, so F_B does not change. Pressure on the top and bottom both rise; the difference stays the same. See the flat part of the graph.',

mech3:'<p>The formula F<sub>B</sub> = d·V contains only two quantities: <b>the specific weight of the liquid</b> d and <b>the submerged volume</b> V. Not the object’s mass, material, shape, or depth (once fully submerged).</p><ul><li><b>Same volume, different material</b> (iron and aluminium, 100 cm³): equal F<sub>B</sub>, about 0.98 N. The iron “loses” only 13% of its weight, the aluminium 37%, which is why people think the forces differ.</li><li><b>Same mass, different material</b> (780 g): the aluminium is 289 cm³, 2.9 times the iron, so its buoyant force is 2.9 times larger.</li><li><b>Same object, different liquid:</b> F<sub>B</sub> is proportional to d: 20% larger in strong brine than in water, 8% smaller in oil.</li><li><b>Same object, different depth:</b> once fully submerged, F<sub>B</sub> is the same.</li></ul>',
simple3:'<p>The water only “cares” how much water the object pushes aside, not what it is made of or how heavy it is.</p><p><b>Misconceptions:</b> “Heavier objects are pushed up harder” and “deeper objects are pushed up harder.” Use the first and last comparison buttons to test them.</p>',

mech4:'<p>An object in a liquid feels two forces: its weight W downward and the buoyant force F<sub>B</sub> upward. Consider the object fully submerged:</p><ul><li><b>W &gt; F<sub>B</sub></b>: it sinks to the bottom.</li><li><b>W = F<sub>B</sub></b>: it hovers in the liquid.</li><li><b>W &lt; F<sub>B</sub></b>: it rises. At the surface the submerged part shrinks until F<sub>B</sub> = W.</li></ul><p>Since W = d<sub>object</sub>·V and F<sub>B</sub> = d<sub>liquid</sub>·V (same V), we can compare densities directly: <b>object denser than the liquid sinks, equal hovers, less dense floats.</b> Floating at rest, V<sub>sub</sub>/V = ρ<sub>object</sub>/ρ<sub>liquid</sub>: ice (917 kg/m³) is 92% submerged in fresh water, 89% in sea water.</p><p>For hollow or composite objects (eggs, apples with air pockets, ships, people) use the <b>average density</b> m/V. Dissolving salt raises the water’s density, so an egg floats. Iron (7800) floats on mercury (13 534).</p>',
simple4:'<p>Imagine a lump of water exactly the size of the object. If the object is <b>heavier</b> than that water, it sinks; if <b>lighter</b>, it floats.</p><p>8 kg log: the same size of water is 13 kg, the log is lighter, so it floats. 30 g iron ball: the same size of water is only 3.8 g, the ball is heavier, so it sinks.</p><p><b>Misconception:</b> “Heavy things sink, light things float.” Press “8 kg log and 30 g iron ball”: the object 270 times heavier floats. What decides is density compared with the liquid.</p>',
word4:'<ul><li>Sino-Vietnamese <b>浮 phù</b> = float, <b>沈 trầm</b> = sink (“phù trầm” = floating and sinking; “thăng trầm” = ups and downs); “lơ lửng” (hover) is native Vietnamese.</li><li>English <i>float</i> (Old English <i>flotian</i>), <i>sink</i> (<i>sincan</i>); a hovering object is <i>neutrally buoyant</i>. French <i>flotter</i> / <i>couler</i>; Latin <i>fluitare</i> “to float about”.</li></ul>',

mech5:'<p>Solid plasticine (or steel) is denser than water, so it sinks. Flattened into a solid disc it still sinks: it still displaces only 37.5 cm³.</p><p>Shaped into a <b>hollow boat</b>, the part below the waterline includes <b>the air inside the hull</b>. The largest displaced volume is now the outside volume of the hull, many times the volume of plasticine. The average density of “plasticine + air + cargo” is less than water’s, so the boat floats.</p><p>Adding cargo makes the boat sit lower (the draught increases) so that F<sub>B</sub> grows with W. When the draught exceeds the wall height, water pours in, replaces the air, the average density jumps and the boat sinks. Real ships carry a <b>Plimsoll line</b> showing the maximum safe draught (different for fresh water, sea water, summer and winter).</p><p>Rough example: a steel cargo ship with a total mass of 50 000 t and about 120 000 m³ of hull below deck has an average density of only about 420 kg/m³.</p>',
simple5:'<p>A ball of plasticine pushes aside only a little water, so the push is smaller than its weight and it sinks. A boat made of the same plasticine also “holds” air, so it pushes aside much more water. The push is big enough to hold up the boat and its cargo.</p><p><b>Misconception:</b> “Steel ships float because the steel is light” or “because sea water pushes big things harder”. Steel is still steel. A ship floats because the whole hollow ship has an average density less than water.</p>',

mech6:'<p><b>Submarine.</b> The hull volume is fixed, so once submerged F<sub>B</sub> = d·V is constant. The submarine changes its <b>weight</b> with ballast tanks: flooding them with sea water makes W &gt; F<sub>B</sub> and it dives; blowing the water out with compressed air makes W &lt; F<sub>B</sub> and it rises; trimming to W = F<sub>B</sub> lets it hover at a depth. (Real submarines also use small trim tanks and hydroplanes.)</p><p><b>Hot-air balloon.</b> Air is a fluid, so it gives a buoyant force too: F<sub>B</sub> equals the weight of the air displaced, about 3.4 tonnes for 2800 m³! Heating makes the air inside expand and some escapes from the mouth, so the remaining hot air is lighter. When the total weight (envelope, basket, people, hot air) is less than F<sub>B</sub>, the balloon rises. Higher up the air is thinner, F<sub>B</sub> falls, and the balloon settles at an equilibrium altitude.</p><p><b>Hydrometer.</b> A floating object always has F<sub>B</sub> = W, so d<sub>liquid</sub>·V<sub>sub</sub> = W. In a less dense liquid V<sub>sub</sub> is larger: the hydrometer sinks deeper. Because V<sub>sub</sub> is inversely proportional to ρ, the scale is <b>not evenly spaced</b>: larger numbers at the bottom, marks closer together towards the bottom. Used to measure alcohol content, saltiness, battery charge, or whether milk has been watered down.</p>',
simple6:'<p>A submarine “drinks” water to get heavier and dive, and “spits” it out to get lighter and rise. A hot-air balloon is full of hot air that is lighter than the air around it, so the air pushes it up, just as water pushes up a wooden ball. The deeper a hydrometer sinks, the lighter the liquid.</p><p><b>Misconception:</b> “A hot-air balloon rises because the flame blows it up.” The flame only heats the air. The lift is the buoyant force of the surrounding air.</p>',
word6:'<ul><li><b>Submarine</b> ← Latin <i>sub</i> “under” + <i>marinus</i> “of the sea”. Chinese 潛水艇 (“diving water boat”; 潛 = dive, hide).</li><li><b>Hot-air balloon</b>: <i>balloon</i> ← Italian <i>pallone</i> “large ball”. Vietnamese “khinh khí cầu” 輕氣球 = ball (球) of light (輕) gas (氣); in old Sino-Vietnamese “khinh khí” also meant hydrogen. Jacques Charles’s 1783 balloon used hydrogen; the Montgolfier brothers’ balloon of the same year used hot air (French <i>montgolfière</i>).</li><li><b>Hydrometer</b> ← Greek ὕδωρ <i>hydōr</i> “water” + μέτρον <i>metron</i> “measure”. Vietnamese “tỉ trọng kế” 比重計 = meter (計) of relative density (比重). It is described in a letter from Synesius to the mathematician Hypatia (c. AD 400).</li></ul>',

let C={};
function readColors(){const cs=getComputedStyle(document.documentElement);
  ['bg','panel','lane','ink','muted','line','accent','ok','warn','force','vel','mass','c3','c4','c5','laneA','laneB','metal','metal2','wood','gold','space','star','land']

function hexA(hex,a){const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

/* ================= Vẽ chung ================= */
function size(cv,ratio,maxH,minH=160){
  const w=cv.clientWidth||300; let h=Math.round(w*ratio); if(maxH)h=Math.min(h,maxH); h=Math.max(h,minH);
  if(cv._h!==h){cv.style.height=h+'px';cv._h=h;}
  const d=window.devicePixelRatio||1,W=Math.round(w*d),H=Math.round(h*d);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);return {ctx,w,h};
}
function txt(ctx,s,x,y,col,sz=14,wt=600,al='left',bl='middle',font=FONT){ctx.fillStyle=col;ctx.font=`${wt} ${sz}px ${font}`;ctx.textAlign=al;ctx.textBaseline=bl;ctx.fillText(s,x,y);}
function pill(ctx,s,x,y,col,sz=13,al='center',bg){ctx.font=`700 ${sz}px ${FONT}`;const tw=ctx.measureText(s).width;let x0=al==='center'?x-tw/2:al==='right'?x-tw:x;
  ctx.fillStyle=bg||C.panel;ctx.globalAlpha=.9;ctx.beginPath();ctx.roundRect(x0-5,y-sz*.75,tw+10,sz*1.5,5);ctx.fill();ctx.globalAlpha=1;txt(ctx,s,x0,y,col,sz,700,'left');}
function arrow(ctx,x1,y1,x2,y2,col,lw=4){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<2)return;const ux=dx/L,uy=dy/L,hl=Math.min(14,L*.7),hw=hl*.55;
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-ux*hl*.8,y2-uy*hl*.8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-ux*hl-uy*hw,y2-uy*hl+ux*hw);ctx.lineTo(x2-ux*hl+uy*hw,y2-uy*hl-ux*hw);ctx.closePath();ctx.fill();
}
function niceStep(range,n=5){const r=range/n,p=10**Math.floor(Math.log10(r)),m=r/p;return (m<1.5?1:m<3?2:m<7?5:10)*p;}
function graph(cv,series,o){
  const {ctx,w,h}=size(cv,R(.62,.62),260,180);
  const L=54,Rr=14,Tt=14,B=38,pw=w-L-Rr,ph=h-Tt-B;
  const x0=o.x0||0,x1=o.x1,y0=o.y0||0,y1=o.y1;
  const X=x=>L+(x-x0)/(x1-x0)*pw,Y=y=>Tt+ph-(y-y0)/(y1-y0)*ph;
  ctx.strokeStyle=C.line;ctx.lineWidth=1;
  const sx=niceStep(x1-x0,4),sy=niceStep(y1-y0,4),dx=sx<1?(sx<.1?2:1):0,dy=sy<1?(sy<.1?2:1):0;

/* Lực kế lò xo: thân ống, vạch chia 0…Fmax, kim đỏ. Trả về toạ độ móc. */
function drawBalance(ctx,x,top,len,F,Fmax,label){
  const bw=Math.max(22,len*.16);
  ctx.fillStyle=C.panel;ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x-bw/2,top,bw,len,6);ctx.fill();ctx.stroke();
  const y0=top+10,y1=top+len-12,step=niceStep(Fmax,5);
  for(let f=0;f<=Fmax+1e-9;f+=step/2){const y=y0+(f/Fmax)*(y1-y0),major=Math.abs(f/step-Math.round(f/step))<1e-6;
    ctx.strokeStyle=C.muted;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-bw/2+3,y);ctx.lineTo(x-bw/2+(major?11:7),y);ctx.stroke();
    if(major&&len>110)txt(ctx,nf(f,step<1?1:0),x+bw/2-3,y,C.muted,10,600,'right');}
  const yp=y0+clamp(F/Fmax,0,1.04)*(y1-y0);
  ctx.fillStyle=C.force;ctx.beginPath();ctx.moveTo(x-bw/2-6,yp);ctx.lineTo(x-bw/2+12,yp-4);ctx.lineTo(x-bw/2+12,yp+4);ctx.closePath();ctx.fill();
  ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top-10);ctx.stroke();
  ctx.beginPath();ctx.arc(x,top-15,5,0,7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,top+len);ctx.lineTo(x,top+len+6);ctx.arc(x+3,top+len+9,3,Math.PI,Math.PI*.2,true);ctx.stroke();
  if(label)pill(ctx,label,x-bw/2-6,top+len*.5,C.force,12,'right');
  return top+len+12;
}

function solveLevel(W,Ac,A,hb,H){ // mực chất lỏng L trong bình tiết diện Ac khi có vật trụ tiết diện A, đáy ở độ cao hb (cm, cm², cm³)
  let L=W/Ac;if(L<=hb)return {L,s:0};
  L=(W-A*hb)/(Ac-A);if(L<=hb+H)return {L,s:L-hb};
  return {L:(W+A*H)/Ac,s:H};}

    const he=balEq();if(he!=null&&he<9000){const y=yg-Math.min(he,hmax)*ps;ctx.strokeStyle='#fff';ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(w*.25,y);ctx.lineTo(w-10,y);ctx.stroke();ctx.setLineDash([]);txt(ctx,T('k6heq'),w-12,y-9,'#fff',11,700,'right');}
    const s=S6.bal,f=balF(),cx=w*.58,bk=yg-Math.min(s.h,hmax)*ps,r=Math.min(36,w*.08),cy=bk-22-r*1.25,heat=(s.T-20)/100;
    ctx.strokeStyle='#5b3a1a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx-r*.45,cy+r*.95);ctx.lineTo(cx-7,bk-12);ctx.moveTo(cx+r*.45,cy+r*.95);ctx.lineTo(cx+7,bk-12);ctx.stroke();
    ctx.fillStyle='#8a5a2b';ctx.fillRect(cx-9,bk-12,18,12);
    if(heat>0){ctx.fillStyle=`rgba(255,${160-90*heat|0},0,.9)`;ctx.beginPath();ctx.moveTo(cx-4,bk-13);ctx.quadraticCurveTo(cx,bk-13-26*heat-4,cx+4,bk-13);ctx.fill();}
    const gr=ctx.createLinearGradient(cx-r,0,cx+r,0);gr.addColorStop(0,`hsl(${8+30*(1-heat)},80%,${48+8*heat}%)`);gr.addColorStop(1,`hsl(${40-20*heat},85%,45%)`);
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(cx,cy,r,Math.PI*.8,Math.PI*.2);ctx.lineTo(cx+r*.4,cy+r*1.05);ctx.lineTo(cx-r*.4,cy+r*1.05);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;[-.5,0,.5].forEach(q=>{ctx.beginPath();ctx.ellipse(cx,cy,Math.abs(q)*r||1,r,0,0,7);ctx.stroke();});
    const sc=55/f.FB;arrow(ctx,cx+r+14,cy,cx+r+14,cy-f.FB*sc,'#1f6fd1',4);arrow(ctx,cx+r+26,cy,cx+r+26,cy+f.W*sc,'#d1323b',4);
    pill(ctx,'F_A',cx+r+14,cy-f.FB*sc-10,C.vel,12);pill(ctx,'P',cx+r+26,cy+f.W*sc+10,C.force,12);}
  else{const ty=h-14,k=Math.min((ty-16)/HYD.jar,w*.06),cx=w*.42,jw=6*k,X=c=>cx+c*k,Y=c=>ty-c*k,s=S6.hyd,li=s.li>=0?H6[s.li]:{col:'#7fb2d6',a:.5},d=hydDep(s.rho);
    ctx.fillStyle=hexA(li.col,.55);ctx.fillRect(cx-jw/2,Y(HYD.Lw),jw,HYD.Lw*k);
    const yb=Y(s.y==null?hydTarget():s.y),bw=Math.max(1.8*k,16),sw=Math.max(.8*k,10),bh=HYD.hB*k,sl=HYD.Ls*k;
    ctx.fillStyle='rgba(230,240,248,.95)';ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(cx-bw/2,yb-bh,bw,bh,bw/2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#555';ctx.beginPath();ctx.roundRect(cx-bw/2+2,yb-bh*.35,bw-4,bh*.35-2,bw/2);ctx.fill();
    ctx.fillStyle='rgba(245,248,252,.97)';ctx.fillRect(cx-sw/2,yb-bh-sl,sw,sl);ctx.strokeRect(cx-sw/2,yb-bh-sl,sw,sl);
    for(let r=800;r<=1330;r+=10){const x=(HYD.m/(r/1000)-HYD.Vb)/HYD.As;if(x<0||x>HYD.Ls)continue;const y=yb-bh-x*k,maj=r%50===0;
      ctx.strokeStyle=C.ink;ctx.lineWidth=maj?1.4:.8;ctx.beginPath();ctx.moveTo(cx-sw/2,y);ctx.lineTo(cx-sw/2+(maj?sw*.8:sw*.4),y);ctx.stroke();if(r%100===0)txt(ctx,nf(r/1000,1),cx+sw/2+4,y,C.ink,11,700,'left','middle',MONO);}
    ctx.fillStyle=hexA(li.col,.35);ctx.fillRect(cx-jw/2,Y(HYD.Lw),jw,HYD.Lw*k);
    ctx.strokeStyle=hexA(li.col,1);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-jw/2,Y(HYD.Lw));ctx.lineTo(cx+jw/2,Y(HYD.Lw));ctx.stroke();
    ctx.strokeStyle=C.ink;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(cx-jw/2,Y(HYD.jar));ctx.lineTo(cx-jw/2,ty);ctx.lineTo(cx+jw/2,ty);ctx.lineTo(cx+jw/2,Y(HYD.jar));ctx.stroke();
    pill(ctx,d.st==='ok'?T('k6read')+': '+nf(s.rho/1000,2):'—',cx+jw/2+10,Y(HYD.Lw),C.vel,13,'left');
    if(d.st!=='low'){const my=yb-bh*.5;arrow(ctx,cx-bw/2-12,my,cx-bw/2-12,my+36,C.force,3);arrow(ctx,cx-bw/2-24,my,cx-bw/2-24,my-36,C.vel,3);
      txt(ctx,'P',cx-bw/2-12,my+46,C.force,12,700,'center');txt(ctx,'F_A',cx-bw/2-24,my-46,C.vel,12,700,'center');}}}

  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));

  $('langBtn').textContent=lang==='vi'?'EN':'VI';
  Object.keys(PRED).forEach(renderPred);[1,2,3,4,5,6].forEach(renderVids);
  fillSelect($('mat1'),MAT,S1.mat);fillSelect($('obj1'),IRR,S1.io);fillSelect($('liq1'),LIQ,S1.liq);fillSelect($('mat2'),MAT,S2.mat);fillSelect($('liq2'),LIQ,S2.liq);
  fillSelect($('matA'),MAT,R3[0].mat);fillSelect($('matB'),MAT,R3[1].mat);fillSelect($('liqA'),LIQ,R3[0].liq);fillSelect($('liqB'),LIQ,R3[1].liq);

  $('liq6').innerHTML=`<option value="-1">—</option>`+H6.map((x,i)=>`<option value="${i}">${T(x.k)} (${nf(x.rho/1000,3)} g/cm³)</option>`).join('');$('liq6').value=S6.hyd.li;
  $('pre3').innerHTML=PRE3.map((p,i)=>`<button class="btn" data-i="${i}">${T(p.k)}</button>`).join('');$('pre3').querySelectorAll('button').forEach(b=>b.onclick=()=>preset3(+b.dataset.i));
  gSeg();updAll();}
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi';applyLang();};

reset2();applyLang();
{const t=+store.get('arch-tab');setTab(t>=1&&t<=6?t:1);}
let last=performance.now(),uiT=0;
function loop(now){const dt=Math.min((now-last)/1000,.1);last=now;
  try{
    if(tab===1)renderT1();
    else if(tab===2)renderT2(dt);
    else if(tab===3)renderT3();
    else if(tab===4){let r=dt;while(r>1e-6){const hh=Math.min(r,1/240);step4(hh);r-=hh;}renderT4();uiT+=dt;if(uiT>.2){uiT=0;info4();}}
    else if(tab===5){step5(dt);renderT5();}
    else{step6(dt);renderT6();uiT+=dt;if(uiT>.15){uiT=0;info6();}}
  }catch(err){console.error(err);}
  requestAnimationFrame(loop);}
addEventListener('resize',()=>{renderTable1();graph2();});
requestAnimationFrame(loop);
