<title>Đòn bẩy và moment lực</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Xưởng đòn bẩy: sân khấu canvas bên trái, sổ ghi chép bên phải; tab 3 thêm cột Archimedes dẫn đường. Điện thoại xếp một cột. */
:root{
  --bg:#edf1ee; --panel:#ffffff; --lane:#f4f7f5; --ink:#16211c; --muted:#56655d; --line:#cbd5ce;
  --accent:#14606b; --accent-ink:#ffffff; --ok:#1d8a4b; --warn:#c2410c;
  --force:#d1323b; --effort:#6a3fc2; --arm:#b26c12;
  --wood:#c78d55; --wood-dark:#7f5229; --pivot:#3b4850; --ground:#8f9e95;
  --space:#0a0f1f; --space-ink:#e7ecf8; --space-muted:#9aa6c4; --star:#d5ddff;
  --toga:#f4f1ea; --toga-line:#b8ae9c; --sash:#9b3d2e; --skin:#e0b08a; --hair:#a7a7a7; --hair-dark:#6f6f6f;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --panel:#17201c; --lane:#121a17; --ink:#e3ebe6; --muted:#97a89f; --line:#2b3933;
  --accent:#4fb8c4; --accent-ink:#04252a; --ok:#47c47d; --warn:#f08a4b;
  --force:#ff5f67; --effort:#a98bf5; --arm:#f0a948;
  --wood:#b98552; --wood-dark:#e0b080; --pivot:#9fb0b9; --ground:#5d6c64;
  --toga:#e6e1d6; --toga-line:#8f8676; --sash:#c0574a; --skin:#d9a77f; --hair:#b9b9b9; --hair-dark:#8a8a8a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --panel:#17201c; --lane:#121a17; --ink:#e3ebe6; --muted:#97a89f; --line:#2b3933;
  --accent:#4fb8c4; --accent-ink:#04252a; --ok:#47c47d; --warn:#f08a4b;
  --force:#ff5f67; --effort:#a98bf5; --arm:#f0a948;
  --wood:#b98552; --wood-dark:#e0b080; --pivot:#9fb0b9; --ground:#5d6c64;
  --toga:#e6e1d6; --toga-line:#8f8676; --sash:#c0574a; --skin:#d9a77f; --hair:#b9b9b9; --hair-dark:#8a8a8a;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(25px,3.4vw,36px);line-height:1.15;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:700}
.hdr-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.chipcard:focus-visible,.zone:focus-visible,.lrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg .btn{border:0;border-radius:0;min-width:52px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-size:15px;font-weight:600;white-space:nowrap;min-height:46px;padding:8px 14px;border:0;border-bottom:3px solid transparent;
  background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.req{margin:0;font-size:14px;color:var(--muted);max-width:110ch}
.req b{color:var(--ink);font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
.lab3{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1020px){.lab,.lab3{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0}
.card.predict{border-color:var(--accent);border-width:2px}
canvas{display:block;width:100%;touch-action:none;border-radius:8px;background:var(--lane)}
canvas.space{background:var(--space);touch-action:pan-y}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:14px;color:var(--muted);margin:0}
.status{font-size:15px;font-weight:600;margin:0;min-height:24px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.fld .val{color:var(--ink);font-family:var(--font-num);font-size:15px}
select{font:inherit;font-size:15px;min-height:44px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--lane);color:var(--ink);width:100%}
input[type=range]{width:100%;min-width:0;height:32px;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices .btn{flex:1 1 120px;font-size:14px}
.choices .btn.right{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.choices .btn.wrong{border-color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
.fb{font-size:15px;padding:8px 10px;border-radius:8px;background:var(--lane)}
.fb.good{color:var(--ok)} .fb.bad{color:var(--warn)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
td.n{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.concl{font-size:15px;padding:10px 12px;border-radius:8px;border:1px dashed var(--accent);background:var(--lane)}
.formula{font-family:var(--font-num);font-size:15px;background:var(--lane);padding:8px 10px;border-radius:8px;overflow-x:auto;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
footer{font-size:13px;color:var(--muted)}
footer p{margin:0 0 4px}
/* Tab 2: loại đòn bẩy */
.types{display:flex;flex-direction:column;gap:6px}
.types .btn{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.types .btn .ord{font-family:var(--font-num);font-size:13px;opacity:.85}
.obs{display:flex;flex-direction:column;gap:6px;font-size:15px}
.obs p{margin:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor;margin-right:6px}
/* Trò chơi phân loại */
.sort{display:flex;flex-direction:column;gap:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border-radius:10px;background:var(--lane)}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.zone{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:96px;min-width:0;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--panel)}
.zone.hover,.zone.armed{border-color:var(--accent);background:var(--lane)}
.zone h3 span+span{font-family:var(--font-num);font-size:12px;color:var(--muted);font-weight:600;margin-left:6px}
.chipcard{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;font-weight:600;font-size:15px;color:var(--ink)}
.chipcard .em{font-family:var(--emoji);font-size:24px;line-height:1}
.chipcard.sel{outline:3px solid var(--accent);outline-offset:1px}
.chipcard.done{cursor:default;border-color:var(--ok);align-items:flex-start;touch-action:auto}
.chipcard.done .det{font-weight:500;font-size:13px;color:var(--muted)}
@media (max-width:760px){.zone{padding:6px;gap:6px}.zone h3{font-size:13px;display:flex;flex-direction:column}.zone h3 span+span{margin-left:0}
  .chipcard.done{padding:4px 6px;gap:4px;font-size:13px;flex-direction:column;align-items:center;text-align:center}.chipcard.done .det{display:none}.chipcard.done .em{font-size:20px}}
.chipcard .txt{display:flex;flex-direction:column;min-width:0}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.92;transform:translate(-50%,-60%);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* Tab 3: Archimedes */
.guide{position:sticky;top:12px}
@media (max-width:1020px){.guide{position:static}}
.guide .who{display:flex;flex-direction:column;align-items:center;gap:8px}
.archi{width:170px;height:auto;display:block}
@media (max-width:1020px){.guide .who{flex-direction:row;align-items:flex-start}.archi{width:96px;flex:0 0 96px}}
.archi .toga{fill:var(--toga);stroke:var(--toga-line);stroke-width:1.5}
.archi .fold{fill:none;stroke:var(--toga-line);stroke-width:1.5}
.archi .sash{fill:var(--sash)}
.archi .skin{fill:var(--skin)}
.archi .skinln{fill:none;stroke:var(--skin);stroke-linecap:round}
.archi .hair{fill:var(--hair)}
.archi .hairln{fill:none;stroke:var(--hair-dark);stroke-width:2.5;stroke-linecap:round}
.archi .eye{fill:#2a2a2a}
.archi .tool{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round}
.bubble{position:relative;background:var(--lane);border:2px solid var(--accent);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px;min-width:0;flex:1}
.bubble p{margin:0}
.bubble blockquote{margin:0;padding:6px 10px;border-left:3px solid var(--accent);font-weight:700;font-size:16px}
.bubble ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.bubble .stepn{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.bubble .choices .btn{flex:1 1 100%;text-align:left;font-size:14px}
.bnav{display:flex;justify-content:space-between;gap:8px}
.bigfig{font-family:var(--font-num);font-size:clamp(20px,2.6vw,28px);font-weight:600;line-height:1.2}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.ladder{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:"e n r" "e b b";gap:2px 10px;padding:7px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.lrow:hover{background:var(--lane)}
@media (max-width:600px){.lrow{grid-template-columns:30px minmax(0,1fr);grid-template-areas:"e n" "e r" "e b"}.lrow .rt{white-space:normal}}
.lrow .e{grid-area:e;font-family:var(--emoji);font-size:20px;line-height:1.3}
.lrow .nm{grid-area:n;font-size:14px;min-width:0}
.lrow .nm small{color:var(--muted);font-family:var(--font-num);margin-left:6px}
.lrow .rt{grid-area:r;font-family:var(--font-num);font-size:13px;color:var(--muted);white-space:nowrap}
.lrow .bar{grid-area:b;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.lrow .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--muted);border-radius:3px}
.lrow.me{background:var(--lane);border:2px solid var(--accent)}
.lrow.me .bar i{background:var(--accent)}
.lrow.me .nm{font-weight:700}
.lrow.cur .nm{text-decoration:underline;text-decoration-color:var(--arm);text-decoration-thickness:3px;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="hdr-ctl">
      <div class="seg" role="group" aria-label="level">
        <button class="btn" id="lvQual" data-i18n="lvQual"></button>
        <button class="btn" id="lvQuant" data-i18n="lvQuant"></button>
      </div>
      <button class="btn" id="langBtn">EN</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="1" data-i18n="tab1"></button>
    <button role="tab" data-tab="2" data-i18n="tab2"></button>
    <button role="tab" data-tab="3" data-i18n="tab3"></button>
  </nav>

  <!-- ===================== TAB 1 ===================== -->
  <section id="t1" class="col">
    <p class="req" data-i18n-html="req1"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint1"></p>
        <canvas id="cv1" aria-label="lever"></canvas>
        <p class="status" id="st1"></p>
        <div class="controls">
          <button class="btn primary" id="rel1" data-i18n="release"></button>
          <button class="btn" id="rst1" data-i18n="reset"></button>
          <div class="seg" role="group" id="spd1">
            <button class="btn" data-s="0.25">×0,25</button>
            <button class="btn" data-s="0.5">×0,5</button>
            <button class="btn" data-s="1">×1</button>
          </div>
          <label class="chk"><input type="checkbox" id="vec1" checked> <span data-i18n="showVec"></span></label>
          <button class="btn" id="chal1" data-i18n="challenge"></button>
        </div>
        <div class="legend"><span><i style="background:var(--force)"></i><span data-i18n="lgWeight"></span></span><span><i style="background:var(--arm)"></i><span data-i18n="lgArm"></span></span></div>
      </div>
      <aside class="col">
        <div class="card">
          <h2 data-i18n="cObjs"></h2>
          <div class="grid2">
            <div class="fld"><span><span class="sw" style="background:var(--accent)"></span><span data-i18n="objA"></span></span>
              <select id="selA"></select>
              <div id="cusA" hidden><input type="range" id="rngA" min="0.5" max="300" step="0.5" value="20"></div>
              <span class="val" id="mA"></span></div>
            <div class="fld"><span><span class="sw" style="background:var(--effort)"></span><span data-i18n="objB"></span></span>
              <select id="selB"></select>
              <div id="cusB" hidden><input type="range" id="rngB" min="0.5" max="300" step="0.5" value="20"></div>
              <span class="val" id="mB"></span></div>
          </div>
        </div>
        <div class="card">
          <h2 data-i18n="cPivot"></h2>
          <div class="row">
            <button class="btn" id="pvL" aria-label="pivot left">◀</button>
            <span id="pvTxt" style="flex:1;min-width:0"></span>
            <button class="btn" id="pvR" aria-label="pivot right">▶</button>
          </div>
          <label class="chk"><input type="checkbox" id="ign1" checked> <span data-i18n="ignBeam"></span></label>
          <div class="fld" id="beamBox" hidden><span><span data-i18n="beamMass"></span>: <span class="val" id="mbTxt"></span></span>
            <input type="range" id="rngMb" min="1" max="60" step="1" value="10"></div>
          <div class="row" id="gRow"><span class="hint" data-i18n="gLbl"></span>
            <div class="seg" id="gSeg"><button class="btn" data-g="9.8">9,8</button><button class="btn" data-g="10">10</button></div></div>
        </div>
        <div class="card predict">
          <h2 data-i18n="cPred"></h2>
          <p data-i18n="predQ"></p>
          <div class="choices" id="pred1">
            <button class="btn" data-p="L" data-i18n="pL"></button>
            <button class="btn" data-p="B" data-i18n="pB"></button>
            <button class="btn" data-p="R" data-i18n="pR"></button>
          </div>
          <p class="fb" id="fb1" hidden></p>
        </div>
        <div class="card">
          <h2 data-i18n="cData"></h2>
          <div class="tblwrap"><table id="tbl1"></table></div>
          <p id="cmp1" class="obs"></p>
          <p class="concl" id="concl1" hidden></p>
        </div>
      </aside>
    </div>
  </section>

  <!-- ===================== TAB 2 ===================== -->
  <section id="t2" class="col" hidden>
    <p class="req" data-i18n-html="req2"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint2"></p>
        <canvas id="cv2" aria-label="lever classes"></canvas>
        <div class="fld"><span><span data-i18n="liftLbl"></span>: <span class="val" id="liftTxt"></span></span>
          <input type="range" id="rngLift" min="0" max="100" step="1" value="0"></div>
        <div class="legend"><span><i style="background:var(--force)"></i><span data-i18n="lgP"></span></span><span><i style="background:var(--effort)"></i><span data-i18n="lgF"></span></span><span><i style="background:var(--arm)"></i><span data-i18n="lgPath"></span></span></div>
      </div>
      <aside class="col">
        <div class="card">
          <h2 data-i18n="cTypes"></h2>
          <div class="types" id="types2">
            <button class="btn" data-t="1"><span data-i18n="ty1"></span><span class="ord" data-i18n="ord1"></span></button>
            <button class="btn" data-t="2"><span data-i18n="ty2"></span><span class="ord" data-i18n="ord2"></span></button>
            <button class="btn" data-t="3"><span data-i18n="ty3"></span><span class="ord" data-i18n="ord3"></span></button>
          </div>
          <p id="tyDesc"></p>
          <div class="fld"><span><span data-i18n="massLbl2"></span>: <span class="val" id="m2Txt"></span></span>
            <input type="range" id="rngM2" min="5" max="100" step="1" value="20"></div>
        </div>
        <div class="card predict">
          <h2 data-i18n="cObs2"></h2>
          <div class="obs" id="obs2"></div>
        </div>
      </aside>
    </div>
    <div class="card sort">
      <h2 data-i18n="sortTitle"></h2>
      <p class="hint" data-i18n="sortHint"></p>
      <div class="zones">
        <div class="zone" data-z="1" tabindex="0"><h3><span data-i18n="ty1"></span><span data-i18n="ord1"></span></h3></div>
        <div class="zone" data-z="2" tabindex="0"><h3><span data-i18n="ty2"></span><span data-i18n="ord2"></span></h3></div>
        <div class="zone" data-z="3" tabindex="0"><h3><span data-i18n="ty3"></span><span data-i18n="ord3"></span></h3></div>
      </div>
      <div class="pool" id="pool"></div>
      <p class="fb" id="sortFb" hidden></p>
      <div class="row"><span id="score" class="num"></span><button class="btn" id="sortReset" data-i18n="sortReset"></button></div>
    </div>
  </section>

  <!-- ===================== TAB 3 ===================== -->
  <section id="t3" class="col" hidden>
    <p class="req" data-i18n-html="req3"></p>
    <div class="lab3">
      <aside class="card guide">

  sp_walk:'Đi bộ (5 km/h)', sp_car:'Ô tô (100 km/h)', sp_plane:'Máy bay (900 km/h)', sp_probe:'Tàu Parker Solar Probe (≈ 690 000 km/h), nhanh nhất do con người chế tạo', sp_light:'Ánh sáng (300 000 km/s), không vật nào có khối lượng đạt được',
  liftS:(h,s,ly,mw)=>`Đầu thanh phía em phải đi: <b class="num">s = h·d₂/d₁ ≈ ${s}</b> ≈ <b>${ly}</b> (≈ ${mw} lần đường kính Ngân Hà).`,
  liftSQ:(h,ly,mw)=>`Để nâng Trái Đất lên ${h}, đầu thanh phía em phải đi xuống khoảng <b>${ly}</b> (≈ ${mw} lần đường kính Ngân Hà).`,
  liftT:(t,age)=>`Thời gian: <b>≈ ${t} năm</b>${age?`, lâu gấp ${age} lần tuổi của vũ trụ (13,8 tỉ năm)`:''}.`,
  liftW:(a)=>`Công em bỏ ra đúng bằng công nâng Trái Đất: A = P·h ≈ <span class="num">${a} J</span>. Đòn bẩy không cho lợi về công.`,
  stepN:(k,n)=>`Archimedes hướng dẫn · bước ${k}/${n}`, next:'Tiếp ›', again:'Xem lại từ đầu',
  st3_1:'<p>Xin chào! Ta là <b>Archimedes</b>, nhà bác học ở thành Syracuse (khoảng 287–212 TCN). Ta đã tìm ra quy tắc đòn bẩy và từng tuyên bố:</p><blockquote>«Hãy cho ta một điểm tựa, ta sẽ nâng bổng cả Trái Đất!»</blockquote><p class="hint">Câu nói được Pappus thành Alexandria (thế kỉ IV) chép lại; Plutarch kể một câu tương tự.</p><p>Hôm nay ta cùng tính xem muốn làm thế thì cần một đòn bẩy dài bao nhiêu.</p>',
  st3_2:m=>`<p>Đặt Trái Đất (5,97 × 10²⁴ kg) cách điểm tựa <b>d₁ = 1 m</b>. Em nặng <b>${m} kg</b>, đứng ở đầu kia của thanh.</p><p>Để thanh cân bằng, em phải đứng cách điểm tựa bao xa? Đoán trước nhé:</p>`,
  q3:['Bằng chiều dài nước Việt Nam (≈ 1 650 km)','Bằng khoảng cách Trái Đất – Mặt Trời','Dài hơn cả đường kính Ngân Hà','Dài hơn cả vũ trụ quan sát được'],
  q3Right:(ly,mw)=>`Chính xác! d₂ ≈ ${ly}, gấp khoảng ${mw} lần đường kính Ngân Hà.`,
  q3Low:(ly,k)=>`Còn xa lắm! Thực tế d₂ ≈ ${ly}, lớn hơn đáp án em chọn ${k} lần.`,
  q3High:(ly,k)=>`Chưa đến mức ấy. d₂ ≈ ${ly}, chỉ bằng khoảng 1/${k} đường kính vũ trụ quan sát được.`,
  st3_3q:(d2,ly)=>`<p>Quy tắc đòn bẩy: moment hai bên bằng nhau.</p><p class="formula">P<sub>TĐ</sub>·d₁ = P<sub>em</sub>·d₂ ⇒ d₂ = m<sub>TĐ</sub>·d₁ / m<sub>em</sub></p><p>d₂ = <b class="num">${d2} m</b> ≈ <b>${ly}</b>.</p><p>Ánh sáng đi từ điểm tựa tới chỗ em đứng cũng mất chừng ấy năm!</p>`,
  st3_3l:(r,ly)=>`<p>Trái Đất nặng gấp em khoảng ${r} lần, nên em phải đứng xa điểm tựa gấp chừng ấy lần so với Trái Đất: khoảng <b>${ly}</b>.</p><p>Ánh sáng đi từ điểm tựa tới chỗ em đứng cũng mất chừng ấy năm!</p>`,
  st3_4:'<p>Giờ hãy bấm <b>Phóng to dần</b>. Ta bắt đầu từ chỗ em đứng rồi lùi ra xa: qua tháp Landmark 81, nước Việt Nam, Trái Đất, Mặt Trời, rồi ra ngoài Ngân Hà.</p><p>Để ý xem đến lúc nào mới nhìn thấy điểm tựa và Trái Đất.</p>',
  st3_4btn:'Bắt đầu phóng to',
  st3_5:(h,s,mw,t,age)=>`<p>Đòn bẩy cho ta lợi về lực nhưng thiệt về đường đi. Muốn nâng Trái Đất lên <b>${h}</b>, em phải ấn đầu thanh đi xuống <b>${s}</b>, gần bằng ${mw} lần đường kính Ngân Hà.</p><p>Đi bộ thì mất khoảng <b>${t} năm</b>, lâu gấp ${age} lần tuổi của vũ trụ.</p>`,
  st3_6:(g,rod,snd,sage)=>`<p>Ta phải thú nhận: đây chỉ là <b>thí nghiệm tưởng tượng</b>. Vì sao không làm thật được?</p><ul><li>Trọng lượng là lực hút của một hành tinh. Muốn Trái Đất «nặng» ${g} N thì phải tưởng tượng có trọng trường đều g = 9,8 m/s² ở khắp nơi.</li><li>Không có chỗ đứng hay điểm tựa nào ngoài Trái Đất. Tâm Trái Đất cách điểm tựa 1 m nghĩa là điểm tựa nằm sâu trong lòng đất (bán kính Trái Đất 6 371 km).</li><li>Không có vật liệu đủ cứng. Một thanh thép tiết diện 1 m² dài như vậy nặng gấp khoảng ${rod} lần Trái Đất và sẽ cong, gãy.</li><li>Cú ấn của em truyền dọc thanh với tốc độ âm thanh trong thép (≈ 5 km/s), mất khoảng ${snd} năm mới tới điểm tựa, gấp ${sage} lần tuổi vũ trụ.</li><li>Không gì đi nhanh hơn ánh sáng, nên nâng 1 cm cũng mất hơn một trăm nghìn năm.</li></ul><p><b>Điều ta muốn nói:</b> chỉ cần cánh tay đòn đủ dài, một lực nhỏ có thể cân bằng một vật rất nặng. Nhưng không bao giờ được lợi về công.</p>`,
  foot1:'Giả thiết mô phỏng: vật coi như chất điểm gắn chặt trên thanh, đặt đúng vị trí nấc; thanh cứng, không ma sát ở trục; bỏ qua sức cản không khí. Khi bỏ qua khối lượng thanh, chỉ trọng lượng hai vật làm thanh quay. Trục quay nằm trên trục của thanh.',
  foot2:'Giả thiết mô phỏng: thanh cứng, nhẹ; lực của tay luôn vuông góc với thanh, trọng lượng vật luôn theo phương thẳng đứng; nâng chậm đều nên coi như thanh luôn cân bằng. Quãng đường tính theo cung tròn mà điểm đặt lực vạch ra.',
  foot3:'Thí nghiệm tưởng tượng: trọng trường đều g = 9,8 m/s² ở mọi nơi, thanh cứng tuyệt đối và không có khối lượng. Số liệu: khối lượng Trái Đất 5,972 × 10²⁴ kg; 1 năm ánh sáng = 9,461 × 10¹⁵ m; 1 AU = 1,496 × 10¹¹ m; Ngân Hà ≈ 100 000 năm ánh sáng; Andromeda ≈ 2,5 triệu năm ánh sáng; vũ trụ quan sát được ≈ 93 tỉ năm ánh sáng.',
  bigU:[[1e12,'nghìn tỉ'],[1e9,'tỉ'],[1e6,'triệu'],[1e3,'nghìn']]
},

  stepN:(k,n)=>`Archimedes guides you · step ${k}/${n}`, next:'Next ›', again:'Start again',
  st3_1:'<p>Greetings! I am <b>Archimedes</b> of Syracuse (about 287–212 BC). I discovered the law of the lever and once declared:</p><blockquote>“Give me a place to stand, and I will move the Earth!”</blockquote><p class="hint">The saying was recorded by Pappus of Alexandria (4th century); Plutarch tells a similar story.</p><p>Let us work out how long a lever that would need.</p>',
  st3_2:m=>`<p>Put the Earth (5.97 × 10²⁴ kg) <b>d₁ = 1 m</b> from the pivot. You weigh <b>${m} kg</b> and stand at the other end.</p><p>To balance, how far from the pivot must you stand? Guess first:</p>`,
  q3:['As long as Viet Nam (≈ 1,650 km)','The Earth – Sun distance','Longer than the Milky Way is wide','Longer than the observable universe'],
  q3Right:(ly,mw)=>`Exactly! d₂ ≈ ${ly}, about ${mw} times the diameter of the Milky Way.`,
  q3Low:(ly,k)=>`Far too short! In fact d₂ ≈ ${ly}, ${k} times your answer.`,
  q3High:(ly,k)=>`Not that far. d₂ ≈ ${ly}, only about 1/${k} of the observable universe.`,
  st3_3q:(d2,ly)=>`<p>Law of the lever: the moments on both sides are equal.</p><p class="formula">P<sub>E</sub>·d₁ = P<sub>you</sub>·d₂ ⇒ d₂ = m<sub>E</sub>·d₁ / m<sub>you</sub></p><p>d₂ = <b class="num">${d2} m</b> ≈ <b>${ly}</b>.</p><p>Even light takes that many years to travel from the pivot to you!</p>`,

  st3_4:'<p>Now press <b>Zoom out</b>. We start where you stand and move away: past Landmark 81, Viet Nam, the Earth, the Sun and out of the Milky Way.</p><p>Watch for the moment the pivot and the Earth come into view.</p>',

/* ============ TAB 2: ba loại đòn bẩy ============ */
const LB2=1.6, ORD={1:['P','O','F'],2:['O','P','F'],3:['O','F','P']};
const s2={ type:1, pos:{1:{P:0.15,O:0.55,F:1.5},2:{O:0.1,P:0.55,F:1.5},3:{O:0.1,F:0.55,P:1.5}}, phi:0, m:20, drag:null };
const PHIMAX=22*Math.PI/180;
let D2g=null;
function geo2(){
  const {w,h}=D2g; const p=s2.pos[s2.type]; const up=s2.type!==1; const sinM=Math.sin(PHIMAX);
  // loại 2, 3: cả thanh đi lên nên đặt trục thấp; tỉ lệ chọn để đầu thanh không ra khỏi khung
  const Oy = up ? h-86 : h*0.5;
  const sc = Math.min((w-70)/LB2, up ? (Oy-110)/(LB2*sinM) : (h-Oy-24)/(LB2*sinM));
  const x0=(w-LB2*sc)/2; const Ox=x0+p.O*sc;
  const rP=p.P-p.O, rF=p.F-p.O; const th=Math.sign(rP)*s2.phi;
  const at=u=>{ const r=(u-p.O)*sc; return {x:Ox+r*Math.cos(th), y:Oy-r*Math.sin(th)}; };
  return {w,h,sc,x0,p,Ox,Oy,rP,rF,th,at};
}
function forces2(){
  // F luôn vuông góc với thanh: cánh tay đòn của F là dF; P thẳng đứng: cánh tay đòn của P là dP·cosφ
  const p=s2.pos[s2.type]; const dP=Math.abs(p.P-p.O), dF=Math.abs(p.F-p.O); const P=s2.m*9.8;
  const Fat=phi=>P*dP*Math.cos(phi)/dF; const F=Fat(s2.phi);
  let WF=0; const n=200; for (let i=0;i<n;i++){ const ph=(i+0.5)/n*s2.phi; WF+=Fat(ph)*dF*s2.phi/n; } // cộng dần công của F dọc cung đường
  return {dP,dF,P,F,sP:dP*s2.phi,sF:dF*s2.phi,hP:dP*Math.sin(s2.phi),WF,WP:P*dP*Math.sin(s2.phi)};
}
function draw2(){
  const {ctx,w,h}=D2g; const G=geo2(); ctx.clearRect(0,0,w,h);
  const {P,F}=forces2();
  const thick=10;
  // vị trí ban đầu (nét đứt)
  if (s2.phi>0.002){
    ctx.save(); ctx.setLineDash([6,5]); ctx.strokeStyle=C.muted; ctx.lineWidth=1.5;
    ctx.strokeRect(G.x0-4, G.Oy-thick/2, LB2*G.sc+8, thick); ctx.restore();
    // cung quãng đường
    for (const [key,col] of [['P',C.arm],['F',C.arm]]){
      const r=(G.p[key]-G.p.O)*G.sc; if (Math.abs(r)<2) continue;
      const a0 = r>0?0:Math.PI; const a1 = r>0? -G.th : Math.PI-G.th;
      ctx.save(); ctx.setLineDash([5,4]); ctx.strokeStyle=col; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(G.Ox,G.Oy,Math.abs(r),Math.min(a0,a1),Math.max(a0,a1)); ctx.stroke(); ctx.restore();
      const x=G.Ox+r*1, y=G.Oy; ctx.fillStyle=C.muted; ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
      const am=(a0+a1)/2; label(ctx, key==='P'?'s_P':'s_F', G.Ox+Math.cos(am)*(Math.abs(r)+16), G.Oy+Math.sin(am)*(Math.abs(r)+16), C.arm,'center',12,700);
    }
  }
  // điểm tựa
  const O=G.at(G.p.O);
  ctx.fillStyle=C.pivot; ctx.beginPath(); ctx.moveTo(O.x,O.y+thick/2); ctx.lineTo(O.x-18,O.y+thick/2+34); ctx.lineTo(O.x+18,O.y+thick/2+34); ctx.closePath(); ctx.fill();
  ctx.fillStyle=C.ground; ctx.fillRect(O.x-30,O.y+thick/2+34,60,4);
  // thanh
  ctx.save(); ctx.translate(G.Ox,G.Oy); ctx.rotate(-G.th);
  const a=(0-G.p.O)*G.sc, b=(LB2-G.p.O)*G.sc;
  ctx.fillStyle=C.wood; ctx.strokeStyle=C['wood-dark']; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(a-4,-thick/2,b-a+8,thick,3) : ctx.rect(a-4,-thick/2,b-a+8,thick); ctx.fill(); ctx.stroke();
  ctx.restore();
  label(ctx,'O',O.x,O.y+thick/2+22,C.panel,'center',12,800);
  // vật P (thùng hàng) đặt trên thanh
  const Pp=G.at(G.p.P); const box=clamp(G.sc*0.16,26,48);
  ctx.save(); ctx.translate(Pp.x,Pp.y); ctx.rotate(-G.th);
  ctx.fillStyle=C.wood; ctx.strokeStyle=C['wood-dark']; ctx.lineWidth=2;
  ctx.fillRect(-box/2,-thick/2-box,box,box); ctx.strokeRect(-box/2,-thick/2-box,box,box);
  ctx.beginPath(); ctx.moveTo(-box/2,-thick/2-box); ctx.lineTo(box/2,-thick/2); ctx.moveTo(box/2,-thick/2-box); ctx.lineTo(-box/2,-thick/2); ctx.stroke();
  ctx.restore();
  const nx=-Math.sin(G.th), ny=-Math.cos(G.th);
  const pc={x:Pp.x+nx*(thick/2+box/2), y:Pp.y+ny*(thick/2+box/2)};
  const maxL=Math.min(90,h*0.3); const k=maxL/Math.max(P,F);
  // trọng lượng vật đặt tại chỗ thùng tì lên thanh, luôn thẳng đứng
  arrow(ctx,Pp.x,Pp.y,Pp.x,Pp.y+Math.max(12,P*k),C.force,3);
  label(ctx, level==='quant'?`P = ${nf(P,0)} N`:'P', pc.x+box/2+6, pc.y-box/2-4, C.force,'left',13,700,C.panel);
  if (s2.phi>0.002){ // khoảng cách từ O tới phương thẳng đứng của P
    ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle=C.force; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(G.Ox,G.Oy); ctx.lineTo(Pp.x,G.Oy); ctx.lineTo(Pp.x,Pp.y); ctx.stroke(); ctx.restore();
  }
  // tay F: luôn vuông góc với thanh
  const Fp=G.at(G.p.F); const up = s2.type!==1;
  const ux=Math.cos(G.th), uy=-Math.sin(G.th);          // hướng dọc thanh (ra xa O)
  const fx=(up?-1:1)*Math.sin(G.th), fy=(up?-1:1)*Math.cos(G.th); // pháp tuyến của thanh
  const fl=Math.max(12,F*k)+15;
  arrow(ctx,Fp.x,Fp.y,Fp.x+fx*fl,Fp.y+fy*fl,C.effort,3.5);
  const ra=22; ctx.strokeStyle=C.effort; ctx.lineWidth=1.5; ctx.beginPath();
  ctx.moveTo(Fp.x+ux*ra,Fp.y+uy*ra); ctx.lineTo(Fp.x+ux*ra+fx*ra,Fp.y+uy*ra+fy*ra); ctx.lineTo(Fp.x+fx*ra,Fp.y+fy*ra); ctx.stroke();
  ctx.fillStyle=C.effort; ctx.beginPath(); ctx.arc(Fp.x,Fp.y,15,0,Math.PI*2); ctx.fill();
  label(ctx,'F',Fp.x,Fp.y+0.5,C.panel,'center',14,800);
  label(ctx, level==='quant'?`F = ${nf(F,F<10?1:0)} N`:'F', Fp.x+fx*fl*0.6-ux*22, Fp.y+fy*fl*0.6-uy*22, C.effort,'right',13,700,C.panel);
  // nhãn khoảng cách
  if (s2.phi<0.002){
    const y=G.Oy+thick/2+50;
    for (const key of ['P','F']){ const x1=G.Ox, x2=G.at(G.p[key]).x; const yy= key==='P'? y : y+18;
      ctx.strokeStyle=key==='P'?C.force:C.effort; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x1,yy); ctx.lineTo(x2,yy); ctx.moveTo(x1,yy-4); ctx.lineTo(x1,yy+4); ctx.moveTo(x2,yy-4); ctx.lineTo(x2,yy+4); ctx.stroke();
      label(ctx, level==='quant'?`d_${key} = ${nf(Math.abs(G.p[key]-G.p.O),2)} m`:`d_${key}`, (x1+x2)/2, yy-8, key==='P'?C.force:C.effort,'center',12,700,C.lane); }
  }
}
function hit2(p){
  const G=geo2();
  const F=G.at(G.p.F); if (Math.hypot(p.x-F.x,p.y-F.y)<26) return 'F';
  const P=G.at(G.p.P); const box=clamp(G.sc*0.16,26,48); if (Math.abs(p.x-P.x)<box/2+10 && p.y<P.y+10 && p.y>P.y-box-20) return 'P';
  const O=G.at(G.p.O); if (Math.abs(p.x-O.x)<26 && p.y>O.y-10 && p.y<O.y+50) return 'O';
  return null;
}
function slide2(key,u){
  const ord=ORD[s2.type], i=ord.indexOf(key), p=s2.pos[s2.type], gap=0.12;
  const lo = i>0 ? p[ord[i-1]]+gap : 0.05; const hi = i<2 ? p[ord[i+1]]-gap : LB2-0.05;
  p[key]=clamp(u,lo,hi);
}
function setup2(){
  const cv=$('#cv2');

  cv.addEventListener('pointermove',e=>{ const p=ptr(cv,e);
    if (!s2.drag){ cv.style.cursor=hit2(p)?'grab':'default'; return; }
    const d=s2.drag, G=geo2();
    if (!d.mode){ if (Math.hypot(p.x-d.x0,p.y-d.y0)<6) return; d.mode = Math.abs(p.x-d.x0)>Math.abs(p.y-d.y0)?'slide':'lift'; }
    if (d.mode==='slide'){ const r=((p.x-G.Ox)*Math.cos(G.th)-(p.y-G.Oy)*Math.sin(G.th))/G.sc; slide2(d.k, G.p.O+r); }
    else { const rF=G.rF*G.sc; const s=clamp((G.Oy-p.y)/rF,-1,1); const th=Math.asin(s); s2.phi=clamp(th*Math.sign(G.rP),0,PHIMAX); $('#rngLift').value=Math.round(s2.phi/PHIMAX*100); }
    ui2();
  });

  $('#rngM2').oninput=e=>{ s2.m=+e.target.value; ui2(); };
  $('#rngLift').oninput=e=>{ s2.phi=PHIMAX*e.target.value/100; ui2(); };

/* Trò chơi phân loại */
const EX=[
  {id:'scissors',e:'✂️',t:1},{id:'hammer',e:'🔨',t:1},{id:'balance',e:'⚖️',t:1},{id:'nod',e:'🙇',t:1},
  {id:'barrow',e:'🛞',t:2},{id:'opener',e:'🍾',t:2},{id:'nut',e:'🌰',t:2},{id:'tiptoe',e:'🦶',t:2},
  {id:'tongs',e:'🧊',t:3},{id:'rod',e:'🎣',t:3},{id:'arm',e:'💪',t:3},{id:'broom',e:'🧹',t:3}
];
let sortState={placed:{},order:[],sel:null};
function shuffleSort(){ sortState.placed={}; sortState.sel=null; sortState.order=EX.map(x=>x.id).sort(()=>Math.random()-0.5); renderSort(); $('#sortFb').hidden=true; }
function cardHTML(x,done){ return `<div class="chipcard${done?' done':''}" data-id="${x.id}" tabindex="${done?-1:0}" role="button"><span class="em">${x.e}</span><span class="txt"><span>${t('ex_'+x.id)}</span>${done?`<span class="det">${t('de_'+x.id)}</span>`:''}</span></div>`; }
function renderSort(){
  const pool=$('#pool'); pool.innerHTML=sortState.order.filter(id=>!sortState.placed[id]).map(id=>cardHTML(EX.find(x=>x.id===id),false)).join('');
  $$('.zone').forEach(z=>{ const ty=+z.dataset.z; $$('.chipcard',z).forEach(c=>c.remove());
    z.insertAdjacentHTML('beforeend', EX.filter(x=>sortState.placed[x.id] && x.t===ty).map(x=>cardHTML(x,true)).join('')); z.classList.toggle('armed', !!sortState.sel); });
  if (sortState.sel){ const c=$(`#pool .chipcard[data-id="${sortState.sel}"]`); if (c) c.classList.add('sel'); }
  const n=Object.keys(sortState.placed).length; $('#score').textContent=t('score',n,EX.length);

function tryPlace(id,ty){
  const x=EX.find(e=>e.id===id); const fb=$('#sortFb'); fb.hidden=false; sortState.sel=null;
  if (x.t===ty){ sortState.placed[id]=true; fb.className='fb good'; fb.textContent = Object.keys(sortState.placed).length===EX.length ? t('sortAll') : t('sortRight',t('ex_'+id),t('de_'+id)); renderSort(); }
  else { fb.className='fb bad'; fb.textContent=t('sortWrong',t('ex_'+id),t('hi_'+id)); renderSort(); const c=$(`#pool .chipcard[data-id="${id}"]`); if (c){ c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),450);} }
}
function setupSort(){
  const pool=$('#pool'); let dr=null;
  pool.addEventListener('pointerdown',e=>{ const c=e.target.closest('.chipcard'); if(!c) return; dr={c,id:c.dataset.id,x0:e.clientX,y0:e.clientY,moved:false,g:null}; try{c.setPointerCapture(e.pointerId);}catch(_){} });
  pool.addEventListener('pointermove',e=>{ if(!dr) return;
    if (!dr.moved && Math.hypot(e.clientX-dr.x0,e.clientY-dr.y0)>8){ dr.moved=true; dr.g=dr.c.cloneNode(true); dr.g.classList.add('ghost'); document.body.appendChild(dr.g); dr.c.style.opacity=.35; }
    if (dr.g){ dr.g.style.left=e.clientX+'px'; dr.g.style.top=e.clientY+'px'; const el=document.elementFromPoint(e.clientX,e.clientY); $$('.zone').forEach(z=>z.classList.toggle('hover', !!el && z.contains(el))); e.preventDefault(); }
  });
  const finish=(e,cancel)=>{ if(!dr) return; const d=dr; dr=null; $$('.zone').forEach(z=>z.classList.remove('hover'));
    if (d.g){ d.g.remove(); d.c.style.opacity=''; if (!cancel){ const el=document.elementFromPoint(e.clientX,e.clientY); const z=el && el.closest('.zone'); if (z) tryPlace(d.id,+z.dataset.z); } }
    else if (!cancel){ sortState.sel = sortState.sel===d.id?null:d.id; renderSort(); }
  };
  pool.addEventListener('pointerup',e=>finish(e,false)); pool.addEventListener('pointercancel',e=>finish(e,true));
  pool.addEventListener('keydown',e=>{ const c=e.target.closest('.chipcard'); if (c && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); sortState.sel=c.dataset.id; renderSort(); const z=$('.zone'); z&&z.focus(); } });

    z.addEventListener('click',go); z.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } }); });

  if (tab===3){ D3a=fit($('#cv3a'),0.32,215,270); D3b=fit($('#cv3b'),0.56,280,440); }
}
let last=performance.now(), acc=0; const DT=1/240;
function loop(now){
  const dt=Math.min((now-last)/1000,0.1); last=now;
  if (tab===1 && D1g){
    if (s1.state==='run'){ acc+=dt*s1.speed; while(acc>=DT && s1.state==='run'){ step1(DT); acc-=DT; } }
    else acc=0;
    draw1();
  }
  if (tab===2 && D2g) draw2();
  if (tab===3 && D3a && D3b){
    if (s3.playing){ s3.v=Math.min(1000, s3.v+dt*1000/28); if (s3.v>=1000) { s3.playing=false; ui3zoom(); } $('#rngZ').value=s3.v; }
    else if (s3.target!==null){ s3.v+= (s3.target-s3.v)*Math.min(1,dt*4); if (Math.abs(s3.target-s3.v)<0.5){ s3.v=s3.target; s3.target=null; } $('#rngZ').value=s3.v; }
    draw3a(); draw3b();
  }
  requestAnimationFrame(loop);
}

  $$('nav.tabs button').forEach(b=>b.onclick=()=>{ tab=+b.dataset.tab; save(); renderAll(); });
