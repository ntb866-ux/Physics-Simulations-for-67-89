<title>Sóng âm KHTN 7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Bàn thí nghiệm: sân khấu (các làn môi trường) bên trái, bảng ghi chép bên phải; điện thoại xếp một cột */
:root{
  --bg:#eaf0f2; --panel:#ffffff; --lane:#f6f9fa; --ink:#14222b; --muted:#566872; --line:#cbd6dc;
  --accent:#0d6b86; --accent-ink:#ffffff; --ok:#1f9d55; --warn:#c2410c;
  --solid:#4f6272; --liquid:#1d74c4; --gas:#b9741f; --na:#8a4fd1; --cl:#2f9e58; --mark:#d7263d;
  --compress:13,107,134; --rare:214,160,40;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --panel:#172129; --lane:#121b21; --ink:#e4ecf0; --muted:#94a6b1; --line:#2a3842;
  --accent:#4cb6d3; --accent-ink:#06222b; --ok:#45c47c; --warn:#f08a4b;
  --solid:#a3b4c3; --liquid:#5aaef0; --gas:#e6a453; --na:#b98ef2; --cl:#5fcb88; --mark:#ff5b6f;
  --compress:76,182,211; --rare:230,180,80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --panel:#172129; --lane:#121b21; --ink:#e4ecf0; --muted:#94a6b1; --line:#2a3842;
  --accent:#4cb6d3; --accent-ink:#06222b; --ok:#45c47c; --warn:#f08a4b;
  --solid:#a3b4c3; --liquid:#5aaef0; --gas:#e6a453; --na:#b98ef2; --cl:#5fcb88; --mark:#ff5b6f;
  --compress:76,182,211; --rare:230,180,80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(24px,3.4vw,34px);line-height:1.15;font-weight:700;text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:700}
.btn{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav.tabs button{font:inherit;font-size:15px;font-weight:600;white-space:nowrap;min-height:44px;padding:8px 14px;border:0;border-bottom:3px solid transparent;
  background:none;color:var(--muted);cursor:pointer}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:disabled{cursor:not-allowed;opacity:.6}
nav.tabs small{font-weight:500;font-size:12px;margin-left:4px}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:980px){.lab{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lanesel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.lanesel{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lanesel label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
select{font:inherit;font-size:15px;min-height:44px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--lane);color:var(--ink);width:100%}
.clock{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;font-size:14px;color:var(--muted)}
.clock b{font-family:var(--font-num);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
canvas{display:block;width:100%;touch-action:none;border-radius:8px;background:var(--lane)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg .btn{border:0;border-radius:0;min-width:56px}
.hint{font-size:14px;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.freq{display:flex;align-items:center;gap:8px;flex:1 1 260px;font-size:14px}
input[type=range]{flex:1;min-width:120px;height:32px;accent-color:var(--accent)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0}
.card.predict{border-color:var(--accent);border-width:2px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices .btn{flex:1 1 140px;font-size:14px;text-align:left}
.choices .btn.right{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.choices .btn.wrong{border-color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
.fb{font-size:15px;padding:8px 10px;border-radius:8px;background:var(--lane)}
.fb.good{color:var(--ok)} .fb.bad{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
td.n{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.n{text-align:right}
.tablewrap{overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 78px;gap:8px;align-items:center;font-size:13px}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:14px;border-radius:3px;background:var(--accent)}
.bar .n{text-align:right;font-family:var(--font-num)}
.slider{display:flex;flex-direction:column;gap:2px;font-size:14px}
.slider .top{display:flex;justify-content:space-between;gap:8px}
.toggles{display:flex;flex-direction:column;gap:2px}
.toggles label{display:flex;gap:10px;align-items:center;min-height:40px;font-size:15px;cursor:pointer}
.toggles input{width:22px;height:22px;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
details{font-size:14px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--ink);min-height:36px;display:flex;align-items:center}
details ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.concl{font-size:15px}
.concl ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.hidenum .sec{visibility:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.seg.wide{display:flex}
.seg.wide .btn{flex:1 1 0;min-width:0;white-space:normal;line-height:1.2}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 18px}
.scopehead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.card table td:first-child{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .btn{font-size:14px;padding:6px 12px}
.ebars{display:flex;flex-direction:column;gap:6px}
.ebhead{font-size:13px;color:var(--muted);min-height:18px}
.ebar{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:15px}
.ebar .track{height:16px;border-radius:4px;background:var(--lane);border:1px solid var(--line);overflow:hidden}
.ebar .track i{display:block;height:100%}
.ebar b{text-align:right}
@media (max-width:480px){.ebar{grid-template-columns:110px minmax(0,1fr) 54px;font-size:14px}}
details.custom summary{color:var(--accent)}
ul.vids{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px}
ul.vids a{color:var(--accent);font-weight:600}
ul.vids span{display:block;font-size:12px;color:var(--muted)}
.apps{display:flex;flex-direction:column;gap:14px}
.appgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.appgrid{grid-template-columns:minmax(0,1fr)}}
.appcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.app h3{margin:4px 0 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.app p{font-size:15px}
.numin{font:inherit;min-height:44px;width:7em;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--lane);color:var(--ink)}
</style>

<div class="wrap" id="app">
  <header>
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="row">
      <button class="btn" id="teacher" aria-pressed="false" data-i18n="teacher"></button>
      <button class="btn" id="lang">EN</button>
    </div>
  </header>

  <nav class="tabs" aria-label="tabs" role="tablist">
    <button class="on" role="tab" data-i18n="tab1"></button>
    <button role="tab" data-i18n="tab2"></button>
    <button role="tab" data-i18n="tab3"></button>
    <button role="tab" data-i18n="tab4"></button>
  </nav>

  <section class="lab" id="p1">
    <div class="stage">
      <div class="lanesel" id="lanesel"></div>
      <div class="clock">
        <span><span data-i18n="clock"></span> <b id="clock">0,000 ms</b></span>
        <span id="slowtxt"></span>
      </div>
      <canvas id="scene" aria-label="Mô phỏng truyền âm"></canvas>
      <div class="legend" id="legend"></div>
      <div class="controls">
        <button class="btn primary" id="strike" data-i18n="strike"></button>
        <button class="btn" id="cont" aria-pressed="false" data-i18n="cont"></button>
        <button class="btn" id="run" data-i18n="pause"></button>
        <button class="btn" id="stepb" data-i18n="step"></button>
        <button class="btn" id="reset" data-i18n="reset"></button>
        <div class="seg" id="speed">
          <button class="btn" data-s="0.25">×0,25</button><button class="btn" data-s="0.5">×0,5</button><button class="btn" data-s="1" aria-pressed="true">×1</button>
        </div>
      </div>
      <div class="row">
        <label class="freq" id="freqbox" hidden><span data-i18n="freq"></span>
          <input type="range" id="freq" min="100" max="1000" step="10" value="500">
          <b class="num" id="freqv"></b></label>
        <label class="freq"><span data-i18n="slow"></span>
          <select id="slow" style="width:auto">
            <option value="1000">1 000</option><option value="3000" selected>3 000</option><option value="10000">10 000</option><option value="30000">30 000</option>
          </select></label>
      </div>
      <p class="hint" data-i18n="hint"></p>
    </div>

    <aside id="aside">
      <div class="card predict">
        <h2 data-i18n="predTitle"></h2>
        <p data-i18n="predQ"></p>
        <div class="choices" id="predChoices"></div>
        <div class="fb" id="predFb" data-i18n="predWait"></div>
      </div>

      <div class="card">
        <h2 data-i18n="resTitle"></h2>
        <div class="tablewrap"><table>
          <thead><tr><th data-i18n="thLane"></th><th data-i18n="thMed"></th><th class="n" data-i18n="thV"></th><th class="n" data-i18n="thT"></th><th class="n" data-i18n="thVm"></th></tr></thead>
          <tbody id="resBody"></tbody>
        </table></div>
        <div class="bars sec" id="bars"></div>
        <p class="hint" data-i18n="resNote"></p>
      </div>

      <div class="card">
        <h2 data-i18n="q2Title"></h2>
        <p data-i18n="q2"></p>
        <div class="choices" id="q2Choices">
          <button class="btn" data-a="travel" data-i18n="q2a"></button>
          <button class="btn" data-a="osc" data-i18n="q2b"></button>
        </div>
        <div class="fb" id="q2Fb" hidden></div>
      </div>

      <div class="card">
        <h2 data-i18n="envTitle"></h2>
        <div class="slider"><div class="top"><span data-i18n="temp"></span><b class="num" id="tempv"></b></div>
          <input type="range" id="temp" min="0" max="35" step="1" value="20"></div>
        <div class="slider"><div class="top"><span data-i18n="sal"></span><b class="num" id="salv"></b></div>
          <input type="range" id="sal" min="0" max="40" step="1" value="35"></div>
        <p class="hint" data-i18n="envNote"></p>
        <div class="toggles">
          <label><input type="checkbox" id="tShade" checked><span data-i18n="tShade"></span></label>
          <label><input type="checkbox" id="tBonds" checked><span data-i18n="tBonds"></span></label>
          <label><input type="checkbox" id="tTherm" checked><span data-i18n="tTherm"></span></label>
        </div>
      </div>

      <div class="card"><h2 data-i18n="vidTitle"></h2><ul class="vids" id="p1vid"></ul></div>

      <div class="card concl">
        <details id="conclBox">
          <summary data-i18n="conclTitle"></summary>
          <ul id="conclList"></ul>
        </details>
      </div>

      <div class="card">
        <details>
          <summary data-i18n="assumeTitle"></summary>
          <ul id="assumeList"></ul>
        </details>
        <details>
          <summary data-i18n="yccdTitle"></summary>
          <ul id="yccdList"></ul>
        </details>
      </div>
    </aside>
  </section>

  <!-- ============ TAB 2: NGUỒN ÂM (TẦN SỐ, BIÊN ĐỘ) ============ -->
  <section class="lab" id="p2" hidden>
    <div class="stage">
      <canvas id="p2cv" aria-label="máy phát âm và loa"></canvas>
      <div class="sliders">
        <div class="slider"><div class="top"><span data-i18n="p2f"></span><b class="num" id="p2fv"></b></div><input type="range" id="p2f" min="0" max="1000" step="1" value="473"></div>
        <div class="slider"><div class="top"><span data-i18n="p2a"></span><b class="num" id="p2av"></b></div><input type="range" id="p2a" min="0" max="100" step="1" value="50"></div>
      </div>
      <div class="controls">
        <button class="btn primary" id="p2sound" aria-pressed="false" data-i18n="soundOn"></button>
        <button class="btn" id="p2slow" aria-pressed="false" data-i18n="p2slow"></button>
        <button class="btn" id="p2hold" data-i18n="hold"></button>
        <button class="btn" id="p2clear" data-i18n="clearHold"></button>
      </div>
      <div class="scopehead">
        <h2 data-i18n="scopeTitle"></h2>
        <label class="freq"><span data-i18n="tdiv"></span>
          <select id="p2tdiv" style="width:auto"></select></label>
      </div>
      <canvas id="p2scope" aria-label="dao động kí"></canvas>
      <p class="hint" data-i18n="p2hint"></p>
    </div>
    <aside>
      <div class="card predict" id="p2pred"></div>
      <div class="card">
        <h2 data-i18n="readTitle"></h2>
        <table><tbody id="p2read"></tbody></table>
        <div class="fb" id="p2zone"></div>
      </div>
      <div class="card"><h2 data-i18n="vidTitle"></h2><ul class="vids" id="p2vid"></ul></div>
      <div class="card concl"><details><summary data-i18n="conclTitle"></summary><ul id="p2concl"></ul></details></div>
      <div class="card">
        <details><summary data-i18n="assumeTitle"></summary><ul id="p2assume"></ul></details>
        <details><summary data-i18n="yccdTitle"></summary><ul id="p2yccd"></ul></details>
      </div>
    </aside>
  </section>

  <!-- ============ TAB 3: PHẢN XẠ ÂM ============ -->
  <section class="lab" id="p3" hidden>
    <div class="stage">
      <div class="seg wide" id="p3mode">
        <button class="btn" data-v="mat" data-i18n="p3modeMat"></button><button class="btn" data-v="echo" data-i18n="p3modeEcho"></button>
      </div>
      <div id="p3matBox" class="stack">
        <div class="chips" id="p3presets"></div>
        <canvas id="p3cv" aria-label="sóng âm gặp vật liệu"></canvas>
        <div class="legend" id="p3legend"></div>
        <div class="controls">
          <button class="btn primary" id="p3send" data-i18n="p3send"></button>
          <div class="seg" id="p3speed"><button class="btn" data-s="0.5">×0,5</button><button class="btn" data-s="1" aria-pressed="true">×1</button></div>
        </div>
        <div class="ebars" id="p3bars"></div>
        <details class="custom">
          <summary data-i18n="p3custom"></summary>
          <div class="sliders">
            <div class="slider"><div class="top"><span data-i18n="p3Z"></span><b class="num" id="p3Zv"></b></div><input type="range" id="p3Z" min="0" max="1000" step="1" value="1000"></div>
            <div class="slider"><div class="top"><span data-i18n="p3G"></span><b class="num" id="p3Gv"></b></div><input type="range" id="p3G" min="0" max="40" step="1" value="0"></div>
            <div class="slider"><div class="top"><span data-i18n="p3Th"></span><b class="num" id="p3Thv"></b></div><input type="range" id="p3Th" min="1" max="16" step="1" value="8"></div>
          </div>
        </details>
      </div>
      <div id="p3echoBox" class="stack" hidden>
        <canvas id="p4cv" aria-label="tiếng vang"></canvas>
        <div class="sliders">
          <div class="slider"><div class="top"><span data-i18n="p4d"></span><b class="num" id="p4dv"></b></div><input type="range" id="p4d" min="2" max="150" step="0.5" value="5"></div>
          <label class="slider"><span data-i18n="p4mat"></span><select id="p4mat"></select></label>
        </div>
        <div class="controls">
          <button class="btn primary" id="p4clap" data-i18n="p4clap"></button>
          <div class="seg" id="p4slow"><button class="btn" data-s="10">×10</button><button class="btn" data-s="30" aria-pressed="true">×30</button><button class="btn" data-s="100">×100</button></div>
          <span class="hint" data-i18n="p4slowLbl"></span>
        </div>
        <h2 data-i18n="p4tlTitle"></h2>
        <canvas id="p4tl" aria-label="âm nghe được theo thời gian"></canvas>
        <p class="hint" data-i18n="p4hint"></p>
      </div>
    </div>
    <aside>
      <div class="card predict" id="p3pred"></div>
      <div class="card" id="p3why">
        <h2 data-i18n="p3whyTitle"></h2>
        <p id="p3whyMat"></p>
        <details><summary data-i18n="p3mechTitle"></summary><ul id="p3mech"></ul></details>
        <details><summary data-i18n="p3simpleTitle"></summary><ul id="p3simple"></ul></details>
      </div>
      <div class="card" id="p4echoRead" hidden>
        <h2 data-i18n="readTitle"></h2>
        <table><tbody id="p4read"></tbody></table>
        <div class="fb" id="p4verdict"></div>
      </div>
      <div class="card">
        <h2 data-i18n="p4refTitle"></h2>
        <ul class="plain" id="p4ref"></ul>
      </div>
      <div class="card"><h2 data-i18n="vidTitle"></h2><ul class="vids" id="p3vid"></ul></div>
      <div class="card concl"><details><summary data-i18n="conclTitle"></summary><ul id="p3concl"></ul></details></div>
      <div class="card">
        <details><summary data-i18n="assumeTitle"></summary><ul id="p3assume"></ul></details>
        <details><summary data-i18n="yccdTitle"></summary><ul id="p3yccd"></ul></details>
      </div>
    </aside>
  </section>

  <!-- ============ TAB 4: ỨNG DỤNG ============ -->
  <section id="p4" hidden>
    <div class="apps">
      <article class="card app wide-app">
        <h2 data-i18n="a1t"></h2>
        <div class="appgrid">
          <div class="stack">
            <canvas id="p4sea" aria-label="đo độ sâu biển"></canvas>
            <div class="controls">

  vacuum:{g:'none'},

  const m = MEDIA[key];

  if (m.g === 'gas') return Math.sqrt(m.gamma * R_GAS * (S.tempC + 273.15) / m.M);
  if (key === 'water') return medwin(S.tempC, 0);
  if (m.brine) return medwin(S.tempC, S.sal);

}

const DT = 1/4000;     // bước tích phân (giây hình)

function rng(seed){ let x = seed >>> 0 || 1; return () => (x = (x * 1664525 + 1013904223) >>> 0) / 4294967296; }

}

  const w = cv.clientWidth, small = w < 560;

  c.font = `600 ${G.small?12:14}px ${getComputedStyle(document.body).fontFamily}`;
  lanes.forEach((l, li) => {
    const top = laneTop(li), m = MEDIA[l.key].g, y0 = top + G.head, yb = top + G.laneH - 4;
    c.fillStyle = colors.panel; c.fillRect(0, top, G.w, G.laneH);
    c.strokeStyle = colors.line; c.lineWidth = 1; c.strokeRect(0.5, top+0.5, G.w-1, G.laneH-1);
    // vùng nén, dãn
    if (S.shade && m !== 'none'){
      for (let i = 0; i < N; i++){
        const e = l.u[i+1] - l.u[i]; const a = Math.min(1, Math.abs(e)/AMP*1.4) * 0.38; if (a < 0.02) continue;
        const xa = G.x0 + (i + l.u[i]) * G.aPx, xb = G.x0 + (i + 1 + l.u[i+1]) * G.aPx;
        c.fillStyle = `rgba(${e < 0 ? colors.comp : colors.rare},${a})`; c.fillRect(xa, y0-2, xb-xa, yb-y0+2);
      }
    }
    // micrô
    const xd = G.x0 + DET * G.aPx;
    c.setLineDash([3,4]); c.strokeStyle = colors.muted; c.beginPath(); c.moveTo(xd, y0-2); c.lineTo(xd, yb); c.stroke(); c.setLineDash([]);
    c.fillStyle = l.lit ? colors.ok : colors.line; c.beginPath(); c.arc(xd, top + G.head/2, G.small?6:7, 0, 6.283); c.fill();
    // nhãn làn
    c.fillStyle = colors.ink; c.textBaseline = 'middle'; c.textAlign = 'left';
    let lab = `${T('lane')} ${li+1} · ${T('media')[l.key]}`;
    if (!S.hide && m !== 'none') lab += ` · ${fmt(speedOf(l.key))} m/s`;
    c.fillText(lab, 8, top + G.head/2 + 1);
    if (l.det.tArr !== null && !S.hide){ c.textAlign = 'right'; c.fillStyle = colors.ok; c.fillText(`${fmtSig(l.det.tArr*1000,3)} ms`, xd - 12, top + G.head/2 + 1); }
    if (S.cont && m !== 'none' && !S.hide){ c.textAlign = 'right'; c.fillStyle = colors.muted; c.fillText(tpl(T('lambda'), { l: fmtSig(speedOf(l.key)/S.f, 3) }), G.w - 8, top + G.head/2 + 1); }
    // hạt
    if (m === 'none'){
      c.fillStyle = colors.muted; c.textAlign = 'center'; c.font = `500 ${G.small?12:15}px ${getComputedStyle(document.body).fontFamily}`;
      c.fillText(T('vacuumMsg'), (G.x0 + G.w)/2, (y0 + yb)/2);
      c.font = `600 ${G.small?12:14}px ${getComputedStyle(document.body).fontFamily}`;
    } else {
      const col = m === 'solid' ? colors.solid : m === 'liquid' ? colors.liquid : colors.gas;
      const ionP = MEDIA[l.key].brine ? S.sal/40*0.16 : 0;
      if (m === 'solid' && S.bonds){
        c.strokeStyle = col; c.globalAlpha = 0.35; c.lineWidth = 1; c.beginPath();
        for (const p of l.P){
          const a = particleXY(l, p, li);
          if (p.i < N){ const q = l.P[(p.i)*ROWS + p.k]; const b = particleXY(l, q, li); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); }
          if (p.k < ROWS-1){ const q = l.P[(p.i-1)*ROWS + p.k + 1]; const b = particleXY(l, q, li); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); }
        }
        c.stroke(); c.globalAlpha = 1;
        // nối hàng đầu với pít-tông
        c.beginPath(); c.globalAlpha = 0.35;
        for (let k = 0; k < ROWS; k++){ const a = particleXY(l, l.P[k], li); c.moveTo(G.x0 + l.u[0]*G.aPx, a.y); c.lineTo(a.x, a.y); }
        c.stroke(); c.globalAlpha = 1;
      }
      for (const p of l.P){
        const isMark = p.i === l.mark.i && p.k === l.mark.k;
        if (m === 'gas' && p.vis > 0.38 && !isMark) continue;
        const a = particleXY(l, p, li);
        let fill = col, r = rad;
        if (ionP && p.ion < ionP){ fill = (p.i + p.k) % 2 ? colors.na : colors.cl; r = rad*1.15; }
        if (isMark){
          c.setLineDash([2,2]); c.strokeStyle = colors.mark; c.lineWidth = 1.4; c.beginPath(); c.arc(a.eqx, a.eqy, rad+2.5, 0, 6.283); c.stroke(); c.setLineDash([]);
          continue;
        }
        c.fillStyle = fill; c.beginPath(); c.arc(a.x, a.y, r, 0, 6.283); c.fill();
      }
      const mp = l.P[(l.mark.i-1)*ROWS + l.mark.k], a = particleXY(l, mp, li);
      c.fillStyle = colors.mark; c.beginPath(); c.arc(a.x, a.y, rad*1.35, 0, 6.283); c.fill();
    }
    // pít-tông
    const xp = G.x0 + l.u[0]*G.aPx;
    c.fillStyle = colors.solid; c.fillRect(xp - G.pw, y0 - 2, G.pw, yb - y0 + 2);
    c.strokeStyle = colors.panel; c.lineWidth = 1.5; c.beginPath();
    for (let g = 0; g < 3; g++){ const gx = xp - G.pw*0.25 - g*G.pw*0.22; c.moveTo(gx, (y0+yb)/2 - 10); c.lineTo(gx, (y0+yb)/2 + 10); }
    c.stroke();
  });
  // thước đo
  const ry = laneTop(4) - G.gap + 10, xd = G.x0 + DET*G.aPx;
  c.strokeStyle = colors.muted; c.fillStyle = colors.muted; c.lineWidth = 1; c.textAlign = 'center'; c.textBaseline = 'top';
  c.beginPath(); c.moveTo(G.x0, ry); c.lineTo(xd, ry);
  for (let j = 0; j <= 10; j++){ const x = G.x0 + j*(xd - G.x0)/10; c.moveTo(x, ry); c.lineTo(x, ry + (j%5 ? 4 : 8)); }
  c.stroke();
  c.font = `500 ${G.small?11:13}px ${getComputedStyle(document.body).fontFamily}`;
  c.fillText('0', G.x0, ry + 10); c.fillText(`${fmt(0.5,1)} m`, (G.x0+xd)/2, ry + 10); c.fillText('1 m', xd, ry + 10);
}

const $ = id => document.getElementById(id);
function buildLaneSel(){
  const box = $('lanesel'); box.innerHTML = '';
  lanes.forEach((l, li) => {
    const lab = document.createElement('label');
    lab.innerHTML = `<span>${T('lane')} ${li+1}</span>`;
    const sel = document.createElement('select'); sel.id = 'lane' + li;
    for (const g of ['solid','liquid','gas','none']){
      const og = document.createElement('optgroup'); og.label = T('groups')[g];
      for (const k of ORDER[g]){ const o = document.createElement('option'); o.value = k; o.textContent = T('media')[k]; og.appendChild(o); }
      sel.appendChild(og);
    }
    sel.value = l.key;
    sel.onchange = () => { const mark = l.mark; lanes[li] = makeLane(sel.value, li); lanes[li].mark = mark; S.pred = null; renderPred(); renderResults(); renderLegend(); };
    lab.appendChild(sel); box.appendChild(lab);
  });
}
function renderLegend(){
  const used = new Set(lanes.map(l => MEDIA[l.key].g)), brine = lanes.some(l => MEDIA[l.key].brine);
  const it = [];
  if (used.has('solid')) it.push(['--solid','lgSolid']);
  if (used.has('liquid')) it.push(['--liquid','lgLiquid']);
  if (used.has('gas')) it.push(['--gas','lgGas']);
  if (brine){ it.push(['--na','lgNa']); it.push(['--cl','lgCl']); }
  it.push(['--mark','lgMark']);
  let h = it.map(([c,k]) => `<span><i class="dot" style="background:var(${c})"></i>${T(k)}</span>`).join('');
  if (S.shade) h += `<span><i class="dot" style="border-radius:2px;background:rgba(var(--compress),.45)"></i>${T('lgComp')}</span><span><i class="dot" style="border-radius:2px;background:rgba(var(--rare),.45)"></i>${T('lgRare')}</span>`;
  $('legend').innerHTML = h;
}
function renderResults(){
  const rows = lanes.map((l, li) => {
    const v = speedOf(l.key), t = l.det.tArr, none = MEDIA[l.key].g === 'none';
    return `<tr><td>${li+1}</td><td>${T('media')[l.key]}</td><td class="n sec">${none ? '0' : fmt(v)}</td><td class="n sec">${t !== null ? fmtSig(t*1000,3)+' ms' : '—'}</td><td class="n sec">${t !== null ? fmt(DIST/t) : '—'}</td></tr>`;
  }).join('');
  $('resBody').innerHTML = rows;
  const vmax = 6500;
  $('bars').innerHTML = lanes.map((l, li) => { const v = speedOf(l.key); return `<div class="bar"><span>${li+1}. ${T('media')[l.key]}</span><span><i style="width:${Math.max(0.5, v/vmax*100)}%"></i></span><span class="n">${fmt(v)} m/s</span></div>`; }).join('');
}
function arrivalOrder(){
  return lanes.map((l, li) => ({ li, t:l.det.tArr, none:MEDIA[l.key].g === 'none' })).filter(o => !o.none && o.t !== null).sort((a,b) => a.t - b.t);
}
function laneName(li){ return `${T('lane')} ${li+1} (${T('media')[lanes[li].key]})`; }
function onArrival(){
  renderResults();
  const pending = lanes.some(l => MEDIA[l.key].g !== 'none' && l.det.st !== 'done');
  if (!pending){ S.predDone = true; renderPred(); }
}
function renderPred(){
  const box = $('predChoices'); box.innerHTML = '';
  const ord = S.predDone ? arrivalOrder() : [];
  const first = ord.length ? ord[0].li : null;
  lanes.forEach((l, li) => {
    const b = document.createElement('button'); b.className = 'btn'; b.textContent = laneName(li);
    b.setAttribute('aria-pressed', S.pred === li ? 'true' : 'false');
    if (S.predDone && S.pred !== null){ if (ord.length && Math.abs(lanes[li].det.tArr - ord[0].t) < 1e-9) b.classList.add('right'); else if (li === S.pred) b.classList.add('wrong'); }
    b.onclick = () => { S.pred = li; S.predDone = false; renderPred(); };
    box.appendChild(b);
  });
  const fb = $('predFb'); fb.className = 'fb';
  if (S.predDone && ord.length){
    let s = '';
    if (S.pred !== null){
      const ok = Math.abs((lanes[S.pred].det.tArr ?? Infinity) - ord[0].t) < 1e-9;
      s = tpl(T(ok ? 'predRight' : 'predWrong'), { m: laneName(first), g: laneName(S.pred) }) + ' ';
      fb.classList.add(ok ? 'good' : 'bad');
    }
    s += tpl(T('order'), { o: ord.map(o => T('media')[lanes[o.li].key]).join(' → ') });
    lanes.forEach(l => { if (MEDIA[l.key].g === 'none') s += ' ' + tpl(T('noSound'), { m: T('media')[l.key] }); });
    fb.textContent = s;
  } else fb.textContent = S.pred === null ? T('predWait') : tpl(T('predChosen'), { m: laneName(S.pred) });
}
function renderQ2(){
  const fb = $('q2Fb');
  document.querySelectorAll('#q2Choices .btn').forEach(b => { b.classList.remove('right','wrong'); if (S.q2 && b.dataset.a === S.q2) b.classList.add(S.q2 === 'osc' ? 'right' : 'wrong'); });
  if (!S.q2){ fb.hidden = true; return; }
  fb.hidden = false; fb.className = 'fb ' + (S.q2 === 'osc' ? 'good' : 'bad'); fb.textContent = T(S.q2 === 'osc' ? 'q2good' : 'q2bad');
}

// Kéo pít-tông, chạm để đánh dấu hạt
function ptr(e){ const r = cv.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  const p = ptr(e), li = Math.floor((p.y - G.top) / (G.laneH + G.gap));
  if (li < 0 || li > 3) return;
  const xp = G.x0 + S.dragU * G.aPx;
  if (p.x < xp + G.aPx*1.2){
    if (S.cont) setCont(false);
    S.tStrike = null; lanes.forEach(l => { l.det = { st:'wait', mx:0, tm:0, tArr:null }; });
    S.drag = { x0:p.x, u0:S.dragU }; S.ret = null; S.running = true; updRun(); cv.setPointerCapture(e.pointerId); e.preventDefault(); return;
  }
  const l = lanes[li]; if (MEDIA[l.key].g === 'none') return;
  let best = null, bd = 1e9;
  for (const q of l.P){ if (MEDIA[l.key].g === 'gas' && q.vis > 0.38) continue; const a = particleXY(l, q, li); const d = (a.x-p.x)**2 + (a.y-p.y)**2; if (d < bd){ bd = d; best = q; } }
  if (best && bd < (G.aPx*3)**2) l.mark = { i:best.i, k:best.k };
});
cv.addEventListener('pointermove', e => {
  if (!S.drag) return;
  const p = ptr(e); S.dragU = Math.max(-1.2, Math.min(1.2, S.drag.u0 + (p.x - S.drag.x0) / G.aPx));
});
const endDrag = () => { if (!S.drag) return; S.drag = null; S.ret = { t0:S.t, u0:S.dragU, dur: 0.6 }; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// Vòng lặp: bước cố định
let last = performance.now(), acc = 0;
function loop(now){
  const fdt = Math.min((now - last)/1000, 0.1); last = now;
  if (S.running && curTab === 1){
    acc += fdt * S.play; S.tj += fdt * S.play;
    let n = 0; while (acc >= DT && n < 2000){ step(DT); acc -= DT; n++; }
    if (n >= 2000) acc = 0;
  }
  lanes.forEach(l => { if (l.lit && Math.abs(l.u[DET]) < 0.05*AMP) l.lit = Math.max(0, l.lit - fdt*1.5); });
  // đồng hồ thời gian thực
  let tr = 0;
  if (S.tStrike !== null){
    tr = (S.t - S.tStrike) / S.slow;
    const pend = lanes.some(l => MEDIA[l.key].g !== 'none' && l.det.st !== 'done');
    if (!pend){ const ts = lanes.map(l => l.det.tArr).filter(t => t !== null); if (ts.length) tr = Math.max(...ts); }
  } else if (S.cont) tr = (S.t - S.tCont0) / S.slow;
  $('clock').textContent = S.hide ? '—' : `${fmt(tr*1000, 3)} ms`;
  if (curTab === 1) render(); else FRAMES[curTab](fdt);
  requestAnimationFrame(loop);
}

  why:{
    concrete:'Concrete particles are heavy and tightly bound. Air pushing on it is like a ping-pong ball hitting a wall: the wall barely moves, so almost all the sound bounces back. Very little enters the wall.',

const FONT = '"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif', MONO = '"IBM Plex Mono",ui-monospace,Consolas,monospace';

}

  let osc = null, gn = null;
  return {
    get on(){ return !!osc; },
    start(f, g){ const a = ac(); if (!a) return; this.stop(); osc = a.createOscillator(); gn = a.createGain(); osc.type = 'sine'; osc.frequency.value = f; gn.gain.value = 0;
      osc.connect(gn).connect(a.destination); osc.start(); gn.gain.setTargetAtTime(g, a.currentTime, 0.03); },
    set(f, g){ if (!osc) return; osc.frequency.setTargetAtTime(f, AC.currentTime, 0.02); gn.gain.setTargetAtTime(g, AC.currentTime, 0.04); },
    stop(){ if (!osc) return; const o = osc, gg = gn; gg.gain.setTargetAtTime(0, AC.currentTime, 0.02); setTimeout(() => { try { o.stop(); } catch(e){} }, 250); osc = null; gn = null; }
  };
}
function burst(delay, gain, dur = 0.025){
  const a = ac(); if (!a) return;
  const n = Math.round(a.sampleRate * dur * 5), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * Math.exp(-i / (a.sampleRate*dur));
  const s = a.createBufferSource(), g = a.createGain(); s.buffer = buf; g.gain.value = gain; s.connect(g).connect(a.destination); s.start(a.currentTime + delay);
}
function drawScope(c, x, y, w, h, o){
  c.fillStyle = colors.lane; c.fillRect(x, y, w, h);
  c.strokeStyle = colors.line; c.lineWidth = 1; c.beginPath();
  for (let i = 0; i <= 10; i++){ const xx = Math.round(x + i*w/10) + 0.5; c.moveTo(xx, y); c.lineTo(xx, y+h); }
  for (let j = 0; j <= 8; j++){ const yy = Math.round(y + j*h/8) + 0.5; c.moveTo(x, yy); c.lineTo(x+w, yy); }
  c.stroke();
  c.strokeStyle = colors.muted; c.globalAlpha = 0.5; c.beginPath(); c.moveTo(x, y+h/2); c.lineTo(x+w, y+h/2); c.stroke(); c.globalAlpha = 1;
  const plot = (amp, f, color, dash) => {
    const span = 10*o.tDiv, cycles = span*f;
    c.strokeStyle = color; c.lineWidth = dash ? 1.5 : 2.2; c.setLineDash(dash ? [5,4] : []);
    const ay = Math.max(-h/2, Math.min(h/2, amp / o.yDiv * h/8));
    if (cycles > w/3){ c.fillStyle = color; c.globalAlpha = 0.35; c.fillRect(x, y + h/2 - Math.abs(ay), w, 2*Math.abs(ay)); c.globalAlpha = 1; c.setLineDash([]); return true; }

    for (let k = 0; k <= n; k++){

      const yy = y + h/2 - Math.max(-h/2, Math.min(h/2, v / o.yDiv * h/8));

  };

  const crowded = plot(o.amp, o.f, colors.accent, false);
  c.font = `600 13px ${MONO}`; c.textBaseline = 'top'; c.textAlign = 'left';
  const lbl = (s, xx, yy) => { const m = c.measureText(s).width; c.fillStyle = colors.panel; c.globalAlpha = 0.85; c.fillRect(xx-3, yy-2, m+6, 18); c.globalAlpha = 1; c.fillStyle = colors.ink; c.fillText(s, xx, yy); };

}

// vật liệu xốp có ma sát −γv. Đo năng lượng phản xạ (về nguồn), truyền qua (ra đầu kia), hấp thụ (công ma sát).
const PRESETS = {
  concrete:{ Z:20000, g:0, th:8, look:'solid' }, water:{ Z:3600, g:0, th:12, look:'liquid' }, wood:{ Z:5000, g:0, th:2, look:'solid' },
  curtain:{ Z:2, g:0.6, th:2, look:'cloth' }, foam:{ Z:1.3, g:2.5, th:14, look:'foam' }, foamwall:{ Z:1.3, g:2.5, th:10, wall:4, look:'foam' },

  const ks = new Float64Array(N); for (let i = 0; i < N; i++) ks[i] = 2*k[i]*k[i+1]/(k[i] + k[i+1]);

function step3(dt){

    const e = s.u[i+1] - s.u[i], al = Math.min(1, Math.abs(e)/M3.AMP*1.5) * 0.35; if (al < 0.02) continue;

}

  cv.addEventListener('pointermove', e => { if (!P4.drag) return; const r = cv.getBoundingClientRect(); const d = (e.clientX - r.left - P4.geo.px) / P4.geo.scale; P4.d = Math.max(2, Math.min(150, Math.round(d*2)/2)); $('p4d').value = P4.d; upd4echo(); });
  const end = () => { P4.drag = false; }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}

/* ================= TAB 4: ứng dụng ================= */
const SEA_W = 2000;
function seaDepth(x){ const d = 140 + 45*Math.sin(2*Math.PI*x/900) + 25*Math.sin(2*Math.PI*x/330 + 1) - 60*Math.exp(-(((x - 1400)/120)**2)); return Math.max(15, d); }
const vSea = () => medwin(S.tempC, 35);
function upd4(){
  $('p4given').textContent = tpl(T('p4given'), { v: fmt(vSea()) });
  const lt = P4.lastT;
  rows('p4sread', [[T('rowTs'), lt ? fmtT(lt.t) : '—'], [T('rowH'), lt && P4.show ? `${fmt(lt.h, 1)} m` : '?']]);
  $('p4show').setAttribute('aria-pressed', P4.show);
}
function drawSea(dt){
  const cv = $('p4sea'), small = cv.clientWidth < 560, { c, w, h } = fit(cv, small ? 260 : 320);
  const sy = 52, maxD = 240, Y = d => sy + d/maxD*(h - sy - 8), X = x => x/SEA_W*w;
  c.fillStyle = colors.lane; c.fillRect(0, 0, w, sy);
  c.fillStyle = rgba(colors.comp, 0.12); c.fillRect(0, sy, w, h - sy);
  c.fillStyle = rgba(colors.rare, 0.55); c.beginPath(); c.moveTo(0, h);
  for (let px = 0; px <= w; px += 3) c.lineTo(px, Y(seaDepth(px/w*SEA_W)));
  c.lineTo(w, h); c.closePath(); c.fill();
  c.fillStyle = colors.muted; c.font = `500 11px ${MONO}`; c.textAlign = 'left'; c.textBaseline = 'middle';
  [50,100,150,200].forEach(d => { c.globalAlpha = 0.5; c.fillRect(0, Y(d), 8, 1); c.globalAlpha = 1; c.fillText(`${d} m`, 10, Y(d)); });
  P4.pings.forEach(p => { c.fillStyle = colors.mark; c.beginPath(); c.arc(X(p.x), Y(p.h), 4, 0, 6.283); c.fill(); });
  if (P4.pings.length > 1){ const ps = [...P4.pings].sort((a,b) => a.x - b.x); c.strokeStyle = colors.mark; c.lineWidth = 1.5; c.setLineDash([4,3]); c.beginPath(); ps.forEach((p, i) => i ? c.lineTo(X(p.x), Y(p.h)) : c.moveTo(X(p.x), Y(p.h))); c.stroke(); c.setLineDash([]); }
  const xs = X(P4.shipX*SEA_W);
  c.fillStyle = colors.ink; c.beginPath(); c.moveTo(xs - 34, sy - 16); c.lineTo(xs + 34, sy - 16); c.lineTo(xs + 24, sy); c.lineTo(xs - 24, sy); c.closePath(); c.fill();
  c.fillRect(xs - 10, sy - 30, 22, 14); c.fillStyle = colors.accent; c.fillRect(xs - 4, sy - 2, 8, 6);
  c.fillStyle = colors.muted; c.font = `500 12px ${FONT}`; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText(T('surface'), 8, sy - 18);
  if (P4.ping){
    const pg = P4.ping; pg.ta += dt;
    const tr = pg.ta / 10, R = vSea()*tr, D = seaDepth(pg.x), xp = X(pg.x);
    c.lineWidth = 3;
    if (R < D){ c.strokeStyle = colors.accent; c.beginPath(); c.arc(xp, sy, (Y(R) - sy), Math.PI*0.35, Math.PI*0.65); c.stroke(); }
    else if (R < 2*D){ const up = 2*D - R; c.strokeStyle = colors.mark; c.beginPath(); c.arc(xp, Y(D), (Y(D) - Y(up)), Math.PI*1.35, Math.PI*1.65); c.stroke(); }
    else { const t = 2*D/vSea(); P4.lastT = { t, h:D }; P4.pings.push({ x:pg.x, h:vSea()*t/2 }); P4.ping = null; upd4(); }
  }
}
function frame4(dt){ drawSea(dt); }
function bind4(){
  $('p4ping').onclick = () => { if (!P4.ping) P4.ping = { x:P4.shipX*SEA_W, ta:0 }; };
  $('p4show').onclick = () => { P4.show = !P4.show; upd4(); };
  $('p4clearMap').onclick = () => { P4.pings = []; upd4(); };
  $('p4check').onclick = () => {
    const fb = $('p4sfb'); fb.hidden = false; const lt = P4.lastT;
    if (!lt){ fb.className = 'fb'; fb.textContent = T('p4need'); return; }
    const a = parseFloat(String($('p4ans').value).replace(',', '.'));
    const ok = isFinite(a) && Math.abs(a - lt.h)/lt.h < 0.02;
    fb.className = 'fb ' + (ok ? 'good' : 'bad'); fb.textContent = ok ? tpl(T('p4right'), { h: fmt(lt.h, 1) }) : T('p4wrong');
  };
  const sea = $('p4sea');
  sea.addEventListener('pointerdown', e => { if (P4.ping) return; const r = sea.getBoundingClientRect(); if (e.clientY - r.top > 90) return; P4.sdrag = true; sea.setPointerCapture(e.pointerId); P4.shipX = Math.max(0.03, Math.min(0.97, (e.clientX - r.left)/r.width)); });
  sea.addEventListener('pointermove', e => { if (!P4.sdrag || P4.ping) return; const r = sea.getBoundingClientRect(); P4.shipX = Math.max(0.03, Math.min(0.97, (e.clientX - r.left)/r.width)); });
  const end2 = () => { P4.sdrag = false; }; sea.addEventListener('pointerup', end2); sea.addEventListener('pointercancel', end2);
}
