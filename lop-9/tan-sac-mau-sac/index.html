<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lăng kính và màu sắc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Phòng thí nghiệm lăng kính, tán sắc và màu sắc (KHTN 9): dải video thực tế, sân khấu canvas bên trái, sổ ghi chép bên phải. Điện thoại xếp một cột.
   Cùng hệ màu, phông với bộ mô phỏng KHTN 6–9. Phòng tối (tán sắc, cầu vồng) luôn nền tối để màu ánh sáng hiện đúng. */
:root{
  --bg:#edf0f3; --panel:#ffffff; --lane:#f4f6f9; --ink:#141c26; --muted:#556170; --line:#c9d1db;
  --accent:#1d5fa8; --accent-ink:#ffffff; --ok:#1d8a4b; --warn:#c2410c;
  --force:#d1323b; --vel:#1f6fd1; --glass:#9cc9e6; --glass2:#3d7fae; --normal:#7a8696;
  --space:#0d1626; --star:#e9eef7; --dark:#05080d; --gold:#c99a2e; --wood:#b07a45; --sky:#8fc3ea; --ground:#6d9a58;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --panel:#161e28; --lane:#111821; --ink:#e3e9f0; --muted:#97a3b2; --line:#2a3644;
  --accent:#5ea6ec; --accent-ink:#04182c; --ok:#47c47d; --warn:#f08a4b;
  --force:#ff5f67; --vel:#5aa2ff; --glass:#3e6f8f; --glass2:#7fb8e0; --normal:#8d99ab;
  --space:#060a12; --star:#cfd8e6; --dark:#03050a; --gold:#e0b24a; --wood:#9a6a3c; --sky:#2f5f88; --ground:#3f6436;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --panel:#161e28; --lane:#111821; --ink:#e3e9f0; --muted:#97a3b2; --line:#2a3644;
  --accent:#5ea6ec; --accent-ink:#04182c; --ok:#47c47d; --warn:#f08a4b;
  --force:#ff5f67; --vel:#5aa2ff; --glass:#3e6f8f; --glass2:#7fb8e0; --normal:#8d99ab;
  --space:#060a12; --star:#cfd8e6; --dark:#03050a; --gold:#e0b24a; --wood:#9a6a3c; --sky:#2f5f88; --ground:#3f6436;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(25px,3.4vw,36px);line-height:1.15;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
.btn{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{min-height:40px;padding:4px 12px;font-size:14px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg .btn{border:0;border-radius:0;min-width:52px}
.seg .btn i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-size:15px;font-weight:600;white-space:nowrap;min-height:46px;padding:8px 14px;border:0;border-bottom:3px solid transparent;
  background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.req{margin:0;font-size:14px;color:var(--muted);max-width:110ch}
.req b{color:var(--ink);font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:1020px){.lab{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0}
canvas{display:block;width:100%;border-radius:8px;background:var(--lane);touch-action:pan-y;user-select:none;-webkit-user-select:none}
canvas.drk{background:var(--dark)}
.hint{margin:0;font-size:14px;color:var(--muted)}
.status{margin:0;font-weight:600;min-height:1.5em}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:6px;vertical-align:middle}
.sl{display:flex;flex-direction:column;gap:4px}
.sl .top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.sl .val{font-family:var(--font-num);font-weight:600;text-align:right}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);margin:0}
.kv{display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:4px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kv dd.t{font-family:var(--font-ui);font-weight:600;white-space:normal;grid-column:1/-1;text-align:left;margin:-2px 0 4px 12px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts .btn{text-align:left;font-size:14px}
.opts .btn.picked{border:2px solid var(--accent)}
.opts .btn.right{background:color-mix(in srgb,var(--ok) 18%,var(--panel));border-color:var(--ok)}
.opts .btn.wrong{background:color-mix(in srgb,var(--warn) 14%,var(--panel));border-color:var(--warn)}
.ans{background:var(--lane);border-left:4px solid var(--ok);padding:8px 12px;border-radius:6px;font-size:15px}
.muted{color:var(--muted);font-size:14px}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:0 14px}
details[open]{padding-bottom:12px}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;font-size:15px}
details p,details ul,details ol{margin:6px 0;font-size:15px;max-width:95ch}
details ul,details ol{padding-left:22px}
details li{margin:3px 0}
details h3{font-size:15px;margin:12px 0 2px}
.fine{font-size:13px;color:var(--muted);margin:0}
.tblwrap{overflow-x:auto}
table.log{border-collapse:collapse;width:100%;font-size:14px}
table.log th,table.log td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.log th{color:var(--muted);font-weight:600}
table.log td.n{font-family:var(--font-num);text-align:right;white-space:nowrap}
table.log th.n{text-align:right}
table.log .sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--warn);font-weight:700}
.chal{display:flex;flex-direction:column;gap:6px}
.chal div{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.chal b{font-size:18px;line-height:1.3;width:22px;flex:none;text-align:center}
.chal .done{color:var(--ok)}
.objs{display:flex;flex-wrap:wrap;gap:6px}
.objs .btn{font-size:14px;padding:6px 10px}
.objs .btn.on{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.swatch{display:flex;gap:10px;align-items:center}
.swatch{flex-wrap:wrap}.swatch i{display:inline-block;width:44px;height:30px;border-radius:6px;border:1px solid var(--line);flex:none}
.q5{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.q5:first-child{border-top:0;padding-top:0}
.q5 p{margin:0;font-weight:600}
.score{font-family:var(--font-num);font-size:clamp(26px,4vw,40px);font-weight:600;line-height:1.1}
/* Dải video thực tế: thumbnail bấm là phát ngay trong trang */
.vbox{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;align-items:start;background:var(--space);color:var(--star);border-radius:var(--r);padding:12px}
.vbox.playing{grid-template-columns:minmax(0,1fr)}
@media (max-width:720px){.vbox{grid-template-columns:minmax(0,1fr)}}
.vmedia{position:relative;width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#1e2c44,#0b111c)}
.vbox.playing .vmedia{max-width:860px}
.thumb{all:unset;cursor:pointer;position:absolute;inset:0;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;left:10px;bottom:8px;font-size:13px;opacity:.75}
.thumb .pbtn{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--force);box-shadow:0 2px 12px rgba(0,0,0,.4)}
.thumb .pbtn::before{content:"";position:absolute;left:25px;top:20px;border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #fff}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font:600 13px var(--font-num);padding:2px 6px;border-radius:4px}
.thumb:focus-visible{outline:3px solid var(--star);outline-offset:-3px}
.player{position:absolute;inset:0}
.player video,.player iframe{width:100%;height:100%;border:0;display:block;background:#000}
.vt{display:flex;flex-direction:column;gap:4px;min-width:0}
.vt .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;font-weight:600}
.vt .ttl{font-weight:700;font-size:16px;line-height:1.3}
.vt .look{font-size:14px;opacity:.92}
.vt .src{font-size:12.5px;opacity:.7}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font:inherit;font-size:14px;font-weight:600;min-height:40px;padding:6px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;
  background:transparent;color:var(--star);border:1px solid color-mix(in srgb,var(--star) 45%,transparent)}
.chip.on{background:var(--star);color:var(--space)}
/* Chế độ giáo viên: che số liệu để lớp dự đoán */
body.hideNums .num{filter:blur(7px);user-select:none}
body.hideNums .num:hover{filter:none}
footer{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="hbtns">
      <button class="btn" id="gvBtn" aria-pressed="false" data-i18n="gvBtn"></button>
      <button class="btn" id="langBtn">EN</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="1" data-i18n="tab1"></button>
    <button role="tab" data-tab="2" data-i18n="tab2"></button>
    <button role="tab" data-tab="3" data-i18n="tab3"></button>
    <button role="tab" data-tab="4" data-i18n="tab4"></button>
    <button role="tab" data-tab="5" data-i18n="tab5"></button>
  </nav>

  <!-- ===================== TAB 1: ĐƯỜNG ĐI CỦA TIA SÁNG QUA LĂNG KÍNH ===================== -->
  <section id="t1" class="col">
    <p class="req" data-i18n-html="req1"></p>
    <div class="vbox" id="v1"></div>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint1"></p>
        <canvas id="cv1" class="drag" aria-label="laser beam through a triangular prism"></canvas>
        <div class="controls">
          <div class="seg" id="col1"></div>
          <button class="btn" id="draw1" aria-pressed="false" data-i18n="draw1"></button>
          <button class="btn primary" id="chk1" data-i18n="chk1" hidden></button>
          <button class="btn" id="rst1" data-i18n="reset"></button>
        </div>
        <p class="status" id="st1"></p>
        <canvas id="gr1" aria-label="graph of deviation angle against angle of incidence"></canvas>
        <div class="legend">
          <span><i style="background:var(--force)"></i><span data-i18n="lgD"></span></span>
          <span><i style="background:var(--normal)"></i><span data-i18n="lgN"></span></span>
        </div>
        <p class="fine" data-i18n="assume1"></p>
      </div>
      <div class="col">
        <div class="card" id="p1"></div>
        <div class="card"><h2 data-i18n="data"></h2><dl class="kv" id="kv1"></dl></div>
        <div class="card">
          <div><div class="muted" data-i18n="setMat"></div><div class="seg" id="mat1"></div></div>
          <div class="sl"><div class="top"><span data-i18n="setA"></span><span class="val" id="a1V"></span></div>
            <input type="range" id="a1" min="30" max="75" step="1" value="60"></div>
          <div class="sl"><div class="top"><span data-i18n="setI"></span><span class="val" id="i1V"></span></div>
            <input type="range" id="i1" min="-60" max="85" step="0.5" value="48"></div>
        </div>
        <div class="card" id="p1b"></div>
        <div class="card" id="c1"></div>
      </div>
    </div>
    <details><summary data-i18n="whyT"></summary><div data-i18n-html="why1"></div></details>
    <details><summary data-i18n="misT"></summary><div data-i18n-html="mis1"></div></details>
  </section>

  <!-- ===================== TAB 2: TÁN SẮC ÁNH SÁNG TRẮNG ===================== -->
  <section id="t2" class="col" hidden>
    <p class="req" data-i18n-html="req2"></p>
    <div class="vbox" id="v2"></div>
    <div class="lab">
      <div class="stage">
        <div class="controls"><div class="seg" id="mode2"></div></div>
        <p class="hint" id="hint2"></p>
        <canvas id="cv2" class="drk drag" aria-label="white light dispersed by a prism in a dark room"></canvas>
        <p class="muted" data-i18n="scr2T"></p>
        <canvas id="cv2s" class="drk" aria-label="enlarged view of the screen"></canvas>
        <p class="status" id="st2"></p>
        <div class="tblwrap"><table class="log" id="tb2"></table></div>
        <p class="fine" data-i18n="assume2"></p>
      </div>
      <div class="col">
        <div class="card" id="p2"></div>
        <div class="card">
          <div><div class="muted" data-i18n="setSrc"></div><div class="seg" id="src2"></div></div>
          <div><div class="muted" data-i18n="setMat"></div><div class="seg" id="mat2"></div></div>
          <div class="sl"><div class="top"><span data-i18n="setRot"></span><span class="val" id="r2V"></span></div>
            <input type="range" id="r2" min="-20" max="20" step="0.5" value="0"></div>
          <div class="sl"><div class="top"><span data-i18n="setW"></span><span class="val" id="w2V"></span></div>
            <input type="range" id="w2" min="1" max="12" step="1" value="2"></div>
        </div>
        <div class="card" id="p2b"></div>
        <div class="card" id="c2"></div>
      </div>
    </div>
    <details><summary data-i18n="whyT"></summary><div data-i18n-html="why2"></div></details>
    <details><summary data-i18n="misT"></summary><div data-i18n-html="mis2"></div></details>
  </section>

  <!-- ===================== TAB 3: MÀU SẮC CỦA VẬT ===================== -->
  <section id="t3" class="col" hidden>
    <p class="req" data-i18n-html="req3"></p>
    <div class="vbox" id="v3"></div>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint3"></p>
        <canvas id="cv3" aria-label="objects on a table under a coloured lamp"></canvas>
        <div class="objs" id="obj3"></div>
        <canvas id="cv3s" aria-label="spectra of the lamp, the object's reflection and the reflected light"></canvas>
        <div class="legend">
          <span><i style="background:linear-gradient(90deg,#8040ff,#0060ff,#00c060,#ffd000,#ff3000)"></i><span data-i18n="lgS"></span></span>
          <span><i style="background:var(--ink)"></i><span data-i18n="lgR"></span></span>
        </div>
        <p class="fine" data-i18n="assume3"></p>
      </div>
      <div class="col">
        <div class="card" id="p3"></div>
        <div class="card">
          <div><div class="muted" data-i18n="setLamp"></div><div class="seg" id="lamp3"></div></div>
          <div id="rgb3" class="col" hidden>
            <div class="sl"><div class="top"><span data-i18n="ledR"></span><span class="val" id="lr3V"></span></div><input type="range" id="lr3" min="0" max="100" step="5" value="100"></div>
            <div class="sl"><div class="top"><span data-i18n="ledG"></span><span class="val" id="lg3V"></span></div><input type="range" id="lg3" min="0" max="100" step="5" value="100"></div>
            <div class="sl"><div class="top"><span data-i18n="ledB"></span><span class="val" id="lb3V"></span></div><input type="range" id="lb3" min="0" max="100" step="5" value="0"></div>
          </div>
          <div><div class="muted" data-i18n="setFilt"></div><div class="seg" id="filt3"></div></div>
          <label class="chk"><input type="checkbox" id="adapt3" checked> <span data-i18n="adapt3"></span></label>
        </div>
        <div class="card"><h2 id="obT3"></h2><div class="swatch"><i id="sw3a"></i><span class="muted" data-i18n="swWhite"></span><i id="sw3b"></i><span class="muted" data-i18n="swNow"></span></div><dl class="kv" id="kv3"></dl></div>
        <div class="card"><h2 data-i18n="chalT"></h2><div class="chal" id="ch3"></div></div>
        <div class="card" id="p3b"></div>
        <div class="card" id="c3"></div>
      </div>
    </div>
    <details><summary data-i18n="whyT"></summary><div data-i18n-html="why3"></div></details>
    <details><summary data-i18n="misT"></summary><div data-i18n-html="mis3"></div></details>
  </section>

  <!-- ===================== TAB 4: CẦU VỒNG ===================== -->
  <section id="t4" class="col" hidden>
    <p class="req" data-i18n-html="req4"></p>
    <div class="vbox" id="v4"></div>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint4"></p>
        <canvas id="cv4" class="drk drag" aria-label="sunlight entering a water droplet"></canvas>
        <div class="controls">
          <div class="seg" id="col4"></div>
          <label class="chk"><input type="checkbox" id="many4"> <span data-i18n="many4"></span></label>
          <label class="chk"><input type="checkbox" id="sec4"> <span data-i18n="sec4"></span></label>
        </div>
        <canvas id="gr4" aria-label="graph of the angle of the outgoing ray against the entry height"></canvas>
        <p class="hint" data-i18n="hint4b"></p>
        <canvas id="cv4s" aria-label="sky seen by an observer with the sun behind"></canvas>
        <div class="sl"><div class="top"><span data-i18n="setSun"></span><span class="val" id="sun4V"></span></div>
          <input type="range" id="sun4" min="0" max="60" step="1" value="20"></div>
        <p class="fine" data-i18n="assume4"></p>
      </div>
      <div class="col">
        <div class="card" id="p4"></div>
        <div class="card"><h2 data-i18n="data"></h2><dl class="kv" id="kv4"></dl></div>
        <div class="card" id="p4b"></div>
        <div class="card" id="c4"></div>
      </div>
    </div>
    <details><summary data-i18n="whyT"></summary><div data-i18n-html="why4"></div></details>
    <details><summary data-i18n="misT"></summary><div data-i18n-html="mis4"></div></details>
  </section>

  <!-- ===================== TAB 5: LUYỆN TẬP ===================== -->
  <section id="t5" class="col" hidden>
    <p class="req" data-i18n-html="req5"></p>

c1a:'Tia sáng bị khúc xạ hai lần: lần một khi đi từ không khí vào lăng kính, lần hai khi từ lăng kính ra không khí. Tia ló bị lệch về phía đáy lăng kính so với tia tới. Cách vẽ: (1) vẽ pháp tuyến tại điểm tới; (2) vẽ tia khúc xạ lệch gần pháp tuyến hơn (vào chất chiết quang hơn); (3) tại mặt thứ hai vẽ pháp tuyến; (4) vẽ tia ló lệch xa pháp tuyến hơn. Ánh sáng màu khác nhau thì lệch khác nhau một chút.',
why1:'<h3>Cơ chế</h3><p>Lăng kính là khối chất trong suốt có hai mặt phẳng không song song (hai mặt bên), góc giữa chúng là góc chiết quang A. Tại mỗi mặt, tia sáng tuân theo định luật khúc xạ: sin i = n·sin r. Ở mặt thứ nhất tia sáng đi vào chất có chiết suất lớn hơn nên bị bẻ lại gần pháp tuyến; ở mặt thứ hai tia sáng ra không khí nên bị bẻ xa pháp tuyến. Vì hai mặt nghiêng về hai phía khác nhau của đỉnh, cả hai lần bẻ đều làm tia sáng quay về phía đáy. Góc lệch tổng cộng là D = i₁ + i₂ − A, nhỏ nhất khi tia đi đối xứng qua lăng kính (đồ thị dưới hình).</p><p>Nếu r₂ lớn hơn góc tới hạn thì xảy ra phản xạ toàn phần ở mặt thứ hai (thử với kim cương hoặc góc A lớn), đây là cách lăng kính trong ống nhòm hoạt động.</p><h3>Nói cho học sinh</h3><p>Ánh sáng đi trong thuỷ tinh chậm hơn trong không khí. Giống như một hàng người chạy từ đường nhựa vào bãi cát chéo góc: người chạm cát trước bị chậm lại trước, cả hàng bị quay hướng. Lăng kính “dày” ở đáy, “mỏng” ở đỉnh, nên ánh sáng luôn bị quay về phía đáy.</p>',
mis1:'<ul><li><b>“Tia sáng bị bẻ ở giữa lăng kính.”</b> Tia sáng chỉ đổi hướng ở mặt phân cách; bên trong thuỷ tinh đồng chất nó đi thẳng.</li><li><b>“Tia ló lệch về phía đỉnh.”</b> Khi ló ra được ở mặt bên thứ hai, tia ló luôn lệch về phía đáy.</li><li><b>Vẽ tia khúc xạ không vẽ pháp tuyến</b>, đo góc so với mặt lăng kính thay vì so với pháp tuyến.</li><li><b>“Lăng kính nào cũng cho tia ló.”</b> Góc A lớn hoặc chất có chiết suất lớn (kim cương) thì tia sáng có thể bị phản xạ toàn phần bên trong.</li></ul>',

p2a:'Một vệt sáng trắng, lệch xuống phía dưới',p2b:'Một dải màu từ đỏ đến tím; tím lệch nhiều nhất',p2c:'Một dải màu từ đỏ đến tím; đỏ lệch nhiều nhất',
p2e:'Ánh sáng trắng gồm nhiều ánh sáng màu. Chiết suất của thuỷ tinh lớn nhất với ánh sáng tím, nhỏ nhất với ánh sáng đỏ, nên tím lệch nhiều nhất, đỏ lệch ít nhất. Các màu tách ra thành dải màu liên tục: quang phổ của ánh sáng trắng.',

p2be:'Lăng kính không “tạo ra” màu. Ánh sáng lục đã là ánh sáng đơn sắc nên qua lăng kính thứ hai chỉ bị lệch, không tách thêm. Newton gọi đây là “thí nghiệm quyết định” (experimentum crucis, 1672).',
c2q:'Ánh sáng trắng là gì? Ánh sáng màu (ánh sáng đơn sắc) là gì? Vì sao lăng kính phân tích được ánh sáng trắng?',
c2a:'Ánh sáng trắng (ánh sáng Mặt Trời, đèn dây tóc) là hỗn hợp của rất nhiều ánh sáng màu biến thiên liên tục từ đỏ đến tím. Ánh sáng màu đơn sắc là ánh sáng có một màu nhất định, không bị lăng kính tách ra thành màu khác. Chiết suất của lăng kính khác nhau với mỗi màu (lớn nhất với tím), nên mỗi màu bị lệch một góc khác nhau và tách nhau ra: đó là sự tán sắc ánh sáng. Gom các màu lại (bằng thấu kính) thì được ánh sáng trắng.',
why2:'<h3>Cơ chế</h3><p>Tốc độ ánh sáng trong thuỷ tinh phụ thuộc vào màu (bước sóng) của ánh sáng: ánh sáng tím chậm hơn ánh sáng đỏ một chút. Vì chiết suất n = c/v nên n với ánh sáng tím lớn hơn với ánh sáng đỏ: với thuỷ tinh thường n ≈ 1,514 (đỏ) đến 1,530 (tím); với thuỷ tinh flint n ≈ 1,615 đến 1,649. Theo định luật khúc xạ, n lớn hơn thì tia bị bẻ mạnh hơn, nên mỗi màu ló ra theo một hướng khác: chùm sáng trắng bị “mở quạt” thành quang phổ. Đó là sự tán sắc ánh sáng.</p><p>Điều thú vị khi tăng bề rộng chùm sáng: phần giữa vệt sáng trên màn vẫn trắng, chỉ hai mép có màu, vì ở giữa các màu vẫn chồng lên nhau. Muốn thấy rõ quang phổ phải dùng khe hẹp và đặt màn xa (Newton dùng lỗ nhỏ trên cửa chớp và màn cách 7 m).</p><h3>Nói cho học sinh</h3><p>Ánh sáng trắng giống một đội chạy gồm nhiều bạn mặc áo bảy màu. Khi chạy vào bãi cát chéo góc, bạn áo tím bị chậm lại nhiều nhất nên rẽ gấp nhất, bạn áo đỏ rẽ ít nhất. Ra khỏi bãi cát, cả đội không còn đi chung một hướng nữa mà tách thành dải bảy màu.</p>',
mis2:'<ul><li><b>“Lăng kính nhuộm màu cho ánh sáng.”</b> Các màu đã có sẵn trong ánh sáng trắng; lăng kính chỉ tách chúng ra (chế độ “Tách riêng một màu” và “Gom các màu lại”).</li><li><b>“Quang phổ có đúng 7 màu.”</b> Quang phổ biến thiên liên tục; Newton chọn 7 tên màu cho giống 7 nốt nhạc. Nhiều sách nước ngoài chỉ kể 6 màu (không có chàm).</li><li><b>“Đỏ lệch nhiều nhất vì đứng đầu dải.”</b> Đỏ lệch ít nhất, tím lệch nhiều nhất.</li><li><b>“Ánh sáng màu nào cũng là ánh sáng đơn sắc.”</b> Ánh sáng hồng tím (đỏ + lam) qua lăng kính tách ra thành hai vạch: đó là ánh sáng màu nhưng không đơn sắc. Thử nguồn “Đỏ + lam”.</li></ul>',

p3a:'Vẫn màu đỏ',p3b:'Màu lục',p3c:'Gần như đen',
p3e:'Cà chua đỏ phản xạ mạnh ánh sáng đỏ và hấp thụ gần hết các màu khác. Đèn lục không có ánh sáng đỏ nên cà chua gần như không phản xạ ánh sáng nào vào mắt: trông gần như đen. Màu đỏ không “nằm sẵn” trong quả cà chua.',
p3bq:'Đặt kính lọc màu đỏ trước đèn trắng. Chiếc lá cây trông thế nào?',
p3ba:'Màu đỏ, vì kính lọc nhuộm đỏ cho lá',p3bb:'Gần như đen',p3bc:'Vẫn xanh lục',
p3be:'Kính lọc đỏ hấp thụ gần hết các màu, chỉ cho ánh sáng đỏ đi qua. Lá cây phản xạ chủ yếu ánh sáng lục và hấp thụ ánh sáng đỏ, nên dưới ánh sáng đỏ lá gần như đen.',
c3q:'Vì sao ta thấy một vật có màu đỏ? Vật màu trắng và vật màu đen khác nhau thế nào?',
c3a:'Ta nhìn thấy vật khi có ánh sáng từ vật truyền vào mắt. Vật màu đỏ phản xạ mạnh ánh sáng đỏ và hấp thụ phần lớn các ánh sáng màu khác; dưới ánh sáng trắng, ánh sáng phản xạ vào mắt là ánh sáng đỏ nên ta thấy vật màu đỏ. Vật màu trắng phản xạ tốt mọi màu, nên trông có màu của ánh sáng chiếu vào nó. Vật màu đen hấp thụ gần hết mọi màu. Vậy màu ta thấy phụ thuộc vào cả ánh sáng chiếu tới và ánh sáng mà vật hấp thụ, phản xạ.',
why3:'<h3>Cơ chế</h3><p>Ánh sáng chiếu vào bề mặt một vật, một phần bị các phân tử chất màu (sắc tố) hấp thụ và biến thành nhiệt, phần còn lại bị phản xạ (tán xạ) ra mọi phía. Mỗi chất màu hấp thụ mạnh ở một số màu nhất định: chất diệp lục trong lá hấp thụ mạnh ánh sáng lam và đỏ để quang hợp, phản xạ phần lớn ánh sáng lục; lycopene trong cà chua hấp thụ lam, lục và phản xạ đỏ. Ánh sáng phản xạ vào mắt là “phổ ánh sáng chiếu tới × tỉ lệ phản xạ của vật” (đồ thị bên dưới): màu ta thấy do phần còn lại này quyết định.</p><p>Kính lọc màu cũng vậy nhưng cho ánh sáng truyền qua: kính lọc đỏ hấp thụ các màu khác, chỉ cho đỏ đi qua. Kính lọc chỉ bớt đi, không thêm màu.</p><h3>Nói cho học sinh</h3><p>Mỗi vật giống một “người gác cổng” chỉ trả lại một số màu, giữ lại các màu khác. Quả cà chua chỉ trả lại màu đỏ. Nếu ánh sáng chiếu tới không có màu đỏ thì cà chua không có gì để trả lại, và ta thấy nó gần như đen.</p>',
mis3:'<ul><li><b>“Màu là của vật, lúc nào cũng vậy.”</b> Màu nhìn thấy phụ thuộc vào ánh sáng chiếu tới: dưới đèn natri, cà chua, lá cây và khối lam gần như không phân biệt được.</li><li><b>“Vật đỏ phát ra ánh sáng đỏ.”</b> Vật không tự phát sáng; nó phản xạ phần ánh sáng đỏ có sẵn trong ánh sáng chiếu tới.</li><li><b>“Kính lọc nhuộm màu cho ánh sáng.”</b> Kính lọc hấp thụ bớt các màu khác; ánh sáng qua kính lọc luôn yếu hơn.</li><li><b>“Màu đen là một màu như các màu khác.”</b> Đen là khi hầu như không có ánh sáng từ vật tới mắt.</li><li><b>“Trộn ánh sáng giống trộn sơn.”</b> Bật LED đỏ và LED lục cùng lúc: tờ giấy trắng trông màu vàng, không phải màu nâu như khi trộn sơn.</li></ul>',

p4e:'Ánh sáng đi vào giọt nước, phản xạ ở mặt sau rồi quay ngược trở lại, ló ra theo hướng lệch khoảng 40°–42° so với hướng ngược tia Mặt Trời. Vì vậy cầu vồng luôn ở phía đối diện Mặt Trời.',

p4be:'Ánh sáng đỏ ló ra với góc lớn nhất khoảng 42°, tím khoảng 40,6°. Giọt nước ở cao hơn gửi ánh sáng đỏ tới mắt, giọt thấp hơn gửi ánh sáng tím, nên đỏ ở ngoài, tím ở trong. Cầu vồng phụ thì ngược lại.',
c4q:'Giải thích vì sao có cầu vồng.',
c4a:'Sau mưa, không khí còn nhiều giọt nước. Ánh sáng Mặt Trời đi vào mỗi giọt nước bị khúc xạ và tán sắc (giống qua lăng kính), phản xạ ở mặt sau giọt, rồi khúc xạ, tán sắc thêm lần nữa khi ló ra. Mỗi màu ló ra mạnh nhất theo một góc riêng (đỏ khoảng 42°, tím khoảng 40,6° so với hướng ngược tia Mặt Trời). Mắt nhận ánh sáng đỏ từ các giọt ở góc 42°, ánh sáng tím từ các giọt ở góc 40,6°, nên ta thấy các vòng cung màu. Phải quay lưng về Mặt Trời mới thấy.',
why4:'<h3>Cơ chế</h3><p>Một tia sáng vào giọt nước ở độ cao b bị khúc xạ (sin i = n·sin r), phản xạ một lần ở mặt sau, rồi khúc xạ khi ló ra. Góc θ giữa tia ló và hướng ngược tia Mặt Trời là θ = 4r − 2i. Đồ thị cho thấy θ tăng dần theo b rồi đạt giá trị lớn nhất (khoảng 42° với ánh sáng đỏ) và giảm lại: các tia gần b ≈ 0,86 ló ra gần như cùng một hướng, ánh sáng dồn lại ở đó rất sáng (bật “Nhiều tia song song” để thấy). Vì n của nước với ánh sáng tím lớn hơn, góc lớn nhất của tím nhỏ hơn (khoảng 40,6°): các màu tách ra. Mọi giọt nằm trên hình nón 42° quanh điểm đối nhật cùng gửi ánh sáng đỏ về mắt, nên cầu vồng là một cung tròn. Nếu Mặt Trời cao hơn khoảng 42° thì cung này nằm dưới đường chân trời: buổi trưa mùa hè hiếm khi thấy cầu vồng.</p><p>Cầu vồng phụ do ánh sáng phản xạ hai lần trong giọt nước, ở khoảng 50°–53°, mờ hơn và thứ tự màu đảo ngược. Vùng trời giữa hai cầu vồng tối hơn (dải tối Alexander).</p><h3>Nói cho học sinh</h3><p>Mỗi giọt mưa là một “lăng kính tròn tí hon” có thêm một chiếc gương ở mặt sau. Nó tách ánh sáng Mặt Trời thành các màu rồi gửi ngược về phía em. Hàng triệu giọt mưa, mỗi giọt gửi cho em một màu, ghép lại thành cầu vồng.</p>',
mis4:'<ul><li><b>“Cầu vồng ở một chỗ cố định, đi tới được chân cầu vồng.”</b> Cầu vồng là hướng nhìn, không phải vật: mỗi người thấy cầu vồng của riêng mình, đi tới thì nó lùi theo.</li><li><b>“Một giọt nước cho cả cầu vồng.”</b> Mỗi giọt chỉ gửi một màu vào mắt em; các giọt ở độ cao khác nhau cho các màu khác nhau.</li><li><b>“Nhìn về phía Mặt Trời mới thấy cầu vồng.”</b> Phải quay lưng về phía Mặt Trời.</li><li><b>“Cầu vồng chỉ do khúc xạ.”</b> Cần cả khúc xạ, tán sắc và phản xạ ở mặt sau giọt nước.</li></ul>',

origin:`<ul><li><b>Lăng kính</b> (棱鏡): “lăng” 棱 là cạnh, góc cạnh; “kính” 鏡 là gương, kính. Lăng kính là khối kính có cạnh. Tiếng Anh <i>prism</i>, từ tiếng Hy Lạp <i>prisma</i> “vật được cưa ra” (động từ <i>prizein</i>: cưa), vì khối lăng trụ giống một khúc gỗ được cưa vát. Tiếng Pháp <i>prisme</i>, tiếng Trung 棱镜 léngjìng, tiếng Nhật プリズム.</li>
<li><b>Tán sắc</b> (散色): “tán” 散 là tản ra, rải ra; “sắc” 色 là màu. Tán sắc là màu bị tản ra. Tiếng Anh <i>dispersion</i>, từ tiếng Latinh <i>dispergere</i> = <i>dis-</i> (ra nhiều phía) + <i>spargere</i> (rắc, rải). Tiếng Trung dùng 色散 sèsàn (đảo ngược hai chữ), tiếng Nhật 分散 bunsan.</li>
<li><b>Quang phổ</b> (光譜): “quang” là ánh sáng, “phổ” 譜 là bảng ghi có thứ tự (như gia phả, nhạc phổ). Tiếng Anh <i>spectrum</i>, tiếng Latinh nghĩa là “hình ảnh hiện ra, bóng ma” (từ <i>specere</i>: nhìn). Newton dùng từ này năm 1671 cho dải màu hiện trên tường.</li>
<li><b>Đơn sắc</b>: “đơn” là một, “sắc” là màu. Tiếng Anh <i>monochromatic</i>, từ tiếng Hy Lạp <i>monos</i> (một) + <i>chroma</i> (màu).</li>
<li><b>Chiết quang</b> (折光): “chiết” 折 là bẻ gãy; chiết quang là bẻ ánh sáng. Góc chiết quang A là góc giữa hai mặt bẻ ánh sáng.</li>
<li><b>Cầu vồng</b>: từ thuần Việt, cái cầu cong vồng lên; Hán Việt là “hồng” 虹 (chữ có bộ trùng 虫, vì người xưa tưởng cầu vồng là con rồng uống nước). Tiếng Anh <i>rainbow</i> (cây cung của mưa), tiếng Pháp <i>arc-en-ciel</i> (cung trên trời). Người Hy Lạp gọi là <i>Iris</i>, tên nữ thần sứ giả; từ đó có từ <i>iris</i> (mống mắt, nhiều màu).</li>
<li><b>Kính lọc</b>: tiếng Anh <i>filter</i>, từ tiếng Latinh thời Trung cổ <i>filtrum</i> là tấm nỉ dùng để lọc chất lỏng.</li></ul>
<p><b>Lịch sử:</b> Khoảng năm 1304, Theodoric xứ Freiberg (Đức) và Kamāl al-Dīn al-Fārisī (Ba Tư) dùng quả cầu thuỷ tinh đựng nước làm “giọt mưa phóng to” và hiểu ra đường đi của ánh sáng trong cầu vồng. Năm 1637, Descartes tính được góc 42°. Năm 1666, khi trường đại học đóng cửa vì bệnh dịch, Isaac Newton làm thí nghiệm lăng kính trong phòng tối; năm 1672 ông gửi Hội Hoàng gia Anh bức thư mô tả “thí nghiệm quyết định”: ánh sáng trắng là hỗn hợp các ánh sáng màu.</p>`,

p1be:'Glass has a larger refractive index for violet (about 1.530) than for red (about 1.514), so violet is bent more. This is the seed of the dispersion in tab 2.',
c1q:'Describe the path of a single-colour ray through a prism. How do you draw it?',
c1a:'The ray is refracted twice: entering the prism from air and leaving it into air. The emergent ray is deviated towards the base. To draw: (1) normal at the point of incidence; (2) refracted ray bent towards the normal; (3) normal at the second face; (4) emergent ray bent away from the normal. Different colours deviate slightly differently.',
why1:'<h3>The science</h3><p>A prism is a transparent block with two non-parallel flat faces; the angle between them is the apex angle A. At each face Snell’s law holds: sin i = n·sin r. Entering the denser material, the ray bends towards the normal; leaving it, away from the normal. Because the two faces lean opposite ways, both bends turn the ray towards the base. The total deviation is D = i₁ + i₂ − A, smallest when the ray passes symmetrically (graph below).</p><p>If r₂ is larger than the critical angle, the ray is totally reflected at the second face (try diamond or a large A), which is how prisms in binoculars work.</p><h3>For students</h3><p>Light is slower in glass than in air. Think of a line of runners crossing from tarmac onto sand at an angle: whoever hits the sand first slows first, and the whole line turns. The prism is thick at the base and thin at the apex, so the light always turns towards the base.</p>',
mis1:'<ul><li><b>“The ray bends in the middle of the prism.”</b> It only changes direction at a boundary; inside uniform glass it is straight.</li><li><b>“The ray bends towards the apex.”</b> When it emerges from the second face it always bends towards the base.</li><li><b>Drawing refraction without a normal</b>, measuring angles from the surface instead of the normal.</li><li><b>“Every prism lets the ray out.”</b> With a large A or high index (diamond) the ray can be totally reflected inside.</li></ul>',

p2q:'A narrow beam of white light passes through a prism onto a screen. What do you see?',
p2a:'A white spot, shifted down',p2b:'A band from red to violet; violet deviates most',p2c:'A band from red to violet; red deviates most',
p2e:'White light contains many colours. The refractive index of glass is largest for violet and smallest for red, so violet deviates most and red least. The colours spread into a continuous band: the spectrum of white light.',
p2bq:'A slit picks out the green part, which then goes through a second prism. What happens?',
p2ba:'The green splits into more colours',p2bb:'The green is only deviated again; it stays green',p2bc:'The green turns into white light',
p2be:'The prism does not “make” colours. Green is already monochromatic, so the second prism only deviates it. Newton called this the “crucial experiment” (experimentum crucis, 1672).',
c2q:'What is white light? What is monochromatic (single-colour) light? Why can a prism split white light?',
c2a:'White light (sunlight, a filament lamp) is a mixture of many coloured lights changing continuously from red to violet. Monochromatic light has a single colour that a prism cannot split further. The prism’s refractive index differs for each colour (largest for violet), so each colour deviates by a different angle and they separate: dispersion. Bringing the colours together (with a lens) gives white light again.',
why2:'<h3>The science</h3><p>The speed of light in glass depends on its colour (wavelength): violet is a little slower than red. Since n = c/v, n is larger for violet: crown glass n ≈ 1.514 (red) to 1.530 (violet); flint glass n ≈ 1.615 to 1.649. By Snell’s law a larger n means a stronger bend, so each colour leaves in a different direction and the white beam fans out into a spectrum. That is dispersion.</p><p>Notice what happens when you widen the beam: the middle of the patch stays white and only the edges are coloured, because the colours still overlap in the middle. To see a clean spectrum you need a narrow slit and a distant screen (Newton used a small hole in his shutter and a wall 7 m away).</p><h3>For students</h3><p>White light is like a team of runners in seven different shirts. Running onto sand at an angle, the violet runner slows the most and turns the most, the red runner the least. Out of the sand they no longer run together: they spread into a band of seven colours.</p>',
mis2:'<ul><li><b>“The prism dyes the light.”</b> The colours are already in white light; the prism only separates them (try “Pick out one colour” and “Recombine”).</li><li><b>“The spectrum has exactly 7 colours.”</b> It changes continuously; Newton chose 7 names to match the 7 notes of a musical scale. Many books list only 6 (no indigo).</li><li><b>“Red deviates most because it is first.”</b> Red deviates least, violet most.</li><li><b>“Any coloured light is monochromatic.”</b> Magenta (red + blue) splits into two lines: coloured but not monochromatic. Try the “Red + blue” source.</li></ul>',

p3q:'A green lamp shines on a ripe (red) tomato. What colour does the tomato look?',
p3a:'Still red',p3b:'Green',p3c:'Almost black',
p3e:'A red tomato reflects red strongly and absorbs nearly all other colours. A green lamp has no red, so almost no light comes back to the eye: it looks nearly black. The red is not “stored” in the tomato.',
p3bq:'A red filter is put in front of a white lamp. How does the leaf look?',
p3ba:'Red, because the filter dyes it red',p3bb:'Almost black',p3bc:'Still green',
p3be:'A red filter absorbs nearly all colours and lets only red through. A leaf reflects mainly green and absorbs red, so in red light it looks nearly black.',
c3q:'Why does an object look red? How do white and black objects differ?',
c3a:'We see an object when light from it enters our eye. A red object reflects red strongly and absorbs most other colours; in white light the light reaching the eye is red, so the object looks red. A white object reflects every colour well, so it takes the colour of the light falling on it. A black object absorbs nearly every colour. So the colour we see depends on both the light arriving and the colours the object absorbs and reflects.',
why3:'<h3>The science</h3><p>Light falling on a surface is partly absorbed by pigment molecules (turning into heat) and partly reflected (scattered) in all directions. Each pigment absorbs certain colours strongly: chlorophyll absorbs blue and red for photosynthesis and reflects much of the green; lycopene in tomatoes absorbs blue and green and reflects red. The light reaching the eye is “arriving spectrum × reflectance” (graph below), and that remainder decides the colour we see.</p><p>A colour filter works the same way but transmits light: a red filter absorbs other colours and lets red through. A filter only removes colours; it never adds them.</p><h3>For students</h3><p>Each object is a “gatekeeper” that hands back only some colours and keeps the rest. A tomato hands back only red. If the light has no red in it, the tomato has nothing to hand back, and it looks almost black.</p>',
mis3:'<ul><li><b>“Colour belongs to the object, always.”</b> The colour we see depends on the light: under a sodium lamp a tomato, a leaf and a blue block look almost alike.</li><li><b>“A red object gives out red light.”</b> It does not glow; it reflects the red that is already in the light falling on it.</li><li><b>“A filter dyes the light.”</b> It absorbs other colours; light through a filter is always dimmer.</li><li><b>“Black is a colour like any other.”</b> Black is when almost no light comes from the object to the eye.</li><li><b>“Mixing light is like mixing paint.”</b> Turn on the red and green LEDs together: white paper looks yellow, not brown as with paint.</li></ul>',

p4q:'To see a rainbow after rain, how must you stand?',
p4a:'Facing the Sun',p4b:'With your back to the Sun, looking at the rain',p4c:'Any direction works',
p4e:'Light enters a drop, reflects off the back and comes back out at about 40°–42° from the anti-sun direction. So a rainbow is always opposite the Sun.',
p4bq:'Which colour is on the outer (top) edge of the primary rainbow?',
p4ba:'Red',p4bb:'Violet',p4bc:'Sometimes red, sometimes violet',
p4be:'Red leaves at a largest angle of about 42°, violet about 40.6°. Higher drops send red to your eye, lower drops send violet, so red is outside and violet inside. The secondary bow is the other way round.',
c4q:'Explain how a rainbow forms.',
c4a:'After rain the air is full of drops. Sunlight entering each drop is refracted and dispersed (as in a prism), reflected off the back of the drop, then refracted and dispersed again on leaving. Each colour comes out most strongly at its own angle (red about 42°, violet about 40.6° from the anti-sun direction). Your eye gets red from drops at 42° and violet from drops at 40.6°, so you see coloured arcs. You must have your back to the Sun.',
why4:'<h3>The science</h3><p>A ray entering a drop at height b is refracted (sin i = n·sin r), reflected once at the back and refracted on leaving. The angle between the outgoing ray and the anti-sun direction is θ = 4r − 2i. The graph shows θ rising with b to a maximum (about 42° for red) and falling again: rays near b ≈ 0.86 all leave in nearly the same direction, so light piles up there (turn on “Many parallel rays”). Water’s n is larger for violet, so violet’s maximum is smaller (about 40.6°): the colours separate. Every drop on the 42° cone around the antisolar point sends red to your eye, so the bow is a circular arc. If the Sun is higher than about 42°, the arc is below the horizon: you rarely see rainbows at midday in summer.</p><p>The secondary bow comes from two reflections inside the drop, at about 50°–53°, fainter and with colours reversed. The sky between the bows is darker (Alexander’s dark band).</p><h3>For students</h3><p>Each raindrop is a tiny round prism with a mirror at the back. It splits sunlight into colours and sends them back towards you. Millions of drops, each sending you one colour, build the rainbow.</p>',
mis4:'<ul><li><b>“A rainbow is in a fixed place; you can walk to its end.”</b> A rainbow is a direction, not an object: everyone sees their own, and it moves as you walk.</li><li><b>“One drop makes the whole rainbow.”</b> Each drop sends just one colour to your eye; drops at different heights give different colours.</li><li><b>“Look towards the Sun to see a rainbow.”</b> You must have your back to the Sun.</li><li><b>“Rainbows are only refraction.”</b> They need refraction, dispersion and reflection at the back of the drop.</li></ul>',

originT:'Where the terms come from, and a little history',
origin:`<ul><li><b>Prism</b>: from Greek <i>prisma</i>, “something sawn off” (<i>prizein</i>, to saw), because the solid looks like a sawn block. Vietnamese <i>lăng kính</i> (棱鏡) means “edged glass”. French <i>prisme</i>, Chinese 棱镜 léngjìng, Japanese プリズム.</li>
<li><b>Dispersion</b>: from Latin <i>dispergere</i> = <i>dis-</i> (in all directions) + <i>spargere</i> (to scatter). Vietnamese <i>tán sắc</i> (散色) means “colours scattered”; Chinese reverses it, 色散 sèsàn; Japanese 分散 bunsan.</li>
<li><b>Spectrum</b>: Latin for “an appearance, an apparition” (from <i>specere</i>, to look). Newton used it in 1671 for the band of colours on his wall. Vietnamese <i>quang phổ</i> (光譜) means “an ordered record of light”.</li>
<li><b>Monochromatic</b>: Greek <i>monos</i> (one) + <i>chroma</i> (colour); Vietnamese <i>đơn sắc</i>, “single colour”.</li>
<li><b>Refracting (apex) angle</b>: Vietnamese <i>góc chiết quang</i>, from 折 “to break” + 光 “light”: the angle between the faces that break the light.</li>
<li><b>Rainbow</b>: “bow of the rain”; French <i>arc-en-ciel</i> (arc in the sky). The Greeks called it <i>Iris</i>, the messenger goddess, giving the word <i>iris</i> for the coloured part of the eye. Vietnamese <i>cầu vồng</i> means “arched bridge”; the Sino-Vietnamese word 虹 contains the “creature” radical because people imagined a dragon drinking water.</li>
<li><b>Filter</b>: from Medieval Latin <i>filtrum</i>, felt used to strain liquids.</li></ul>
<p><b>History:</b> Around 1304, Theodoric of Freiberg (Germany) and Kamāl al-Dīn al-Fārisī (Persia) used water-filled glass spheres as giant raindrops and worked out the path of light in a rainbow. In 1637 Descartes calculated the 42° angle. In 1666, with Cambridge closed by plague, Isaac Newton experimented with prisms in a darkened room; in 1672 he described his “crucial experiment” to the Royal Society: white light is a mixture of coloured lights.</p>`,

const nf=(x,d=2,mn=0)=>{if(!isFinite(x))x=0;if(Math.abs(x)<0.5*Math.pow(10,-d))x=0;return new Intl.NumberFormat(lang==='vi'?'vi-VN':'en-US',{maximumFractionDigits:d,minimumFractionDigits:mn}).format(x);};

const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let CS={};

  ['bg','panel','lane','ink','muted','line','accent','ok','warn','force','vel','glass','glass2','normal','space','star','dark','gold','wood','sky','ground']

function fit(cv,asp,minH=0){const w=Math.max(260,cv.clientWidth|0);const h=Math.max(minH,Math.round(w*asp));const d=Math.min(2.5,window.devicePixelRatio||1);

  const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.globalCompositeOperation='source-over';c.globalAlpha=1;c.clearRect(0,0,w,h);return{c,w,h};}
function txt(c,s,x,y,o={}){c.font=`${o.w||600} ${o.sz||13}px ${o.mono?'"IBM Plex Mono",monospace':'"Be Vietnam Pro",system-ui,sans-serif'}`;c.fillStyle=o.col||CS.ink;c.textAlign=o.al||'center';c.textBaseline=o.bl||'middle';c.fillText(s,x,y);}
function pill(c,s,x,y,o={}){c.font=`700 ${o.sz||13}px "Be Vietnam Pro",system-ui,sans-serif`;const tw=c.measureText(s).width,sz=o.sz||13;
  c.fillStyle=o.bg||CS.panel;c.globalAlpha=.88;rrect(c,x-tw/2-5,y-sz*.78,tw+10,sz*1.56,5);c.fill();c.globalAlpha=1;txt(c,s,x,y,{col:o.col||CS.ink,sz,w:700});}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function arrowHead(c,x,y,ang,sz,col){c.save();c.translate(x,y);c.rotate(ang);c.fillStyle=col;c.beginPath();c.moveTo(sz,0);c.lineTo(-sz*.7,sz*.6);c.lineTo(-sz*.7,-sz*.6);c.closePath();c.fill();c.restore();}
function seg(id,items,cur,pick){const el=$(id);el.innerHTML='';items.forEach(it=>{const b=document.createElement('button');b.className='btn';
  b.innerHTML=(it.dot?`<i style="background:${it.dot}"></i>`:'')+esc(it.label);
  b.setAttribute('aria-pressed',String(it.k===cur));b.onclick=()=>pick(it.k);el.appendChild(b);});}
function pickCanvas(cv,e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
function onDrag(cv,down,move,up){
  cv.addEventListener('pointerdown',e=>{const p=pickCanvas(cv,e);if(down(p,e)){cv.setPointerCapture(e.pointerId);cv._d=true;e.preventDefault();}});
  cv.addEventListener('pointermove',e=>{if(cv._d)move(pickCanvas(cv,e),e);});
  const end=e=>{if(cv._d){cv._d=false;up&&up();}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);}
/* vectơ 2D */
const V=(x,y)=>[x,y],add=(a,b)=>[a[0]+b[0],a[1]+b[1]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],mul=(a,k)=>[a[0]*k,a[1]*k],
  dot=(a,b)=>a[0]*b[0]+a[1]*b[1],len=a=>Math.hypot(a[0],a[1]),unit=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l];},
  rot=(a,t)=>[a[0]*Math.cos(t)-a[1]*Math.sin(t),a[0]*Math.sin(t)+a[1]*Math.cos(t)],cross=(a,b)=>a[0]*b[1]-a[1]*b[0];
const angOf=a=>Math.atan2(a[1],a[0]);

/* ================= Quang học: chiết suất theo bước sóng (λ tính bằng nm) ================= */
// Công thức Sellmeier: Schott (N-BK7, F2), Sultanova 2009 (PMMA), Peter 1923 (kim cương), Daimon–Masumura 2007 (nước 20 °C).
const sell=(B,C)=>l=>{const L=(l/1000)**2;let s=1;for(let k=0;k<B.length;k++)s+=B[k]*L/(L-C[k]);return Math.sqrt(s);};
const MATS={
  bk7:{n:sell([1.03961212,0.231792344,1.01046945],[0.00600069867,0.0200179144,103.560653])},
  f2:{n:sell([1.34533359,0.209073176,0.937357162],[0.00997743871,0.0470450767,111.886764])},
  pmma:{n:sell([0.99654,0.18964,0.00411],[0.00787,0.02191,3.85727])},
  water:{n:sell([5.684027565e-1,1.726177391e-1,2.086189578e-2,1.130748688e-1],[5.101829712e-3,1.821153936e-2,2.620722293e-2,1.069792721e1])},
  dia:{n:sell([4.3356,0.3306],[0.1060**2,0.1750**2])}};
const MAT_KEYS=['bk7','f2','pmma','water','dia'];

/* ================= Màu: hàm màu CIE 1931 (xấp xỉ Wyman–Sloan–Shirley 2013) → sRGB ================= */
const gp=(x,m,s1,s2)=>{const t=(x-m)/(x<m?s1:s2);return Math.exp(-.5*t*t);};
function cmf(l){return[1.056*gp(l,599.8,37.9,31)+.362*gp(l,442,16,26.7)-.065*gp(l,501.1,20.4,26.2),
  .821*gp(l,568.8,46.9,40.5)+.286*gp(l,530.9,16.3,31.1),1.217*gp(l,437,11.8,36)+.681*gp(l,459,26,13.8)];}
const xyz2lin=([X,Y,Z])=>[3.2406*X-1.5372*Y-.4986*Z,-.9689*X+1.8758*Y+.0415*Z,.0557*X-.204*Y+1.057*Z];
const gam=u=>{u=clamp(u,0,1);return u<=.0031308?12.92*u:1.055*Math.pow(u,1/2.4)-.055;};
const css=(r,g,b,a=1)=>`rgba(${Math.round(gam(r)*255)},${Math.round(gam(g)*255)},${Math.round(gam(b)*255)},${a})`;
// Màu hiển thị của một bước sóng: bỏ phần âm (màn hình không hiện được), chuẩn hoá kênh lớn nhất = 1.
const DISP={};
function lamRGB(l){l=Math.round(l);if(DISP[l])return DISP[l];let [r,g,b]=xyz2lin(cmf(Math.min(l,645))).map(v=>Math.max(0,v));// đuôi đỏ của hàm xấp xỉ kém chính xác: lấy sắc độ của 645 nm
  const m=Math.max(r,g,b)||1;// cho đầu đỏ và đầu tím tối dần như mắt thấy
  const fade=l<420?.35+.65*(l-380)/40:l>680?.35+.65*(730-l)/50:1;
  return DISP[l]=[r/m*fade,g/m*fade,b/m*fade];}
const lamCss=(l,a=1)=>{const [r,g,b]=lamRGB(l);return css(r,g,b,a);};
const COL7=[{k:'red',l:700},{k:'orange',l:600},{k:'yellow',l:580},{k:'green',l:530},{k:'blue',l:470},{k:'indigo',l:440},{k:'violet',l:410}];
function lamName(l){return T(l>=625?'cRed':l>=590?'cOrange':l>=565?'cYellow':l>=495?'cGreen':l>=480?'cCyan':l>=450?'cBlue':l>=430?'cIndigo':'cViolet');}

/* ================= Dò tia qua đa giác (định luật khúc xạ + hệ số phản xạ Fresnel) ================= */
function hitPolys(o,d,polys){let best=null;
  polys.forEach((P,k)=>{const pts=P.pts;for(let j=0;j<pts.length;j++){const a=pts[j],b=pts[(j+1)%pts.length],e=sub(b,a),den=cross(d,e);
    if(Math.abs(den)<1e-12)continue;const w=sub(a,o),t=cross(w,e)/den,s=cross(w,d)/den;
    if(t>1e-6&&s>=-1e-9&&s<=1+1e-9&&(!best||t<best.t)){const nr=unit([e[1],-e[0]]);best={t,k,j,nrm:nr};}}});
  return best;}
// Đa giác khai báo theo chiều kim đồng hồ trên màn hình (y hướng xuống) để [e1,-e0] là pháp tuyến hướng ra ngoài.
function refractAt(d,N,n1,n2){// N ngược hướng d
  const ci=-dot(d,N),eta=n1/n2,k=1-eta*eta*(1-ci*ci);
  const rd=add(d,mul(N,2*ci));
  if(k<0)return{R:1,rd,td:null,ci,ct:0};
  const ct=Math.sqrt(k),rs=((n1*ci-n2*ct)/(n1*ci+n2*ct))**2,rp=((n1*ct-n2*ci)/(n1*ct+n2*ci))**2;
  return{R:(rs+rp)/2,rd,td:add(mul(d,eta),mul(N,eta*ci-ct)),ci,ct};}
function trace(o,d,polys,lam,opt={}){const L=opt.L||4000,minW=opt.minW||.03,maxDepth=opt.maxDepth||8,segs=[],ev=[];
  const st=[{o,d,w:1,inP:-1,dep:0,main:true}];
  while(st.length){const r=st.pop();const h=hitPolys(r.o,r.d,polys);
    if(!h||r.dep>=maxDepth){segs.push({a:r.o,b:add(r.o,mul(r.d,L)),w:r.w,main:r.main,end:true,d:r.d});continue;}
    const p=add(r.o,mul(r.d,h.t));segs.push({a:r.o,b:p,w:r.w,main:r.main,inP:r.inP,d:r.d});
    const n1=r.inP>=0?polys[r.inP].n(lam):1,ent=r.inP<0,n2=ent?polys[h.k].n(lam):1;
    let N=h.nrm;if(dot(r.d,N)>0)N=mul(N,-1);
    const f=refractAt(r.d,N,n1,n2);
    if(r.main)ev.push({p,k:h.k,j:h.j,ent,n1,n2,i:Math.acos(clamp(f.ci,-1,1))/DEG,r:f.td?Math.acos(clamp(f.ct,-1,1))/DEG:null,tir:!f.td,N,din:r.d,dout:f.td||f.rd});
    if(!f.td){st.push({o:p,d:f.rd,w:r.w,inP:r.inP,dep:r.dep+1,main:r.main});continue;}
    if(opt.branch&&r.w*f.R>minW)st.push({o:p,d:f.rd,w:r.w*f.R,inP:r.inP,dep:r.dep+1,main:false});
    st.push({o:p,d:f.td,w:r.w*(1-f.R),inP:ent?h.k:-1,dep:r.dep+1,main:r.main});}
  return{segs,ev};}
// Lăng kính tam giác cân, đỉnh ở trên: tâm (cx,cy) là trọng tâm, cao H, góc chiết quang A, xoay góc rotD (độ).
function prism(cx,top,H,A,rotD=0,flip=false){const hb=H*Math.tan(A*DEG/2);let pts=[[0,0],[hb,H],[-hb,H]];// đỉnh, đáy phải, đáy trái (chiều kim đồng hồ)
  if(flip)pts=pts.map(p=>[p[0],H-p[1]]).reverse();
  const g=[0,flip?H/3:2*H/3];pts=pts.map(p=>add(rot(sub(p,g),rotD*DEG),[cx,top+g[1]]));
  return pts;}

const LASERS=[{k:650,key:'lzRed'},{k:532,key:'lzGreen'},{k:405,key:'lzViolet'}];
const S1={mat:'bk7',A:60,i:48,u:.5,lam:650,draw:false,checked:false,h1:.5,h2:0,drag:null,msg:''};
function geo1(w,h){const H=Math.min(h*.66,w*(w<560?.3:.2)/Math.tan(S1.A*DEG/2)),top=h*.14,cx=w*.5;const pts=prism(cx,top,H,S1.A);

  const tB=unit(sub(P1,P0)),nOut=unit([tB[1],-tB[0]]);const nO=dot(nOut,sub(P0,[cx,top+H]))<0&&nOut[0]>0?mul(nOut,-1):nOut;
  const aim=add(P0,mul(sub(P1,P0),S1.u));const src=[Math.cos(S1.i*DEG),Math.sin(S1.i*DEG)];// trong hệ (pháp tuyến, cạnh)

  return{pts,P0,P1,P2,tB,nO,aim,d0,o,Lz,tR,nR:nRo,H,top,cx};}
function analyticD(i,n,A){const s=Math.sin(i*DEG)/n;const r1=Math.asin(s)/DEG,r2=A-r1,q=n*Math.sin(r2*DEG);if(Math.abs(q)>1)return null;const i2=Math.asin(q)/DEG;return{r1,r2,i2,D:i+i2-A};}
const cv1=$('cv1'),gr1=$('gr1');
onDrag(cv1,([x,y])=>{const G=cv1._G;if(!G)return false;
  if(S1.draw&&!S1.checked){const h1=add(G.P0,mul(sub(G.P2,G.P0),S1.h1));if(Math.hypot(x-h1[0],y-h1[1])<26){S1.drag='h1';return true;}
    const hd=add(h1,mul([Math.cos(S1.h2*DEG),Math.sin(S1.h2*DEG)],95));if(Math.hypot(x-hd[0],y-hd[1])<26){S1.drag='h2';return true;}}

  // thân đèn laser: đoạn từ o lùi thêm 60 px

  if(along>-40&&along<80&&perp<26){S1.drag='lz';return true;}

 ([x,y])=>{const G=cv1._G;if(!G)return;

  else if(S1.drag==='h2'){const h1=add(G.P0,mul(sub(G.P2,G.P0),S1.h1));S1.h2=clamp(angOf(sub([x,y],h1))/DEG,-80,85);}
  ui1();},()=>{S1.drag=null;});

$('i1').oninput=e=>{S1.i=+e.target.value;S1.checked=false;ui1();};

$('rst1').onclick=()=>{Object.assign(S1,{mat:'bk7',A:60,i:48,u:.5,lam:650,draw:false,checked:false,h1:.5,h2:0,msg:''});$('a1').value=60;$('i1').value=48;ui1();};
let R1=null;
function solve1(w,h){const G=geo1(w,h);const n=l=>MATS[S1.mat].n(l);const res=trace(G.o,G.d0,[{pts:G.pts,n}],S1.lam,{branch:true,minW:.025,L:3000});
  const ev=res.ev;let out=null;
  if(ev.length>=2&&ev[0].ent){const e2=ev[1];out={i1:ev[0].i,r1:ev[0].r,face:e2.j,tir:e2.tir,r2:e2.i,i2:e2.r,p1:ev[0].p,p2:e2.p,dIn:ev[0].dout};
    // tia ló cuối cùng của đường chính
    const last=res.segs.filter(s=>s.main&&s.end)[0];if(last){out.dF=last.d;out.pF=last.a;const c=clamp(dot(G.d0,last.d),-1,1);out.D=Math.acos(c)/DEG;out.toBase=cross(G.d0,last.d)>0;}
    out.nInside=ev.filter(e=>!e.ent&&e.tir).length;}
  return{G,res,out};}
function check1(){const R=R1;if(!R||!R.out)return;const o=R.out;
  if(o.face!==0||o.tir){S1.msg=T('st1NoCheck');S1.checked=true;return;}
  const G=R.G,h1=add(G.P0,mul(sub(G.P2,G.P0),S1.h1));const dStu=unit(sub(h1,o.p1));
  const e1=Math.acos(clamp(dot(dStu,o.dIn),-1,1))/DEG;
  const fin=R.res.segs.find(s=>s.main&&s.end);const e2=Math.abs(((S1.h2-angOf(fin.d)/DEG)+540)%360-180);

function draw1(){const {c,w,h}=fit(cv1,isPhone()?.95:.6);const R=solve1(w,h);R1=R;cv1._G=R.G;const G=R.G,o=R.out,col=lamCss(S1.lam);

  // góc chiết quang A
  {const a1=angOf(sub(G.P1,G.P0)),a2=angOf(sub(G.P2,G.P0));c.strokeStyle=CS.ink;c.lineWidth=1.5;c.beginPath();c.arc(G.P0[0],G.P0[1],30,a2,a1);c.stroke();
   txt(c,'A = '+nf(S1.A,0)+'°',G.P0[0],G.P0[1]+48,{sz:13,w:700});txt(c,T('apex'),G.P0[0],G.P0[1]-10,{sz:12,col:CS.muted});
   txt(c,T('base'),(G.P1[0]+G.P2[0])/2,G.P1[1]+16,{sz:12,col:CS.muted});}
  const showAll=!S1.draw||S1.checked;

  if(o){nline(o.p1,G.nO);if(showAll&&o.p2){const e2=R.res.ev[1];nline(o.p2,e2.N);}}
  // các tia (đường chính đậm, phản xạ một phần mờ)
  c.lineCap='round';
  for(const s of R.res.segs){if(!showAll&&!(s.main&&s.inP===undefined&&dot(sub(s.a,G.o),sub(s.a,G.o))<1))continue;
    c.strokeStyle=col;c.globalAlpha=s.main?1:clamp(s.w*2.2,.12,.6);c.lineWidth=s.main?3.2:1.6;c.beginPath();c.moveTo(s.a[0],s.a[1]);c.lineTo(s.b[0],s.b[1]);c.stroke();

  c.globalAlpha=1;

    c.setLineDash([3,6]);c.strokeStyle=CS.muted;c.lineWidth=1.5;c.beginPath();c.moveTo(o.p1[0],o.p1[1]);c.lineTo(o.p1[0]+G.d0[0]*w,o.p1[1]+G.d0[1]*w);c.stroke();
    const den=cross(G.d0,o.dF);if(Math.abs(den)>1e-3){const t=cross(sub(o.pF,o.p1),o.dF)/den;const X=add(o.p1,mul(G.d0,t));
      c.beginPath();c.moveTo(X[0],X[1]);c.lineTo(o.pF[0],o.pF[1]);c.stroke();c.setLineDash([]);
      const a0=angOf(G.d0),a1=angOf(o.dF);c.strokeStyle=CS.force;c.lineWidth=2.5;const rd=clamp((w-X[0])*.6,70,280);c.beginPath();c.arc(X[0],X[1],rd,Math.min(a0,a1),Math.max(a0,a1));c.stroke();
      const am=(a0+a1)/2;pill(c,'D = '+nf(o.D,1)+'°',X[0]+Math.cos(am)*(rd+22),X[1]+Math.sin(am)*(rd+22),{col:CS.force});}

      if(o.p2){const e2=R.res.ev[1];lab(o.p2,e2.N,o.dIn,'r₂',36,false);if(!e2.tir)lab(o.p2,e2.N,e2.dout,'i₂',40,true);}}}

  {const b=unit(sub(G.o,G.aim)),a=angOf(b);c.save();c.translate(G.o[0],G.o[1]);c.rotate(a);c.fillStyle='#2b3440';rrect(c,0,-11,70,22,5);c.fill();c.fillStyle=col;c.fillRect(-3,-5,5,10);
    c.fillStyle='#e9eef7';c.font='600 11px "Be Vietnam Pro",sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.save();c.translate(36,0);if(Math.cos(a)<0)c.rotate(Math.PI);c.fillText(S1.lam+' nm',0,0);c.restore();c.restore();
    // tay nắm

  // chế độ thử vẽ: tay nắm của học sinh

    txt(c,T('drawMine'),hd[0],hd[1]-22,{sz:12,col:CS.accent,w:700});}
}
function drawGr1(){const {c,w,h}=fit(gr1,isPhone()?.62:.36);const n=MATS[S1.mat].n(S1.lam),A=S1.A;const L=50,Rr=14,Tt=16,B=34,W=w-L-Rr,H=h-Tt-B;

    const t=theta(Math.abs(S4.b),nW(cols[0]),k);txt(c,'θ = '+nf(t,1)+'°',q[0]-R*.75,q[1]+(out[1]>0?-12:14),{sz:13,w:700,col:'#e9eef7'});}
}
function drawGr4(){const {c,w,h}=fit(gr4,isPhone()?.6:.3);const L=46,Rr=12,Tt=14,B=32,W=w-L-Rr,H=h-Tt-B;const k=S4.sec?2:1;
  const y0=k===1?0:40,y1=k===1?50:90;const X=b=>L+b*W,Y=t=>Tt+H-(t-y0)/(y1-y0)*H;c.fillStyle=CS.panel;c.fillRect(L,Tt,W,H);c.strokeStyle=CS.line;c.lineWidth=1;c.beginPath();
  for(let b=0;b<=1.001;b+=.2){c.moveTo(X(b),Tt);c.lineTo(X(b),Tt+H);}for(let t=y0;t<=y1;t+=10){c.moveTo(L,Y(t));c.lineTo(L+W,Y(t));}c.stroke();
  for(let b=0;b<=1.001;b+=.2)txt(c,nf(b,1),X(b),Tt+H+12,{sz:12,mono:true,col:CS.muted,w:500});for(let t=y0;t<=y1;t+=10)txt(c,t+'°',L-5,Y(t),{al:'right',sz:12,mono:true,col:CS.muted,w:500});
  txt(c,T('grB'),L+W,Tt+H+26,{al:'right',sz:12,w:700});txt(c,T('grTh'),L+4,Tt+8,{al:'left',sz:w<560?10.5:12,w:700});
  c.save();c.beginPath();c.rect(L,Tt,W,H);c.clip();
  for(const l of [700,410]){c.strokeStyle=lamCss(l);c.lineWidth=2.4;c.beginPath();for(let b=0;b<=1;b+=.005){const t=theta(b,nW(l),k);b?c.lineTo(X(b),Y(t)):c.moveTo(X(b),Y(t));}c.stroke();
    const m=k===1?TH[l].p:TH[l].s;c.setLineDash([4,4]);c.beginPath();c.moveTo(L,Y(m.t));c.lineTo(L+W,Y(m.t));c.stroke();c.setLineDash([]);
    txt(c,nf(m.t,1)+'°',X(.06),Y(m.t)+(l===700?(k===1?-9:9):(k===1?9:-9)),{sz:12,col:lamCss(l),w:700,al:'left'});}
  const b=Math.abs(S4.b),t=theta(b,nW(S4.col==='v'?410:700),k);c.beginPath();c.arc(X(b),Y(t),6,0,7);c.fillStyle=CS.accent;c.fill();c.restore();}
function drawSky4(){const {c,w,h}=fit(cv4s,isPhone()?.7:.38);const s=S4.sun*DEG;const yH=h*.78,ppd=Math.min(h*.7/60,w/150);const cx=w/2;
  const sky=c.createLinearGradient(0,0,0,yH);sky.addColorStop(0,'#5d7691');sky.addColorStop(1,'#a7b8c8');c.fillStyle=sky;c.fillRect(0,0,w,yH);
  // hướng nhìn: phía đối diện Mặt Trời; điểm đối nhật thấp hơn đường chân trời đúng bằng độ cao Mặt Trời
  const A=[Math.cos(-s),0,Math.sin(-s)];// (x: phía trước, y: ngang, z: lên)
  const u=[-Math.sin(-s),0,Math.cos(-s)],vv=[0,1,0];
  const toXY=p=>{const el=Math.asin(clamp(p[2],-1,1)),az=Math.atan2(p[1],p[0]);return[cx+az/DEG*ppd,yH-el/DEG*ppd];};
  const arc=(rho,col,lw,alpha)=>{c.strokeStyle=col;c.globalAlpha=alpha;c.lineWidth=lw;c.beginPath();let pen=false;
    for(let ph=0;ph<=360;ph+=1){const a=ph*DEG,cr=Math.cos(rho*DEG),sr=Math.sin(rho*DEG);const p=[0,1,2].map(i=>cr*A[i]+sr*(Math.cos(a)*u[i]+Math.sin(a)*vv[i]));
      const [x,y]=toXY(p);if(y<=yH+1&&p[0]>-0.2){pen?c.lineTo(x,y):c.moveTo(x,y);pen=true;}else pen=false;}c.stroke();c.globalAlpha=1;};
  // dải trời sáng hơn bên trong cầu vồng chính
  for(let rho=2;rho<40;rho+=2)arc(rho,'#ffffff',ppd*2.1,.035);
  const ls=[700,650,610,580,530,470,440,410];ls.forEach(l=>arc(TH[l]?TH[l].p.t:thetaMax(nW(l),1).t,lamCss(l),Math.max(2,ppd*.32),.8));
  if(true)ls.forEach(l=>arc(TH[l]?TH[l].s.t:thetaMax(nW(l),2).t,lamCss(l),Math.max(2,ppd*.36),.35));
  // mặt đất và người quan sát (nhìn từ sau lưng)
  c.fillStyle='#4f7a44';c.fillRect(0,yH,w,h-yH);
  const ax=cx,ay=yH+s/DEG*ppd;if(ay<h-4){c.strokeStyle='#ffd34d';c.lineWidth=2;c.beginPath();c.moveTo(ax-8,ay);c.lineTo(ax+8,ay);c.moveTo(ax,ay-8);c.lineTo(ax,ay+8);c.stroke();txt(c,T('anti'),ax+12,ay,{al:'left',sz:12,col:'#fff'});}
  const px=w*.18,py=h-6;c.fillStyle='#1a1f27';c.beginPath();c.arc(px,py-48,10,0,7);c.fill();rrect(c,px-12,py-38,24,38,6);c.fill();
  txt(c,Tf('sunBehind',{s:nf(S4.sun,0)}),8,34,{al:'left',sz:12,col:'#fff'});
  const top=TH[700].p.t-S4.sun;txt(c,top>0?Tf('bowTop',{t:nf(top,1)}):T('bowNone'),8,14,{al:'left',sz:w<560?12:13,w:700,col:top>0?'#fff':'#ffd34d'});}
function ui4(){seg('col4',[{k:'w',label:T('c4w'),dot:'#fff'},{k:'r',label:T('c_red'),dot:lamCss(700)},{k:'v',label:T('c_violet'),dot:lamCss(410)}],S4.col,k=>{S4.col=k;ui4();});
  $('sun4V').textContent=nf(S4.sun,0)+'°';const k=S4.sec?2:1,b=Math.abs(S4.b),l=S4.col==='v'?410:700,n=nW(l);
  const i=Math.asin(b)/DEG,r=Math.asin(b/n)/DEG;
  $('kv4').innerHTML=`<dt>${T('kLam')}</dt><dd class="num">${l} nm</dd><dt>n</dt><dd class="num">${nf(n,4)}</dd><dt>${T('kB')}</dt><dd class="num">${nf(b,2)}</dd>
   <dt>${T('kI')}</dt><dd class="num">${nf(i,1)}°</dd><dt>${T('kR')}</dt><dd class="num">${nf(r,1)}°</dd><dt>${T('kTh')}</dt><dd class="num">${nf(theta(b,n,k),1)}°</dd>
   <dt>${T(k===1?'kMaxR':'kMinR')}</dt><dd class="num">${nf((k===1?TH[700].p:TH[700].s).t,1)}°</dd><dt>${T(k===1?'kMaxV':'kMinV')}</dt><dd class="num">${nf((k===1?TH[410].p:TH[410].s).t,1)}°</dd>`;}
$('many4').onchange=e=>{S4.many=e.target.checked;ui4();};$('sec4').onchange=e=>{S4.sec=e.target.checked;ui4();};$('sun4').oninput=e=>{S4.sun=+e.target.value;ui4();};

/* ================= TAB 5: Luyện tập ================= */
const QZ=[{o:4,c:1},{o:4,c:2},{o:4,c:0},{o:4,c:3},{o:4,c:1},{o:4,c:2},{o:4,c:3},{o:4,c:0},{o:4,c:2},{o:4,c:1}];
const A5={};
function render5(){let h='';QZ.forEach((q,i)=>{const p=A5[i];h+=`<div class="q5"><p>${i+1}. ${T('q'+i)}</p><div class="opts">`+
  [...Array(q.o)].map((_,j)=>`<button class="btn ${p!=null&&j===q.c?'right':''} ${p===j&&j!==q.c?'wrong':''}" data-q="${i}:${j}" ${p!=null?'disabled':''}>${String.fromCharCode(65+j)}. ${T('q'+i+'_'+j)}</button>`).join('')+
  `</div>${p!=null?`<div class="ans">${T('q'+i+'e')}</div>`:''}</div>`;});$('q5').innerHTML=h;
  const n=Object.keys(A5).length,ok=Object.keys(A5).filter(i=>A5[i]===QZ[i].c).length;$('sc5').textContent=ok+' / '+QZ.length;$('sc5t').textContent=Tf('sc5',{n});}
$('q5').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const [i,j]=b.dataset.q.split(':').map(Number);if(A5[i]==null){A5[i]=j;render5();}});
$('rst5').onclick=()=>{for(const k in A5)delete A5[k];render5();};

/* ================= Tab, ngôn ngữ, chế độ GV ================= */
let tab=1;
function setTab(n){tab=n;document.querySelectorAll('nav.tabs button').forEach(b=>{const on=+b.dataset.tab===n;b.classList.toggle('on',on);b.setAttribute('aria-selected',on);});
  for(let k=1;k<=5;k++)$('t'+k).hidden=k!==n;store.set('tsms-tab',String(n));DIRTY.all=true;}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>setTab(+b.dataset.tab));
$('gvBtn').onclick=()=>{const on=!document.body.classList.contains('hideNums');document.body.classList.toggle('hideNums',on);$('gvBtn').setAttribute('aria-pressed',on);};
function applyLang(){document.documentElement.lang=lang;document.title=T('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=T(el.dataset.i18nHtml));
  $('langBtn').textContent=lang==='vi'?'EN':'VI';
  Object.keys(PRED).forEach(renderPred);Object.keys(CONC).forEach(renderConc);[1,2,3,4].forEach(renderVideo);renderMedia();render5();
  ui1();ui2();ui3();ui4();DIRTY.all=true;}
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi';applyLang();};

/* ================= Vòng lặp: chỉ vẽ lại khi có thay đổi ================= */
applyLang();
{const t=+store.get('tsms-tab');setTab(t>=1&&t<=5?t:1);}
let lastSig='';
function sig(){const cv=[cv1,cv2,cv3,cv4][tab-1];return [tab,cv?cv.clientWidth:0,JSON.stringify(tab===1?S1:tab===2?[S2.mode,S2.src,S2.mat,S2.rot,S2.wmm,S2.xs,S2.ys,S2.xl,S2.xs2]:tab===3?S3:S4),lang].join('#');}
function loop(){try{const s=sig();if(s!==lastSig||DIRTY.all){lastSig=s;DIRTY.all=false;
    if(tab===1){draw1();drawGr1();ui1();}else if(tab===2){draw2();ui2();}else if(tab===3){draw3();}else if(tab===4){draw4();drawGr4();drawSky4();}}}
  catch(err){console.error(err);}requestAnimationFrame(loop);}
addEventListener('resize',()=>{DIRTY.all=true;});
requestAnimationFrame(loop);
