<title>Thấu kính và sự tạo ảnh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Bàn quang học: sân khấu canvas bên trái (giá quang học, tia sáng), sổ ghi chép bên phải; màn hứng ảnh là "phòng tối" luôn tối ở cả hai chế độ màu. Điện thoại xếp một cột. */
:root{
  --bg:#eef1f6; --panel:#ffffff; --lane:#f4f6fa; --ink:#121826; --muted:#566079; --line:#cfd6e3;
  --accent:#2a4fb5; --accent-ink:#ffffff; --ok:#16834a; --warn:#c2410c;
  --r1:#e2560f; --r2:#0e7c86; --r3:#9b2fae; --beam:#ee8a00;
  --obj:#1d5fbf; --img:#c62a47; --glass:#bfe3f5; --glass2:#a5d4ee; --glass-edge:#3e8fc0;
  --mask:#3b3f47; --axis:#7d879c; --grid:#e3e8f0; --wax:#e9dcc3; --flame:#ff9d1f; --zone1:#fde7c8; --zone2:#e2ecfb;
  --room:#0f1216; --room-ink:#cfd6e3; --room-line:#2a313b; --screen:#1d2229; --skin:#e0b08a; --iris:#7a4a22; --wall:#d8d2c4; --floor:#b9b2a3;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1219; --panel:#161c26; --lane:#121822; --ink:#e4e9f2; --muted:#98a3b8; --line:#2a3344;
  --accent:#86a0ff; --accent-ink:#0b1430; --ok:#45c47d; --warn:#f08a4b;
  --r1:#ff8a4c; --r2:#38c2cc; --r3:#d27ae6; --beam:#ffb340;
  --obj:#6aa6ff; --img:#ff6b85; --glass:#24475d; --glass2:#2d5670; --glass-edge:#6cbfe8;
  --mask:#5a606b; --axis:#7c879d; --grid:#1f2735; --wax:#d9cbb0; --flame:#ffa733; --zone1:#3a2d18; --zone2:#1a2a44;
  --room:#090b0e; --room-ink:#cfd6e3; --room-line:#262c35; --screen:#191d23; --skin:#d9a77f; --iris:#b07a4a; --wall:#4a463e; --floor:#3a362f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1219; --panel:#161c26; --lane:#121822; --ink:#e4e9f2; --muted:#98a3b8; --line:#2a3344;
  --accent:#86a0ff; --accent-ink:#0b1430; --ok:#45c47d; --warn:#f08a4b;
  --r1:#ff8a4c; --r2:#38c2cc; --r3:#d27ae6; --beam:#ffb340;
  --obj:#6aa6ff; --img:#ff6b85; --glass:#24475d; --glass2:#2d5670; --glass-edge:#6cbfe8;
  --mask:#5a606b; --axis:#7c879d; --grid:#1f2735; --wax:#d9cbb0; --flame:#ffa733; --zone1:#3a2d18; --zone2:#1a2a44;
  --room:#090b0e; --room-ink:#cfd6e3; --room-line:#262c35; --screen:#191d23; --skin:#d9a77f; --iris:#b07a4a; --wall:#4a463e; --floor:#3a362f;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(25px,3.4vw,36px);line-height:1.15;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:700}
.hdr-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);max-width:100%}
.seg .btn{border:0;border-radius:0;min-width:48px;padding:8px 12px}
.seg .btn+.btn{border-left:1px solid var(--line)}
.seg.full{display:flex}
.seg.full .btn{flex:1 1 0;min-width:0}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-size:15px;font-weight:600;white-space:nowrap;min-height:46px;padding:8px 14px;border:0;border-bottom:3px solid transparent;
  background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.req{margin:0;font-size:14px;color:var(--muted);max-width:110ch}
.req b{color:var(--ink);font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
@media (max-width:1020px){.lab{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0}
.card.predict{border-color:var(--accent);border-width:2px}
canvas{display:block;width:100%;touch-action:none;border-radius:8px;background:var(--lane)}
canvas.room{background:var(--room);touch-action:pan-y}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:14px;color:var(--muted);margin:0}
.status{font-size:16px;font-weight:600;margin:0;min-height:24px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.fld .val{color:var(--ink);font-family:var(--font-num);font-size:15px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:500;margin-top:-4px}
input[type=range]{width:100%;min-width:0;height:32px;accent-color:var(--accent)}
input[type=number]{font:inherit;font-family:var(--font-num);font-size:16px;min-height:44px;width:110px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--lane);color:var(--ink)}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px;cursor:pointer;color:var(--ink);font-weight:500}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices .btn{flex:1 1 120px;font-size:14px}
.choices .btn.right{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.choices .btn.wrong{border-color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
.q{font-size:15px;font-weight:600}
.fb{font-size:15px;padding:8px 10px;border-radius:8px;background:var(--lane)}
.fb.good{color:var(--ok)} .fb.bad{color:var(--warn)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
td.n{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.concl{font-size:15px;padding:10px 12px;border-radius:8px;border:1px dashed var(--accent);background:var(--lane)}
.formula{font-family:var(--font-num);font-size:14px;background:var(--lane);padding:8px 10px;border-radius:8px;overflow-x:auto;white-space:nowrap;line-height:1.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:20px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.dash{background:none!important;border-top:3px dashed currentColor;height:0}
.obs{display:flex;flex-direction:column;gap:8px;font-size:15px}
.obs p{margin:0}
.rules{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:8px 10px;border-radius:8px;background:var(--lane)}
.rules li .mk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted)}
.rules li.done .mk{border-color:var(--ok);background:var(--ok);color:var(--panel)}
.rules li .sw{flex:none;width:14px;height:4px;border-radius:2px;margin-top:11px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;align-items:baseline}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;border:1px solid currentColor}
.pill.good{color:var(--ok)} .pill.mid{color:var(--warn)} .pill.off{color:var(--muted)}
details{font-size:15px}
summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:32px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}
ol.steps li.done{color:var(--ok)}
ol.steps li.cur{font-weight:700}
.sub{display:flex;gap:6px;flex-wrap:wrap}
.sub .btn{flex:1 1 120px}
.nudge{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nudge .btn{min-width:44px;padding:8px 10px}
.nudge span{font-size:14px;color:var(--muted);font-weight:600}
footer{font-size:13px;color:var(--muted)}
footer p{margin:0 0 4px;max-width:120ch}
@media (max-width:520px){ .seg .btn{padding:8px 8px;font-size:14px} nav.tabs button{padding:8px 10px;font-size:14px} }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="hdr-ctl">
      <div class="seg" role="group" aria-label="level">
        <button class="btn" id="lvQual" data-i18n="lvQual"></button>
        <button class="btn" id="lvQuant" data-i18n="lvQuant"></button>
      </div>
      <button class="btn" id="langBtn">EN</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="1" data-i18n="tab1"></button>
    <button role="tab" data-tab="2" data-i18n="tab2"></button>
    <button role="tab" data-tab="3" data-i18n="tab3"></button>
    <button role="tab" data-tab="4" data-i18n="tab4"></button>
    <button role="tab" data-tab="5" data-i18n="tab5"></button>
    <button role="tab" data-tab="6" data-i18n="tab6"></button>
  </nav>

  <!-- ===================== TAB 1: Lăng kính → thấu kính ===================== -->
  <section id="t1" class="col">
    <p class="req" data-i18n-html="req1"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint1"></p>
        <canvas id="cv1" aria-label="prisms and lens"></canvas>
        <div class="controls"><span class="hint" data-i18n="zoom"></span>
          <div class="seg" id="zm1"><button class="btn" data-v="1">×1</button><button class="btn" data-v="2">×2</button><button class="btn" data-v="4">×4</button><button class="btn" data-v="8">×8</button></div>
          <span class="hint" id="zmHint1"></span></div>
        <p class="status" id="st1"></p>
        <div class="legend">
          <span><i style="background:var(--r1)"></i><span data-i18n="lgRay"></span></span>
          <span style="color:var(--r1)"><i class="dash"></i><span style="color:var(--muted)" data-i18n="lgExt"></span></span>
          <span><i style="background:var(--r3)"></i><span data-i18n="lgBase"></span></span>
        </div>
      </div>
      <aside class="col">
        <div class="card">
          <h2 data-i18n="cLens1"></h2>
          <div class="seg full" id="typ1"><button class="btn" data-v="conv" data-i18n="conv"></button><button class="btn" data-v="div" data-i18n="div"></button></div>
          <div class="fld"><span data-i18n="nPrism"></span>
            <div class="seg full" id="np1">
              <button class="btn" data-v="2">2</button><button class="btn" data-v="3">3</button><button class="btn" data-v="5">5</button><button class="btn" data-v="9">9</button><button class="btn" data-v="0">∞</button>
            </div></div>
          <div class="fld"><span><span data-i18n="curv"></span> <span class="val" id="rTxt"></span></span>
            <input type="range" id="rngR" min="7" max="24" step="0.5" value="19">
            <div class="ends"><span data-i18n="curvLess"></span><span data-i18n="curvMore"></span></div></div>
          <div class="seg full" id="beam1"><button class="btn" data-v="par" data-i18n="beamPar"></button><button class="btn" data-v="one" data-i18n="beamOne"></button></div>
          <label class="chk"><input type="checkbox" id="nm1" checked> <span data-i18n="names"></span></label>
        </div>
        <div class="card predict">
          <h2 data-i18n="cPred"></h2>
          <p class="q" data-i18n="q1a"></p>
          <div class="choices" id="pq1a"><button class="btn" data-p="0" data-i18n="q1a_0"></button><button class="btn" data-p="1" data-i18n="q1a_1"></button><button class="btn" data-p="2" data-i18n="q1a_2"></button></div>
          <p class="fb" id="fb1a" hidden></p>
          <p class="q" data-i18n="q1b"></p>
          <div class="choices" id="pq1b"><button class="btn" data-p="0" data-i18n="q1b_0"></button><button class="btn" data-p="1" data-i18n="q1b_1"></button><button class="btn" data-p="2" data-i18n="q1b_2"></button></div>
          <p class="fb" id="fb1b" hidden></p>
        </div>
        <div class="card">
          <h2 data-i18n="cObs"></h2>
          <div id="obs1" class="obs"></div>
          <p class="concl" id="concl1" hidden></p>
        </div>
      </aside>
    </div>
  </section>

  <!-- ===================== TAB 2: Đường đi tia sáng ===================== -->
  <section id="t2" class="col" hidden>
    <p class="req" data-i18n-html="req2"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint2"></p>
        <canvas id="cv2" aria-label="laser and lens"></canvas>
        <p class="status" id="st2"></p>
        <div class="controls">
          <button class="btn" id="pre2par" data-i18n="prePar"></button>
          <button class="btn" id="pre2o" data-i18n="preO"></button>
          <button class="btn" id="pre2f"></button>
        </div>
        <div class="controls">
          <button class="btn primary" id="keep2" data-i18n="keep"></button>
          <button class="btn" id="clr2" data-i18n="clearKept"></button>
        </div>
      </div>
      <aside class="col">
        <div class="card">
          <h2 data-i18n="cLens"></h2>
          <div class="seg full" id="typ2"><button class="btn" data-v="conv" data-i18n="conv"></button><button class="btn" data-v="div" data-i18n="div"></button></div>
          <div class="fld" id="f2box"><span><span data-i18n="focal"></span> <span class="val" id="f2Txt"></span></span>
            <input type="range" id="rngF2" min="6" max="15" step="0.5" value="10"></div>
          <dl class="kv" id="kv2"></dl>
        </div>
        <div class="card predict">
          <h2 data-i18n="cPred"></h2>
          <p class="q" id="q2"></p>
          <div class="choices" id="pq2"><button class="btn" data-p="0"></button><button class="btn" data-p="1"></button><button class="btn" data-p="2"></button></div>
          <p class="fb" id="fb2" hidden></p>
        </div>
        <div class="card">
          <h2 data-i18n="cRules"></h2>
          <ul class="rules" id="rules2"></ul>
          <p class="concl" id="concl2" hidden></p>
        </div>
      </aside>
    </div>
  </section>

  <!-- ===================== TAB 3: Sự tạo ảnh ===================== -->
  <section id="t3" class="col" hidden>
    <p class="req" data-i18n-html="req3"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint3"></p>
        <canvas id="cv3" aria-label="optical bench"></canvas>
        <p class="status" id="st3"></p>
        <div class="controls">
          <div class="seg" id="rays3"><button class="btn" data-v="special" data-i18n="raySpecial"></button><button class="btn" data-v="beam" data-i18n="rayBeam"></button><button class="btn" data-v="both" data-i18n="rayBoth"></button></div>
          <div class="seg" id="mode3"><button class="btn" data-v="screen" data-i18n="modeScreen"></button><button class="btn" data-v="eye" data-i18n="modeEye"></button></div>
        </div>
        <div class="controls">
          <label class="chk"><input type="checkbox" id="mask3"> <span data-i18n="mask"></span></label>
          <label class="chk"><input type="checkbox" id="zone3" checked> <span data-i18n="zones"></span></label>
        </div>
        <div class="legend">
          <span><i style="background:var(--r1)"></i><span data-i18n="lg1"></span></span>
          <span><i style="background:var(--r2)"></i><span data-i18n="lg2"></span></span>
          <span><i style="background:var(--r3)"></i><span data-i18n="lg3"></span></span>
          <span><i style="background:var(--obj)"></i><span data-i18n="lgObj"></span></span>
          <span><i style="background:var(--img)"></i><span data-i18n="lgImg"></span></span>
        </div>
      </div>
      <aside class="col">
        <div class="card">
          <h2 data-i18n="cSetup"></h2>
          <div class="seg full" id="typ3"><button class="btn" data-v="conv" data-i18n="conv"></button><button class="btn" data-v="div" data-i18n="div"></button></div>
          <div class="fld"><span><span data-i18n="focal"></span> <span class="val" id="f3Txt"></span></span>
            <input type="range" id="rngF3" min="4" max="20" step="0.5" value="10"></div>
          <div class="fld"><span data-i18n="objType"></span>
            <div class="seg full" id="obj3"><button class="btn" data-v="arrow" data-i18n="oArrow"></button><button class="btn" data-v="F" data-i18n="oF"></button><button class="btn" data-v="candle" data-i18n="oCandle"></button></div></div>
        </div>
        <div class="card" id="scrCard3">
          <h2 id="scrTitle3"></h2>
          <canvas id="cv3s" class="room" aria-label="screen"></canvas>
          <p class="hint" id="scrTxt3"></p>
        </div>
        <div class="card predict">
          <h2 data-i18n="cPred"></h2>
          <p class="hint" id="pr3intro"></p>
          <button class="btn primary" id="pr3start" data-i18n="predStart"></button>
          <div id="pr3box" class="col" hidden>
            <div class="choices" data-g="kind"><button class="btn" data-v="real" data-i18n="pReal"></button><button class="btn" data-v="virt" data-i18n="pVirt"></button><button class="btn" data-v="none" data-i18n="pNone"></button></div>
            <div class="choices" data-g="up"><button class="btn" data-v="up" data-i18n="pUp"></button><button class="btn" data-v="inv" data-i18n="pInv"></button></div>
            <div class="choices" data-g="size"><button class="btn" data-v="big" data-i18n="pSize_big"></button><button class="btn" data-v="eq" data-i18n="pSize_eq"></button><button class="btn" data-v="small" data-i18n="pSize_small"></button></div>
            <button class="btn primary" id="pr3check" data-i18n="check"></button>
          </div>
          <p class="fb" id="fb3" hidden></p>
        </div>
        <div class="card">
          <h2 data-i18n="cResult"></h2>
          <div id="res3" class="obs"></div>
          <details id="ext3"><summary data-i18n="extend"></summary><div class="formula" id="lensEq3"></div></details>
        </div>
        <div class="card">
          <h2 data-i18n="cTable"></h2>
          <div class="row"><button class="btn primary" id="rec3" data-i18n="record"></button><button class="btn" id="clr3" data-i18n="clearTbl"></button></div>
          <div class="tblwrap"><table id="tbl3"></table></div>
          <canvas id="cv3g" aria-label="graph" hidden></canvas>

  why5kl:['<b>Cấu tạo:</b> kính lúp là một thấu kính hội tụ có tiêu cự ngắn, lắp trong khung có tay cầm. Trên vành ghi số bội giác như 2x, 3x, 5x; G = 25/f với f tính bằng cm.','<b>Nguyên lí:</b> đặt vật trong khoảng tiêu cự (d < f) thì thấu kính hội tụ cho ảnh ảo, cùng chiều, lớn hơn vật. Mắt đặt sau kính nhìn ảnh ảo này dưới góc trông lớn hơn.','<b>Cách dùng:</b> đặt kính sát vật rồi từ từ đưa ra xa đến khi thấy ảnh rõ, to nhất; vật khi đó ở gần tiêu điểm.','<b>Nói gọn cho học sinh:</b> kính lúp "kéo" vật lại gần mắt hơn mà mắt vẫn nhìn rõ.'],
  why5ma:['<b>Nguyên lí:</b> vật kính là thấu kính hội tụ. Người ở rất xa (d > 2f) nên cho ảnh thật, ngược chiều, nhỏ hơn vật, nằm ngay sau tiêu điểm F′.','<b>Lấy nét</b> là dịch vật kính (hoặc cảm biến) để ảnh rơi đúng lên cảm biến. Vật càng gần, ảnh càng lùi xa vật kính.','<b>Nói gọn cho học sinh:</b> máy ảnh là "màn hứng ảnh thật" đặt trong hộp tối; ảnh ngược chiều được phần mềm lật lại.'],
  why5mat:['<b>Mô hình:</b> thể thuỷ tinh như một thấu kính hội tụ, màng lưới như màn hứng ảnh cách nó khoảng 2 cm và không dịch được. Ảnh trên màng lưới là ảnh thật, ngược chiều, rất nhỏ.','<b>Điều tiết:</b> vì không dịch được màn, mắt đổi tiêu cự: nhìn vật gần thì cơ vòng co, thể thuỷ tinh phồng lên, f giảm.','<b>Giới hạn:</b> mắt chỉ điều tiết được đến điểm cực cận (khoảng 25 cm với mắt tốt). Vật gần hơn thì ảnh rơi sau màng lưới, nhìn mờ.','<b>Nói gọn cho học sinh:</b> máy ảnh lấy nét bằng cách dịch thấu kính, còn mắt lấy nét bằng cách làm thấu kính phồng hay dẹt.'],
  why5mc:['<b>Nguyên lí:</b> phim (vật) đặt ngoài tiêu cự nhưng rất gần F (f < d < 2f, sát f). Vật kính cho ảnh thật, ngược chiều, lớn hơn vật rất nhiều lần trên tường ở xa.','<b>Vì ảnh ngược chiều</b> nên phim phải đặt lộn ngược thì ảnh trên tường mới xuôi chiều.','<b>Lấy nét:</b> tường càng xa thì phim phải đặt càng gần tiêu điểm.','<b>Nói gọn cho học sinh:</b> máy chiếu là máy ảnh chạy ngược: vật nhỏ ở gần, ảnh to ở xa.'],

  foot1:'<b>Giả thiết mô phỏng.</b> Thuỷ tinh chiết suất n = 1,5. Tia sáng khúc xạ theo định luật khúc xạ (n = sin i / sin r) tại từng mặt, tính chính xác cả phản xạ toàn phần nếu xảy ra. Hai mặt thấu kính là mặt cầu cùng bán kính R; với thấu kính mỏng thì f ≈ R. Hình vẽ đúng tỉ lệ.',
  foot2:'<b>Giả thiết mô phỏng.</b> Thấu kính mỏng lí tưởng, đường kính 14 cm: tia sáng coi như khúc xạ một lần tại mặt phẳng giữa thấu kính. Hình vẽ đúng tỉ lệ.',
  foot3:'<b>Giả thiết mô phỏng.</b> Thấu kính mỏng lí tưởng, đường kính 10 cm. Hình được phóng to theo chiều đứng cho dễ nhìn (đường thẳng vẫn thẳng, các giao điểm giữ nguyên). Tia đặc biệt có thể đi ra ngoài vành thấu kính; khi đó coi thấu kính được kéo dài (nét đứt) như cách vẽ trong SGK. Độ sáng và độ nhòe của ảnh trên màn tính theo chùm sáng thật đi qua thấu kính.',
  foot4:'<b>Giả thiết mô phỏng.</b> Thấu kính bí ẩn có tiêu cự chọn ngẫu nhiên từ 8 cm đến 20 cm, đường kính 5 cm. Vật là chữ F phát sáng cao 2 cm đặt ở vạch 0. Độ nhòe của ảnh tính theo chùm sáng thật.',
  foot5:'<b>Giả thiết mô phỏng.</b> Mỗi dụng cụ được mô hình hoá bằng một thấu kính hội tụ mỏng. Kính lúp: mắt đặt sát kính, G = 25/f; khung bên phải vẽ vật và ảnh cùng tỉ lệ với hình vẽ. Mắt: thực tế ánh sáng khúc xạ nhiều nhất ở giác mạc; ở đây gộp lại thành thể thuỷ tinh cách màng lưới 2 cm, điểm cực cận 25 cm; hình toàn cảnh của mắt không theo tỉ lệ. Máy chiếu: vật kính f = 10 cm, phim cao 2,4 cm; tụ quang hội tụ ánh sáng đèn vào vật kính.',

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
let lang='vi', level='quant', tab=1;
try{ const sv=JSON.parse(localStorage.getItem('thaukinh-ui')||'{}'); if(sv.lang) lang=sv.lang; if(sv.level) level=sv.level; if(sv.tab) tab=sv.tab; }catch(e){}
const HASH={'lang-kinh':1,'tia-sang':2,'tao-anh':3,'do-tieu-cu':4,'ung-dung':5,'luyen-ve':6};
if (HASH[location.hash.slice(1)]) tab = HASH[location.hash.slice(1)];
function save(){ try{ localStorage.setItem('thaukinh-ui', JSON.stringify({lang,level,tab})); }catch(e){} }
function t(k, ...a){ let v = I18N[lang][k]; if (v===undefined) v = I18N.vi[k]; if (v===undefined) return k; return typeof v==='function' ? v(...a) : v; }
function nf(x, d=1, min=0){ return new Intl.NumberFormat(lang==='vi'?'vi-VN':'en-US',{maximumFractionDigits:d,minimumFractionDigits:min}).format(x); }
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const snap=(v,s)=>Math.round(v/s)*s;
const quant=()=>level==='quant';
let C={};
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  for (const k of ['bg','panel','lane','ink','muted','line','accent','ok','warn','r1','r2','r3','beam','obj','img','glass','glass2','glass-edge','mask','axis','grid','wax','flame','zone1','zone2','room','room-ink','room-line','screen','skin','iris','wall','floor'])
    C[k]=cs.getPropertyValue('--'+k).trim();
}
function fit(cv, aspect, minH, maxH){
  const w=cv.clientWidth||300; const h=Math.round(clamp(w*aspect,minH,maxH));
  cv.style.height=h+'px'; const dpr=window.devicePixelRatio||1;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {cv,ctx,w,h};
}
function ptr(cv,e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function font(ctx,size=13,weight=600){ ctx.font=`${weight} ${size}px "Be Vietnam Pro",system-ui,sans-serif`; }
function label(ctx,txt,x,y,col,align='center',size=13,weight=600,bg){
  font(ctx,size,weight); ctx.textAlign=align; ctx.textBaseline='middle';
  if (bg){ const w=ctx.measureText(txt).width+8; const x0= align==='center'? x-w/2 : align==='right'? x-w+4 : x-4; ctx.fillStyle=bg; ctx.globalAlpha=.85; ctx.fillRect(x0,y-size*0.75,w,size*1.5); ctx.globalAlpha=1; }
  ctx.fillStyle=col; ctx.fillText(txt,x,y);
}
/* Khung nhìn: toạ độ thế giới tính bằng cm, trục chính là y = 0 */
function view(D,x0,x1,yHalf,trueScale,pad=0,oyFrac=0.5){
  const k=(D.w-2*pad)/(x1-x0); const oy=D.h*oyFrac;
  const ky= trueScale? k : Math.max(k,(Math.min(oy,D.h-oy)-14)/yHalf);
  const V={k,ky,x0,x1,oy,X:x=>pad+(x-x0)*k, Y:y=>oy-y*ky, ix:px=>x0+(px-pad)/k, iy:py=>(oy-py)/ky, w:D.w,h:D.h};
  V.box={x0:x0-2,x1:x1+2,y0:-(D.h-oy)/ky*1.4-1,y1:oy/ky*1.4+1};
  return V;
}
function clipSeg(x1,y1,x2,y2,b){
  let t0=0,t1=1; const dx=x2-x1, dy=y2-y1;
  const p=[-dx,dx,-dy,dy], q=[x1-b.x0, b.x1-x1, y1-b.y0, b.y1-y1];
  for(let i=0;i<4;i++){
    if (p[i]===0){ if (q[i]<0) return null; }
    else { const r=q[i]/p[i]; if (p[i]<0){ if (r>t1) return null; if (r>t0) t0=r; } else { if (r<t0) return null; if (r<t1) t1=r; } }
  }
  return [x1+t0*dx,y1+t0*dy,x1+t1*dx,y1+t1*dy];
}
function L(ctx,V,x1,y1,x2,y2,col,lw=2,dash=null,arrow=false,alpha=1){
  const c=clipSeg(x1,y1,x2,y2,V.box); if (!c) return;
  const X1=V.X(c[0]),Y1=V.Y(c[1]),X2=V.X(c[2]),Y2=V.Y(c[3]);
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.moveTo(X1,Y1); ctx.lineTo(X2,Y2); ctx.stroke(); ctx.setLineDash([]);
  if (arrow){ const len=Math.hypot(X2-X1,Y2-Y1); if (len>46){
    const ux=(X2-X1)/len, uy=(Y2-Y1)/len, s=6+lw, mx=X1+(X2-X1)*0.5, my=Y1+(Y2-Y1)*0.5;
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(mx+ux*s,my+uy*s); ctx.lineTo(mx-ux*s-uy*s*0.6,my-uy*s+ux*s*0.6); ctx.lineTo(mx-ux*s+uy*s*0.6,my-uy*s-ux*s*0.6); ctx.closePath(); ctx.fill(); } }
  ctx.restore();
}
function arrowPx(ctx,x1,y1,x2,y2,col,lw=2.5){
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy); if (len<3) return;
  const ux=dx/len, uy=dy/len, hs=Math.min(10,len*0.45);
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2-ux*hs*0.8,y2-uy*hs*0.8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-ux*hs-uy*hs*0.55,y2-uy*hs+ux*hs*0.55); ctx.lineTo(x2-ux*hs+uy*hs*0.55,y2-uy*hs-ux*hs*0.55); ctx.closePath(); ctx.fill();
}
/* Ảnh qua thấu kính mỏng: F > 0 hội tụ, F < 0 phân kì; d > 0 */
function imageOf(d,F){
  if (Math.abs(d-F)<1e-9) return {inf:true,dp:Infinity,m:Infinity,real:false};
  const dp=d*F/(d-F); return {inf:false,dp,m:-dp/d,real:dp>0};
}
function propsOf(im){
  if (im.inf) return {kind:'none'};
  const a=Math.abs(im.m);
  return {kind:im.real?'real':'virt', up:im.m>0?'up':'inv', size: Math.abs(a-1)<0.02?'eq':(a>1?'big':'small')};
}
function propText(p){ if (p.kind==='none') return t('noImage'); return t(p.kind==='real'?'pReal':'pVirt')+', '+t(p.up==='up'?'pUp':'pInv').toLowerCase()+', '+t('pSize_'+p.size).toLowerCase(); }

function drawAxis(ctx,V,col){ ctx.save(); ctx.strokeStyle=col||C.axis; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(0,V.Y(0)); ctx.lineTo(V.w,V.Y(0)); ctx.stroke(); ctx.restore(); }
function drawRuler(ctx,V,y,labelEvery,origin=0,show=true){
  ctx.save(); ctx.strokeStyle=C.muted; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(V.w,y); ctx.stroke();
  const step= V.k>=6 ? 1 : (V.k>=2.5?2:5);
  for (let x=Math.ceil(V.x0/step)*step; x<=V.x1; x+=step){
    const r=Math.round(x-origin); const big = r%10===0, mid=r%5===0;
    const px=V.X(x); ctx.beginPath(); ctx.moveTo(px,y); ctx.lineTo(px,y+(big?10:mid?7:4)); ctx.stroke();
    if (show && big && r>=0 && r%labelEvery===0) label(ctx,nf(r,0),px,y+19,C.muted,'center',11,600);
  }
  ctx.restore();
}
function lensPath(ctx,x,yt,yb,conv,bw){
  const ym=(yt+yb)/2; ctx.beginPath();
  if (conv){ ctx.moveTo(x,yt); ctx.quadraticCurveTo(x+bw*2,ym,x,yb); ctx.quadraticCurveTo(x-bw*2,ym,x,yt); }
  else { ctx.moveTo(x-bw,yt); ctx.lineTo(x+bw,yt); ctx.quadraticCurveTo(x+bw*0.1,ym,x+bw,yb); ctx.lineTo(x-bw,yb); ctx.quadraticCurveTo(x-bw*0.1,ym,x-bw,yt); }
  ctx.closePath();
}
function drawLens(ctx,V,xL,H,conv,o={}){
  const x=V.X(xL), yt=V.Y(H), yb=V.Y(-H);
  if (o.plane!==false){ ctx.save(); ctx.strokeStyle=C['glass-edge']; ctx.globalAlpha=.45; ctx.setLineDash([5,6]); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,V.h); ctx.stroke(); ctx.restore(); }
  const bw=o.bw ?? clamp((yb-yt)*0.06,4,12);
  ctx.save(); lensPath(ctx,x,yt,yb,conv,bw); ctx.fillStyle=C.glass; ctx.globalAlpha=.85; ctx.fill(); ctx.globalAlpha=1;
  ctx.strokeStyle=C['glass-edge']; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
  if (o.mask){ ctx.save(); ctx.fillStyle=C.mask; ctx.fillRect(x-bw*2.6,yt-6,bw*5.2,V.Y(0)-yt+5); ctx.restore(); }
}
function drawPt(ctx,V,x,txt,col,below=true){
  const px=V.X(x), py=V.Y(0); ctx.save(); ctx.fillStyle=col; ctx.beginPath(); ctx.arc(px,py,4,0,7); ctx.fill(); ctx.restore();
  label(ctx,txt,px,py+(below?16:-16),col,'center',13,700,C.panel);
}
/* Vật/ảnh nhìn ngang. h tính bằng cm (âm = lộn ngược, tức quay 180°) */
function sideGlyph(ctx,V,type,x,h,col,o={}){
  const px=V.X(x), y0=V.Y(0), y1=V.Y(h), hp=y0-y1, s=Math.sign(h)||1, ah=Math.abs(hp);
  if (!isFinite(px)||!isFinite(y1)||ah<1) return;
  ctx.save(); ctx.globalAlpha=o.alpha??1; ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=o.lw||3; ctx.lineCap='round'; ctx.lineJoin='round';
  if (o.dash) ctx.setLineDash([6,5]);
  if (type==='arrow'){
    const hs=Math.min(12,ah*0.4);
    ctx.beginPath(); ctx.moveTo(px,y0); ctx.lineTo(px,y1+s*hs*0.7); ctx.stroke();
    ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(px,y1); ctx.lineTo(px-hs*0.6,y1+s*hs); ctx.lineTo(px+hs*0.6,y1+s*hs); ctx.closePath();
    if (o.dash){ ctx.lineWidth=2; ctx.stroke(); } else ctx.fill();
  } else if (type==='F'){
    const bw=clamp(ah*0.45,6,70)*s;
    ctx.beginPath(); ctx.moveTo(px,y0); ctx.lineTo(px,y1); ctx.lineTo(px+bw,y1); ctx.moveTo(px,y0-hp*0.52); ctx.lineTo(px+bw*0.72,y0-hp*0.52); ctx.stroke();
  } else if (type==='candle'){
    const ww=clamp(ah*0.13,3,40), yb=y0-hp*0.64;
    ctx.beginPath(); ctx.rect(px-ww,Math.min(y0,yb),ww*2,Math.abs(yb-y0));
    if (o.dash){ ctx.lineWidth=2; ctx.stroke(); } else { ctx.fillStyle=o.wax||C.wax; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=2; ctx.stroke(); }
    const fy0=yb, fy1=y1, fm=fy0+(fy1-fy0)*0.42, fw=ww*0.85*(o.flick||1);
    ctx.beginPath(); ctx.moveTo(px,fy0); ctx.quadraticCurveTo(px+fw*1.4,fm,px,fy1); ctx.quadraticCurveTo(px-fw*1.4,fm,px,fy0); ctx.closePath();
    if (o.dash){ ctx.strokeStyle=C.flame; ctx.lineWidth=2; ctx.stroke(); } else { ctx.fillStyle=C.flame; ctx.fill(); }
  }
  ctx.restore();
}
function drawEye(ctx,px,py,s,col){
  ctx.save(); ctx.translate(px,py); ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.fillStyle=C.panel;
  ctx.beginPath(); ctx.moveTo(-s,0); ctx.quadraticCurveTo(0,-s*0.9,s*0.9,0); ctx.quadraticCurveTo(0,s*0.9,-s,0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(-s*0.38,0,s*0.3,0,7); ctx.fill();
  ctx.fillStyle=C.panel; ctx.beginPath(); ctx.arc(-s*0.45,-s*0.08,s*0.08,0,7); ctx.fill();
  ctx.restore();
}

/* Cảnh quang học chung cho thấu kính mỏng: vật B ở (xo, h) */
function opt(ctx,V,o){
  const {xL,F,H,xo,h}=o, d=xL-xo, im=imageOf(d,F), conv=F>0;
  const xi=xL+im.dp, yi=im.m*h;
  const stop=(o.stopX!=null && o.stopX>xL)? o.stopX : xL+1e4;
  const R=[];
  if (o.special){
    const want=k=>!o.only || o.only.includes(k);
    if (want('par')) R.push({y:h,col:C.r1,k:'par'}); if (want('o')) R.push({y:0,col:C.r2,k:'o'});
    if (want('f') && Math.abs(d-F)>0.05){ const u=-h/(d-F); R.push({y:h+u*d,col:C.r3,k:'f'}); }
  }
  if (o.beam){ const n=o.nb||9; for (let i=0;i<n;i++){ R.push({y:-H+2*H*(i+0.5)/n,col:C.beam,k:'b',thin:true}); } }
  for (const r of R){
    const u=(r.y-h)/d, lw=r.thin?1.4:2.4, al=r.thin?0.7:1;
    const blocked=(o.mask && r.y>0.02);
    const x0= o.farFrom!=null ? Math.max(xo,o.farFrom) : xo, y0=h+u*(x0-xo);
    L(ctx,V,x0,y0,xL,r.y,r.col,lw,null,!r.thin,al);
    if (r.k==='f' && !conv) L(ctx,V,xL,r.y,xL-F,0,r.col,1.3,[4,5],false,.6);
    if (r.k==='f' && conv && d<F) L(ctx,V,xL-F,0,xo,h,r.col,1.3,[4,5],false,.6);
    if (blocked){ const px=V.X(xL)-3, py=V.Y(r.y); ctx.save(); ctx.strokeStyle=r.col; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(px-5,py-5); ctx.lineTo(px+5,py+5); ctx.moveTo(px+5,py-5); ctx.lineTo(px-5,py+5); ctx.stroke(); ctx.restore(); continue; }
    if (o.hideOut) continue;
    const u2=u-r.y/F, xe=stop;
    L(ctx,V,xL,r.y,xe,r.y+u2*(xe-xL),r.col,lw,null,!r.thin,al);
    if (!im.inf && !im.real) L(ctx,V,xL,r.y,xi,yi,r.col,r.thin?1:1.4,[5,5],false,r.thin?0.5:0.8);
  }
  const res={im,xi,yi,d};
  if (o.hideOut || o.showImg===false) return res;
  if (!im.inf && Math.abs(im.dp)<800 && Math.abs(yi)<200){
    if (im.real){
      if (xi<=stop+1e-6) sideGlyph(ctx,V,o.obj,xi,yi,C.img,{lw:3,flick:o.flick});
      else if (o.ghost!==false){ sideGlyph(ctx,V,o.obj,xi,yi,C.img,{lw:2,dash:true,alpha:.35}); res.ghost=true; }
    } else sideGlyph(ctx,V,o.obj,xi,yi,C.img,{lw:2.2,dash:true});
    if (o.labels!==false && (im.real? xi<=stop+1e-6 : true)){
      label(ctx,'A′',V.X(xi),V.Y(0)+(yi>0?14:-14),C.img,'center',13,700,C.panel);
      label(ctx,'B′',V.X(xi)+14,V.Y(yi),C.img,'left',13,700,C.panel);
    }
  }
  return res;
}

/* ---- Màn nhìn chính diện (phòng tối) ---- */
const SAMP=(()=>{ const a=[], N=48; for (let i=0;i<N;i++){ const r=Math.sqrt((i+0.5)/N), th=i*2.39996; a.push([r*Math.cos(th), r*Math.sin(th)]); } return a; })();
const HAS_FILTER=(()=>{ try{ const c=document.createElement('canvas').getContext('2d'); return 'filter' in c; }catch(e){ return false; } })();
function glyph2D(ctx,type,a){
  if (type==='arrow'){ ctx.fillStyle=`rgba(255,228,176,${a})`; ctx.fillRect(-0.045,0,0.09,0.8); ctx.beginPath(); ctx.moveTo(-0.17,0.78); ctx.lineTo(0.17,0.78); ctx.lineTo(0,1); ctx.closePath(); ctx.fill(); }
  else if (type==='F'){ ctx.fillStyle=`rgba(255,228,176,${a})`; ctx.fillRect(-0.07,0,0.14,1); ctx.fillRect(-0.07,0.87,0.6,0.13); ctx.fillRect(-0.07,0.45,0.44,0.13); }
  else if (type==='candle'){ ctx.fillStyle=`rgba(240,214,170,${a*0.35})`; ctx.fillRect(-0.12,0,0.24,0.64);
    ctx.fillStyle=`rgba(255,170,60,${a})`; ctx.beginPath(); ctx.ellipse(0,0.81,0.085,0.17,0,0,7); ctx.fill();
    ctx.fillStyle=`rgba(255,240,200,${a})`; ctx.beginPath(); ctx.ellipse(0,0.78,0.035,0.08,0,0,7); ctx.fill(); }
  else if (type==='person'){ ctx.fillStyle=`rgba(255,226,180,${a})`; ctx.beginPath(); ctx.arc(0,0.915,0.075,0,7); ctx.fill();
    ctx.fillRect(-0.12,0.47,0.24,0.36); ctx.fillRect(-0.11,0,0.09,0.48); ctx.fillRect(0.02,0,0.09,0.48); ctx.fillRect(-0.2,0.5,0.07,0.31); ctx.fillRect(0.13,0.5,0.07,0.31); }
}
/* Ánh sáng từ vật (cao h, cách thấu kính d) đi qua thấu kính bán kính H, tới màn cách thấu kính s.
   Điểm sáng (y,z) tới màn tại c·(y,z) + P·(1 − s/d′), với c = −s/d, P chạy trên phần mở của thấu kính. */
function renderScreen(ctx,o){
  const {cx,cy,ppc,type,h,d,dp,s,H,mask,gain=1,sref=20}=o;
  const c=-s/d, fac= isFinite(dp)? 1-s/dp : 1;
  const open= mask? SAMP.filter(p=>p[1]<0) : SAMP;
  const blurPx=H*Math.abs(fac)*ppc;
  const pts= blurPx<0.6 ? [[0,0]] : open;
  const I= (mask?0.5:1)*gain*clamp((sref/s)**2,0.04,2.4);
  const a=Math.min(1, pts.length>1 ? I/pts.length*1.2*clamp(blurPx/6,1,7) : I); // nhòe nhiều thì tăng nhẹ độ sáng cho dễ thấy vệt sáng
  ctx.save(); ctx.globalCompositeOperation='lighter';
  if (HAS_FILTER && blurPx>3) ctx.filter=`blur(${Math.min(14,blurPx/5).toFixed(1)}px)`;
  for (const p of pts){
    const ox= p[0]*H*fac*ppc, oy= -p[1]*H*fac*ppc;
    ctx.setTransform(1,0,0,1,0,0); ctx.save();
    const dpr=window.devicePixelRatio||1;
    ctx.setTransform(dpr*c*h*ppc,0,0,-dpr*c*h*ppc,dpr*(cx+ox),dpr*(cy+oy));
    glyph2D(ctx,type,a); ctx.restore();
  }
  ctx.restore();
  const dpr=window.devicePixelRatio||1; ctx.setTransform(dpr,0,0,dpr,0,0);
  return {blurCm:H*Math.abs(fac), size:Math.abs(c*h)};
}
function screenFrame(ctx,x,y,w,h,ppc,gridStep,labelStep){
  ctx.save(); ctx.fillStyle=C.screen; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=C['room-line']; ctx.lineWidth=1; ctx.beginPath();
  const cx=x+w/2, cy=y+h/2;
  for (let v=0; v<=w/2; v+=gridStep*ppc){ ctx.moveTo(cx+v,y); ctx.lineTo(cx+v,y+h); ctx.moveTo(cx-v,y); ctx.lineTo(cx-v,y+h); }
  for (let v=0; v<=h/2; v+=gridStep*ppc){ ctx.moveTo(x,cy+v); ctx.lineTo(x+w,cy+v); ctx.moveTo(x,cy-v); ctx.lineTo(x+w,cy-v); }
  ctx.stroke(); ctx.restore();
}

/* ============ TAB 1: lăng kính → thấu kính (dò tia theo định luật khúc xạ) ============ */
const s1={type:'conv', N:2, R:12, beam:'par', laserY:2.2, names:true, p1:null, p2:null, zoom:1, cx:1, cy:0};
const NG=1.5, H1=4, E1=0.15, X1A=-24, X1B=26;
let D1=null, V1=null;
function lens1(){
  const R=s1.R, conv=s1.type==='conv', N=s1.N||400;
  const sag=y=>R-Math.sqrt(R*R-y*y);
  const tc= conv? E1+2*sag(H1) : 0.3;
  const xr= y=> conv? tc/2-sag(y) : tc/2+sag(y);
  const ys=[]; for (let i=0;i<=N;i++) ys.push(-H1+2*H1*i/N);
  const P=[]; ys.forEach(y=>P.push([xr(y),y])); for (let i=N;i>=0;i--) P.push([-xr(ys[i]),ys[i]]);
  return {P,ys,xr,N};
}
function trace1(P,p,d){
  const pts=[p.slice()]; let cur=p.slice(), dir=d.slice();
  for (let it=0; it<14; it++){
    let best=Infinity, bn=null;
    for (let i=0;i<P.length;i++){
      const a=P[i], b=P[(i+1)%P.length], ex=b[0]-a[0], ey=b[1]-a[1];
      const den=dir[0]*ey-dir[1]*ex; if (Math.abs(den)<1e-12) continue;
      const wx=a[0]-cur[0], wy=a[1]-cur[1];
      const tt=(wx*ey-wy*ex)/den, u=(wx*dir[1]-wy*dir[0])/den;
      if (tt>1e-7 && u>=-1e-9 && u<=1+1e-9 && tt<best){ best=tt; const Lh=Math.hypot(ex,ey); bn=[ey/Lh,-ex/Lh]; }
    }
    if (!bn) break;
    cur=[cur[0]+dir[0]*best, cur[1]+dir[1]*best]; pts.push(cur.slice());
    let nn=bn, n1=1, n2=NG; const dn=dir[0]*bn[0]+dir[1]*bn[1];
    if (dn>0){ nn=[-bn[0],-bn[1]]; n1=NG; n2=1; }
    const ci=-(dir[0]*nn[0]+dir[1]*nn[1]), eta=n1/n2, k=1-eta*eta*(1-ci*ci);
    if (k<0) dir=[dir[0]+2*ci*nn[0], dir[1]+2*ci*nn[1]];
    else { const cc=eta*ci-Math.sqrt(k); dir=[eta*dir[0]+cc*nn[0], eta*dir[1]+cc*nn[1]]; }
    const Ln=Math.hypot(dir[0],dir[1]); dir=[dir[0]/Ln,dir[1]/Ln];
    cur=[cur[0]+dir[0]*1e-6, cur[1]+dir[1]*1e-6];
  }
  return {pts,dir,end:cur};
}
function rays1(){
  const lp=lens1(), out=[];
  let ys=[];
  if (s1.beam==='one') ys=[s1.laserY];
  else { for (let i=1;i<=5;i++){ ys.push(H1*0.9*i/5); ys.push(-H1*0.9*i/5); } if (s1.N%2===1 || s1.N===0) ys.push(0); }
  for (const y of ys){ const r=trace1(lp.P,[X1A-1,y],[1,0]); r.y0=y; out.push(r); }
  return {lp,out};
}
function crossX(r){ const e=r.end, d=r.dir; if (Math.abs(d[1])<1e-9) return null; return e[0]-e[1]*d[0]/d[1]; }
/* Độ nhoè của chùm song song khi ghép ∞ lăng kính: tia mép cắt trục ở rim, tia gần trục ở near */
function blur1(){
  if (s1.N!==0) return null;
  const lp=lens1(), conv=s1.type==='conv';
  const near=crossX(trace1(lp.P,[X1A-1,H1*0.18],[1,0])), rim=crossX(trace1(lp.P,[X1A-1,H1*0.9],[1,0]));
  if (near===null||rim===null) return null;
  const ratio=Math.abs(near-rim)/Math.abs(near);
  return {near,rim,ratio,bad:ratio>0.17};
}
function focus1(){ const lp=lens1(); const r=trace1(lp.P,[X1A-1,H1/lp.N],[1,0]); return crossX(r); } // tia gần trục, đi qua giữa dải sát trục
function draw1(){
  const {ctx,w,h}=D1; ctx.clearRect(0,0,w,h);
  const span=(X1B-X1A)/s1.zoom, kz=w/span;
  V1=view(D1,s1.cx-span/2,s1.cx+span/2,6,true,0,0.5+s1.cy*kz/h); const V=V1, conv=s1.type==='conv', LX=Math.max(V.X(X1A),0);
  drawAxis(ctx,V);
  const {lp,out}=rays1();
  // các lăng kính nhỏ
  const N=lp.N, smooth=s1.N===0;
  for (let i=0;i<N;i++){
    const a=lp.ys[i], b=lp.ys[i+1];
    ctx.beginPath(); ctx.moveTo(V.X(lp.xr(a)),V.Y(a)); ctx.lineTo(V.X(lp.xr(b)),V.Y(b)); ctx.lineTo(V.X(-lp.xr(b)),V.Y(b)); ctx.lineTo(V.X(-lp.xr(a)),V.Y(a)); ctx.closePath();
    ctx.fillStyle= smooth? C.glass : (i%2? C.glass2 : C.glass); ctx.fill();
    if (!smooth){ ctx.strokeStyle=C['glass-edge']; ctx.lineWidth=1.5; ctx.stroke(); }
  }
  if (smooth){ ctx.beginPath(); lp.P.forEach((p,i)=>i? ctx.lineTo(V.X(p[0]),V.Y(p[1])) : ctx.moveTo(V.X(p[0]),V.Y(p[1]))); ctx.closePath(); ctx.strokeStyle=C['glass-edge']; ctx.lineWidth=2; ctx.stroke(); }
  // lăng kính đang được chiếu (chế độ một tia) và hướng về đáy
  if (!smooth){
    let idx=null; if (s1.beam==='one') idx=clamp(Math.floor((s1.laserY+H1)/(2*H1)*N),0,N-1);
    for (let i=0;i<N;i++){
      if (s1.beam==='one' && i!==idx) continue;
      const a=lp.ys[i], b=lp.ys[i+1], ta=lp.xr(a), tb=lp.xr(b);
      if (Math.abs(ta-tb)<1e-6) continue;
      const thick = ta>tb ? a : b, thin = ta>tb ? b : a; // đáy ở phía dày hơn
      const ym=(a+b)/2, px=V.X(0), yb=V.Y(thick), ymPx=V.Y(ym);
      if (s1.beam==='one'){ ctx.save(); ctx.beginPath(); ctx.moveTo(V.X(ta),V.Y(a)); ctx.lineTo(V.X(tb),V.Y(b)); ctx.lineTo(V.X(-tb),V.Y(b)); ctx.lineTo(V.X(-ta),V.Y(a)); ctx.closePath(); ctx.strokeStyle=C.r3; ctx.lineWidth=2.5; ctx.stroke(); ctx.restore(); }
      ctx.save(); arrowPx(ctx,px,ymPx,px,ymPx+(yb-ymPx)*0.75,C.r3,2); ctx.restore();
    }
  }
  // tia sáng
  for (const r of out){
    ctx.save(); ctx.strokeStyle=C.r1; ctx.lineWidth=s1.beam==='one'?2.6:1.8; ctx.lineCap='round'; ctx.beginPath();
    r.pts.forEach((p,i)=>{ const P=[V.X(p[0]),V.Y(p[1])]; i? ctx.lineTo(...P) : ctx.moveTo(...P); }); ctx.stroke(); ctx.restore();
    const e=r.end, d=r.dir; L(ctx,V,e[0],e[1],e[0]+d[0]*80,e[1]+d[1]*80,C.r1,s1.beam==='one'?2.6:1.8,null,true);
    if (!conv && Math.abs(d[1])>1e-6){ const xc=crossX(r); if (xc!==null && xc<e[0]) L(ctx,V,e[0],e[1],Math.max(xc,X1A-2),e[1]+d[1]/d[0]*(Math.max(xc,X1A-2)-e[0]),C.r1,1.2,[5,5],false,.75); }
  }
  // đèn
  if (s1.beam==='one'){ const px=LX+2, py=V.Y(s1.laserY); ctx.save(); ctx.fillStyle=C.ink; ctx.beginPath(); ctx.roundRect? ctx.roundRect(px-2,py-9,34,18,5) : ctx.rect(px-2,py-9,34,18); ctx.fill(); ctx.fillStyle=C.r1; ctx.fillRect(px+30,py-3,5,6);
    ctx.strokeStyle=C.accent; ctx.lineWidth=2; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.arc(px+14,py,16,0,7); ctx.stroke(); ctx.restore(); }
  // vùng các tia cắt trục khi thấu kính quá cong
  const B=blur1();
  if (B && B.bad && s1.beam==='par'){

  $$('#m4 .btn').forEach(b=>b.onclick=()=>{ s4.method=+b.dataset.v; s4.rec=[]; if (s4.method===1&&s4.lock) s4.xL=s4.xs/2; ui4(); });
  $('#lock4').onchange=e=>{ s4.lock=e.target.checked; if (s4.lock) s4.xL=s4.xs/2; ui4(); };
  $('#ray4').onchange=e=>{ s4.rays=e.target.checked; };
  $('#l4m').onclick=()=>move4('lens',s4.xL-0.1); $('#l4p').onclick=()=>move4('lens',s4.xL+0.1);
  $('#s4m').onclick=()=>move4('scr',s4.xs-(s4.method===1&&s4.lock?0.2:0.1)); $('#s4p').onclick=()=>move4('scr',s4.xs+(s4.method===1&&s4.lock?0.2:0.1));

    const e=Math.abs(v-s4.f)/s4.f*100; s4.chk= Math.abs(v-s4.f)<=0.3? {ok:true,msg:t('f4ok',nf(s4.f,1))} : e<=8? {ok:true,msg:t('f4close',nf(s4.f,1),nf(e,0))} : {ok:false,msg:t('f4no')}; ui4(); };
  $('#new4').onclick=()=>{ let f; do f=F_POOL[Math.floor(Math.random()*F_POOL.length)]; while (f===s4.f); s4.f=f; s4.rec=[]; s4.chk=null; $('#ans4').value=''; ui4(); };
  cv.addEventListener('pointerdown',e=>{
    if (!V4) return; const p=ptr(cv,e), V=V4;
    const dl=Math.abs(p.x-V.X(s4.xL)), ds=Math.abs(p.x-V.X(s4.xs));
    if (Math.min(dl,ds)<24){ drag4= dl<=ds ? 'lens' : 'scr'; cv.setPointerCapture(e.pointerId); }
  });
  cv.addEventListener('pointermove',e=>{ if (!drag4) return; const p=ptr(cv,e), x=snap(V4.ix(p.x),0.5); move4(drag4,x); });

}

}

function hitCircle(px,py,ux,uy,cx,cy,R){ // tia từ (px,py) theo (ux,uy) gặp đường tròn, lấy giao điểm phía trước
  const fx=px-cx, fy=py-cy, b=fx*ux+fy*uy, c=fx*fx+fy*fy-R*R, disc=b*b-c; if (disc<0) return null;
  const tt=-b+Math.sqrt(disc); return tt>0? [px+ux*tt,py+uy*tt] : null;
}

/* Mắt – toàn cảnh (không theo tỉ lệ): vật ở bên trái, mắt người bên phải; tia từ A, B qua con ngươi tới màng lưới */
function drawEyeScene(ctx,w,h){
  const {D}=s5.mat, f=matF(D), im=imageOf(D,f);
  const R=Math.min(h*0.27,w*0.15), ex=w-R*1.2-12, ey=h*0.5, lx=ex-R*0.8, pr=R*0.2;
  // đầu người (mờ) để nhận ra đây là mắt
  ctx.save(); ctx.fillStyle=C.skin; ctx.globalAlpha=.3; ctx.beginPath(); ctx.ellipse(ex+R*1.7,ey-R*0.35,R*2.3,R*2.9,0,0,7); ctx.fill(); ctx.restore();
  // nhãn cầu
  ctx.save(); ctx.fillStyle=C.zone2; ctx.strokeStyle=C.muted; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(ex,ey,R,0,7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle=C.img; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(ex,ey,R-3,-1.0,1.0); ctx.stroke();
  ctx.fillStyle=C.glass; ctx.strokeStyle=C['glass-edge']; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ex-R*0.86,ey-R*0.5); ctx.quadraticCurveTo(ex-R*1.3,ey,ex-R*0.86,ey+R*0.5); ctx.fill(); ctx.stroke();
  ctx.fillStyle=C.iris; ctx.fillRect(lx-R*0.07,ey-R*0.55,R*0.07,R*0.55-pr); ctx.fillRect(lx-R*0.07,ey+pr,R*0.07,R*0.55-pr);
  const lw=R*(0.1+clamp((2-f)/0.148,0,1)*0.08); ctx.fillStyle=C.glass; ctx.strokeStyle=C['glass-edge']; ctx.beginPath(); ctx.ellipse(lx+lw*0.6,ey,lw,R*0.36,0,0,7); ctx.fill(); ctx.stroke();
  ctx.restore();
  // trục
  ctx.save(); ctx.strokeStyle=C.axis; ctx.setLineDash([4,6]); ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(20,ey); ctx.lineTo(ex+R,ey); ctx.stroke(); ctx.restore();
  // vật: càng gần càng sát mắt (thang log)
  const t01=clamp((Math.log(D)-Math.log(10))/(Math.log(2000)-Math.log(10)),0,1);
  const ox=lx-R*0.9-t01*(lx-R*0.9-40), oh=h*0.36;
  arrowPx(ctx,ox,ey,ox,ey-oh,C.obj,3.5);
  label(ctx,'A',ox,ey+14,C.obj,'center',13,700,C.panel); label(ctx,'B',ox-12,ey-oh,C.obj,'right',13,700,C.panel);
  label(ctx,t('objAB'),ox+8,ey-oh-14,C.obj,'left',12,700,C.panel);
  // điểm hội tụ: tỉ lệ thật giữa d′ và khoảng cách 2 cm tới màng lưới

  const ray=(sx,sy,py,tx,ty,col)=>{
    ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(lx,py);
    const ux=tx-lx, uy=ty-py, Ln=Math.hypot(ux,uy), q=hitCircle(lx,py,ux/Ln,uy/Ln,ex,ey,R-3) || [xr,py];
    ctx.lineTo(q[0],q[1]); ctx.stroke(); ctx.restore(); return q; };
  for (const py of [-pr,0,pr]) ray(ox,ey-oh,ey+py,xi,yi,C.r1);
  for (const py of [-pr,pr]) ray(ox,ey,ey+py,xi,ey,C.r2);
  // ảnh trên màng lưới
  const focused=Math.abs(xi-xr)<3;
  if (focused){ const yb=ey+sl*(xr-lx); arrowPx(ctx,xr-2,ey,xr-2,yb,C.img,3); label(ctx,'A′B′',xr-10,(ey+yb)/2,C.img,'right',12,800,C.panel); }
  // chú thích
  label(ctx,t('pLens'),lx+lw,ey-R*0.36-12,C['glass-edge'],'center',12,700,C.panel);
  label(ctx,t('pRetina'),Math.min(ex+R*0.5,w-6),ey-R-10,C.img,'right',12,700,C.panel);
  const yd=Math.min(h-14,ey+R*1.15);
  ctx.save(); ctx.strokeStyle=C.muted; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(ox,yd); ctx.lineTo(lx,yd); ctx.stroke(); ctx.restore();

  label(ctx,fmtLen(D),(ox+lx)/2,yd-10,C.ink,'center',13,700,C.panel);

/* Mắt – phóng to hệ quang học (đúng tỉ lệ, đơn vị cm) */

  ctx.fillStyle=C.iris; const pr=0.24;
  ctx.fillRect(V.X(-0.11),V.Y(0.64),V.X(-0.04)-V.X(-0.11),V.Y(pr)-V.Y(0.64)); ctx.fillRect(V.X(-0.11),V.Y(-pr),V.X(-0.04)-V.X(-0.11),V.Y(-0.64)-V.Y(-pr));

  const lwc=(0.12+clamp((2-f)/0.148,0,1)*0.09)*V.k, lh=0.44*V.k;

  ctx.stroke();

    if (s6.step===1 && s6.cur && x>0.3){ drag6='aim'; }
    else if (s6.step===2 && !s6.bpOk){ drag6='bp'; }
    if (drag6){ cv.setPointerCapture(e.pointerId); move6(x,y); }
  });
  const move6=(x,y)=>{ if (drag6==='aim'){ const r=in6(s6.cur.k); if (x>0.3) s6.cur.u2=(y-r.y)/x; }
    if (drag6==='bp'){ s6.bp={x:clamp(Math.round(x*4)/4,-13.5,13.5), y:clamp(Math.round(y*4)/4,-7,7)}; } s6.msg=''; };
  cv.addEventListener('pointermove',e=>{ if (!drag6) return; const p=ptr(cv,e); move6(V6.ix(p.x),V6.iy(p.y)); });
  const up=()=>{ drag6=null; ui6(); }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
}

/* ============ Chung ============ */
function applyLang(){
  document.documentElement.lang=lang;
  $$('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  $$('[data-i18n-html]').forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  $('#langBtn').textContent= lang==='vi'?'EN':'VI';
  ctl5(); renderAll();
}
function renderAll(){
  $('#lvQual').setAttribute('aria-pressed',String(level==='qual')); $('#lvQuant').setAttribute('aria-pressed',String(level==='quant'));
  $$('nav.tabs button').forEach(b=>{ const on=+b.dataset.tab===tab; b.classList.toggle('on',on); b.setAttribute('aria-selected',String(on)); });
  for (const i of [1,2,3,4,5,6]) $('#t'+i).hidden = i!==tab;
  $('#foot').innerHTML=`<p>${t('foot'+tab)}</p>`;
  resize();
  ui1(); ui2(); ui3(); ui4(); ui5(); ui6();
}
function resize(){
  if (tab===1) D1=fit($('#cv1'),0.5,250,470);
  if (tab===2) D2=fit($('#cv2'),0.55,280,480);
  if (tab===3){ D3=fit($('#cv3'),0.5,300,480); D3s=fit($('#cv3s'),0.95,280,400); if (quant() && !$('#cv3g').hidden) drawGraph3(); }
  if (tab===4){ D4=fit($('#cv4'),0.36,230,360); D4s=fit($('#cv4s'),0.75,200,280); }
  if (tab===5){ const sb=s5.sub, two= sb==='mat'||sb==='mc';
    $('#cv5z').hidden=!two; $('#cap5a').hidden=!two; $('#cap5b').hidden=!two;
    D5=fit($('#cv5'),sb==='mc'?0.56:0.5,260,460); if (two) D5z=fit($('#cv5z'),0.56,270,460);
    D5v= sb==='kl'? fit($('#cv5v'),0.85,230,320) : fit($('#cv5v'),0.6,170,240); }
  if (tab===6) D6=fit($('#cv6'),0.5,260,520);
}
function loop(){
  try{
    if (tab===1 && D1) draw1();
    if (tab===2 && D2) draw2();
    if (tab===3 && D3){ draw3(); drawScreen3(); }
    if (tab===4 && D4){ draw4(); drawScreen4(); }
    if (tab===5 && D5){ draw5(); if (D5z && !$('#cv5z').hidden) draw5z(); drawView5(); }
    if (tab===6 && D6) draw6();
  }catch(err){ console.error(err); }
  requestAnimationFrame(loop);
}
function init(){
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
  new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  setup1(); setup2(); setup3(); setup4(); setup5(); setup6();
  $('#langBtn').onclick=()=>{ lang= lang==='vi'?'en':'vi'; save(); applyLang(); };
  $('#lvQual').onclick=()=>{ level='qual'; save(); renderAll(); };
  $('#lvQuant').onclick=()=>{ level='quant'; save(); renderAll(); };
  $$('nav.tabs button').forEach(b=>b.onclick=()=>{ tab=+b.dataset.tab; save(); renderAll(); });
  window.addEventListener('resize',()=>{ resize(); });
  applyLang();
  requestAnimationFrame(loop);
}
init();
</script>
