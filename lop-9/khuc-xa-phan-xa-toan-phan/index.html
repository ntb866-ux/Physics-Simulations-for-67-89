<title>Khúc xạ và phản xạ toàn phần</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --lane:#f4f6fa; --ink:#121826; --muted:#566079; --line:#cfd6e3;
  --accent:#2a4fb5; --accent-ink:#ffffff; --ok:#16834a; --warn:#c2410c;
  --r1:#e2560f; --r2:#0e7c86; --r3:#9b2fae; --beam:#ee8a00;
  --obj:#1d5fbf; --img:#c62a47; --glass:#bfe3f5; --glass2:#a5d4ee; --glass-edge:#3e8fc0;
  --mask:#3b3f47; --axis:#7d879c; --grid:#e3e8f0; --wax:#e9dcc3; --flame:#ff9d1f; --zone1:#fde7c8; --zone2:#e2ecfb;
  --room:#0f1216; --room-ink:#cfd6e3; --room-line:#2a313b; --screen:#1d2229; --skin:#e0b08a; --iris:#7a4a22; --wall:#d8d2c4; --floor:#b9b2a3;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1219; --panel:#161c26; --lane:#121822; --ink:#e4e9f2; --muted:#98a3b8; --line:#2a3344;
  --accent:#86a0ff; --accent-ink:#0b1430; --ok:#45c47d; --warn:#f08a4b;
  --r1:#ff8a4c; --r2:#38c2cc; --r3:#d27ae6; --beam:#ffb340;
  --obj:#6aa6ff; --img:#ff6b85; --glass:#24475d; --glass2:#2d5670; --glass-edge:#6cbfe8;
  --mask:#5a606b; --axis:#7c879d; --grid:#1f2735; --wax:#d9cbb0; --flame:#ffa733; --zone1:#3a2d18; --zone2:#1a2a44;
  --room:#090b0e; --room-ink:#cfd6e3; --room-line:#262c35; --screen:#191d23; --skin:#d9a77f; --iris:#b07a4a; --wall:#4a463e; --floor:#3a362f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1219; --panel:#161c26; --lane:#121822; --ink:#e4e9f2; --muted:#98a3b8; --line:#2a3344;
  --accent:#86a0ff; --accent-ink:#0b1430; --ok:#45c47d; --warn:#f08a4b;
  --r1:#ff8a4c; --r2:#38c2cc; --r3:#d27ae6; --beam:#ffb340;
  --obj:#6aa6ff; --img:#ff6b85; --glass:#24475d; --glass2:#2d5670; --glass-edge:#6cbfe8;
  --mask:#5a606b; --axis:#7c879d; --grid:#1f2735; --wax:#d9cbb0; --flame:#ffa733; --zone1:#3a2d18; --zone2:#1a2a44;
  --room:#090b0e; --room-ink:#cfd6e3; --room-line:#262c35; --screen:#191d23; --skin:#d9a77f; --iris:#b07a4a; --wall:#4a463e; --floor:#3a362f;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(25px,3.4vw,36px);line-height:1.15;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:700}
.hdr-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);max-width:100%}
.seg .btn{border:0;border-radius:0;min-width:48px;padding:8px 12px}
.seg .btn+.btn{border-left:1px solid var(--line)}
.seg.full{display:flex}
.seg.full .btn{flex:1 1 0;min-width:0}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-size:15px;font-weight:600;white-space:nowrap;min-height:46px;padding:8px 14px;border:0;border-bottom:3px solid transparent;
  background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.req{margin:0;font-size:14px;color:var(--muted);max-width:110ch}
.req b{color:var(--ink);font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
@media (max-width:1020px){.lab{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0}
.card.predict{border-color:var(--accent);border-width:2px}
canvas{display:block;width:100%;touch-action:none;border-radius:8px;background:var(--lane)}
canvas.room{background:var(--room);touch-action:pan-y}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:14px;color:var(--muted);margin:0}
.status{font-size:16px;font-weight:600;margin:0;min-height:24px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.fld .val{color:var(--ink);font-family:var(--font-num);font-size:15px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:500;margin-top:-4px}
input[type=range]{width:100%;min-width:0;height:32px;accent-color:var(--accent)}
input[type=number]{font:inherit;font-family:var(--font-num);font-size:16px;min-height:44px;width:110px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--lane);color:var(--ink)}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px;cursor:pointer;color:var(--ink);font-weight:500}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices .btn{flex:1 1 120px;font-size:14px}
.choices .btn.right{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.choices .btn.wrong{border-color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
.q{font-size:15px;font-weight:600}
.fb{font-size:15px;padding:8px 10px;border-radius:8px;background:var(--lane)}
.fb.good{color:var(--ok)} .fb.bad{color:var(--warn)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
td.n{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.concl{font-size:15px;padding:10px 12px;border-radius:8px;border:1px dashed var(--accent);background:var(--lane)}
.formula{font-family:var(--font-num);font-size:14px;background:var(--lane);padding:8px 10px;border-radius:8px;overflow-x:auto;white-space:nowrap;line-height:1.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:20px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.dash{background:none!important;border-top:3px dashed currentColor;height:0}
.obs{display:flex;flex-direction:column;gap:8px;font-size:15px}
.obs p{margin:0}
.rules{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:8px 10px;border-radius:8px;background:var(--lane)}
.rules li .mk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted)}
.rules li.done .mk{border-color:var(--ok);background:var(--ok);color:var(--panel)}
.rules li .sw{flex:none;width:14px;height:4px;border-radius:2px;margin-top:11px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;align-items:baseline}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;border:1px solid currentColor}
.pill.good{color:var(--ok)} .pill.mid{color:var(--warn)} .pill.off{color:var(--muted)}
details{font-size:15px}
summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:32px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}
ol.steps li.done{color:var(--ok)}
ol.steps li.cur{font-weight:700}
.sub{display:flex;gap:6px;flex-wrap:wrap}
.sub .btn{flex:1 1 120px}
.nudge{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nudge .btn{min-width:44px;padding:8px 10px}
.nudge span{font-size:14px;color:var(--muted);font-weight:600}
footer{font-size:13px;color:var(--muted)}
footer p{margin:0 0 4px;max-width:120ch}
@media (max-width:520px){ .seg .btn{padding:8px 8px;font-size:14px} nav.tabs button{padding:8px 10px;font-size:14px} }
</style>
<style>
/* Bàn thí nghiệm quang học: tia laser đỏ có quầng sáng, độ đậm của tia = năng lượng thật (Fresnel). */
:root{ --laser:#e0131b; --laser-glow:rgba(224,19,27,.22); --normal:#6b7590; --sky1:#7fb8ec; --sky2:#d6ebfb; --sand:#d9c49a; --road:#4a4d55; --tree:#3f8a4a; --bar-r:#e0131b; --bar-t:#2a4fb5; }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){ --laser:#ff4a4a; --laser-glow:rgba(255,74,74,.25); --normal:#8a93ab; --sky1:#2d5a8a; --sky2:#6d9cc9; --sand:#8a7752; --road:#2c2f35; --tree:#3f8a4a; --bar-r:#ff4a4a; --bar-t:#86a0ff; }}
:root[data-theme="dark"]{ --laser:#ff4a4a; --laser-glow:rgba(255,74,74,.25); --normal:#8a93ab; --sky1:#2d5a8a; --sky2:#6d9cc9; --sand:#8a7752; --road:#2c2f35; --tree:#3f8a4a; --bar-r:#ff4a4a; --bar-t:#86a0ff; }
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 58px;gap:8px;align-items:center;font-size:14px}
.bar .tr{height:16px;border-radius:8px;background:var(--lane);border:1px solid var(--line);overflow:hidden}
.bar .fill{height:100%;width:0;border-radius:8px;transition:width .08s linear}
.bar .pc{font-family:var(--font-num);text-align:right}
select{font:inherit;font-size:15px;min-height:44px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
.medrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:20px;font-weight:700;font-family:var(--font-num)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){ .two{grid-template-columns:1fr} .bar{grid-template-columns:90px 1fr 52px} }
.cap{font-size:13px;color:var(--muted);font-weight:600;margin:0}
.lock{font-size:14px;color:var(--warn);font-weight:600;margin:0}
.score{font-family:var(--font-num);font-weight:700}
.quiz{display:flex;flex-direction:column;gap:12px}
.quiz .qi{padding:10px 12px;border-radius:8px;background:var(--lane);display:flex;flex-direction:column;gap:8px}
body.qual .qt{display:none!important}
body:not(.qual) .ql{display:none!important}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="hdr-ctl">
      <div class="seg" role="group" aria-label="level">
        <button class="btn" id="lvQual" data-i18n="lvQual"></button>
        <button class="btn" id="lvQuant" data-i18n="lvQuant"></button>
      </div>
      <button class="btn" id="langBtn">EN</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="1" data-i18n="tab1"></button>
    <button role="tab" data-tab="2" data-i18n="tab2"></button>
    <button role="tab" data-tab="3" data-i18n="tab3"></button>
    <button role="tab" data-tab="4" data-i18n="tab4"></button>
    <button role="tab" data-tab="5" data-i18n="tab5"></button>
    <button role="tab" data-tab="6" data-i18n="tab6"></button>
  </nav>

  <!-- ===================== TAB 1: Vì sao tia sáng bị gãy ===================== -->
  <section id="t1" class="col">
    <p class="req" data-i18n-html="req1"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint1"></p>
        <div class="seg full" id="vm1"><button class="btn" data-v="ray" data-i18n="vmRay"></button><button class="btn" data-v="wave" data-i18n="vmWave"></button><button class="btn" data-v="march" data-i18n="vmMarch"></button></div>
        <canvas id="cv1" aria-label="refraction"></canvas>
        <div class="controls">
          <button class="btn" id="perp1" data-i18n="perp"></button>
          <button class="btn" id="play1" data-i18n="pause"></button>
          <div class="seg" id="spd1"><button class="btn" data-v="0.4">×0,4</button><button class="btn" data-v="1">×1</button></div>
        </div>
        <div class="fld"><span><span data-i18n="angI"></span> <span class="val" id="iTxt1"></span></span>
          <input type="range" id="rngI1" min="0" max="85" step="1" value="45"></div>
        <p class="status" id="st1"></p>
      </div>
      <aside class="col">
        <div class="card predict">
          <h2 data-i18n="cPred"></h2>
          <p class="q" data-i18n="q1"></p>
          <div class="choices" id="pq1"><button class="btn" data-p="0" data-i18n="q1_0"></button><button class="btn" data-p="1" data-i18n="q1_1"></button><button class="btn" data-p="2" data-i18n="q1_2"></button><button class="btn" data-p="3" data-i18n="q1_3"></button></div>
          <p class="lock" id="lock1" data-i18n="lock1"></p>
          <p class="fb" id="fb1" hidden></p>
        </div>
        <div class="card">
          <h2 data-i18n="cMedia"></h2>
          <div class="medrow">
            <label class="fld"><span data-i18n="medTop"></span><select id="m1a"></select></label>
            <label class="fld"><span data-i18n="medBot"></span><select id="m1b"></select></label>
          </div>
          <dl class="kv" id="kv1"></dl>
          <p class="formula qt" id="f1"></p>
        </div>
        <div class="card">
          <h2 data-i18n="cObs"></h2>
          <div id="obs1" class="obs"></div>
          <details><summary data-i18n="concl"></summary><p class="concl" data-i18n-html="concl1"></p></details>
        </div>
      </aside>
    </div>
  </section>

  <!-- ===================== TAB 2: Phòng thí nghiệm ===================== -->
  <section id="t2" class="col" hidden>
    <p class="req" data-i18n-html="req2"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint2"></p>
        <canvas id="cv2" aria-label="semicircular block on protractor"></canvas>
        <div class="controls">
          <div class="nudge"><span data-i18n="angI"></span><button class="btn" data-d="-1">−1°</button><button class="btn" data-d="1">+1°</button></div>
          <button class="btn" id="rev2" data-i18n="rev"></button>
          <div class="seg" id="rot2"><button class="btn" data-v="0" data-i18n="rotH"></button><button class="btn" data-v="90" data-i18n="rotV"></button><button class="btn" data-v="30" data-i18n="rotS"></button></div>
        </div>
        <p class="status" id="st2"></p>
        <div class="two">
          <div><p class="cap" data-i18n="g2a"></p><canvas id="cv2a"></canvas></div>
          <div class="qt"><p class="cap" data-i18n="g2b"></p><canvas id="cv2b"></canvas></div>
        </div>
      </div>
      <aside class="col">
        <div class="card">
          <h2 data-i18n="cBlock"></h2>
          <select id="m2"></select>
          <div class="row"><button class="btn primary" id="rec2" data-i18n="record"></button><button class="btn" id="clr2" data-i18n="clear"></button></div>
          <div class="tblwrap"><table id="tb2"></table></div>
          <p class="hint" id="h2"></p>
        </div>
        <div class="card predict">
          <h2 data-i18n="cPred"></h2>
          <p class="q" data-i18n="q2a"></p>
          <div class="choices" id="pq2a"><button class="btn" data-p="0" data-i18n="q2a_0"></button><button class="btn" data-p="1" data-i18n="q2a_1"></button><button class="btn" data-p="2" data-i18n="q2a_2"></button></div>
          <p class="fb" id="fb2a" hidden></p>
          <p class="q" data-i18n="q2b"></p>
          <div class="choices" id="pq2b"><button class="btn" data-p="0" data-i18n="q2b_0"></button><button class="btn" data-p="1" data-i18n="q2b_1"></button><button class="btn" data-p="2" data-i18n="q2b_2"></button></div>
          <p class="fb" id="fb2b" hidden></p>
        </div>
        <div class="card qt">
          <h2 data-i18n="cEx2"></h2>
          <p id="ex2"></p>
          <div class="row"><span id="ex2lab">r =</span><input type="number" id="ex2in" step="0.1" inputmode="decimal"><span id="ex2u">°</span><button class="btn primary" id="ex2chk" data-i18n="check"></button><button class="btn" id="ex2new" data-i18n="newProb"></button></div>
          <p class="fb" id="ex2fb" hidden></p>
        </div>
        <div class="card">
          <h2 data-i18n="cObs"></h2>
          <details><summary data-i18n="concl"></summary><p class="concl" data-i18n-html="concl2"></p></details>
        </div>
      </aside>
    </div>
  </section>

  <!-- ===================== TAB 3: Phản xạ toàn phần ===================== -->
  <section id="t3" class="col" hidden>
    <p class="req" data-i18n-html="req3"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" id="hint3"></p>
        <canvas id="cv3" aria-label="total internal reflection"></canvas>
        <div class="controls">
          <div class="nudge"><span data-i18n="angI"></span><button class="btn" data-d="-1">−1°</button><button class="btn" data-d="-0.1">−0,1°</button><button class="btn" data-d="0.1">+0,1°</button><button class="btn" data-d="1">+1°</button></div>
          <button class="btn" id="rev3" data-i18n="rev3"></button>
        </div>
        <p class="status" id="st3"></p>
        <div class="bars">
          <div class="bar"><span data-i18n="eRefl"></span><div class="tr"><div class="fill" id="bR3" style="background:var(--bar-r)"></div></div><span class="pc" id="pR3"></span></div>
          <div class="bar"><span data-i18n="eRefr"></span><div class="tr"><div class="fill" id="bT3" style="background:var(--bar-t)"></div></div><span class="pc" id="pT3"></span></div>
        </div>
        <p class="cap" data-i18n="g3"></p>
        <canvas id="cv3g"></canvas>
      </div>
      <aside class="col">
        <div class="card predict">
          <h2 data-i18n="cPred"></h2>
          <p class="q" data-i18n="q3a"></p>
          <div class="choices" id="pq3a"><button class="btn" data-p="0" data-i18n="q3a_0"></button><button class="btn" data-p="1" data-i18n="q3a_1"></button><button class="btn" data-p="2" data-i18n="q3a_2"></button></div>

          <p class="q" data-i18n="q3b"></p>

function fresnel(n1,n2,i){
  const ci=Math.cos(i), si=Math.sin(i), st=n1/n2*si; if (Math.abs(st)>=1) return 1;

  return (rs*rs+rp*rp)/2;
}

function beamAlpha(I){ return I<=0.002? 0 : clamp(Math.sqrt(I),0.12,1); }
function beam(ctx,x1,y1,x2,y2,I,arrow=true){
  const a=beamAlpha(I); if (!a) return;

  ctx.globalAlpha=a; ctx.strokeStyle=C['laser-glow']; ctx.lineWidth=9; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.strokeStyle=C.laser; ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  if (arrow){ const mx=(x1+x2)/2, my=(y1+y2)/2, an=Math.atan2(y2-y1,x2-x1), L=Math.hypot(x2-x1,y2-y1);
    if (L>40){ ctx.fillStyle=C.laser; ctx.beginPath(); ctx.moveTo(mx+9*Math.cos(an),my+9*Math.sin(an));
      ctx.lineTo(mx-6*Math.cos(an)+6*Math.sin(an),my-6*Math.sin(an)-6*Math.cos(an)); ctx.lineTo(mx-6*Math.cos(an)-6*Math.sin(an),my-6*Math.sin(an)+6*Math.cos(an)); ctx.fill(); } }
  ctx.restore();
}

function arcAngle(ctx,cx,cy,r,a0,a1,col,txt){

}

const s1={i:45, a:'air', b:'water', vm:'ray', tau:0, run:true, spd:1, pred:false};
let D1=null, V1=null, drag1=false;
function setup1(){
  const cv=$('#cv1');
  $('#rngI1').oninput=e=>{ s1.i=+e.target.value; ui1(); };
  $('#perp1').onclick=()=>{ s1.i=0; ui1(); };
  $('#play1').onclick=()=>{ s1.run=!s1.run; ui1(); };
  $$('#spd1 .btn').forEach(b=>b.onclick=()=>{ s1.spd=+b.dataset.v; ui1(); });
  $$('#vm1 .btn').forEach(b=>b.onclick=()=>{ s1.vm=b.dataset.v; ui1(); });
  $('#m1a').onchange=e=>{ s1.a=e.target.value; ui1(); };
  $('#m1b').onchange=e=>{ s1.b=e.target.value; ui1(); };
  predict('#pq1','#fb1',1,'fb1',()=>{ s1.pred=true; ui1(); });
  const set=e=>{ const p=ptr(cv,e), x=V1.ix(p.x), y=V1.iy(p.y); if (y<0.2) return; s1.i=Math.round(clamp(Math.atan2(-x,y)*R2D,0,85)); ui1(); };
  cv.addEventListener('pointerdown',e=>{ if(!V1) return; const p=ptr(cv,e); if (V1.iy(p.y)<0.2) return; drag1=true; cv.setPointerCapture(e.pointerId); set(e); });
  cv.addEventListener('pointermove',e=>{ if(drag1) set(e); });
  const up=()=>{ drag1=false; }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
}
function ui1(){
  const ids=['air','water','ice','oil','acrylic','glass','diamond'];
  medOptions($('#m1a'),ids,s1.a); medOptions($('#m1b'),ids,s1.b);
  $('#rngI1').value=s1.i; $('#iTxt1').textContent=nf(s1.i,0)+'°';
  $('#play1').textContent=t(s1.run?'pause':'play');
  $$('#spd1 .btn').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===s1.spd)));
  $$('#vm1 .btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===s1.vm)));
  $('#lock1').hidden=s1.pred;
  const n1=MED[s1.a].n, n2=MED[s1.b].n, i=s1.i*D2R, r=snell(n1,n2,i);
  const v1=C0/n1, v2=C0/n2;
  const show=s1.pred;
  const rows=[[t('kvI'),nf(s1.i,0)+'°'],[t('kvR'), !show?'?': r===null? t('none') : nf(r*R2D,1)+'°']];
  if (quant()) rows.push([t('kvV1'),nf(v1/1e8,2,2)+'·10⁸ m/s'],[t('kvV2'),nf(v2/1e8,2,2)+'·10⁸ m/s'],[t('kvN1'),nf(n1,2)],[t('kvN2'),nf(n2,2)]);
  else rows.push([t('kvCmp'), n2>n1? t('cmpSlow') : n2<n1? t('cmpFast') : t('cmpEq')]);
  $('#kv1').innerHTML=rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('');
  $('#f1').innerHTML=`n = c / v = ${nf(3,2,2)}·10⁸ / ${nf(v2/1e8,2,2)}·10⁸ = ${nN(n2)}`;
  const o=[];
  if (!show) o.push(t('lock1'));
  else {
    if (r===null) o.push(t('o1tir'));
    else if (s1.i===0) o.push(t('o1perp'));
    else if (n1===n2) o.push(t('o1same'));
    else o.push(t(n2>n1?'o1slow':'o1fast'));
    if (s1.vm==='wave') o.push(t('o1wave'));
    if (s1.vm==='march') o.push(t('o1march'));
    if (s1.a==='water'&&s1.b==='oil'||s1.a==='oil'&&s1.b==='water') o.push(t('o1oil'));
  }
  $('#obs1').innerHTML=o.map(x=>`<p>${x}</p>`).join('');
  $('#st1').textContent= show? (r===null? `i = ${nf(s1.i,0)}° · ${t('o1tir').split(':')[0]}` : `i = ${nf(s1.i,0)}°  →  r = ${nf(r*R2D,1)}°`) : `i = ${nf(s1.i,0)}°`;
}
function draw1(dt){
  const D=D1, ctx=D.ctx; clear(D);
  const V=V1=fitView(D,-11,11,-7,7,6), k=V.k;
  const n1=MED[s1.a].n, n2=MED[s1.b].n, i=s1.i*D2R, r=snell(n1,n2,i), show=s1.pred;
  if (s1.run) s1.tau+=dt*0.55*s1.spd;
  /* nền hai môi trường */
  const march=s1.vm==='march';
  ctx.fillStyle= march? 'rgba(150,150,150,.18)' : MED[s1.a].fill; ctx.fillRect(0,0,D.w,V.Y(0));
  ctx.fillStyle= march? (C.sand) : MED[s1.b].fill; if (march) ctx.globalAlpha=.45; ctx.fillRect(0,V.Y(0),D.w,D.h-V.Y(0)); ctx.globalAlpha=1;
  if (!show){ ctx.fillStyle=C.lane; ctx.globalAlpha=.75; ctx.fillRect(0,V.Y(0),D.w,D.h-V.Y(0)); ctx.globalAlpha=1; label(ctx,'?',D.w/2,(V.Y(0)+D.h)/2,C.muted,'center',54,800); }
  ctx.strokeStyle=C['glass-edge']; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,V.Y(0)); ctx.lineTo(D.w,V.Y(0)); ctx.stroke();
  const nameA= march? t('ground1')+' – '+t('sFast') : t(s1.a)+(quant()?`  n = ${nN(n1)}`:'');
  const nameB= march? t('ground2')+' – '+t('sSlow') : t(s1.b)+(quant()?`  n = ${nN(n2)}`:'');
  label(ctx,nameA,10,V.Y(0)-16,C.ink,'left',14,700,C.panel);
  if (show) label(ctx,nameB,10,V.Y(0)+18,C.ink,'left',14,700,C.panel);
  /* pháp tuyến */
  dashLine(ctx,V.X(0),V.Y(6.6),V.X(0),V.Y(-6.6),C.normal,1.5);
  label(ctx,t('normal'),V.X(0)+6,V.Y(6.4),C.normal,'left',12,600);
  const R=8, Lx=-R*Math.sin(i), Ly=R*Math.cos(i);
  const d1={x:Math.sin(i),y:-Math.cos(i)};
  const d2= r===null? {x:Math.sin(i),y:Math.cos(i)} : {x:Math.sin(r),y:-Math.cos(r)};
  if (s1.vm==='ray'){
    const Rf=fresnel(n1,n2,i);
    beam(ctx,V.X(Lx),V.Y(Ly),V.X(0),V.Y(0),1);
    if (show){
      beam(ctx,V.X(0),V.Y(0),V.X(R*Math.sin(i)),V.Y(R*Math.cos(i)),r===null?1:Rf);
      if (r!==null) beam(ctx,V.X(0),V.Y(0),V.X(9*Math.sin(r)),V.Y(-9*Math.cos(r)),1-Rf);
      if (r!==null && s1.i>0) dashLine(ctx,V.X(0),V.Y(0),V.X(-Lx*0.9),V.Y(-Ly*0.9),C.muted,1.2,[3,5]);
      if (r!==null && s1.i>0) arcAngle(ctx,V.X(0),V.Y(0),2.6*k,Math.PI/2,Math.PI/2-r,C['bar-t'],'r');
      if (quant() && show && r!==null) label(ctx,nf((1-Rf)*100,0)+' %',V.X(4.2*Math.sin(r))+30,V.Y(-4.2*Math.cos(r)),C.muted,'left',12,600,C.panel);
      if (quant() && show) label(ctx,nf((r===null?1:Rf)*100,r===null?0:1)+' %',V.X(4.5*Math.sin(i))+28,V.Y(4.5*Math.cos(i)),C.muted,'left',12,600,C.panel);
    }
    if (s1.i>0) arcAngle(ctx,V.X(0),V.Y(0),2.2*k,-Math.PI/2,-Math.PI/2-i,C.laser,'i');
  } else {
    /* chùm có bề rộng W; hàng = mặt sóng cùng pha; cột = đường đi của từng "người" */
    const W=3.6, lam0=march?2.3:1.25, L1=lam0/n1, L2=(r===null? lam0/n1 : lam0/n2);
    const e1={x:Math.cos(i),y:Math.sin(i)}, NC=march?5:31, sStart=-R;
    const ti=Math.tan(i);
    const colPt=(u,phi)=>{ /* điểm của cột u ở pha phi */
      const sB=u*ti, phB=sB/L1;
      if (phi<=phB || !show){ const s=phi*L1; if (s<sStart) return null; const P={x:s*d1.x+u*e1.x, y:s*d1.y+u*e1.y, m:1}; return (!show&&P.y<0)? null : P; }
      const Bx=u/Math.cos(i), q=(phi-phB)*L2; return {x:Bx+q*d2.x, y:q*d2.y, m:2};
    };
    /* dải chùm sáng */
    ctx.save(); ctx.fillStyle=C['laser-glow']; ctx.beginPath();
    const a0={x:sStart*d1.x-W/2*e1.x,y:sStart*d1.y-W/2*e1.y}, a1={x:sStart*d1.x+W/2*e1.x,y:sStart*d1.y+W/2*e1.y};
    const b0={x:-W/2/Math.cos(i),y:0}, b1={x:W/2/Math.cos(i),y:0};
    ctx.moveTo(V.X(a0.x),V.Y(a0.y)); ctx.lineTo(V.X(a1.x),V.Y(a1.y)); ctx.lineTo(V.X(b1.x),V.Y(b1.y)); ctx.lineTo(V.X(b0.x),V.Y(b0.y)); ctx.fill();
    if (show){ ctx.beginPath(); ctx.moveTo(V.X(b0.x),V.Y(b0.y)); ctx.lineTo(V.X(b1.x),V.Y(b1.y)); ctx.lineTo(V.X(b1.x+14*d2.x),V.Y(14*d2.y)); ctx.lineTo(V.X(b0.x+14*d2.x),V.Y(14*d2.y)); ctx.fill(); }
    ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,D.w,D.h); ctx.clip();
    const frac=s1.tau%1, kmin=Math.floor(sStart/L1)-1, kmax=40;
    for (let kk=kmin; kk<kmax; kk++){
      const phi=kk+frac; const pts=[];
      for (let j=0;j<NC;j++){
        const u=-W/2+W*j/(NC-1);
        const p=colPt(u,phi); if (p) pts.push({...p,u});
      }
      if (pts.length<2) { if (march && pts.length===1){} else if(!march) continue; }
      /* chèn điểm gãy đúng trên mặt phân cách */
      if (!march && show && ti>1e-6){ const us=phi*L1/ti; if (us>-W/2 && us<W/2){ pts.push({x:us/Math.cos(i),y:0,u:us}); pts.sort((a,b)=>a.u-b.u); } }
      if (!pts.length) continue;
      if (pts.every(p=>Math.abs(p.x)>12||p.y<-8||p.y>8)) continue;
      if (!march){
        ctx.strokeStyle=C.laser; ctx.lineWidth=2.6; ctx.beginPath();

      } else {

        for (const p of pts){
          const dd= p.m===1? d1 : d2, ang=Math.atan2(-dd.y,dd.x);
          ctx.save(); ctx.translate(V.X(p.x),V.Y(p.y)); ctx.rotate(ang);
          ctx.fillStyle= p.m===1? C.accent : C.warn; ctx.beginPath(); ctx.ellipse(0,0,0.16*k,0.36*k,0,0,7); ctx.fill();
          ctx.fillStyle=C.ink; ctx.beginPath(); ctx.arc(0.05*k,0,0.15*k,0,7); ctx.fill();
          ctx.restore();
        }
      }
    }
    ctx.restore();
  }
  laserBody(ctx,V.X(Lx),V.Y(Ly),Math.atan2(-(0-Ly),(0-Lx)),drag1);
}

const s2={i:40, mat:'glass', rev:false, rot:0, rows:[], ex:null};
let D2=null, V2=null, D2a=null, D2b=null, drag2=false;
const MATCOL={water:'#2f86d6',ice:'#3fb0c8',oil:'#c99a10',acrylic:'#6b8fb0',glass:'#14907f',diamond:'#8a5ad6',mystery:'#d6457f'};

  $('#m2').onchange=e=>{ s2.mat=e.target.value; ui2(); };
  $('#rec2').onclick=()=>{ const r=ang2().r; if (r===null){ $('#h2').textContent=t('noRec'); return; } s2.rows.push({mat:s2.mat,i:s2.i,r:r*R2D,rev:s2.rev}); ui2(); };
  $('#clr2').onclick=()=>{ s2.rows=[]; ui2(); };

  $('#ex2new').onclick=()=>{ newEx2(); ui2(); };
  $('#ex2chk').onclick=()=>{ const v=parseFloat($('#ex2in').value.replace(',','.')), e=s2.ex, fb=$('#ex2fb'); fb.hidden=false;

  newEx2();
  const set=e=>{ const p=ptr(cv,e); let x=V2.ix(p.x), y=V2.iy(p.y); const c=Math.cos(-s2.rot*D2R), s=Math.sin(-s2.rot*D2R); const lx=x*c-y*s, ly=x*s+y*c;
    const a= s2.rev? Math.atan2(-lx,-ly) : Math.atan2(-lx,ly); s2.i=Math.round(clamp(a*R2D,0,89)); ui2(); };
  cv.addEventListener('pointerdown',e=>{ if(!V2) return; drag2=true; cv.setPointerCapture(e.pointerId); set(e); });
  cv.addEventListener('pointermove',e=>{ if(drag2) set(e); });
  const up=()=>{ drag2=false; }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);

function newEx2(){
  const mats=['water','glass','diamond','acrylic'];
  if (Math.random()<0.6){ const m=mats[Math.floor(Math.random()*4)], i=5*(2+Math.floor(Math.random()*15)), n=MED[m].n;
    s2.ex={type:'r', m, i, n, ans:Math.asin(Math.sin(i*D2R)/n)*R2D, tol:0.6}; }
  else { const n=[1.33,1.36,1.40,1.44,1.47][Math.floor(Math.random()*5)], i=5*(4+Math.floor(Math.random()*11)), r=Math.round(Math.asin(Math.sin(i*D2R)/n)*R2D*10)/10;
    s2.ex={type:'n', i, r, ans:Math.sin(i*D2R)/Math.sin(r*D2R), tol:0.02}; }
  $('#ex2in').value=''; $('#ex2fb').hidden=true;
}
function ang2(){ const n=MED[s2.mat].n, i=s2.i*D2R; return s2.rev? {n1:n,n2:1,r:snell(n,1,i)} : {n1:1,n2:n,r:snell(1,n,i)}; }
function ui2(){

  const {r}=ang2();

  const q=quant();
  let h=`<tr><th>${t('thN')}</th><th>${t('thMat')}</th><th>${t('thI')}</th><th>${t('thR')}</th>${q?'<th>i/r</th><th>sin i</th><th>sin r</th><th>sin i / sin r</th>':''}</tr>`;
  s2.rows.forEach((w,k)=>{ const si=Math.sin(w.i*D2R), sr=Math.sin(w.r*D2R);
    h+=`<tr><td class="n">${k+1}</td><td><span style="color:${MATCOL[w.mat]}">●</span> ${t(w.mat)}${w.rev?' ↺':''}</td><td class="n">${nf(w.i,0)}°</td><td class="n">${nf(w.r,1)}°</td>${q?`<td class="n">${w.r>0?nf(w.i/w.r,2):'–'}</td><td class="n">${nf(si,3)}</td><td class="n">${nf(sr,3)}</td><td class="n"><b>${sr>0?nf(si/sr,2):'–'}</b></td>`:''}</tr>`; });

  $('#h2').innerHTML=hh;
  if ($('#myst2b')) $('#myst2b').onclick=()=>{ const v=parseFloat($('#myst2').value.replace(',','.')); const ok=Math.abs(v-myst.n)<=0.04;

function draw2(){
  const D=D2, ctx=D.ctx; clear(D);
  const V=V2=fitView(D,-11,11,-11,11,4), k=V.k;
  const ro=s2.rot*D2R, cr=Math.cos(ro), sr_=Math.sin(ro);
  const P=(x,y)=>[V.X(x*cr-y*sr_), V.Y(x*sr_+y*cr)];
  const n=MED[s2.mat].n, i=s2.i*D2R, {n1,n2,r}=ang2(), Rf=fresnel(n1,n2,i);
  const RB=6.6, RR=9.2, RL=10.2;
  /* bảng chia độ tròn */
  const [ox,oy]=P(0,0);
  ctx.save(); ctx.strokeStyle=C.line; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(ox,oy,RR*k,0,7); ctx.stroke();
  for (let a=0;a<360;a+=5){ const big=a%10===0, c=Math.cos(a*D2R), s=Math.sin(a*D2R);
    const [x1,y1]=P(RR*s,RR*c), [x2,y2]=P((RR-(big?0.6:0.3))*s,(RR-(big?0.6:0.3))*c);
    ctx.strokeStyle=C.muted; ctx.lineWidth=big?1.4:0.8; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    if (big && D.w>360 || a%30===0){ const deg=a<=90?a: a<=180? 180-a : a<=270? a-180 : 360-a; const [lx,ly]=P((RR-1.2)*s,(RR-1.2)*c); label(ctx,String(deg),lx,ly,C.muted,'center',D.w>500?11:9,500); } }
  ctx.restore();
  /* khối bán trụ (nửa dưới trong hệ toạ độ của bàn) */
  ctx.beginPath(); for (let a=0;a<=180;a+=3){ const [x,y]=P(RB*Math.cos(a*D2R),-RB*Math.sin(a*D2R)); a?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.closePath();
  ctx.fillStyle=MED[s2.mat].fill; ctx.fill(); ctx.strokeStyle=C['glass-edge']; ctx.lineWidth=2; ctx.stroke();
  /* pháp tuyến và mặt phân cách */
  { const [a,b]=P(0,RR), [c,d]=P(0,-RR); dashLine(ctx,a,b,c,d,C.normal,1.5); const [e,f]=P(-RR,0),[g,h]=P(RR,0); dashLine(ctx,e,f,g,h,C.line,1,[2,4]); }
  label(ctx,'▼ '+t(s2.mat)+(quant()&&s2.mat!=='mystery'?` (n = ${nN(n)})`:''),D.w-8,D.h-14,C.ink,'right',13,700,C.panel);
  label(ctx,'▲ '+t('air')+(quant()?' (n = 1)':''),D.w-8,14,C.muted,'right',13,600,C.panel);
  const ray=(x1,y1,x2,y2,I)=>{ const [a,b]=P(x1,y1),[c,d]=P(x2,y2); beam(ctx,a,b,c,d,I); };
  const dir=(a,len,sgn)=>[len*Math.sin(a), sgn*len*Math.cos(a)];
  let laserPos, laserAng;
  if (!s2.rev){
    const [lx,ly]=[-RL*Math.sin(i),RL*Math.cos(i)]; laserPos=P(lx,ly); laserAng=[P(0,0),laserPos];
    ray(lx,ly,0,0,1);
    ray(0,0,RR*Math.sin(i),RR*Math.cos(i),Rf);
    if (r!==null){ ray(0,0,RR*Math.sin(r),-RR*Math.cos(r),1-Rf); }
  } else {
    const [lx,ly]=[-RL*Math.sin(i),-RL*Math.cos(i)]; laserPos=P(lx,ly); laserAng=[P(0,0),laserPos];
    ray(lx,ly,0,0,1);
    ray(0,0,RR*Math.sin(i),-RR*Math.cos(i),r===null?1:Rf);
    if (r!==null) ray(0,0,RR*Math.sin(r),RR*Math.cos(r),1-Rf);
  }
  /* cung góc */
  const angPx=(x,y)=>{ const [a,b]=P(x,y); return Math.atan2(b-oy,a-ox); };
  if (s2.i>0){
    if (!s2.rev){ arcAngle(ctx,ox,oy,2.4*k,angPx(0,1),angPx(-Math.sin(i),Math.cos(i)),C.laser,'i');
      if (r!==null) arcAngle(ctx,ox,oy,2.9*k,angPx(0,-1),angPx(Math.sin(r),-Math.cos(r)),C['bar-t'],'r'); }
    else { arcAngle(ctx,ox,oy,2.4*k,angPx(0,-1),angPx(-Math.sin(i),-Math.cos(i)),C.laser,'i');
      if (r!==null) arcAngle(ctx,ox,oy,2.9*k,angPx(0,1),angPx(Math.sin(r),Math.cos(r)),C['bar-t'],'r'); }
  }
  label(ctx,'O',ox-10,oy+12,C.ink,'center',12,700);
  const [lp,lq]=laserPos; laserBody(ctx,lp,lq,Math.atan2(oy-lq,ox-lp),drag2);
}
function drawGraphs2(){
  /* r theo i */
  { const D=D2a, ctx=D.ctx; clear(D);
    const G=axes(D,0,90,0,90,'i (°)','r (°)',[0,30,60,90],[0,30,60,90]);
    dashLine(ctx,G.X(0),G.Y(0),G.X(90),G.Y(90),C.line,1,[4,4]);
    for (const w of s2.rows){ ctx.fillStyle=MATCOL[w.mat]; ctx.beginPath(); ctx.arc(G.X(w.i),G.Y(w.r),4.5,0,7); ctx.fill(); }
    const {r}=ang2(); if (r!==null){ ctx.strokeStyle=C.ink; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(G.X(s2.i),G.Y(r*R2D),6,0,7); ctx.stroke(); } }
  if (!quant()) return;
  { const D=D2b, ctx=D.ctx; clear(D);
    const G=axes(D,0,1,0,1,'sin r','sin i',[0,0.5,1],[0,0.5,1]);
    const groups={};
    for (const w of s2.rows){ const x=Math.sin(w.r*D2R), y=Math.sin(w.i*D2R); ctx.fillStyle=MATCOL[w.mat]; ctx.beginPath(); ctx.arc(G.X(x),G.Y(y),4.5,0,7); ctx.fill();
      const key=w.mat+(w.rev?'r':''); (groups[key]=groups[key]||[]).push([x,y]); }
    let ly=24;
    for (const [key,pts] of Object.entries(groups)){ if (pts.length<2) continue;
      const m=pts.reduce((a,[x,y])=>a+x*y,0)/pts.reduce((a,[x])=>a+x*x,0); const mat=key.replace(/r$/,'');
      const xe=Math.min(1,1/m); ctx.strokeStyle=MATCOL[mat]; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(G.X(0),G.Y(0)); ctx.lineTo(G.X(xe),G.Y(xe*m)); ctx.stroke();
      label(ctx,t('slope')+nf(m,2),D.w-14,ly,MATCOL[mat],'right',12,700,C.panel); ly+=18; }
  }
}

  for (const w of s3.rows){ const n=MED[w.mat].n; h+=`<tr><td><span style="color:${MATCOL[w.mat]}">●</span> ${t(w.mat)}</td><td class="n">${nf(w.g,1)}°</td>${q?`<td class="n">${nf(Math.sin(w.g*D2R),3)}</td><td class="n">${w.mat==='mystery'?'?':nf(1/n,3)}</td>`:''}</tr>`; }

function draw3(){
  const D=D3, ctx=D.ctx; clear(D);
  const V=V3=fitView(D,-11,11,-10.6,10.6,4), k=V.k;
  const {n,n1,n2,i,r,R}=phys3();
  const RB=7.5, RL=9.8, RR=10.2;
  const ox=V.X(0), oy=V.Y(0);
  ctx.fillStyle=MED.air.fill;
  ctx.beginPath(); for (let a=0;a<=180;a+=3){ const x=V.X(RB*Math.cos(a*D2R)), y=V.Y(-RB*Math.sin(a*D2R)); a?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.closePath();
  ctx.fillStyle=MED[s3.mat].fill; ctx.fill(); ctx.strokeStyle=C['glass-edge']; ctx.lineWidth=2; ctx.stroke();
  /* thước góc mờ */
  ctx.strokeStyle=C.line; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(ox,oy,RR*k,0,7); ctx.stroke();
  for (let a=0;a<360;a+=10){ const c=Math.cos(a*D2R), s=Math.sin(a*D2R); ctx.beginPath(); ctx.moveTo(V.X(RR*s),V.Y(RR*c)); ctx.lineTo(V.X((RR-0.5)*s),V.Y((RR-0.5)*c)); ctx.stroke(); }
  dashLine(ctx,ox,V.Y(RR),ox,V.Y(-RR),C.normal,1.5);
  dashLine(ctx,V.X(-RR),oy,V.X(RR),oy,C.line,1,[2,4]);
  label(ctx,'▼ '+t(s3.mat)+(quant()&&s3.mat!=='mystery'?` (n = ${nN(n)})`:''),D.w-8,D.h-14,C.ink,'right',14,700,C.panel);
  label(ctx,'▲ '+t('air')+(quant()?' (n = 1)':''),D.w-8,14,C.muted,'right',14,600,C.panel);
  /* góc tới hạn: vạch chỉ dẫn mờ */
  const g=critAngle(n,1);
  const sg= s3.air? 1 : -1; /* phía đặt đèn */
  const Lx=-RL*Math.sin(i), Ly=sg*RL*Math.cos(i);
  beam(ctx,V.X(Lx),V.Y(Ly),ox,oy,1);
  beam(ctx,ox,oy,V.X(RR*Math.sin(i)),V.Y(sg*RR*Math.cos(i)),R);
  if (r!==null) beam(ctx,ox,oy,V.X(RR*Math.sin(r)),V.Y(-sg*RR*Math.cos(r)),1-R);
  if (s3.i>0){
    arcAngle(ctx,ox,oy,2.3*k,(sg<0?Math.PI/2:-Math.PI/2),Math.atan2(-Ly,Lx),C.laser,'i');
    if (r!==null) arcAngle(ctx,ox,oy,2.9*k,(sg<0?-Math.PI/2:Math.PI/2),Math.atan2(sg*Math.cos(r),Math.sin(r)),C['bar-t'],'r');
  }
  if (r===null) label(ctx,t('tir'),D.w/2,V.Y(6.2),C.laser,'center',D.w<480?16:20,800,C.panel);
  label(ctx,'O',ox-10,oy-12,C.ink,'center',12,700);
  laserBody(ctx,V.X(Lx),V.Y(Ly),Math.atan2(oy-V.Y(Ly),ox-V.X(Lx)),drag3);
}
function drawGraph3(){
  const D=D3g, ctx=D.ctx; clear(D);
  const {n1,n2}=phys3();
  const G=axes(D,0,90,0,1,'i (°)','%',[0,15,30,45,60,75,90],[0,0.5,1]);
  const curve=(f,col)=>{ ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.beginPath(); for (let a=0;a<=90;a+=0.25){ const v=f(a*D2R); a?ctx.lineTo(G.X(a),G.Y(v)):ctx.moveTo(G.X(a),G.Y(v)); } ctx.stroke(); };
  curve(a=>fresnel(n1,n2,Math.min(a,89.99*D2R)),C['bar-r']); curve(a=>1-fresnel(n1,n2,Math.min(a,89.99*D2R)),C['bar-t']);
  const g=critAngle(n1,n2); if (g && s3.rows.some(w=>w.mat===s3.mat)){ dashLine(ctx,G.X(g*R2D),G.Y(0),G.X(g*R2D),G.Y(1),C.warn,1.2,[4,4]); label(ctx,t('igh')+(quant()?' = '+nf(g*R2D,1)+'°':''),G.X(g*R2D)-4,G.Y(0.55),C.warn,'right',12,700,C.panel); }
  const R=fresnel(n1,n2,s3.i*D2R);
  ctx.fillStyle=C['bar-r']; ctx.beginPath(); ctx.arc(G.X(s3.i),G.Y(R),5.5,0,7); ctx.fill();
  ctx.fillStyle=C['bar-t']; ctx.beginPath(); ctx.arc(G.X(s3.i),G.Y(1-R),5.5,0,7); ctx.fill();
}

function drawWinView(){
  const D=D4b, ctx=D.ctx; clear(D); const n=1.33, g=critAngle(n,1);
  const cx=D.w/2, cy=D.h/2, R=Math.min(D.w,D.h)/2-8;

  ctx.fillStyle=C.sand; ctx.fillRect(0,0,D.w,D.h);
  for (const p of PEB){ const r=rad(g)+(R-rad(g))*p.r, a=p.a*D2R; ctx.fillStyle= p.s>1?'#8a7a5a':'#a8946a'; ctx.globalAlpha=.6; ctx.beginPath(); ctx.arc(cx+r*Math.cos(a),cy+r*Math.sin(a),3+p.s*3,0,7); ctx.fill(); }

  /* Mặt Trời ở góc 35° so với phương thẳng đứng */
  const rs=rad(Math.asin(Math.sin(35*D2R)/n)); ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(cx+rs*0.7,cy-rs*0.7,10,0,7); ctx.fill();
  ctx.restore();

  ctx.strokeStyle=C.line; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.stroke();

  label(ctx,t('bottomRefl'),cx,cy+R-18,'#fff','center',12,700);

/* ---- Que thuỷ tinh tàng hình ---- */
function rodTrace(b,a,m){ /* tia song song lệch b so với trục, qua trụ bán kính a, chiết suất tỉ đối m; trả về {ye, yo, dev} hoặc null nếu phản xạ toàn phần */
  const t1=Math.asin(clamp(b/a,-1,1)), s2=Math.sin(t1)/m; if (Math.abs(s2)>=1) return null;
  const t2=Math.asin(s2), ex=2*t2-t1, dev=-2*(t1-t2);
  return {x0:-a*Math.cos(t1), xe:a*Math.cos(ex), ye:a*Math.sin(ex), dev};
}
function drawRod(){
  const D=D4, ctx=D.ctx; clear(D); const st=s4.rod, nr=1.47, nl= st.liq==='air'?1:st.n;
  const bx0=D.w*0.22, bx1=D.w*0.78, by0=D.h*0.16, by1=D.h*0.94, ly=D.h*0.42;
  const per=Math.max(10,Math.round(D.w/60));
  const stripe=x=>(Math.floor((x-bx0+10000*per)/per)%2===0);
  /* tấm nền sọc phía sau */
  const card0=D.w*0.08, card1=D.w*0.92;
  for (let x=card0;x<card1;x+=1){ ctx.fillStyle= stripe(x)? '#1d2433' : '#f2f2ee'; ctx.fillRect(x,D.h*0.04,1,D.h*0.92); }
  /* cốc + chất lỏng */
  if (st.liq!=='air'){ ctx.fillStyle= st.liq==='oil'||Math.abs(nl-1.47)<0.03? 'rgba(230,190,40,.35)' : 'rgba(52,145,230,.25)'; ctx.fillRect(bx0,ly,bx1-bx0,by1-ly); }
  ctx.strokeStyle=C.muted; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(bx0,by0); ctx.lineTo(bx0,by1); ctx.lineTo(bx1,by1); ctx.lineTo(bx1,by0); ctx.stroke();
  if (st.liq!=='air'){ ctx.strokeStyle='rgba(120,120,120,.6)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(bx0,ly); ctx.lineTo(bx1,ly); ctx.stroke(); }
  /* que: vẽ từng cột điểm ảnh theo đường truyền thật của tia qua trụ */
  const xc=D.w*0.5, a=Math.max(14,D.w*0.045), Dbg=a*2, top=D.h*0.07, bot=D.h*0.9;
  const seg=(y0,y1,m,tint)=>{
    for (let px=-a;px<a;px+=1){
      const b=px+0.5, tr=rodTrace(b,a,m); let col, R;
      if (!tr){ col='#c9ced6'; R=1; }
      else { const yb=tr.ye+(Dbg-tr.xe)*Math.tan(tr.dev); col= stripe(xc+yb)? '#1d2433' : '#f2f2ee'; R=Math.min(1,2*fresnel(1,m,Math.asin(Math.min(1,Math.abs(b)/a)))); }
      ctx.fillStyle=col; ctx.fillRect(xc+px,y0,1,y1-y0);
      if (R>0.004){ ctx.fillStyle=`rgba(235,240,250,${R})`; ctx.fillRect(xc+px,y0,1,y1-y0); }
      if (tint){ ctx.fillStyle=tint; ctx.fillRect(xc+px,y0,1,y1-y0); }
    } };
  const tint= st.liq==='air'? null : (st.liq==='oil'||Math.abs(nl-1.47)<0.03? 'rgba(230,190,40,.35)' : 'rgba(52,145,230,.25)');
  seg(top, st.liq==='air'?bot:ly, nr/1, null);
  if (st.liq!=='air') seg(ly,bot,nr/nl,tint);
  /* đầu que */
  ctx.strokeStyle='rgba(150,160,175,.9)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(xc,top,a,a*0.3,0,0,7); ctx.stroke();
  label(ctx,t('rodGlass'),xc+a+8,top+18,C.ink,'left',13,700,C.panel);
  if (st.liq!=='air') label(ctx,(st.liq==='custom'? (lang==='vi'?'chất lỏng':'liquid') : t(st.liq))+` n = ${nN(nl)}`,bx1-8,by1-16,C.ink,'right',13,700,C.panel);
  const dn=Math.abs(nl-nr);
  $('#st4').style.color= dn<0.02? C.ok : C.ink;
  $('#st4').textContent= st.liq==='air'? (lang==='vi'?'Trong không khí: que thấy rõ (chênh lệch chiết suất lớn).':'In air: the rod is clearly visible (large index difference).')
    : dn<0.005? (lang==='vi'?'Chiết suất bằng nhau: phần que trong chất lỏng gần như biến mất!':'Equal indices: the rod almost vanishes in the liquid!')
    : (lang==='vi'?`Chênh lệch chiết suất ${nf(dn,2)}: vẫn thấy que.`:`Index difference ${nf(dn,2)}: the rod is still visible.`);
  drawRodTop(nl,nr);
}
function drawRodTop(nl,nr){
  const D=D4b, ctx=D.ctx; clear(D); const st=s4.rod;
  const cx=D.w/2, cy=D.h*0.5, a=Math.min(D.h*0.3,D.w*0.16);
  ctx.fillStyle= st.liq==='air'? C.lane : (Math.abs(nl-1.47)<0.03||st.liq==='oil'? 'rgba(230,190,40,.25)':'rgba(52,145,230,.2)'); ctx.fillRect(0,0,D.w,D.h);

  const m=nr/nl;
  for (let k2=-4;k2<=4;k2++){ const b=k2/4.6*a, tr=rodTrace(b,a,m);
    /* toạ độ: ánh sáng đi từ trên xuống; "x" của công thức = hướng đi xuống, "y" = lệch ngang */
    const X=(lat)=>cx+lat, Y=(along)=>cy+along;
    if (!tr){ beam(ctx,X(b),0,X(b),Y(-Math.sqrt(a*a-b*b)),1,false); continue; }
    const L=D.h;

}
/* ---- Ảo ảnh ---- */
function nAir(y,Tr){ const Ta=303.15, T=Ta+(Tr+273.15-Ta)*Math.exp(-Math.max(0,y)/0.25); return 1+2.93e-4*288.15/T; }
function dnAir(y,Tr){ const h=1e-4; return (nAir(y+h,Tr)-nAir(Math.max(0,y-h),Tr))/(y>h?2*h:h+y); }
const MIR={X:600, y0:1.6, carX:330, carW:4, carH:1.45};
/* Tia từ mắt đi xuống góc alpha (rad), lần theo phương trình tia y'' = (1/n)(dn/dy)(1+y'²) */
function traceMir(alpha,Tr,keep,car){
  let x=0, y=MIR.y0, s=-Math.tan(alpha); const dx=0.5, pts=keep?[[x,y]]:null;
  while (x<MIR.X){
    const n=nAir(y,Tr); s+= dnAir(y,Tr)/n*(1+s*s)*dx; y+= s*dx; x+=dx;
    if (keep && (Math.round(x*2)%8===0)) pts.push([x,y]);
    if (car && x>=MIR.carX && x<MIR.carX+MIR.carW && y<MIR.carH && y>0) return {kind:'car',x,y,pts};
    if (y<=0) return {kind:'road',x,y:0,pts};
    if (y>40) break;
  }
  return {kind:'end', x, y, s, pts};
}
const hillH=az=>2.6+1.4*Math.sin(az*R2D*2.3+1)+0.8*Math.sin(az*R2D*5.1);
function drawMir(){
  const D=D4, ctx=D.ctx; clear(D); const Tr=s4.mir.Tr, car=s4.mir.car;
  const L=46, B=24, kx=(D.w-L-10)/MIR.X, ky=(D.h-B-10)/3.2;

  const hg=ctx.createLinearGradient(0,Y(0),0,Y(0.8)); hg.addColorStop(0,`rgba(255,120,40,${0.1+0.5*(Tr-30)/40})`); hg.addColorStop(1,'rgba(255,120,40,0)'); ctx.fillStyle=hg; ctx.fillRect(L,Y(0.8),D.w-L,Y(0)-Y(0.8));
  ctx.fillStyle=C.road; ctx.fillRect(L,Y(0),D.w-L,B);
  ctx.fillStyle='#4f7a4a'; ctx.fillRect(X(MIR.X)-6,Y(3),6,3*ky);
  if (car){ ctx.fillStyle='#c62a47'; ctx.fillRect(X(MIR.carX),Y(MIR.carH),Math.max(4,MIR.carW*kx),MIR.carH*ky); label(ctx,t('car'),X(MIR.carX)+4,Y(MIR.carH)-10,C.ink,'center',12,700,C.panel); }
  font(ctx,11,500); ctx.fillStyle=C.muted; ctx.textAlign='right'; ctx.textBaseline='middle';
  for (const v of [0,1,2,3]) ctx.fillText(nf(v,0)+' m',L-4,Y(v));
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#fff'; for (const v of [100,200,300,400,500]) ctx.fillText(v+' m',X(v),D.h-B+5);
  for (let k2=0;k2<16;k2++){ const a=(0.04+k2*0.06)*D2R; const r=traceMir(a,Tr,true,car);
    const col= r.kind==='end'? C['bar-t'] : r.kind==='car'? '#c62a47' : C.muted;
    ctx.save(); ctx.beginPath(); ctx.rect(L,0,D.w-L,D.h); ctx.clip();
    ctx.strokeStyle=col; ctx.lineWidth=r.kind==='end'?2.2:1.4; ctx.beginPath(); r.pts.forEach(([x,y],q)=>q?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))); ctx.lineTo(X(r.x),Y(r.y)); ctx.stroke(); ctx.restore(); }
  drawEye(ctx,X(0)+12,Y(MIR.y0),0.05,false);
  label(ctx,t('exag',Math.round(ky/kx)),D.w-8,12,C.ink,'right',12,700,C.panel);
  const lg=[[C.muted,t('rayRoad')],[C['bar-t'],t('raySky')]].concat(car?[['#c62a47',t('rayCar')]]:[]); let lx=L+8;
  for (const [c,tx] of lg){ ctx.fillStyle=c; ctx.fillRect(lx,8,16,4); label(ctx,tx,lx+20,10,C.ink,'left',11,600); font(ctx,11,600); lx+=ctx.measureText(tx).width+36; }
  const amax=Math.sqrt(2*Math.max(0,nAir(MIR.y0,Tr)-nAir(0,Tr)));

  $('#st4').style.color=C.ink;
  $('#st4').textContent= amax*R2D<0.08 ? t('mirNone') : t('mirYes',nf(Math.round((dist||600)/10)*10,0));
  drawMirView(Tr,car);
}
function drawMirView(Tr,car){
  const D=D4b, ctx=D.ctx;
  if (!s4.mir.cache || s4.mir.cache.Tr!==Tr || s4.mir.cache.w!==D.w || s4.mir.cache.car!==car){
    const off=document.createElement('canvas'); off.width=D.w; off.height=D.h; const o=off.getContext('2d');
    const hz=D.h*0.45, degPx=D.h/1.5;
    for (let py=0;py<D.h;py+=1){
      const a=(py-hz)/degPx*D2R;
      const r=traceMir(a,Tr,false,car); let r2=null;
      for (let px=0;px<D.w;px+=2){
        const az=(px-D.w/2)/degPx*D2R; let rr=r;
        if (r.kind==='car' && Math.abs(az*r.x)>=MIR.carW*0.45){ if (!r2) r2=traceMir(a,Tr,false,false); rr=r2; }
        let col;
        if (rr.kind==='car') col='#c62a47';
        else if (rr.kind==='road'){ const lat=Math.abs(az*rr.x); col= lat<3.5? (lat<0.08 && Math.floor(rr.x/6)%2===0? '#e8e8e0' : C.road) : '#7aa05f'; }
        else col= (rr.y>0 && rr.y<hillH(az))? '#4f7a4a' : (a<-0.25*D2R? C.sky1 : C.sky2);
        o.fillStyle=col; o.fillRect(px,py,2,1);
      }
    }
    s4.mir.cache={Tr,car,w:D.w,img:off,hz};
  }
  clear(D); ctx.drawImage(s4.mir.cache.img,0,0,D.w,D.h);
  label(ctx,lang==='vi'?'đường chân trời':'horizon',8,s4.mir.cache.hz-10,C.ink,'left',11,600,C.panel);
}

function fiberGeom(){

  S.segs.push({a:[a+2.2,-6],b:[a+2.2,-8.4],mirror:0,tag:'eye'});

  /* tính năng lượng tới mắt: đi tới mặt dò */
  const out={segs:[],exit:[],tag:{},tir:0}; let toEye=0;
  for (const r of rays){ const o2={segs:[],exit:[],tag:{},tir:0}; traceEye(S,r.o,r.d,r.I,o2); out.segs.push(...o2.segs); toEye+=o2.eye||0; out.tir+=o2.tir||0; }
  drawSegs(ctx,V,out,3);
  drawEye(ctx,V.X(a+2.6),V.Y(-7.2),Math.PI,false);
  laserBody(ctx,V.X(-5.6),V.Y(1.3),-tl,false);
  label(ctx,lang==='vi'?'ánh sáng từ vật':'light from object',V.X(-5.6),V.Y(2.4),C.muted,'left',12,600);

    : (lang==='vi'?'Mỗi gương chỉ phản xạ khoảng 90 % ánh sáng.':'Each mirror reflects only about 90 % of the light.');
}
function traceEye(S,o,d,I,out,depth=0){
  /* như traceS nhưng dừng ở mặt dò "eye" và cộng năng lượng */
  if (I<0.01 || depth>40) return;
  let best=null, bt=1e9;
  for (const s of S.segs){ const ex=s.b[0]-s.a[0], ey=s.b[1]-s.a[1], den=d[0]*ey-d[1]*ex; if (Math.abs(den)<1e-12) continue;
    const ox=s.a[0]-o[0], oy=s.a[1]-o[1]; const tt=(ox*ey-oy*ex)/den, u=(ox*d[1]-oy*d[0])/den; if (tt>1e-7&&u>=0&&u<=1&&tt<bt){ bt=tt; best=s; } }
  if (!best){ out.segs.push([o[0],o[1],o[0]+d[0]*40,o[1]+d[1]*40,I]); return; }
  const h=[o[0]+d[0]*bt,o[1]+d[1]*bt]; out.segs.push([o[0],o[1],h[0],h[1],I]);
  if (best.tag==='eye'){ out.eye=(out.eye||0)+I; return; }
  const ex=best.b[0]-best.a[0], ey=best.b[1]-best.a[1], L=Math.hypot(ex,ey); let N=[-ey/L,ex/L]; let ci=-(N[0]*d[0]+N[1]*d[1]); if (ci<0){ N=[-N[0],-N[1]]; ci=-ci; }
  const refl=[d[0]+2*ci*N[0], d[1]+2*ci*N[1]];
  if (best.mirror!==undefined){ traceEye(S,h,refl,I*best.mirror,out,depth+1); out.eye=out.eye||0; return; }
  const n1=nAtS(S,[h[0]-d[0]*1e-5,h[1]-d[1]*1e-5]), n2=nAtS(S,[h[0]+d[0]*1e-5,h[1]+d[1]*1e-5]);
  const eta=n1/n2, k=1-eta*eta*(1-ci*ci);
  if (k<0){ out.tir=(out.tir||0)+1; traceEye(S,h,refl,I,out,depth+1); return; }
  let R=fresnel(n1,n2,Math.acos(Math.min(1,ci))); if (best.ar) R=Math.min(R,0.004);
  const tdir=[eta*d[0]+(eta*ci-Math.sqrt(k))*N[0], eta*d[1]+(eta*ci-Math.sqrt(k))*N[1]];
  const sub={segs:[],eye:0,tir:0}; traceEye(S,h,tdir,I*(1-R),sub,depth+1); traceEye(S,h,refl,I*R,sub,depth+1);
  out.segs.push(...sub.segs); out.eye=(out.eye||0)+sub.eye; out.tir=(out.tir||0)+sub.tir;
}

  if (sb==='draw'){
    const P=s6.prob;
    const rows=[[lang==='vi'?'Môi trường tới':'Incident medium',t(P.a)+(quant()?` (n = ${nN(P.n1)})`:'')],[lang==='vi'?'Môi trường khúc xạ':'Second medium',t(P.b)+(quant()?` (n = ${nN(P.n2)})`:'')],[t('angI'),nf(P.i,0)+'°']];
    $('#side6').innerHTML=`<h2>${lang==='vi'?'Đề bài':'Problem'}</h2><dl class="kv">${rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`+
      (s6.fb? `<p class="fb ${s6.fb.ok?'good':'bad'}">${t(s6.fb.k,...s6.fb.a)}</p>`:'')+`<p class="hint score">${t('score',s6.score,s6.tries)}</p>`;
    $('#st6').textContent= s6.tirChosen? t('tirBtn')+' ✓' : '';
  }
  if (sb==='game'){
    const G=s6.game;
    $('#side6').innerHTML=`<h2>${t('s6game')}</h2><p>${t('g6tip')}</p>`+(G.msg? `<p class="fb ${G.msg==='hit'?'good':'bad'}">${t(G.msg)}</p>`:'')+`<p class="hint score">${t('shots',G.hits,G.shots)}</p>`;
    $('#st6').textContent='';
  }
}
function resize6(){ if (tab!==6) return; if (s6.sub!=='quiz') D6=fit($('#cv6'),0.62,280,520); }
function draw6(){
  if (!D6 || s6.sub==='quiz') return; const D=D6, ctx=D.ctx; clear(D);
  if (s6.sub==='draw') drawDraw6(D,ctx); else drawGame6(D,ctx);
}
function drawDraw6(D,ctx){
  const P=s6.prob, V=V6=fitView(D,-10,10,-8,8,6), k=V.k;
  const ro=P.rot*D2R, cr=Math.cos(ro), sr=Math.sin(ro);
  const Q=(x,y)=>[V.X(x*cr-y*sr),V.Y(x*sr+y*cr)];
  /* hai môi trường */
  const half=(sg,fill)=>{ ctx.fillStyle=fill; ctx.beginPath(); const c=[[-30,0],[30,0],[30,sg*30],[-30,sg*30]].map(([x,y])=>Q(x,y)); c.forEach(([x,y],q)=>q?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.fill(); };
  half(1,MED[P.a].fill); half(-1,MED[P.b].fill);
  { const [x1,y1]=Q(-30,0),[x2,y2]=Q(30,0); ctx.strokeStyle=C['glass-edge']; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  { const [ax,ay]=Q(-6,3.2),[bx,by]=Q(-6,-3.2); label(ctx,t(P.a)+(quant()?` ${nN(P.n1)}`:''),ax,ay,C.ink,'center',13,700,C.panel); label(ctx,t(P.b)+(quant()?` ${nN(P.n2)}`:''),bx,by,C.ink,'center',13,700,C.panel); }
  const [ox,oy]=Q(0,0), R=7, i=P.i*D2R;
  if (s6.showN || s6.checked){ const [a,b]=Q(0,8),[c,d]=Q(0,-8); dashLine(ctx,a,b,c,d,C.normal,1.5); }
  const [lx,ly]=Q(-R*Math.sin(i),R*Math.cos(i)); beam(ctx,lx,ly,ox,oy,1);
  /* tia học sinh vẽ */
  if (!s6.tirChosen){ const A=s6.ans, L=Math.hypot(A.x,A.y)||1; const [ex,ey]=Q(A.x/L*R,A.y/L*R);
    ctx.save(); ctx.strokeStyle=C.accent; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.fillStyle=C.accent; ctx.beginPath(); ctx.arc(ex,ey,11,0,7); ctx.fill(); ctx.restore(); }
  else { const [ex,ey]=Q(R*Math.sin(i),R*Math.cos(i)); ctx.save(); ctx.strokeStyle=C.accent; ctx.lineWidth=3; ctx.setLineDash([8,5]); ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ex,ey); ctx.stroke(); ctx.restore(); }
  /* đáp án sau khi kiểm tra */
  if (s6.checked){ const r=snell(P.n1,P.n2,i);
    const [ex,ey]= r===null? Q(R*Math.sin(i),R*Math.cos(i)) : Q(R*Math.sin(r),-R*Math.cos(r));
    ctx.save(); ctx.strokeStyle=C.ok; ctx.lineWidth=2.5; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ex,ey); ctx.stroke(); ctx.restore();
    label(ctx,lang==='vi'?'đáp án':'answer',ex,ey-14,C.ok,'center',12,700,C.panel); }
  if (P.i>0 && (s6.showN||s6.checked)){ const a0=Math.atan2(Q(0,1)[1]-oy,Q(0,1)[0]-ox), a1=Math.atan2(ly-oy,lx-ox); arcAngle(ctx,ox,oy,2*k,a0,a1,C.laser,nf(P.i,0)+'°'); }
}
function drawGame6(D,ctx){
  const G=s6.game, V=V6=fitView(D,-7,8,-3.4,3.6,6), k=V.k;
  const gr=ctx.createLinearGradient(0,0,0,V.Y(0)); gr.addColorStop(0,C.sky1); gr.addColorStop(1,C.sky2); ctx.fillStyle=gr; ctx.fillRect(0,0,D.w,V.Y(0));
  ctx.fillStyle=MED.water.fill; ctx.fillRect(0,V.Y(0),D.w,D.h); ctx.fillStyle=C.sand; ctx.fillRect(0,V.Y(-3.3),D.w,D.h);
  ctx.strokeStyle=C['glass-edge']; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(0,V.Y(0)); ctx.lineTo(D.w,V.Y(0)); ctx.stroke();
  /* bờ */
  ctx.fillStyle=C.line; ctx.fillRect(0,V.Y(2.2),V.X(-4.6),D.h);
  const F=G.fish; fishShape(ctx,V.X(F.x),V.Y(F.y),0.32*k,1,true);
  const a=G.aim, d={x:Math.cos(a),y:-Math.sin(a)};
  /* đường ngắm thẳng */
  const tEnd=(F.y-0.6-GL.y)/d.y; dashLine(ctx,V.X(GL.x),V.Y(GL.y),V.X(GL.x+d.x*Math.max(tEnd,3)),V.Y(GL.y+d.y*Math.max(tEnd,3)),C.muted,1.5,[7,6]);
  if (G.shot){ const S=G.shot.S, d2=G.shot.d2; beam(ctx,V.X(GL.x),V.Y(GL.y),V.X(S.x),V.Y(S.y),1); const Lb=(-3.3-S.y)/d2.y; beam(ctx,V.X(S.x),V.Y(S.y),V.X(S.x+d2.x*Lb),V.Y(S.y+d2.y*Lb),0.97);
    dashLine(ctx,V.X(S.x),V.Y(1),V.X(S.x),V.Y(-1.2),C.normal,1.2);
    if (G.shot.hit){ ctx.strokeStyle=C.ok; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(V.X(F.x),V.Y(F.y),0.5*k,0,7); ctx.stroke(); } }
  laserBody(ctx,V.X(GL.x),V.Y(GL.y),Math.atan2(-d.y,d.x),drag6);
}
function buildQuiz(){
  const box=$('#quiz6'), L=lang;
  const items=QUIZ.map((q,k)=>({q,k})).filter(({q})=>!q.q||quant());
  box.innerHTML=`<h2>${t('qTitle')}</h2><p class="hint score" id="qs6"></p>`+items.map(({q,k})=>{ const arr=q[L], o=QORD[k];
    return `<div class="qi" data-k="${k}"><p class="q">${k+1}. ${arr[0]}</p><div class="choices">${o.map(j=>`<button class="btn" data-j="${j}">${arr[j+1]}</button>`).join('')}</div><p class="fb" hidden></p></div>`; }).join('');
  $$('#quiz6 .qi').forEach(el=>{ const k=+el.dataset.k, q=QUIZ[k];
    el.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{ const j=+b.dataset.j, ok=j===q.a; s6.quiz[k]=ok;
      el.querySelectorAll('.btn').forEach(x=>x.classList.remove('right','wrong')); b.classList.add(ok?'right':'wrong'); if (!ok) el.querySelector(`.btn[data-j="${q.a}"]`).classList.add('right');
      const fb=el.querySelector('.fb'); fb.hidden=false; fb.className='fb '+(ok?'good':'bad'); fb.textContent=(ok?t('right'):t('wrong'))+(L==='vi'?q.fv:q.fe); qScore(); });
    if (s6.quiz[k]!==undefined){} });
  qScore();
}
function qScore(){ const v=Object.values(s6.quiz); $('#qs6').textContent=t('qScore',v.filter(Boolean).length,v.length); }

/* ============ Chung ============ */
const TABS=[1,2,3,4,5,6];
const fnc=n=>typeof window[n]==='function'? window[n] : ()=>{};
function applyLang(){
  document.documentElement.lang=lang;
  $$('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  $$('[data-i18n-html]').forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  $('#langBtn').textContent= lang==='vi'?'EN':'VI';
  $$('#spd1 .btn').forEach(b=>b.textContent='×'+nf(+b.dataset.v,1));
  refreshFb(); renderAll();
}
function renderAll(){
  document.body.classList.toggle('qual',!quant());
  $('#lvQual').setAttribute('aria-pressed',String(level==='qual')); $('#lvQuant').setAttribute('aria-pressed',String(level==='quant'));
  $$('nav.tabs button').forEach(b=>{ const on=+b.dataset.tab===tab; b.classList.toggle('on',on); b.setAttribute('aria-selected',String(on)); });
  for (const i of TABS) $('#t'+i).hidden= i!==tab;
  $('#foot').innerHTML=`<p>${t('foot')}</p>`;
  for (const i of TABS) fnc('ui'+i)();
  resize();
  for (const i of TABS) fnc('ui'+i)();
}
function resize(){
  if (tab===1) D1=fit($('#cv1'),0.62,300,520);
  if (tab===2){ D2=fit($('#cv2'),0.85,320,560); D2a=fit($('#cv2a'),0.75,200,280); if (quant()) D2b=fit($('#cv2b'),0.75,200,280); drawGraphs2(); }
  if (tab===3){ D3=fit($('#cv3'),0.8,320,540); D3g=fit($('#cv3g'),0.38,170,240); drawGraph3(); }
  fnc('resize'+tab)();
}
let lastT=performance.now();
function loop(now){
  const dt=Math.min((now-lastT)/1000,0.1); lastT=now;
  try{
    if (tab===1 && D1) draw1(dt);
    if (tab===2 && D2) draw2(dt);
    if (tab===3 && D3) draw3(dt);
    if (tab>=4) fnc('draw'+tab)(dt);
  }catch(err){ console.error(err); }
  requestAnimationFrame(loop);
}
function init(){
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ readColors(); renderAll(); });
  new MutationObserver(()=>{ readColors(); }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  for (const i of TABS) fnc('setup'+i)();
  $('#langBtn').onclick=()=>{ lang= lang==='vi'?'en':'vi'; save(); applyLang(); };
  $('#lvQual').onclick=()=>{ level='qual'; save(); renderAll(); };
  $('#lvQuant').onclick=()=>{ level='quant'; save(); renderAll(); };
  $$('nav.tabs button').forEach(b=>b.onclick=()=>{ tab=+b.dataset.tab; save(); renderAll(); });
  let rt=null; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(renderAll,120); });
  applyLang();
  requestAnimationFrame(loop);
}
init();
</script>
