<title>Mạch điện nối tiếp, song song</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Bàn thí nghiệm điện: sân khấu canvas bên trái (mạch, mô hình tương tự), sổ ghi chép bên phải; dây đồng và electron xanh là hai màu chủ đạo. Điện thoại xếp một cột. */
:root{
  --bg:#edf0f4; --panel:#ffffff; --lane:#f6f7fa; --ink:#141922; --muted:#586174; --line:#d2d8e2;
  --accent:#a24a17; --accent-ink:#ffffff; --ok:#15803d; --warn:#c2410c;
  --wire:#b4652f; --e:#1d5fd6; --q:#d4313b; --bulb:#ffc21a; --glass:#fbfaf3; --res:#e9e2d2; --heat:#ff5a1f;
  --vlo:#3557d6; --vmid:#22a58f; --vhi:#ef5a0c; --meter:#ffffff; --pipe:#8b96aa; --water:#3d9be0;
  --chain:#3a404c; --ball:#d9480f; --floor:#e3ded3; --person:#5b6b8c; --metal:#9aa3b3;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --panel:#171c25; --lane:#121720; --ink:#e6eaf2; --muted:#9aa4b7; --line:#2b3343;
  --accent:#f09a5c; --accent-ink:#1d0e04; --ok:#4ade80; --warn:#fb923c;
  --wire:#d38a55; --e:#6aa8ff; --q:#ff6b72; --bulb:#ffd043; --glass:#262a33; --res:#4a4538; --heat:#ff7a3d;
  --vlo:#6f8cff; --vmid:#38c7ad; --vhi:#ff8a3d; --meter:#1f2530; --pipe:#5f6a7d; --water:#58b3f0;
  --chain:#c3c9d4; --ball:#ff7a3d; --floor:#2e2b26; --person:#9fb0d4; --metal:#6c7587;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a; --panel:#171c25; --lane:#121720; --ink:#e6eaf2; --muted:#9aa4b7; --line:#2b3343;
  --accent:#f09a5c; --accent-ink:#1d0e04; --ok:#4ade80; --warn:#fb923c;
  --wire:#d38a55; --e:#6aa8ff; --q:#ff6b72; --bulb:#ffd043; --glass:#262a33; --res:#4a4538; --heat:#ff7a3d;
  --vlo:#6f8cff; --vmid:#38c7ad; --vhi:#ff8a3d; --meter:#1f2530; --pipe:#5f6a7d; --water:#58b3f0;
  --chain:#c3c9d4; --ball:#ff7a3d; --floor:#2e2b26; --person:#9fb0d4; --metal:#6c7587;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(25px,3.4vw,36px);line-height:1.15;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:700}
.hdr-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,nav.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);max-width:100%}
.seg .btn{border:0;border-radius:0;min-width:48px;padding:8px 12px}
.seg .btn+.btn{border-left:1px solid var(--line)}
.seg.full{display:flex}
.seg.full .btn{flex:1 1 0;min-width:0}
.seg.wrap2{display:grid;grid-template-columns:1fr 1fr}
.seg.wrap2 .btn{border-left:0!important;border-top:1px solid var(--line)}
.seg.wrap2 .btn:nth-child(-n+2){border-top:0}
.seg.wrap2 .btn:nth-child(2n){border-left:1px solid var(--line)!important}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-size:15px;font-weight:600;white-space:nowrap;min-height:46px;padding:8px 14px;border:0;border-bottom:3px solid transparent;
  background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.req{margin:0;font-size:14px;color:var(--muted);max-width:110ch}
.req b{color:var(--ink);font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:1020px){.lab{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0}
.card.predict{border-color:var(--accent);border-width:2px}
canvas{display:block;width:100%;touch-action:none;border-radius:8px;background:var(--lane)}
canvas.pany{touch-action:pan-y}
.subhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:14px;color:var(--muted);margin:0}
.status{font-size:16px;font-weight:600;margin:0;min-height:24px}
.status.warn{color:var(--warn)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.fld .val{color:var(--ink);font-family:var(--font-num);font-size:15px}
input[type=range]{width:100%;min-width:0;height:32px;accent-color:var(--accent)}
input[type=number]{font:inherit;font-family:var(--font-num);font-size:17px;min-height:44px;width:130px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--lane);color:var(--ink)}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px;cursor:pointer;color:var(--ink);font-weight:500}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.chkrow{display:flex;flex-wrap:wrap;gap:4px 16px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices .btn{flex:1 1 140px;font-size:14px;text-align:left}
.choices .btn.right{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.choices .btn.wrong{border-color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
.pred{display:flex;flex-direction:column;gap:8px}
.pred+.pred{border-top:1px solid var(--line);padding-top:10px}
.q{font-size:15px;font-weight:600;margin:0}
.fb{font-size:15px;padding:8px 10px;border-radius:8px;background:var(--lane);margin:0}
.fb b.good{color:var(--ok)} .fb b.bad{color:var(--warn)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
td.n{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
table.map td:first-child{font-weight:600;white-space:nowrap}
table.map th.on,table.map td.on{background:var(--lane);color:var(--ink)}
.concl{font-size:15px;padding:10px 12px;border-radius:8px;border:1px dashed var(--accent);background:var(--lane);margin:0}
.formula{font-family:var(--font-num);font-size:14px;background:var(--lane);padding:8px 10px;border-radius:8px;overflow-x:auto;line-height:1.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);align-items:center}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:5px}
.legend .ramp{display:inline-block;width:70px;height:8px;border-radius:4px;vertical-align:middle;margin:0 6px;background:linear-gradient(90deg,var(--vlo),var(--vmid),var(--vhi))}
.obs{display:flex;flex-direction:column;gap:8px;font-size:15px}
.obs p{margin:0;padding-left:12px;border-left:3px solid var(--line)}
.obs p.hl{border-left-color:var(--ok)}
.obs p.wn{border-left-color:var(--warn)}
.rules{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:8px 10px;border-radius:8px;background:var(--lane)}
.rules li .mk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted)}
.rules li.done .mk{border-color:var(--ok);background:var(--ok);color:var(--panel)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:15px;align-items:baseline;margin:0}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0;font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kv dd.big{font-size:18px;font-weight:600}
.kv dt.sep,.kv dd.sep{border-top:1px solid var(--line);padding-top:6px}
.map dl{margin:0}
.maplist{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:14px;margin:0}
.maplist dt{font-weight:600}
.maplist dd{margin:0;color:var(--ink)}
.maplist dd::before{content:"↔ ";color:var(--accent);font-weight:700}
ul.rw{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
ul.rw.good li::marker{content:"✓  ";color:var(--ok);font-weight:700}
ul.rw.bad li::marker{content:"✗  ";color:var(--warn);font-weight:700}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;border:1px solid currentColor}
.pill.good{color:var(--ok)} .pill.mid{color:var(--warn)}
details{font-size:15px}
summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:32px}
.nudge{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nudge .btn{min-width:52px;padding:8px 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prob{font-size:16px;line-height:1.55;padding:10px 12px;border-radius:8px;background:var(--lane);margin:0}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
footer{font-size:13px;color:var(--muted)}
footer p{margin:0 0 4px;max-width:120ch}
footer h3{color:var(--ink);margin-bottom:4px}
@media (max-width:520px){ .seg .btn{padding:8px 8px;font-size:14px} nav.tabs button{padding:8px 10px;font-size:14px} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="hdr-ctl">
      <button class="btn" id="hideBtn" aria-pressed="false" data-i18n="hideNums"></button>
      <button class="btn" id="langBtn">EN</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="1" data-i18n="tab1"></button>
    <button role="tab" data-tab="2" data-i18n="tab2"></button>
    <button role="tab" data-tab="3" data-i18n="tab3"></button>
    <button role="tab" data-tab="4" data-i18n="tab4"></button>
    <button role="tab" data-tab="5" data-i18n="tab5"></button>
    <button role="tab" data-tab="6" data-i18n="tab6"></button>
  </nav>

  <!-- ============ TAB 1: Hình dung dòng điện ============ -->
  <section id="t1" class="col" hidden>
    <p class="req" data-i18n-html="req1"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint1"></p>
        <canvas id="cv1" aria-label="circuit"></canvas>
        <div class="subhead"><h3 id="anaTitle"></h3><span class="hint" data-i18n="anaHint"></span></div>
        <canvas id="an1" class="pany" aria-label="analogy"></canvas>
        <p class="status" id="st1"></p>
        <div class="controls" data-ctl></div>
        <div class="legend" data-legend></div>
      </div>
      <aside class="col">
        <div class="card">
          <h2 data-i18n="cCirc"></h2>
          <div class="seg full" id="mode1"><button class="btn" data-v="one" data-i18n="m1one"></button><button class="btn" data-v="ser" data-i18n="m1ser"></button><button class="btn" data-v="par" data-i18n="m1par"></button></div>
          <div class="fld"><span><span data-i18n="sU"></span> <span class="val" id="vU1"></span></span><input type="range" id="rU1" min="0" max="12" step="0.5" value="6"></div>
          <div class="fld"><span><span data-i18n="sRb"></span> <span class="val" id="vR1"></span></span><input type="range" id="rR1" min="4" max="30" step="1" value="12"></div>
          <label class="chk"><input type="checkbox" id="k1" checked> <span data-i18n="closeK"></span></label>
        </div>
        <div class="card">
          <h2 data-i18n="cAna"></h2>
          <div class="seg wrap2" id="ana1"><button class="btn" data-v="water" data-i18n="anaWater"></button><button class="btn" data-v="bike" data-i18n="anaBike"></button><button class="btn" data-v="lift" data-i18n="anaLift"></button><button class="btn" data-v="crowd" data-i18n="anaCrowd"></button></div>
          <dl class="maplist" id="map1"></dl>
          <details><summary data-i18n="fullTable"></summary><div class="tblwrap"><table class="map" id="mapTbl"></table></div></details>
        </div>
        <div class="card">
          <h2 data-i18n="cRW"></h2>
          <h3 data-i18n="right"></h3><ul class="rw good" id="rw1r"></ul>
          <h3 data-i18n="wrong"></h3><ul class="rw bad" id="rw1w"></ul>
        </div>
        <div class="card predict"><h2 data-i18n="cPred"></h2><div class="pred" data-q="q1a"></div><div class="pred" data-q="q1b"></div></div>
        <div class="card"><h2 data-i18n="cObs"></h2><div class="obs" id="obs1"></div><p class="concl" id="concl1" data-i18n-html="concl1" hidden></p><button class="btn" data-concl="1" data-i18n="showConcl"></button></div>
      </aside>
    </div>
  </section>

  <!-- ============ TAB 2: Pin, điện trở, đo đạc ============ -->
  <section id="t2" class="col" hidden>
    <p class="req" data-i18n-html="req2"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint2"></p>
        <canvas id="cv2" aria-label="circuit with voltmeter"></canvas>
        <p class="status" id="st2"></p>
        <div class="subhead"><h3 data-i18n="cZoom"></h3><span class="hint" data-i18n="zoomHint"></span></div>
        <canvas id="zm2" class="pany" aria-label="inside the resistor"></canvas>
        <div class="controls" data-ctl></div>
        <div class="legend" data-legend></div>
      </div>
      <aside class="col">
        <div class="card">
          <h2 data-i18n="cCirc"></h2>
          <div class="fld"><span><span data-i18n="sU"></span> <span class="val" id="vU2"></span></span><input type="range" id="rU2" min="0" max="12" step="0.5" value="6"></div>
          <div class="fld"><span><span data-i18n="sR"></span> <span class="val" id="vR2"></span></span><input type="range" id="rR2" min="2" max="40" step="1" value="12"></div>
          <label class="chk"><input type="checkbox" id="k2" checked> <span data-i18n="closeK"></span></label>
        </div>
        <div class="card"><h2 data-i18n="cData"></h2><dl class="kv" id="kv2"></dl>
          <div class="row"><button class="btn primary" id="rec2" data-i18n="record"></button><button class="btn" id="clr2" data-i18n="clear"></button></div>
          <div class="tblwrap"><table id="tb2"></table></div>
        </div>
        <div class="card"><h2 data-i18n="cGraph"></h2><canvas id="gr2" class="pany" aria-label="I-U graph"></canvas><p class="hint" data-i18n="gHint"></p></div>
        <div class="card"><h2 data-i18n="cMiss"></h2><ul class="rules" id="miss2"></ul></div>
        <div class="card predict"><h2 data-i18n="cPred"></h2><div class="pred" data-q="q2a"></div><div class="pred" data-q="q2b"></div></div>
        <div class="card"><h2 data-i18n="cObs"></h2><div class="obs" id="obs2"></div><p class="concl" id="concl2" data-i18n-html="concl2" hidden></p><button class="btn" data-concl="2" data-i18n="showConcl"></button></div>
      </aside>
    </div>
  </section>

  <!-- ============ TAB 3: Nối tiếp ============ -->
  <section id="t3" class="col" hidden>
    <p class="req" data-i18n-html="req3"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint3"></p>
        <canvas id="cv3" aria-label="series circuit"></canvas>
        <p class="status" id="st3"></p>
        <div class="controls" data-ctl></div>
        <div class="legend" data-legend></div>
      </div>
      <aside class="col">
        <div class="card">
          <h2 data-i18n="cCirc"></h2>
          <div class="seg full" id="n3"><button class="btn" data-v="2" data-i18n="n2"></button><button class="btn" data-v="3" data-i18n="n3"></button></div>
          <div class="fld"><span><span data-i18n="sU"></span> <span class="val" id="vU3"></span></span><input type="range" id="rU3" min="0" max="12" step="0.5" value="6"></div>
          <div class="fld"><span><span data-i18n="sR1"></span> <span class="val" id="vRa3"></span></span><input type="range" id="rRa3" min="2" max="30" step="1" value="12"></div>
          <div class="fld"><span><span data-i18n="sR2"></span> <span class="val" id="vRb3"></span></span><input type="range" id="rRb3" min="2" max="30" step="1" value="12"></div>
          <div class="fld" id="fRc3"><span><span data-i18n="sR3"></span> <span class="val" id="vRc3"></span></span><input type="range" id="rRc3" min="2" max="30" step="1" value="12"></div>
          <div class="chkrow">
            <label class="chk"><input type="checkbox" id="k3" checked> <span data-i18n="closeK"></span></label>
            <label class="chk"><input type="checkbox" id="rm3a"> <span data-i18n="rmD1"></span></label>
            <label class="chk"><input type="checkbox" id="rm3b"> <span data-i18n="rmD2"></span></label>
            <label class="chk" id="lrm3c"><input type="checkbox" id="rm3c"> <span data-i18n="rmD3"></span></label>
          </div>
        </div>
        <div class="card"><h2 data-i18n="cData"></h2><dl class="kv" id="kv3"></dl>
          <div class="row"><button class="btn primary" id="rec3" data-i18n="record"></button><button class="btn" id="clr3" data-i18n="clear"></button></div>
          <div class="tblwrap"><table id="tb3"></table></div>
        </div>
        <div class="card predict"><h2 data-i18n="cPred"></h2><div class="pred" data-q="q3a"></div><div class="pred" data-q="q3b"></div><div class="pred" data-q="q3c"></div></div>
        <div class="card"><h2 data-i18n="cObs"></h2><div class="obs" id="obs3"></div><p class="concl" id="concl3" data-i18n-html="concl3" hidden></p><button class="btn" data-concl="3" data-i18n="showConcl"></button></div>
      </aside>
    </div>
  </section>

  <!-- ============ TAB 4: Song song ============ -->
  <section id="t4" class="col" hidden>
    <p class="req" data-i18n-html="req4"></p>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint4"></p>
        <canvas id="cv4" aria-label="parallel circuit"></canvas>
        <p class="status" id="st4"></p>
        <div class="controls" data-ctl></div>
        <div class="legend" data-legend></div>
      </div>
      <aside class="col">
        <div class="card">

  obs6hi:(i)=>`The more appliances are on, the larger the main current (now ${i}). That is why you should not plug many high-power appliances into one socket.`,
  obs6hs:'Series: the appliances must share 220 V, so none works at its rated power, and switching one off switches them all off.',
  app1t:'Why is home wiring parallel?', app1:'Each appliance needs exactly 220 V. In parallel every branch has the same 220 V, each appliance has its own switch, and one failing does not affect the others.',
  app2t:'Fairy lights', app2:'Many cheap strings of fairy lights are small bulbs in series: each needs only a small share of 220 V. One broken bulb turns off the whole string (newer ones have a part that bypasses a failed bulb).',
  app3t:'Overloaded socket', app3:'Plugging more appliances into one socket adds parallel branches: the equivalent resistance falls, the current in the socket wiring rises and the wires heat up. Fuses and circuit breakers (Grade 8) cut the circuit when the current is too large.',
  pause:'Pause', play:'Play', reset:'Reset', spd:'Speed', parts:'Particles:', partE:'Electrons', partQ:'Conventional', potColor:'Potential colours',
  lgE:'electron (each dot stands for a huge number of electrons)', lgQ:'positive charge moving in the conventional current direction', lgPotLo:'low potential', lgPotHi:'high potential',

  assumeT:'Model assumptions',
  as1:'Connecting wires have no resistance; the cell is ideal (constant terminal voltage) unless “internal resistance” is switched on in the Parallel tab. Ammeters and voltmeters are ideal.',
  as2:'Bulbs are treated as having constant resistance (obeying Ohm’s law); a real bulb’s resistance rises as the filament heats up. Brightness is drawn from the bulb’s power.',
  as3:'Particle speed on screen is symbolic and proportional to the current. Real electron drift speed in copper is only about 0.1 mm/s, but the electric field spreads round the circuit almost instantly.',
  as4:'Each dot stands for a huge number of electrons: 1 A means about 6.24 × 10¹⁸ electrons passing any cross-section per second.',
  as5:'Circuit symbols follow the Vietnamese textbooks (IEC standard). The analogies only help us picture the circuit; each one differs from reality somewhere.',
  Q:{
    q1a:{q:'Close switch K. When does an electron right next to the bulb start to move?',o:['Immediately, together with every electron in the circuit','When electrons from the cell reach it','After the bulb lights up'],
      fb:'Electrons are already everywhere in the wire. When the switch closes, the electric field spreads round the circuit almost instantly, so all the electrons start moving together. The electrons themselves drift very slowly, about 0.1 mm/s.'},
    q1b:{q:'Compared with the number of electrons entering the bulb each second, the number leaving it each second is…',o:['Smaller, because the bulb used some up','The same','Larger'],
      fb:'Charge is not lost and does not pile up inside the bulb: A1 and A2 read the same. What the bulb receives is energy: each electron passing through gives up energy e·U.'},
    q2a:{q:'Switch K is open. Put the voltmeter probes on the two ends of K. What does it read?',o:['0 V, because there is no current','The cell voltage','It cannot be measured'],
      fb:'One end of the switch is still joined to the positive terminal; the other is joined to the negative terminal through the resistor (no current, so no drop across it). The whole potential difference sits across the gap. Try task 3.'},
    q2b:{q:'Keep the same cell and double the resistance R. The current…',o:['Doubles','Stays the same, because a cell always gives the same current','Halves'],
      fb:'I = U/R. The cell keeps the voltage (almost) constant; the current is set by the whole circuit, not “produced” by the cell in a fixed amount.'},
    q3a:{q:'Ammeters A1, A2, A3, A4 sit at different places in the series circuit. Their readings…',o:['Decrease: A1 > A2 > A3 > A4','Are equal','Increase'],
      fb:'A series circuit has only one path; no particle is lost or piles up, so the current is the same at every point.'},
    q3b:{q:'Increase the resistance of the last bulb. The reading of A1 (at the start, before every bulb)…',o:['Stays the same, because A1 is before that bulb','Decreases','Increases'],
      fb:'The circuit is one closed loop: more resistance anywhere means more resistance for the whole loop, so the current falls everywhere at once. Thinking that only the part “after” the change is affected is a common mistake.'},
    q3c:{q:'Remove bulb B2. The other bulbs…',o:['Stay as bright as before','Only the bulbs after B2 go out','All go out'],
      fb:'Removing one bulb breaks the series loop in one place: there is no closed path, so the current stops everywhere.'},
    q4a:{q:'Close K3 to add another branch. The main ammeter A…',o:['Decreases, because the current is shared among more branches','Stays the same, because a cell gives a fixed current','Increases'],
      fb:'A new branch is a new path; the old branches keep their currents and the new one adds its own, so I = I₁ + I₂ + I₃ rises.'},
    q4b:{q:'When another branch is closed, bulb B1 (ideal cell)…',o:['Dims','Stays the same','Gets brighter'],
      fb:'The voltage across each branch is still the cell voltage, so the current through B1 does not change. With a real cell that has internal resistance B1 dims slightly: switch on “internal resistance” to see.'},
    q4c:{q:'Branches with different resistances have voltages that are…',o:['Larger for the larger resistance','Equal','Smaller for the larger resistance'],
      fb:'Both ends of every branch join the same two points (same two potentials), so the branch voltages are equal. What differs is the current: the larger resistance carries less.'},
    q5a:{q:'Two 10 Ω resistors in parallel. The equivalent resistance is…',o:['20 Ω','10 Ω','5 Ω'],
      fb:'1/R = 1/10 + 1/10 = 2/10, so R = 5 Ω. Two identical paths make it twice as easy for the current. Try R₁ = R₂ = 10 Ω in Parallel mode.'},
    q5b:{q:'Add another resistor in parallel. The equivalent resistance…',o:['Increases','Decreases','Stays the same'],

function onTap(v,fn){ let st=null; v.cv.addEventListener('pointerdown',e=>{ st={x:e.clientX,y:e.clientY,t:performance.now()}; });
  v.cv.addEventListener('pointerup',e=>{ if(!st) return; const d=Math.hypot(e.clientX-st.x,e.clientY-st.y); if(d<12&&performance.now()-st.t<600) fn(vpos(v,e)); st=null; });
  v.cv.addEventListener('pointercancel',()=>st=null); }
const HR=v=>Math.max(42,24/v.sc);
onTap(V1c,p=>{ const e=K1.hit(p.x,p.y,q=>q.t==='sw',HR(V1c)); if(e){ S1.K=!S1.K; uiVals(); } });
onTap(V3,p=>{ const e=K3.hit(p.x,p.y,q=>q.t==='sw'||q.t==='bulb',HR(V3)); if(!e) return; if(e.t==='sw') S3.K=!S3.K; else { const i=+e.id.slice(1)-1; S3.rm[i]=!S3.rm[i]; } uiVals(); });
onTap(V4,p=>{ const e=K4.hit(p.x,p.y,q=>q.t==='sw',HR(V4)); if(!e) return; if(e.id==='K') S4.K=!S4.K; else { const i=+e.id.slice(1)-1; S4.Kb[i]=!S4.Kb[i]; } uiVals(); });
onTap(V6,p=>{ const e=K6.hit(p.x,p.y,q=>q.t==='sw',HR(V6)); if(!e) return; if(S6.sub==='bright') S6.K=!S6.K; else if(S6.sub==='house'){ const i=+e.id.slice(1)-1; S6.Kh[i]=!S6.Kh[i]; } uiVals(); });
(function(){ const v=V2; let tap=null;
  v.cv.addEventListener('pointerdown',e=>{ const p=vpos(v,e); let best=null,bd=Math.max(40,26/v.sc);
    for(const k of ['r','k']){ const q=S2.pr[k], L=probeLoc(q), x=L?L.x:q.x, y=L?L.y:q.y, d=Math.hypot(p.x-x,p.y-y); if(d<bd){ bd=d; best=k; } }
    if(best){ S2.drag=best; v.cv.setPointerCapture(e.pointerId); e.preventDefault(); } else tap={x:e.clientX,y:e.clientY}; });
  v.cv.addEventListener('pointermove',e=>{ if(!S2.drag) return; const p=vpos(v,e); S2.pr[S2.drag].x=clamp(p.x,10,990); S2.pr[S2.drag].y=clamp(p.y,10,590); });
  const end=e=>{ if(S2.drag){ const q=S2.pr[S2.drag], L=K2.locate(q.x,q.y,46); if(L){ q.x=L.x; q.y=L.y; } S2.drag=null; }
    else if(tap&&e.type==='pointerup'&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<12){ const p=vpos(v,e); const s=K2.hit(p.x,p.y,q=>q.t==='sw',HR(v)); if(s){ S2.K=!S2.K; uiVals(); } } tap=null; };
  v.cv.addEventListener('pointerup',end); v.cv.addEventListener('pointercancel',end); })();
