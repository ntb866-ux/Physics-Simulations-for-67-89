<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cảm ứng điện từ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Phòng thí nghiệm cảm ứng điện từ (KHTN 9): dải video thực tế, sân khấu canvas bên trái, sổ ghi chép bên phải. Điện thoại xếp một cột.
   Cùng hệ màu, phông với bộ mô phỏng KHTN 6–9. */
:root{
  --bg:#edf0f3; --panel:#ffffff; --lane:#f4f6f9; --ink:#141c26; --muted:#556170; --line:#c9d1db;
  --accent:#1d5fa8; --accent-ink:#ffffff; --ok:#1d8a4b; --warn:#c2410c;
  --force:#d1323b; --vel:#1f6fd1; --nPole:#d1323b; --sPole:#1f6fd1; --copper:#c0702a; --copper2:#8a4a17;
  --fieldc:#8d99ab; --fieldhi:#e07b00; --metal:#8b96a3; --metal2:#5b6673; --space:#0d1626; --star:#e9eef7;
  --gold:#c99a2e; --ledR:#ef2b2b; --ledG:#16a34a; --heat:#e4572e; --water:#7fb7e8;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --panel:#161e28; --lane:#111821; --ink:#e3e9f0; --muted:#97a3b2; --line:#2a3644;
  --accent:#5ea6ec; --accent-ink:#04182c; --ok:#47c47d; --warn:#f08a4b;
  --force:#ff5f67; --vel:#5aa2ff; --nPole:#f0535b; --sPole:#4b8fe8; --copper:#e08a3c; --copper2:#b06a2a;
  --fieldc:#6c7889; --fieldhi:#ffa630; --metal:#7c8794; --metal2:#a9b4c1; --space:#060a12; --star:#cfd8e6;
  --gold:#e0b24a; --ledR:#ff4d4d; --ledG:#3ddc7a; --heat:#ff7a50; --water:#3f7fb8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --panel:#161e28; --lane:#111821; --ink:#e3e9f0; --muted:#97a3b2; --line:#2a3644;
  --accent:#5ea6ec; --accent-ink:#04182c; --ok:#47c47d; --warn:#f08a4b;
  --force:#ff5f67; --vel:#5aa2ff; --nPole:#f0535b; --sPole:#4b8fe8; --copper:#e08a3c; --copper2:#b06a2a;
  --fieldc:#6c7889; --fieldhi:#ffa630; --metal:#7c8794; --metal2:#a9b4c1; --space:#060a12; --star:#cfd8e6;
  --gold:#e0b24a; --ledR:#ff4d4d; --ledG:#3ddc7a; --heat:#ff7a50; --water:#3f7fb8;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(25px,3.4vw,36px);line-height:1.15;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
.btn{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{min-height:40px;padding:4px 12px;font-size:14px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg .btn{border:0;border-radius:0;min-width:52px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-size:15px;font-weight:600;white-space:nowrap;min-height:46px;padding:8px 14px;border:0;border-bottom:3px solid transparent;
  background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.req{margin:0;font-size:14px;color:var(--muted);max-width:110ch}
.req b{color:var(--ink);font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:1020px){.lab{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0}
canvas{display:block;width:100%;border-radius:8px;background:var(--lane);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hint{margin:0;font-size:14px;color:var(--muted)}
.status{margin:0;font-weight:600;min-height:1.5em}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:6px;vertical-align:middle}
.sl{display:flex;flex-direction:column;gap:4px}
.sl .top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.sl .val{font-family:var(--font-num);font-weight:600;text-align:right}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);margin:0}
.kv{display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:4px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.kv dd{white-space:nowrap}.kv dd.t{font-family:var(--font-ui);font-weight:600;white-space:normal;grid-column:1/-1;text-align:left;margin:-2px 0 4px 12px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts .btn{text-align:left;font-size:14px}
.opts .btn.picked{border:2px solid var(--accent)}
.opts .btn.right{background:color-mix(in srgb,var(--ok) 18%,var(--panel));border-color:var(--ok)}
.ans{background:var(--lane);border-left:4px solid var(--ok);padding:8px 12px;border-radius:6px;font-size:15px}
.muted{color:var(--muted);font-size:14px}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:0 14px}
details[open]{padding-bottom:12px}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;font-size:15px}
details p,details ul,details ol{margin:6px 0;font-size:15px;max-width:95ch}
details ul,details ol{padding-left:22px}
details li{margin:3px 0}
.fine{font-size:13px;color:var(--muted);margin:0}
.tblwrap{overflow-x:auto}
table.log{border-collapse:collapse;width:100%;font-size:14px}
table.log th,table.log td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.log th{color:var(--muted);font-weight:600}
table.log tr.sel td{background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
table.log td.case{cursor:pointer;font-weight:600}
.yn{display:flex;gap:4px}
.yn .btn{min-height:40px;padding:4px 10px;font-size:14px;min-width:54px}
.yn .btn.picked{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--warn);font-weight:700}
.big{font-family:var(--font-num);font-size:clamp(26px,4vw,40px);font-weight:600;line-height:1.1}
.zones{display:flex;flex-direction:column;gap:4px}
.zone{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px}
.zone b{font-family:var(--font-num)}
.zone.on{border:2px solid var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--panel))}
.warnbox{border-left:4px solid var(--warn);background:var(--lane);padding:8px 12px;border-radius:6px;font-size:15px;margin:0}
/* Dải video thực tế: thumbnail bấm là phát ngay trong trang */
.vbox{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;align-items:start;background:var(--space);color:var(--star);border-radius:var(--r);padding:12px}
.vbox.playing{grid-template-columns:minmax(0,1fr)}
@media (max-width:720px){.vbox{grid-template-columns:minmax(0,1fr)}}
.vmedia{position:relative;width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#1e2c44,#0b111c)}
.vbox.playing .vmedia{max-width:860px}
.thumb{all:unset;cursor:pointer;position:absolute;inset:0;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;left:10px;bottom:8px;font-size:13px;opacity:.75}
.thumb .pbtn{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--force);box-shadow:0 2px 12px rgba(0,0,0,.4)}
.thumb .pbtn::before{content:"";position:absolute;left:25px;top:20px;border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #fff}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font:600 13px var(--font-num);padding:2px 6px;border-radius:4px}
.thumb:focus-visible{outline:3px solid var(--star);outline-offset:-3px}
.player{position:absolute;inset:0}
.player video,.player iframe{width:100%;height:100%;border:0;display:block;background:#000}
.vt{display:flex;flex-direction:column;gap:4px;min-width:0}
.vt .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;font-weight:600}
.vt .ttl{font-weight:700;font-size:16px;line-height:1.3}
.vt .look{font-size:14px;opacity:.92}
.vt .src{font-size:12.5px;opacity:.7}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font:inherit;font-size:14px;font-weight:600;min-height:40px;padding:6px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;
  background:transparent;color:var(--star);border:1px solid color-mix(in srgb,var(--star) 45%,transparent)}
.chip.on{background:var(--star);color:var(--space)}
/* Chế độ giáo viên: che số liệu để lớp dự đoán */
body.hideNums .num{filter:blur(7px);user-select:none}
body.hideNums .num:hover{filter:none}
footer{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="hbtns">
      <button class="btn" id="gvBtn" aria-pressed="false" data-i18n="gvBtn"></button>
      <button class="btn" id="langBtn">EN</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="1" data-i18n="tab1"></button>
    <button role="tab" data-tab="2" data-i18n="tab2"></button>
    <button role="tab" data-tab="3" data-i18n="tab3"></button>
    <button role="tab" data-tab="4" data-i18n="tab4"></button>
  </nav>

  <!-- ===================== TAB 1: THÍ NGHIỆM FARADAY ===================== -->
  <section id="t1" class="col">
    <p class="req" data-i18n-html="req1"></p>
    <div class="vbox" id="v1"></div>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint1"></p>
        <canvas id="cv1" aria-label="bar magnet, coil and galvanometer"></canvas>
        <div class="controls">
          <button class="btn primary" id="auto1"></button>
          <button class="btn" id="flip1" data-i18n="flip"></button>
          <button class="btn" id="sw1"></button>
          <button class="btn" id="rst1" data-i18n="reset"></button>
        </div>
        <canvas id="gr1" aria-label="graphs of field lines through the coil and induced current against time"></canvas>
        <div class="legend">
          <span><i style="background:var(--fieldhi)"></i><span data-i18n="lgK"></span></span>
          <span><i style="background:var(--vel)"></i><span data-i18n="lgI"></span></span>
        </div>
        <p class="fine" data-i18n="assume1"></p>
      </div>
      <div class="col">
        <div class="card" id="p1"></div>
        <div class="card"><h2 data-i18n="data"></h2><dl class="kv" id="kv1"></dl></div>
        <div class="card">
          <div class="sl"><div class="top"><span data-i18n="setN"></span><span class="val" id="n1V"></span></div>
            <input type="range" id="n1" min="100" max="1000" step="100" value="400"></div>
          <div><div class="muted" data-i18n="setStr"></div><div class="seg" id="str1"></div></div>
          <div class="sl"><div class="top"><span data-i18n="setSpd"></span><span class="val" id="sp1V"></span></div>
            <input type="range" id="sp1" min="0.05" max="1" step="0.05" value="0.3"></div>
        </div>
        <div class="card" id="p1b"></div>
        <div class="card" id="c1"></div>
      </div>
    </div>
    <details><summary data-i18n="whyT"></summary><div data-i18n-html="why1"></div></details>
    <details><summary data-i18n="misT"></summary><div data-i18n-html="mis1"></div></details>
  </section>

  <!-- ===================== TAB 2: KHI NÀO CÓ DÒNG CẢM ỨNG ===================== -->
  <section id="t2" class="col" hidden>
    <p class="req" data-i18n-html="req2"></p>
    <div class="vbox" id="v2"></div>
    <div class="lab">
      <div class="stage">
        <p class="hint" data-i18n="hint2"></p>
        <p class="status" id="st2"></p>
        <canvas id="cv2" aria-label="scenario: magnet, coil and galvanometer"></canvas>
        <div class="controls">
          <button class="btn primary" id="run2"></button>
          <span class="muted" id="desc2"></span>
        </div>
        <canvas id="gr2" aria-label="graphs of field lines through the coil and induced current"></canvas>
        <div class="legend">
          <span><i style="background:var(--fieldhi)"></i><span data-i18n="lgK"></span></span>
          <span><i style="background:var(--vel)"></i><span data-i18n="lgI"></span></span>
        </div>
        <p class="fine" data-i18n="assume2"></p>
      </div>
      <div class="col">
        <div class="card"><h2 data-i18n="tblT"></h2><div class="tblwrap"><table class="log" id="tb2"></table></div><p class="muted" id="score2"></p></div>
        <div class="card" id="c2"></div>
      </div>
    </div>
    <details><summary data-i18n="whyT"></summary><div data-i18n-html="why2"></div></details>
    <details><summary data-i18n="misT"></summary><div data-i18n-html="mis2"></div></details>
  </section>

  <!-- ===================== TAB 3: MÁY PHÁT ĐIỆN XOAY CHIỀU ===================== -->
  <section id="t3" class="col" hidden>
    <p class="req" data-i18n-html="req3"></p>
    <div class="vbox" id="v3"></div>
    <div class="lab">
      <div class="stage">
        <div class="controls"><div class="seg" id="mode3"></div><div class="seg" id="ring3"></div><div class="seg" id="load3"></div></div>
        <p class="hint" id="hint3"></p>
        <canvas id="cv3" aria-label="AC generator"></canvas>
        <div class="controls">
          <button class="btn primary" id="run3"></button>
          <label class="chk"><input type="checkbox" id="slow3" checked> <span data-i18n="slowLbl"></span></label>
          <span class="muted" id="slowNote3"></span>
        </div>
        <canvas id="gr3" aria-label="oscilloscope trace of voltage against time"></canvas>
        <div class="legend"><span><i style="background:var(--vel)"></i><span data-i18n="lgScope"></span></span></div>
        <p class="fine" id="assume3"></p>
      </div>
      <div class="col">
        <div class="card" id="p3"></div>
        <div class="card"><h2 data-i18n="data"></h2><dl class="kv" id="kv3"></dl></div>
        <div class="card">
          <div class="sl"><div class="top"><span data-i18n="setF"></span><span class="val" id="f3V"></span></div>
            <input type="range" id="f3" min="0" max="7" step="1" value="4"></div>
          <div class="sl"><div class="top"><span data-i18n="setN"></span><span class="val" id="n3V"></span></div>
            <input type="range" id="n3" min="50" max="500" step="50" value="200"></div>
          <div><div class="muted" data-i18n="setStr"></div><div class="seg" id="str3"></div></div>
        </div>
        <div class="card" id="p3b"></div>
        <div class="card" id="c3"></div>
      </div>
    </div>
    <details><summary data-i18n="whyT"></summary><div data-i18n-html="why3"></div></details>
    <details><summary data-i18n="misT"></summary><div data-i18n-html="mis3"></div></details>
  </section>

  <!-- ===================== TAB 4: TÁC DỤNG CỦA DÒNG XOAY CHIỀU ===================== -->
  <section id="t4" class="col" hidden>
    <p class="req" data-i18n-html="req4"></p>
    <div class="vbox" id="v4"></div>
    <div class="lab">
      <div class="stage">
        <div class="seg" id="eff4"></div>
        <p class="hint" id="hint4"></p>
        <div id="sim4">
          <canvas id="cv4" aria-label="direct current and alternating current side by side"></canvas>
          <div class="controls" style="margin-top:10px">
            <button class="btn primary" id="run4"></button>
            <button class="btn" id="rst4" data-i18n="reset4"></button>
            <label class="chk"><input type="checkbox" id="slow4" checked> <span data-i18n="slowLbl"></span></label>
            <span class="muted" id="slowNote4"></span>
          </div>
          <div class="sl" style="margin-top:6px"><div class="top"><span data-i18n="setF4"></span><span class="val" id="f4V"></span></div>
            <input type="range" id="f4" min="0" max="6" step="1" value="6"></div>
          <canvas id="gr4" style="margin-top:8px" aria-label="graph of current and effect against time"></canvas>
          <div class="legend" id="lg4" style="margin-top:6px"></div>
        </div>
        <div id="body4" class="col" hidden>
          <div><div class="muted" data-i18n="bodyU"></div><div class="seg" id="bu4"></div></div>
          <div><div class="muted" data-i18n="bodyR"></div><div class="seg" id="br4"></div></div>
          <div><div class="muted" data-i18n="bodyI"></div><div class="big num" id="bi4"></div></div>
          <div class="zones" id="zones4"></div>
          <p class="warnbox" data-i18n="bodyWarn"></p>
        </div>
        <p class="fine" id="assume4"></p>
      </div>
      <div class="col">
        <div class="card" id="p4"></div>
        <div class="card" id="kvc4"><h2 data-i18n="data"></h2><dl class="kv" id="kv4"></dl></div>
        <div class="card"><h2 data-i18n="exT"></h2><div id="ex4"></div></div>
        <div class="card" id="c4"></div>
      </div>
    </div>
    <details><summary data-i18n="whyT"></summary><div data-i18n-html="why4"></div></details>
    <details><summary data-i18n="misT"></summary><div data-i18n-html="mis4"></div></details>
  </section>

  <details><summary data-i18n="originT"></summary><div data-i18n-html="origin"></div></details>
  <details><summary data-i18n="mediaT"></summary><p data-i18n-html="mediaIntro"></p><div class="tblwrap"><table class="log" id="mediaTbl"></table></div></details>
  <footer data-i18n="footer"></footer>
</div>
<script>
'use strict';
/* ================= Chuỗi song ngữ ================= */
const I18N={vi:{

p1e:'Kim chỉ lệch khi nam châm đang chuyển động, tức là khi số đường sức qua cuộn dây đang tăng. Nam châm nằm yên thì số đường sức qua cuộn dây vẫn nhiều nhưng không đổi, nên không có dòng điện. Nam châm không cần chạm vào dây: từ trường tác dụng qua khoảng không.',

c1q:'Hoàn thành câu: “Trong cuộn dây dẫn kín xuất hiện dòng điện cảm ứng khi …”. Dòng điện cảm ứng lớn hơn khi nào?',
c1a:'… số đường sức từ xuyên qua tiết diện của cuộn dây <b>biến thiên</b> (tăng hoặc giảm). Số đường sức tăng và giảm cho dòng điện ngược chiều nhau. Số đường sức biến thiên <b>càng nhanh</b> (đưa nam châm nhanh hơn, dùng nam châm mạnh hơn) hoặc cuộn dây có <b>nhiều vòng hơn</b> thì dòng điện cảm ứng càng lớn.',
assume1:'Giả thiết mô phỏng: nam châm thẳng dài 10 cm, cảm ứng từ trong lòng nam châm khoảng 0,2 T, coi như hai cực từ ở gần hai đầu. Cuộn dây bán kính 2,8 cm, dài 4 cm, 0,02 Ω mỗi vòng; điện kế 50 Ω, thang đo ±1 mA, kim có quán tính. Bỏ qua độ tự cảm của cuộn dây. Mỗi đường sức vẽ ra ứng với cùng một lượng từ trường, nên số đường sức đếm được tỉ lệ với từ thông.',
why1:`<p><b>Cơ chế (định luật cảm ứng Faraday, 1831).</b> Đại lượng đo “lượng đường sức đi qua cuộn dây” gọi là từ thông Φ = B·S·cos α (đơn vị Wb, học kĩ ở lớp 11). Khi từ thông qua cuộn dây có N vòng biến thiên, trong cuộn dây xuất hiện suất điện động cảm ứng e = −N·ΔΦ/Δt. Nếu mạch kín, suất điện động này đẩy các electron tự do trong dây chuyển động thành dòng điện i = e/R.</p>
<p>Dấu “−” là <b>định luật Lenz</b>: dòng cảm ứng có chiều sao cho từ trường của nó chống lại sự biến thiên đã sinh ra nó. Đưa cực N lại gần thì đầu cuộn dây phía nam châm trở thành cực N để đẩy nam châm ra; rút ra thì nó thành cực S để níu lại. Vì vậy phải tốn công để đẩy nam châm: cơ năng của tay biến thành điện năng, không có năng lượng nào “tự sinh ra”.</p>
<p><b>Nói cho học sinh:</b> Cuộn dây kín giống một người gác cổng chỉ để ý xem <i>số đường sức đi qua cổng có đang thay đổi không</i>. Thêm đường sức hay bớt đường sức, nó đều “phản ứng” bằng một dòng điện, thêm và bớt thì dòng chạy ngược chiều nhau. Đường sức nhiều mà đứng yên thì nó không phản ứng. Thay đổi càng nhanh, phản ứng càng mạnh.</p>`,
mis1:`<ul><li><b>“Có nam châm trong cuộn dây là có dòng điện.”</b> Sai: nam châm nằm yên thì kim về 0. Phải có sự <i>thay đổi</i> số đường sức.</li>
<li><b>“Nam châm càng nằm sâu trong cuộn dây, dòng càng lớn.”</b> Sai: dòng lớn khi số đường sức thay đổi <i>nhanh</i>, thường là lúc nam châm đang đi qua miệng cuộn dây. Ở giữa cuộn dây số đường sức nhiều nhất nhưng gần như không đổi.</li>
<li><b>“Dòng điện có sẵn trong nam châm, chạy sang dây.”</b> Sai: nam châm không có dòng điện chạy ra; electron tự do có sẵn trong dây đồng bị từ trường biến thiên làm cho chuyển động.</li>
<li><b>“Nam châm phải chạm vào dây.”</b> Sai: từ trường tác dụng qua khoảng không.</li></ul>`,

c2q:'Dựa vào bảng: dòng điện cảm ứng xuất hiện khi nào? Vì sao tình huống 3 và 6 có chuyển động mà vẫn không có dòng điện?',
c2a:'Dòng điện cảm ứng chỉ xuất hiện khi có đủ hai điều kiện: <b>mạch kín</b> và <b>số đường sức từ qua tiết diện cuộn dây biến thiên</b>. Không quan trọng cái gì chuyển động, hay có chuyển động hay không (tình huống 5 không có gì chuyển động mà vẫn có dòng). Ở tình huống 3 và 6, số đường sức qua cuộn dây không đổi nên không có dòng điện. Ở tình huống 7, số đường sức có biến thiên nhưng mạch hở nên không có dòng (chỉ có hiệu điện thế giữa hai đầu cuộn dây).',
assume2:'Giả thiết mô phỏng: cùng nam châm, cuộn dây 400 vòng và điện kế như tab 1. Nam châm điện có lõi sắt, tạo từ trường giống nam châm thẳng; dòng qua nó tăng, giảm trong khoảng 0,1 s khi đóng, ngắt công tắc. Khi nam châm quay, từ thông được tính bằng tích phân số trên tiết diện cuộn dây.',
why2:`<p><b>Cơ chế.</b> Định luật Faraday chỉ nói tới <i>tốc độ biến thiên của từ thông</i> ΔΦ/Δt, không nói tới chuyển động. Từ thông Φ = B·S·cos α thay đổi khi B thay đổi (lại gần, ra xa, bật tắt nam châm điện), khi S thay đổi, hoặc khi góc α giữa đường sức và mặt cuộn dây thay đổi (quay nam châm hoặc quay cuộn dây). Nếu vị trí tương đối và từ trường không đổi (cùng chuyển động, quay quanh trục đối xứng) thì Φ không đổi, e = 0.</p>
<p>Tình huống 5 chính là nguyên tắc của <b>máy biến áp</b> (học ở lớp 12): một cuộn dây có dòng thay đổi làm số đường sức qua cuộn dây bên cạnh thay đổi.</p>
<p><b>Nói cho học sinh:</b> Đừng hỏi “có cái gì chuyển động không?”, hãy hỏi “số đường sức qua cuộn dây có đang tăng hay giảm không?”. Có thì có dòng (nếu mạch kín), không thì không.</p>`,
mis2:`<ul><li><b>“Cứ có chuyển động là có dòng điện.”</b> Sai: nam châm và cuộn dây cùng chuyển động, hoặc nam châm quay quanh trục của nó, đều không cho dòng.</li>
<li><b>“Phải có chuyển động mới có dòng.”</b> Sai: đóng, ngắt nam châm điện không cần gì chuyển động.</li>
<li><b>“Mạch hở thì không có gì xảy ra.”</b> Chưa đủ: vẫn có hiệu điện thế cảm ứng giữa hai đầu cuộn dây (vôn kế sẽ chỉ), chỉ là không có dòng điện.</li></ul>`,

c3a:'Cho cuộn dây dẫn kín quay trong từ trường của nam châm, hoặc cho nam châm quay trước cuộn dây, để <b>số đường sức từ qua tiết diện cuộn dây luân phiên tăng, giảm</b>. Khi đó trong cuộn dây xuất hiện dòng điện cảm ứng <b>luân phiên đổi chiều</b> (dòng điện xoay chiều), mỗi vòng quay đổi chiều 2 lần. Quay càng nhanh thì dòng đổi chiều càng nhiều lần mỗi giây (tần số lớn hơn) và hiệu điện thế cực đại càng lớn.',
assume3Coil:'Giả thiết mô phỏng: khung dây {N} vòng, diện tích 20 cm² (4 cm × 5 cm), quay trong từ trường đều B = {B} T, nên u = N·B·S·ω·sin ωt. Hai LED mắc ngược chiều, mỗi đèn cần khoảng 1,8 V mới sáng, nối tiếp điện trở 100 Ω. Điện kế 100 Ω, thang đo ±20 mA, kim có quán tính nên không theo kịp dòng đổi chiều nhanh.',
assume3Mag:'Giả thiết mô phỏng: nam châm thẳng như tab 1 quay quanh tâm; cuộn dây {N} vòng quấn trên lõi sắt, lõi sắt làm số đường sức qua cuộn dây tăng lên nhiều lần (ở đây lấy 500 lần, giá trị minh hoạ). Số đường sức qua cuộn dây được lấy biến đổi theo dạng sin (máy phát thật tạo hình các cực từ để được điều này). Máy phát thật dùng nam châm nhiều cực và lõi thép kĩ thuật điện.',
why3:`<p><b>Cơ chế.</b> Khung dây N vòng, diện tích S quay đều với tốc độ góc ω = 2πf trong từ trường đều B. Góc giữa pháp tuyến của khung và đường sức là α = ωt, nên từ thông Φ = N·B·S·cos ωt. Theo định luật Faraday, u = −ΔΦ/Δt = N·B·S·ω·sin ωt: hiệu điện thế biến đổi theo hình sin, đổi dấu sau mỗi nửa vòng. Giá trị cực đại U₀ = N·B·S·ω tỉ lệ với tốc độ quay.</p>
<p><b>Vành khuyên và chổi than</b> giúp khung quay mà dây nối ra ngoài không bị xoắn; mỗi đầu khung luôn nối với cùng một chổi than nên dòng ra ngoài vẫn đổi chiều. Nếu thay bằng <b>cổ góp</b> (hai nửa vành), cứ nửa vòng hai đầu khung lại đổi chổi than: dòng ra ngoài chỉ một chiều (máy phát một chiều, đinamô cũ).</p>
<p>Máy phát ở nhà máy điện thường để cuộn dây đứng yên (stato) và cho nam châm điện quay (rôto), vì lấy dòng lớn ra từ cuộn dây đứng yên dễ hơn. Tần số f = p·n/60 (p là số cặp cực, n là số vòng quay mỗi phút): tua bin nhiệt điện quay 3000 vòng/phút với 1 cặp cực cho 50 Hz; tua bin thủy điện quay chậm hơn nên rôto có nhiều cặp cực.</p>
<p><b>Nói cho học sinh:</b> Quay khung dây giống như liên tục xoay một cánh cổng trong gió: lúc cổng đón gió nhiều nhất, lúc cổng nằm song song với gió, rồi lại đón gió từ phía bên kia. Số đường sức qua khung lên xuống đều đặn, nên dòng điện chạy tới, chạy lui đều đặn.</p>`,
mis3:`<ul><li><b>“Máy phát điện tạo ra điện từ không.”</b> Sai: máy phát biến cơ năng (nước, hơi nước, gió, sức người) thành điện năng. Lấy càng nhiều điện thì càng khó quay (định luật Lenz).</li>
<li><b>“Dòng điện ở ổ cắm chạy một chiều từ nhà máy tới.”</b> Sai: electron trong dây chỉ dao động tới lui 50 lần mỗi giây, năng lượng truyền đi chứ electron không chạy từ nhà máy về.</li>
<li><b>“Quay nhanh hơn chỉ làm dòng mạnh hơn.”</b> Chưa đủ: quay nhanh hơn còn làm tần số tăng (đổi chiều nhiều lần hơn mỗi giây).</li>
<li><b>“Điện kế kim chỉ 0 nghĩa là không có dòng.”</b> Ở 50 Hz kim không kịp lệch theo dòng đổi chiều nên đứng gần 0, dù dòng vẫn có. Thử kéo tốc độ quay lên 50 Hz với tải là điện kế.</li></ul>`,

hint4heat:'Hai ấm giống nhau, mỗi ấm có 200 g nước và dây đốt 6 Ω. Bên trái nối nguồn một chiều 12 V, bên phải nối nguồn xoay chiều 12 V. Nhiệt độ nước được tua nhanh ×60.',

bodyWarn:'Số liệu ở trên chỉ là ước lượng: điện trở cơ thể thay đổi rất nhiều theo hiệu điện thế, diện tích tiếp xúc, đường đi của dòng điện (theo IEC 60479-1). Điện lưới 220 V có thể gây chết người. Không bao giờ chạm vào dây điện trần, ổ cắm, thiết bị điện khi tay ướt.',
p4heatq:'Hai ấm giống hệt nhau, một nối nguồn một chiều 12 V, một nối nguồn xoay chiều 12 V. Ấm nào nước nóng nhanh hơn?',
p4heata:'Ấm nối nguồn một chiều.',p4heatb:'Ấm nối nguồn xoay chiều.',p4heatc:'Nóng nhanh như nhau.',
p4heate:'Như nhau. Dây đốt nóng lên khi có dòng điện chạy qua, theo chiều nào cũng vậy: công suất p = i²·R luôn dương. “12 V xoay chiều” là giá trị hiệu dụng, được định nghĩa đúng bằng hiệu điện thế một chiều gây ra cùng tác dụng nhiệt. Lúc cực đại, u xoay chiều lên tới 12·√2 ≈ 17 V.',
p4lightq:'Đèn LED nối nguồn xoay chiều 50 Hz trông sáng liên tục. Thật ra nó thế nào?',
p4lighta:'Sáng liên tục như nối nguồn một chiều.',p4lightb:'Tắt, sáng rất nhanh (50 lần mỗi giây), mắt không theo kịp nên thấy sáng liên tục.',p4lightc:'Chỉ sáng một nửa độ sáng nhưng không nhấp nháy.',
p4lighte:'LED chỉ cho dòng đi một chiều, nên chỉ sáng trong nửa chu kì dòng chạy đúng chiều: tắt, sáng 50 lần mỗi giây. Mắt người không nhận ra nhấp nháy nhanh hơn khoảng 50–60 lần mỗi giây. Đèn sợi đốt gần như không nhấp nháy vì dây tóc nóng không kịp nguội. Quay chậm bằng điện thoại sẽ thấy rõ (xem video).',
p4magq:'Đặt một kim nam châm cạnh nam châm điện dùng dòng xoay chiều tần số thấp (2 Hz). Kim nam châm sẽ thế nào?',
p4maga:'Bị hút về một phía và đứng yên, giống như với dòng một chiều.',p4magb:'Dao động qua lại, vì cực của nam châm điện đổi liên tục theo chiều dòng.',p4magc:'Không bị tác dụng gì.',
p4mage:'Dòng xoay chiều đổi chiều thì cực N, S của nam châm điện cũng đổi, nên kim nam châm lúc bị hút, lúc bị đẩy: nó dao động. Còn đinh sắt thì luôn bị hút (sắt bị hút bởi cả cực N lẫn cực S), chỉ lực hút lúc mạnh lúc yếu. Ở 50 Hz kim nam châm quá nặng nên chỉ rung rất nhẹ; đó là tiếng “ù ù” của máy biến áp, chấn lưu.',
p4bodyq:'Cùng chạm vào một chỗ hở điện, khi nào dòng điện qua người lớn hơn?',
p4bodya:'Khi da khô.',p4bodyb:'Khi tay ướt, chân trần đứng trên nền ẩm.',p4bodyc:'Như nhau, vì hiệu điện thế như nhau.',
p4bodye:'Tay ướt, chân trần làm điện trở cơ thể giảm mạnh (khoảng vài chục lần), nên dòng I = U/R tăng mạnh. Vì vậy không được chạm vào thiết bị điện khi tay ướt, khi đang tắm.',
exT:'Ví dụ trong đời sống',
exheat:'<ul><li>Ấm siêu tốc, nồi cơm điện, bình nóng lạnh, bàn là, máy sấy tóc dùng điện xoay chiều 220 V.</li><li>Dây dẫn điện bị nóng khi dùng nhiều thiết bị cùng lúc (tác dụng nhiệt có hại).</li><li>Cầu chì: dây chì nóng chảy, ngắt mạch khi dòng quá lớn.</li></ul>',
exlight:'<ul><li>Bóng đèn sợi đốt: dây tóc nóng tới khoảng 2500 °C thì phát sáng (tác dụng nhiệt dẫn tới phát sáng).</li><li>Đèn LED, đèn huỳnh quang, đèn ống, bút thử điện (đèn nêon sáng khi chạm dây pha).</li><li>Quay chậm đèn đường, đèn trong lớp bằng điện thoại sẽ thấy đèn nhấp nháy.</li></ul>',
exmag:'<ul><li>Chuông điện, rơ-le, cần cẩu điện từ (hút sắt cả với dòng xoay chiều).</li><li>Quạt điện, máy bơm, máy giặt: động cơ điện xoay chiều quay được nhờ tác dụng từ.</li><li>Loa: màng loa rung theo dòng điện xoay chiều. Máy biến áp kêu “ù ù” vì lõi thép rung 100 lần/giây.</li></ul>',
exbody:'<ul><li>Có hại: điện giật khi chạm vào dây pha, ổ cắm hở, thiết bị rò điện.</li><li>Có ích (dòng nhỏ, có kiểm soát): điện châm, máy kích thích cơ trong vật lí trị liệu, máy khử rung tim (sốc điện) ở bệnh viện.</li><li>Bảo vệ: aptomat chống giật (RCD) ngắt điện trong khoảng 0,03 s khi dòng rò từ 30 mA.</li></ul>',
c4q:'Lấy một ví dụ cho mỗi tác dụng của dòng điện xoay chiều. Tác dụng nào phụ thuộc vào chiều dòng điện?',
c4a:'Nhiệt: ấm siêu tốc, bàn là. Phát sáng: bóng đèn, đèn LED. Từ: chuông điện, quạt điện, loa. Sinh lí: điện giật, điện châm. <b>Tác dụng nhiệt và phát sáng không phụ thuộc chiều dòng điện</b>, nên dòng xoay chiều dùng tốt như dòng một chiều. <b>Tác dụng từ phụ thuộc chiều dòng điện</b>: với dòng xoay chiều, cực của nam châm điện đổi liên tục, kim nam châm bị hút đẩy luân phiên (nhưng sắt vẫn luôn bị hút).',
assume4heat:'Giả thiết: dây đốt 6 Ω, 200 g nước (nhiệt dung 840 J/K), hao phí nhiệt 0,5 W/K ra môi trường, bắt đầu từ 25 °C. Công suất trung bình P = U²/R = 24 W ở cả hai bên.',
assume4light:'Giả thiết: đèn sợi đốt 12 V – 5 W (28,8 Ω), dây tóc có quán tính nhiệt khoảng 0,04 s; LED cần 2 V mới sáng, nối tiếp 500 Ω; mắt người “nhòe” ánh sáng trong khoảng 0,04 s.',
assume4mag:'Giả thiết: cuộn dây 24 Ω. Lực hút đinh sắt tỉ lệ i², lực trên kim nam châm tỉ lệ i (đổi dấu theo chiều dòng). Đinh trên lò xo dao động riêng 6 Hz, kim nam châm 2 Hz, có ma sát.',
assume4body:'Giả thiết: I = U/R với R là điện trở cơ thể ước lượng. Các mức tác dụng lấy theo dòng xoay chiều 50 Hz trong IEC 60479-1; dòng một chiều cùng cường độ ít nguy hiểm hơn nhưng vẫn nguy hiểm.',
why4:`<p><b>Cơ chế.</b> Các tác dụng của dòng điện đều do electron chuyển động có hướng trong dây dẫn và từ trường của dòng điện gây ra.</p>
<ul><li><b>Nhiệt:</b> electron va chạm với các ion kim loại, truyền năng lượng làm dây nóng lên. Công suất p = i²R không phụ thuộc chiều của i. Giá trị hiệu dụng I = I₀/√2 được định nghĩa từ tác dụng nhiệt.</li>
<li><b>Phát sáng:</b> dây tóc nóng sáng (do tác dụng nhiệt), hoặc trong LED electron và lỗ trống kết hợp phát ra ánh sáng. LED chỉ dẫn điện một chiều nên với dòng xoay chiều chỉ sáng nửa chu kì.</li>
<li><b>Từ:</b> dòng điện sinh ra từ trường, chiều từ trường theo chiều dòng. Dòng xoay chiều tạo từ trường đổi chiều: vật bằng sắt chưa nhiễm từ bị hút theo cả hai chiều (lực tỉ lệ i²), còn nam châm vĩnh cửu bị hút, đẩy luân phiên (lực tỉ lệ i).</li>
<li><b>Sinh lí:</b> dòng điện qua cơ thể kích thích dây thần kinh và cơ. Dòng 50 Hz kích thích cơ 100 lần mỗi giây nên gây co cơ liên tục (không buông tay ra được) và dễ gây rung tim.</li></ul>
<p><b>Nói cho học sinh:</b> Dòng xoay chiều giống người cưa gỗ: lưỡi cưa đi tới đi lui nhưng vẫn làm gỗ nóng và đứt. Việc “làm nóng”, “làm sáng” không cần dòng chạy một chiều. Chỉ những việc cần biết “chiều nào” (như kim nam châm chỉ hướng) mới bị dòng xoay chiều làm cho dao động qua lại.</p>`,
mis4:`<ul><li><b>“Dòng xoay chiều đổi chiều nên tác dụng triệt tiêu, không làm nóng.”</b> Sai: nhiệt toả ra theo cả hai chiều, cộng dồn lại.</li>
<li><b>“Đèn trong nhà sáng liên tục.”</b> Thật ra nhiều loại đèn nhấp nháy 100 lần mỗi giây, mắt không nhận ra.</li>
<li><b>“Dòng xoay chiều không hút được sắt.”</b> Sai: nam châm điện xoay chiều vẫn hút sắt (chuông điện, rơ-le, cần cẩu).</li>
<li><b>“Điện xoay chiều an toàn hơn vì đổi chiều liên tục.”</b> Sai: dòng 50 Hz đặc biệt nguy hiểm cho tim.</li></ul>`,
/* Chung */
originT:'Nguồn gốc các thuật ngữ',
origin:`<ul><li><b>Cảm ứng</b> (感應): <i>cảm</i> 感 là chịu tác động, <i>ứng</i> 應 là đáp lại, nghĩa là “chịu tác động mà đáp lại”: cuộn dây “đáp lại” sự thay đổi của từ trường bằng dòng điện. Tiếng Anh <i>induction</i>, từ Latinh <i>inducere</i> = <i>in</i> (vào) + <i>ducere</i> (dẫn), nghĩa là “dẫn vào, gây ra”. Faraday dùng từ này năm 1831. Tiếng Pháp <i>induction</i>, tiếng Đức <i>Induktion</i>; tiếng Trung 電磁感應 (điện từ cảm ứng), tiếng Nhật 電磁誘導 <i>denji yūdō</i> (điện từ dụ dẫn).</li>
<li><b>Điện từ</b> (電磁): <i>điện</i> 電 vốn nghĩa là tia chớp; <i>từ</i> 磁 trong <i>từ thạch</i> 磁石, “đá hút sắt”. Tiếng Anh <i>magnet</i> từ Hy Lạp <i>Magnētis lithos</i>, “đá xứ Magnesia”, nơi có nhiều quặng sắt từ; <i>electric</i> từ Hy Lạp <i>ēlektron</i>, “hổ phách”.</li>
<li><b>Xoay chiều</b>: từ thuần Việt, “chiều dòng điện xoay qua xoay lại”. Tiếng Trung 交流電 (giao lưu điện, “dòng chảy qua lại”), viết tắt quốc tế AC. Tiếng Anh <i>alternating current</i>, từ Latinh <i>alternare</i>, “làm luân phiên” (<i>alter</i> = cái kia trong hai cái). Ngược lại là <i>một chiều</i>, 直流 (trực lưu), <i>direct current</i>, DC.</li>
<li><b>Điện kế</b> (galvanometer): đặt theo tên nhà khoa học Ý Luigi Galvani; Ampère gọi dụng cụ này là <i>galvanomètre</i> năm 1820.</li>
<li><b>Máy phát điện</b>: tiếng Anh <i>generator</i>, từ Latinh <i>generare</i>, “sinh ra”. <i>Đinamô</i> (dynamo) từ Hy Lạp <i>dynamis</i>, “sức mạnh”, do Werner von Siemens dùng năm 1867 (<i>dynamoelektrische Maschine</i>).</li>
<li><b>Hiệu dụng</b> (有效, hữu hiệu): “có hiệu quả”, giá trị một chiều gây cùng tác dụng nhiệt. Tiếng Anh <i>effective value</i> hoặc <i>RMS</i> (root mean square, căn trung bình bình phương).</li></ul>`,

p1q:'You quickly push the north (N) pole of the magnet into the coil and then hold it still there. What does the galvanometer needle do?',
p1a:'It deflects and stays deflected as long as the magnet is inside the coil.',p1b:'It deflects while the magnet is moving in, then returns to zero when the magnet stops.',p1c:'It does not move, because the magnet does not touch the wire.',
p1e:'The needle deflects only while the magnet moves, i.e. while the number of field lines through the coil is increasing. When the magnet rests, many lines still pass through the coil but their number does not change, so there is no current. The magnet does not need to touch the wire: the magnetic field acts across empty space.',
p1bq:'Now pull the magnet out at the same speed. How does the needle deflect compared with pushing it in?',
p1ba:'To the same side.',p1bb:'To the opposite side.',p1bc:'It does not deflect.',
p1be:'Pushing in increases the number of field lines through the coil; pulling out decreases it. Increasing and decreasing give currents in opposite directions. Try flipping the magnet too: the deflection reverses.',
c1q:'Complete: “An induced current appears in a closed coil when …”. When is the induced current larger?',
c1a:'… the number of field lines through the coil’s cross-section <b>changes</b> (increases or decreases). Increasing and decreasing give opposite currents. The current is larger when the number changes <b>faster</b> (faster motion, stronger magnet) or the coil has <b>more turns</b>.',
assume1:'Model: 10 cm bar magnet, about 0.2 T inside, treated as two magnetic poles near its ends. Coil radius 2.8 cm, length 4 cm, 0.02 Ω per turn; galvanometer 50 Ω, range ±1 mA, needle has inertia. Coil self-inductance is ignored. Each drawn field line carries the same amount of field, so the number of lines counted is proportional to the magnetic flux.',
why1:`<p><b>Mechanism (Faraday’s law, 1831).</b> The quantity measuring “how many field lines pass through the coil” is the magnetic flux Φ = B·S·cos α (unit Wb, studied in grade 11). When the flux through a coil of N turns changes, an induced emf e = −N·ΔΦ/Δt appears. In a closed circuit this emf drives the free electrons in the wire, giving a current i = e/R.</p>
<p>The minus sign is <b>Lenz’s law</b>: the induced current flows so that its own field opposes the change that produced it. Push an N pole in and the near end of the coil becomes an N pole that repels the magnet; pull it out and that end becomes an S pole that holds it back. You must do work to move the magnet: mechanical energy becomes electrical energy.</p>
<p><b>For students:</b> A closed coil is like a gatekeeper who only cares whether <i>the number of field lines through the gate is changing</i>. More lines or fewer lines, it “reacts” with a current, in opposite directions. Many lines that stay put get no reaction. The faster the change, the stronger the reaction.</p>`,
mis1:`<ul><li><b>“A magnet inside a coil makes a current.”</b> No: a resting magnet gives zero. There must be a <i>change</i>.</li>
<li><b>“The deeper the magnet, the larger the current.”</b> No: the current is large when the number of lines changes <i>quickly</i>, usually as the magnet passes the coil’s mouth.</li>
<li><b>“The current comes out of the magnet.”</b> No: the free electrons are already in the copper wire; the changing field sets them moving.</li>
<li><b>“The magnet must touch the wire.”</b> No: the field acts across space.</li></ul>`,

c2q:'From the table: when does an induced current appear? Why do situations 3 and 6 have motion but no current?',
c2a:'An induced current appears only when <b>the circuit is closed</b> and <b>the number of field lines through the coil changes</b>. It does not matter what moves, or whether anything moves (situation 5 has no motion yet gives a current). In 3 and 6 the number of lines stays the same, so there is no current. In 7 the number changes but the circuit is open: there is a voltage across the coil but no current.',
assume2:'Model: same magnet, 400-turn coil and galvanometer as tab 1. The electromagnet has an iron core and a field like the bar magnet; its current rises and falls in about 0.1 s when switched. For a rotating magnet the flux is found by numerical integration over the coil cross-section.',
why2:`<p><b>Mechanism.</b> Faraday’s law involves only the <i>rate of change of flux</i> ΔΦ/Δt, not motion. Φ = B·S·cos α changes when B changes (approaching, receding, switching an electromagnet), when S changes, or when the angle α changes (rotating magnet or coil). If relative position and field stay the same (moving together, spinning about the symmetry axis), Φ is constant and e = 0.</p>
<p>Situation 5 is the principle of the <b>transformer</b> (grade 12).</p>
<p><b>For students:</b> Don’t ask “is something moving?”, ask “is the number of field lines through the coil going up or down?”.</p>`,
mis2:`<ul><li><b>“Any motion gives a current.”</b> No: moving together, or spinning about its own axis, gives none.</li>
<li><b>“Motion is needed.”</b> No: switching an electromagnet needs no motion.</li>
<li><b>“Nothing happens in an open circuit.”</b> Not quite: there is still an induced voltage across the coil, just no current.</li></ul>`,

p3e:'As the coil turns, the number of lines through it rises and falls (and even enters from the other face). Rising and falling give opposite currents, so the current keeps reversing: alternating current. The magnet is still, but the angle between the lines and the coil keeps changing.',

p3be:'Twice: each cycle on the graph has a positive half and a negative half. Mains in Vietnam is 50 Hz, so household current reverses 100 times every second.',
c3q:'State the principle for producing alternating current. What happens when the coil turns faster?',
c3a:'Turn a closed coil in a magnet’s field, or turn a magnet near a coil, so that <b>the number of field lines through the coil rises and falls in turn</b>. An induced current that <b>keeps reversing</b> appears (alternating current), reversing twice per turn. Faster turning gives more reversals per second (higher frequency) and a larger peak voltage.',
assume3Coil:'Model: coil of {N} turns, area 20 cm² (4 cm × 5 cm), in a uniform field B = {B} T, so u = N·B·S·ω·sin ωt. The two LEDs face opposite ways, each needing about 1.8 V, in series with 100 Ω. Galvanometer 100 Ω, range ±20 mA; its needle has inertia and cannot follow fast reversals.',
assume3Mag:'Model: the tab 1 bar magnet spins about its centre; the {N}-turn coil is wound on an iron core, which multiplies the field lines through it many times (500 here, illustrative). The flux through the coil is taken to vary as a sine (real generators shape their poles to achieve this). Real generators use multi-pole magnets and laminated steel cores.',
why3:`<p><b>Mechanism.</b> A coil of N turns and area S turns at angular speed ω = 2πf in a uniform field B. The angle between its normal and the field is α = ωt, so Φ = N·B·S·cos ωt and u = −ΔΦ/Δt = N·B·S·ω·sin ωt: a sine wave that changes sign every half turn, with peak U₀ = N·B·S·ω proportional to rotation speed.</p>
<p><b>Slip rings and brushes</b> let the coil turn without twisting the leads; each end always touches the same brush, so the output still alternates. With a <b>commutator</b> (split ring) the ends swap brushes every half turn and the output flows one way only (a DC dynamo).</p>
<p>Power-station generators keep the coils still (stator) and spin an electromagnet (rotor). Frequency f = p·n/60 (p pole pairs, n rpm): steam turbines spin at 3000 rpm with one pole pair for 50 Hz; slower hydro turbines use many pole pairs.</p>
<p><b>For students:</b> Turning the coil is like turning a gate in the wind: it catches the most wind, then lies edge-on, then catches wind from the other side. Field lines through the coil rise and fall steadily, so the current flows forwards and backwards steadily.</p>`,
mis3:`<ul><li><b>“A generator makes electricity from nothing.”</b> No: it turns mechanical energy into electrical energy. The more current you draw, the harder it is to turn (Lenz’s law).</li>
<li><b>“Mains current flows one way from the power station.”</b> No: electrons only jiggle back and forth 50 times a second; energy travels, not the electrons.</li>
<li><b>“Turning faster only makes the current stronger.”</b> It also raises the frequency.</li>
<li><b>“A needle at zero means no current.”</b> At 50 Hz the needle cannot follow, so it stays near zero although current flows. Try 50 Hz with the galvanometer.</li></ul>`,

p4heatq:'Two identical kettles: one on 12 V DC, one on 12 V AC. Which heats faster?',
p4heata:'The DC kettle.',p4heatb:'The AC kettle.',p4heatc:'Both the same.',
p4heate:'The same. The heater warms whichever way the current flows: p = i²·R is always positive. “12 V AC” is the rms value, defined as the DC voltage with the same heating effect. At its peak the AC voltage reaches 12·√2 ≈ 17 V.',
p4lightq:'An LED on 50 Hz AC looks steadily lit. What is really happening?',
p4lighta:'It is lit steadily, as on DC.',p4lightb:'It switches off and on very fast (50 times a second); the eye cannot follow.',p4lightc:'It glows at half brightness without flickering.',
p4lighte:'An LED conducts one way only, so it lights only during the half cycle in the right direction: off and on 50 times a second. Our eyes cannot see flicker faster than about 50–60 Hz. A filament bulb hardly flickers because its hot filament cannot cool quickly. A slow-motion phone video shows it clearly.',
p4magq:'A compass needle sits next to an electromagnet on low-frequency AC (2 Hz). What does it do?',
p4maga:'It is pulled to one side and stays, as with DC.',p4magb:'It swings back and forth, because the electromagnet’s poles keep swapping.',p4magc:'Nothing.',
p4mage:'When the current reverses, the electromagnet’s N and S poles swap, so the compass needle is attracted then repelled: it oscillates. An iron nail is always attracted (iron is pulled by either pole); only the strength pulses. At 50 Hz the needle is too heavy and only trembles; this is the hum of transformers.',

p4bodya:'With dry skin.',p4bodyb:'With wet hands and bare feet on a damp floor.',p4bodyc:'The same, since the voltage is the same.',
p4bodye:'Wet skin and bare feet lower the body’s resistance many times, so I = U/R rises sharply. Never touch electrical devices with wet hands or while bathing.',
exT:'Everyday examples',
exheat:'<ul><li>Electric kettles, rice cookers, water heaters, irons and hair dryers run on 220 V AC.</li><li>Wires get warm when many appliances run at once (an unwanted heating effect).</li><li>Fuses: the fuse wire melts and breaks the circuit when the current is too large.</li></ul>',
exlight:'<ul><li>Filament bulbs: the filament reaches about 2500 °C and glows.</li><li>LED lamps, fluorescent tubes, neon tester screwdrivers.</li><li>Film street lights or classroom lights in slow motion with a phone and you can see them flicker.</li></ul>',
exmag:'<ul><li>Electric bells, relays, electromagnetic cranes (they attract iron on AC too).</li><li>Fans, pumps, washing machines: AC motors turn because of the magnetic effect.</li><li>Loudspeakers vibrate with AC. Transformers hum because their cores vibrate 100 times a second.</li></ul>',
exbody:'<ul><li>Harmful: electric shock from live wires, exposed sockets, faulty appliances.</li><li>Useful (small, controlled currents): electro-acupuncture, muscle stimulators in physiotherapy, defibrillators in hospitals.</li><li>Protection: residual-current devices cut the power within about 0.03 s when 30 mA leaks.</li></ul>',
c4q:'Give one example of each effect of AC. Which effect depends on the current’s direction?',
c4a:'Heating: kettle, iron. Lighting: bulbs, LEDs. Magnetic: bells, fans, loudspeakers. Physiological: electric shock, electro-acupuncture. <b>Heating and lighting do not depend on direction</b>, so AC works as well as DC. <b>The magnetic effect does</b>: with AC the electromagnet’s poles keep swapping and a compass needle is pushed and pulled in turn (but iron is still always attracted).',
assume4heat:'Model: 6 Ω heater, 200 g water (heat capacity 840 J/K), heat loss 0.5 W/K, starting at 25 °C. Average power P = U²/R = 24 W on both sides.',
assume4light:'Model: 12 V 5 W filament bulb (28.8 Ω) with about 0.04 s thermal lag; LED needs 2 V, in series with 500 Ω; the eye blends light over about 0.04 s.',
assume4mag:'Model: 24 Ω coil. Force on the nail ∝ i², force on the compass needle ∝ i (reverses with current). Nail on spring has a natural frequency of 6 Hz, needle 2 Hz, both damped.',
assume4body:'Model: I = U/R with an estimated body resistance. Effect levels are for 50 Hz AC from IEC 60479-1; DC of the same size is less dangerous but still dangerous.',
why4:`<p><b>Mechanism.</b> All effects of current come from electrons drifting through the conductor and from the magnetic field of the current.</p>
<ul><li><b>Heating:</b> electrons collide with metal ions and pass on energy. Power p = i²R does not depend on the sign of i. The rms value I = I₀/√2 is defined by the heating effect.</li>
<li><b>Lighting:</b> a filament glows when hot, or in an LED electrons and holes recombine and emit light. An LED conducts one way, so on AC it lights for half of each cycle.</li>
<li><b>Magnetic:</b> current creates a magnetic field whose direction follows the current. AC gives a reversing field: unmagnetised iron is attracted either way (force ∝ i²), a permanent magnet is pulled and pushed in turn (force ∝ i).</li>
<li><b>Physiological:</b> current through the body stimulates nerves and muscles. 50 Hz stimulates them 100 times a second, causing sustained contraction (cannot let go) and easily triggering fibrillation.</li></ul>
<p><b>For students:</b> AC is like sawing wood: the saw goes back and forth, yet the wood still heats up and is cut. Heating and lighting do not need one-way current. Only jobs that care about direction, like a compass needle pointing, are made to swing back and forth by AC.</p>`,
mis4:`<ul><li><b>“AC reverses, so its effects cancel and it does not heat.”</b> No: heat is released in both directions and adds up.</li>
<li><b>“Lights at home shine continuously.”</b> Many flicker 100 times a second without us noticing.</li>
<li><b>“AC cannot attract iron.”</b> No: AC electromagnets attract iron (bells, relays, cranes).</li>
<li><b>“AC is safer because it keeps reversing.”</b> No: 50 Hz current is especially dangerous to the heart.</li></ul>`,
originT:'Where the terms come from',
origin:`<ul><li><b>Cảm ứng</b> (感應, “induction”): <i>cảm</i> = to be affected, <i>ứng</i> = to respond. English <i>induction</i> from Latin <i>inducere</i> = <i>in</i> (into) + <i>ducere</i> (to lead): “to lead in, bring about”, used by Faraday in 1831. French <i>induction</i>, German <i>Induktion</i>; Chinese 電磁感應, Japanese 電磁誘導 <i>denji yūdō</i>.</li>
<li><b>Điện từ</b> (電磁, electromagnetic): 電 originally “lightning”; 磁 as in 磁石 “iron-attracting stone”. English <i>magnet</i> from Greek <i>Magnētis lithos</i>, “stone of Magnesia”; <i>electric</i> from Greek <i>ēlektron</i>, “amber”.</li>
<li><b>Xoay chiều</b> (alternating): native Vietnamese, “direction turning back and forth”. Chinese 交流電 (“current flowing to and fro”). English <i>alternating</i> from Latin <i>alternare</i>, “to do by turns” (<i>alter</i> = the other of two). Opposite: <i>một chiều</i>, 直流, direct current.</li>
<li><b>Galvanometer</b>: named after Luigi Galvani; Ampère coined <i>galvanomètre</i> in 1820.</li>
<li><b>Generator</b> from Latin <i>generare</i>, “to beget”. <i>Dynamo</i> from Greek <i>dynamis</i>, “power”, used by Werner von Siemens in 1867.</li>
<li><b>Hiệu dụng</b> (有效, effective): the DC value with the same heating effect; English <i>effective</i> or <i>RMS</i> (root mean square).</li></ul>`,

<script>
'use strict';
/* ================= Tiện ích ================= */
const $=id=>document.getElementById(id);
let lang='vi';
const T=k=>{const v=I18N[lang][k];return v!=null?v:(I18N.vi[k]!=null?I18N.vi[k]:k);};
const Tf=(k,o)=>T(k).replace(/\{(\w+)\}/g,(_,n)=>o[n]);
const nf=(x,d=2,mn=0)=>{if(!isFinite(x))x=0;if(Math.abs(x)<0.5*Math.pow(10,-d))x=0;return new Intl.NumberFormat(lang==='vi'?'vi-VN':'en-US',{maximumFractionDigits:d,minimumFractionDigits:mn}).format(x);};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const TAU=Math.PI*2;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let CS={};
function readColors(){const s=getComputedStyle(document.documentElement);
  ['bg','panel','lane','ink','muted','line','accent','ok','warn','force','vel','nPole','sPole','copper','copper2','fieldc','fieldhi','metal','metal2','space','star','gold','ledR','ledG','heat','water']
  .forEach(k=>CS[k]=s.getPropertyValue('--'+k).trim());}
readColors();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);}catch(e){}
const isPhone=()=>innerWidth<640;
function fit(cv,asp){const w=Math.max(260,cv.clientWidth|0);const h=Math.round(w*asp);const d=Math.min(2.5,window.devicePixelRatio||1);
  if(cv._w!==w||cv._h!==h||cv._d!==d){cv.width=Math.round(w*d);cv.height=Math.round(h*d);cv.style.height=h+'px';cv._w=w;cv._h=h;cv._d=d;}
  const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);return{c,w,h};}
function mkView(w,h,x0,x1,ycF){const S=w/(x1-x0),yc=h*ycF;return{S,w,h,p:(x,y)=>[(x-x0)*S,yc-y*S],wx:X=>X/S+x0,wy:Y=>(yc-Y)/S};}
function arrowHead(c,x,y,ang,sz,col){c.save();c.translate(x,y);c.rotate(ang);c.fillStyle=col;c.beginPath();c.moveTo(sz,0);c.lineTo(-sz*.7,sz*.6);c.lineTo(-sz*.7,-sz*.6);c.closePath();c.fill();c.restore();}
function txt(c,s,x,y,o={}){c.font=`${o.w||600} ${o.sz||13}px ${o.mono?'"IBM Plex Mono",monospace':'"Be Vietnam Pro",system-ui,sans-serif'}`;c.fillStyle=o.col||CS.ink;c.textAlign=o.al||'center';c.textBaseline=o.bl||'middle';c.fillText(s,x,y);}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function seg(id,items,cur,pick){const el=$(id);el.innerHTML='';items.forEach(it=>{const b=document.createElement('button');b.className='btn';b.textContent=it.label;
  b.setAttribute('aria-pressed',String(it.k===cur));b.onclick=()=>pick(it.k);el.appendChild(b);});}

/* Đồ thị theo thời gian: series = [{d:[[t,v],...], col, w, dash}] */
function plot(c,x,y,w,h,o){const {t0,t1,ymin,ymax}=o;
  c.save();c.fillStyle=CS.panel;c.fillRect(x,y,w,h);c.strokeStyle=CS.line;c.lineWidth=1;c.strokeRect(x+.5,y+.5,w-1,h-1);
  const X=t=>x+(t-t0)/(t1-t0)*w,Y=v=>y+h-(v-ymin)/(ymax-ymin)*h;
  if(ymin<0&&ymax>0){c.strokeStyle=CS.muted;c.globalAlpha=.6;c.beginPath();c.moveTo(x,Y(0));c.lineTo(x+w,Y(0));c.stroke();c.globalAlpha=1;}
  c.beginPath();c.rect(x,y,w,h);c.clip();
  for(const s of o.series){if(!s.d.length)continue;c.strokeStyle=s.col;c.lineWidth=s.w||2;c.setLineDash(s.dash||[]);c.beginPath();
    let first=true;for(const [t,v] of s.d){if(t<t0-1e-9)continue;const px=X(t),py=Y(clamp(v,ymin-(ymax-ymin),ymax+(ymax-ymin)));first?c.moveTo(px,py):c.lineTo(px,py);first=false;}c.stroke();}
  c.setLineDash([]);c.restore();
  txt(c,o.ylab||'',x+6,y+12,{al:'left',sz:12,col:CS.muted});
  if(o.xlab)txt(c,o.xlab,x+w-6,y+h-10,{al:'right',sz:12,col:CS.muted});
  if(o.ytick){txt(c,o.ytick[0],x-4,Y(ymax),{al:'right',sz:11,col:CS.muted,mono:1,bl:'top'});txt(c,o.ytick[1],x-4,Y(ymin),{al:'right',sz:11,col:CS.muted,mono:1,bl:'bottom'});}
  return{X,Y};}

/* ================= Mô hình nam châm thẳng và cuộn dây ================= */
/* Nam châm: hai cực từ điểm cách tâm lp; q = μ0·(cường độ cực) tính theo Wb. Cuộn dây đồng trục bán kính a. */
const MAG={hl:0.05,ht:0.009,lp:0.042,q0:4e-5};
const COIL={a:0.028,l:0.04,r1:0.02,rg:50,iFS:1e-3};
const PHI_UNIT=MAG.q0/16;              // từ thông ứng với một đường sức vẽ ra (8 đường mỗi nửa ở độ mạnh "Vừa")
const NH={0.5:4,1:8,1.5:12};
const g=(d,a)=>d/Math.sqrt(d*d+a*a);
function fluxAxial(X,xm,dir,q){const xN=xm+dir*MAG.lp,xS=xm-dir*MAG.lp;return q/2*(g(X-xS,COIL.a)-g(X-xN,COIL.a));}
const NR=16,NPH=32;
function fluxPole(X,px,py,q){const a=COIL.a,dx=X-px,dr=a/NR,dph=Math.PI/NPH;let s=0;
  for(let i=0;i<NR;i++){const r=(i+.5)*dr;for(let j=0;j<NPH;j++){const ph=(j+.5)*dph,yy=r*Math.cos(ph)-py,zz=r*Math.sin(ph);
    s+=dx/Math.pow(dx*dx+yy*yy+zz*zz,1.5)*r;}}
  return q/(4*Math.PI)*2*s*dr*dph;}
function fluxGeneral(X,xm,ym,ang,q){const c=Math.cos(ang),s=Math.sin(ang);
  return fluxPole(X,xm+c*MAG.lp,ym+s*MAG.lp,q)-fluxPole(X,xm-c*MAG.lp,ym-s*MAG.lp,q);}
/* Đường sức trong hệ quy chiếu nam châm (cực N ở +x); gieo đều theo từ thông để số đường tỉ lệ từ thông */
function bF(x,y){const dxN=x-MAG.lp,dxS=x+MAG.lp;const rN=Math.pow(dxN*dxN+y*y,1.5)+1e-12,rS=Math.pow(dxS*dxS+y*y,1.5)+1e-12;return[dxN/rN-dxS/rS,y/rN-y/rS];}
const LINES={};
function getLines(n){if(LINES[n])return LINES[n];const out=[];
  for(let i=0;i<n;i++){const th=Math.acos(1-(2*i+1)/n);let x=MAG.lp+0.002*Math.cos(th),y=0.002*Math.sin(th);const pts=[];let left=false;
    for(let k=0;k<5000;k++){const inM=Math.abs(x)<MAG.hl&&Math.abs(y)<MAG.ht;
      if(!inM){left=true;pts.push(x,y);}else if(left)break;
      if(Math.hypot(x+MAG.lp,y)<0.0025||Math.abs(x)>1.2||Math.abs(y)>0.8)break;
      const ds=0.0012+0.012*Math.hypot(x,y);
      let [bx,by]=bF(x,y),m=Math.hypot(bx,by)||1;const mx=x+bx/m*ds/2,my=y+by/m*ds/2;[bx,by]=bF(mx,my);m=Math.hypot(bx,by)||1;x+=bx/m*ds;y+=by/m*ds;}
    out.push(pts);}
  /* đường sức trong lòng nam châm: từ S sang N */
  const inner=[];for(let k=0;k<2*n;k++){const y=MAG.ht*.85*((k+.5)/(2*n)*2-1);inner.push([-MAG.hl,y,MAG.hl,y]);}
  return LINES[n]={out,inner};}

/* Vẽ đường sức của nam châm (hoặc nam châm điện) đặt tại S.xm, góc S.ang; tô cam các đường cắt mặt phẳng giữa cuộn dây trong tiết diện */
function drawField(c,V,xm,ym,ang,n,alpha,coilX){if(alpha<=0.02)return;const L=getLines(n),ca=Math.cos(ang),sa=Math.sin(ang);
  const W=(px,py)=>[xm+ca*px-sa*py,ym+sa*px+ca*py];
  const one=(pts,sgn,thin)=>{let hit=false,px0,py0;const P=[];
    for(let k=0;k<pts.length;k+=2){const [wx,wy]=W(pts[k],pts[k+1]*sgn);
      if(k&&coilX!=null&&(px0-coilX)*(wx-coilX)<=0&&Math.abs((py0+wy)/2)<COIL.a)hit=true;px0=wx;py0=wy;P.push(V.p(wx,wy));}
    if(P.length<2)return;c.beginPath();c.moveTo(P[0][0],P[0][1]);for(let k=1;k<P.length;k++)c.lineTo(P[k][0],P[k][1]);
    const col=hit?CS.fieldhi:CS.fieldc;c.strokeStyle=col;c.globalAlpha=alpha*(hit?1:thin?.45:.75);c.lineWidth=hit?2.4:thin?1:1.3;c.stroke();
    if(!thin){const m=Math.floor(P.length*.5);if(m>0&&m<P.length){const a=Math.atan2(P[m][1]-P[m-1][1],P[m][0]-P[m-1][0]);arrowHead(c,P[m][0],P[m][1],a,hit?6:5,col);}}};
  for(const s of [1,-1])for(const pts of L.out)one(pts,s,false);
  for(const r of L.inner)one(r,1,true);
  c.globalAlpha=1;}

function drawCoil(c,V,xc,half,label){/* half: 'back' hoặc 'front' */const n=11,a=COIL.a,l=COIL.l,rx=Math.max(3,0.006*V.S);
  for(let j=0;j<n;j++){const [X,Y]=V.p(xc-l/2+l*j/(n-1),0);c.beginPath();
    if(half==='back')c.ellipse(X,Y,rx,a*V.S,0,-Math.PI/2,Math.PI/2);else c.ellipse(X,Y,rx,a*V.S,0,Math.PI/2,Math.PI*1.5);
    c.strokeStyle=half==='back'?CS.copper2:CS.copper;c.lineWidth=half==='back'?2:3.2;c.stroke();}
  if(half==='front'&&label){const [X,Y]=V.p(xc,-a);txt(c,label,X,Y+16,{sz:12,col:CS.muted});}}

function drawMagnet(c,V,xm,ym,ang,spin,alpha=1){const ca=Math.cos(ang),sa=Math.sin(ang);c.save();const [X,Y]=V.p(xm,ym);c.translate(X,Y);c.rotate(-ang);c.globalAlpha=alpha;
  const hl=MAG.hl*V.S,ht=MAG.ht*V.S;c.fillStyle=CS.sPole;c.fillRect(-hl,-ht,hl,2*ht);c.fillStyle=CS.nPole;c.fillRect(0,-ht,hl,2*ht);
  if(spin!=null){c.save();c.beginPath();c.rect(-hl,-ht,2*hl,2*ht);c.clip();c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2;
    for(let k=-4;k<=4;k++){const yy=((k*0.25+spin)%1+1)%1*2*ht-ht;c.beginPath();c.moveTo(-hl,yy-ht*.6);c.lineTo(hl,yy+ht*.6);c.stroke();}c.restore();}
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1;c.strokeRect(-hl,-ht,2*hl,2*ht);c.restore();
  const [nx,ny]=V.p(xm+ca*MAG.hl*.55,ym+sa*MAG.hl*.55),[sx,sy]=V.p(xm-ca*MAG.hl*.55,ym-sa*MAG.hl*.55);
  c.globalAlpha=alpha;txt(c,'N',nx,ny,{col:'#fff',sz:Math.max(11,ht*1.3),w:800});txt(c,'S',sx,sy,{col:'#fff',sz:Math.max(11,ht*1.3),w:800});c.globalAlpha=1;}

function drawElectromagnet(c,V,xm,I,on){const [X,Y]=V.p(xm,0),hl=MAG.hl*V.S,ht=MAG.ht*V.S;
  c.fillStyle=CS.metal;c.fillRect(X-hl,Y-ht,2*hl,2*ht);c.strokeStyle=CS.copper;c.lineWidth=2.4;
  for(let k=0;k<14;k++){const x=X-hl*.85+k*hl*1.7/13;c.beginPath();c.moveTo(x-2,Y-ht-3);c.lineTo(x+2,Y+ht+3);c.stroke();}
  if(I>0.05){c.globalAlpha=clamp(I,0,1);txt(c,'N',X+hl+9,Y,{col:CS.nPole,w:800,sz:14});txt(c,'S',X-hl-9,Y,{col:CS.sPole,w:800,sz:14});c.globalAlpha=1;}
  /* pin và công tắc */
  const by=Y+ht+0.05*V.S,bx=X;c.strokeStyle=CS.ink;c.lineWidth=2;
  c.beginPath();c.moveTo(X-hl*.85,Y+ht);c.lineTo(X-hl*.85,by);c.lineTo(bx-14,by);c.moveTo(bx+14,by);c.lineTo(X+hl*.85-22,by);c.moveTo(X+hl*.85,by);c.lineTo(X+hl*.85,Y+ht);c.stroke();
  c.lineWidth=3;c.beginPath();c.moveTo(bx-6,by-12);c.lineTo(bx-6,by+12);c.stroke();c.lineWidth=5;c.beginPath();c.moveTo(bx+6,by-6);c.lineTo(bx+6,by+6);c.stroke();
  c.lineWidth=2;c.beginPath();c.moveTo(X+hl*.85-22,by);on?c.lineTo(X+hl*.85,by):c.lineTo(X+hl*.85-4,by-14);c.stroke();
  c.fillStyle=CS.ink;c.beginPath();c.arc(X+hl*.85-22,by,3,0,TAU);c.arc(X+hl*.85,by,3,0,TAU);c.fill();
  txt(c,'K',X+hl*.85-11,by+14,{sz:12});txt(c,'+  −',bx,by-20,{sz:11,col:CS.muted});}

/* Điện kế số 0 ở giữa. val = -1..1 ứng với cả thang đo */
function drawMeter(c,cx,cy,R,val,lbl,scale){c.save();rrect(c,cx-R,cy-R*.95,2*R,1.7*R,10);c.fillStyle=CS.panel;c.fill();c.strokeStyle=CS.ink;c.lineWidth=2;c.stroke();
  const px=cx,py=cy+R*.3,rr=R*1.0,A=50*Math.PI/180;c.lineWidth=1.5;c.strokeStyle=CS.muted;
  c.beginPath();c.arc(px,py,rr,-Math.PI/2-A,-Math.PI/2+A);c.stroke();
  for(let k=-4;k<=4;k++){const a=-Math.PI/2+A*k/4,l=k%2===0?9:5;c.beginPath();c.moveTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr);c.lineTo(px+Math.cos(a)*(rr-l),py+Math.sin(a)*(rr-l));c.stroke();}
  txt(c,'0',px,py-rr+16,{sz:11,col:CS.muted,mono:1});txt(c,'−',px+Math.cos(-Math.PI/2-A)*(rr-16),py+Math.sin(-Math.PI/2-A)*(rr-16),{sz:13,col:CS.muted});
  txt(c,'+',px+Math.cos(-Math.PI/2+A)*(rr-16),py+Math.sin(-Math.PI/2+A)*(rr-16),{sz:13,col:CS.muted});
  const a=-Math.PI/2+A*clamp(val,-1.12,1.12);c.strokeStyle=CS.force;c.lineWidth=2.6;c.beginPath();c.moveTo(px,py);c.lineTo(px+Math.cos(a)*(rr-4),py+Math.sin(a)*(rr-4));c.stroke();
  c.fillStyle=CS.ink;c.beginPath();c.arc(px,py,4,0,TAU);c.fill();
  txt(c,lbl,cx-R*.62,cy+R*.52,{w:800,sz:Math.max(11,Math.min(16,R*.3))});if(scale&&R>=34)txt(c,scale,cx+R*.42,cy+R*.55,{sz:11,col:CS.muted,mono:1});c.restore();}

/* ================= Cảnh nam châm – cuộn dây – điện kế (tab 1, tab 2) ================= */
function mkScene(){return{xm:-0.18,ym:0,ang:0,spin:null,xc:0.03,N:400,str:1,closed:true,em:false,Iem:0,emOn:false,
  phi:0,tot:null,e:0,i:0,nd:0,ndv:0,dot:0,v:0,lastRel:null};}
function sceneFlux(S){const q=MAG.q0*S.str*(S.em?S.Iem:1);if(Math.abs(q)<1e-15)return 0;
  const axial=Math.abs(Math.sin(S.ang))<1e-9&&S.ym===0;const nP=axial?7:3;let sum=0;
  for(let j=0;j<nP;j++){const X=S.xc+COIL.l*(j/(nP-1)-.5);sum+=axial?fluxAxial(X,S.xm,Math.cos(S.ang)>0?1:-1,q):fluxGeneral(X,S.xm,S.ym,S.ang,q);}
  return sum/nP;}
function resync(S){S.tot=null;}
function physStep(S,dt){const phi=sceneFlux(S);S.phi=phi;const tot=S.N*phi;if(S.tot==null)S.tot=tot;
  const e=-(tot-S.tot)/dt;S.tot=tot;S.e+=(e-S.e)*Math.min(1,dt/0.012);
  const rel=S.xm-S.xc;if(S.lastRel==null)S.lastRel=rel;S.v+=((rel-S.lastRel)/dt-S.v)*Math.min(1,dt/0.05);S.lastRel=rel;
  const R=COIL.r1*S.N+COIL.rg;S.i=S.closed?S.e/R:0;
  const w0=TAU*2.2,z=.62,tg=clamp(S.i/COIL.iFS,-1.2,1.2);S.ndv+=(w0*w0*(tg-S.nd)-2*z*w0*S.ndv)*dt;S.nd+=S.ndv*dt;
  if(Math.abs(S.nd)>1.12){S.nd=Math.sign(S.nd)*1.12;S.ndv=0;}S.dot+=S.i*dt*900;}
const METER={x:0.19,y:0.085,R:0.042};
function drawWires(c,V,S){const a=COIL.a,l=COIL.l;const L0=[S.xc-l/2,a],R0=[S.xc+l/2,a],mb=METER.y-METER.R*.75;
  const mL=[METER.x-METER.R*.45,mb],mR=[METER.x+METER.R*.45,mb],yw=0.05;
  const pathL=[L0,[L0[0],yw],[mL[0],yw],mL],pathR=[R0,[R0[0],yw-0.012],[mR[0],yw-0.012],mR];
  c.strokeStyle=CS.ink;c.lineWidth=2;
  for(const P of [pathL,pathR]){c.beginPath();P.forEach((p,k)=>{const [X,Y]=V.p(p[0],p[1]);k?c.lineTo(X,Y):c.moveTo(X,Y);});c.stroke();}
  /* công tắc trên dây trái */
  const swx=Math.min(L0[0]+0.03,(L0[0]+mL[0])/2),[sx,sy]=V.p(swx,yw),gap=14;c.strokeStyle=CS.lane;c.lineWidth=5;c.beginPath();c.moveTo(sx-gap,sy);c.lineTo(sx+gap,sy);c.stroke();
  c.strokeStyle=CS.ink;c.lineWidth=2.4;c.beginPath();c.moveTo(sx-gap,sy);S.closed?c.lineTo(sx+gap,sy):c.lineTo(sx+gap-4,sy-15);c.stroke();
  c.fillStyle=CS.ink;c.beginPath();c.arc(sx-gap,sy,3,0,TAU);c.arc(sx+gap,sy,3,0,TAU);c.fill();txt(c,'K',sx,sy+13,{sz:12});
  /* các chấm biểu diễn dòng điện (electron) chạy trong dây */

function draw4(){if(E4.eff==='body')return;const cv=$('cv4');const ph=isPhone();const {c,w,h}=fit(cv,ph?.9:.46);const half=w/2;
  c.strokeStyle=CS.line;c.lineWidth=1;c.beginPath();c.moveTo(half,8);c.lineTo(half,h-8);c.stroke();
  const iD=iDC(),iA=iAC(E4.t),I=iD;
  if(E4.eff==='heat'){drawHeatSide(c,0,half,h,E4.heat.TD,1/2,T('dcSide'));drawHeatSide(c,half,half,h,E4.heat.TA,(iA*iA)/(2*I*I)*1,T('acSide'));
    txt(c,T('heatT')+': '+nf(E4.heat.tH/60,1,1)+(lang==='vi'?' phút':' min'),w/2,h-12,{sz:12,col:CS.muted});}
  else if(E4.eff==='light'){const L=E4.light;for(const [x0,lbl,fl,eye] of [[0,T('dcSide'),L.fD,L.eyeD],[half,T('acSide'),L.fA,L.eyeA]]){const cx=x0+half/2;txt(c,lbl,cx,18,{sz:14,w:700});
      drawBulb(c,cx-half*.2,h*.48,Math.pow(clamp(fl,0,2)/1,1.5)*.9);txt(c,T('bulb'),cx-half*.2,h*.48+52,{sz:12,col:CS.muted});
      drawLED(c,cx+half*.2,h*.48,CS.ledR,clamp(eye,0,1),T('led'),true);}}
  else{const M=E4.mag;drawMagSide(c,0,half,h,M.yD,M.aD,iD,I,T('dcSide'));drawMagSide(c,half,half,h,M.yA,M.aA,iA,I,T('acSide'));}
  /* đồ thị */const g=$('gr4'),{c:c2,w:w2,h:h2}=fit(g,ph?.6:.3),f=f4(),W=2.6/f,t1=Math.max(W,E4.t),t0=t1-W,L=48,H=E4.H,lg=T('lg4'+E4.eff);
  if(E4.eff==='heat'){const P=U4*U4/R4.heat;plot(c2,L,6,w2-L-8,h2-14,{t0,t1,ymin:0,ymax:2.3*P,ylab:'p (W)',xlab:'t (s)',ytick:[nf(2.3*P,0),'0'],
      series:[{d:H.map(r=>[r[0],r[1]]),col:CS.muted,w:2.4,dash:[6,4]},{d:H.map(r=>[r[0],r[2]]),col:CS.heat,w:2.4},{d:[[t0,P],[t1,P]],col:CS.heat,w:1.2,dash:[2,4]}]});}
  else if(E4.eff==='light'){const I=iDC()*1.6;plot(c2,L,6,w2-L-8,h2-14,{t0,t1,ymin:-I,ymax:I,ylab:'i (A)',xlab:'t (s)',ytick:['+'+nf(I,2),'−'+nf(I,2)],
      series:[{d:H.map(r=>[r[0],r[1]]),col:CS.muted,w:2.2,dash:[6,4]},{d:H.map(r=>[r[0],r[2]]),col:CS.vel,w:2.4},{d:H.map(r=>[r[0],r[3]/0.03*I*.9]),col:CS.ledR,w:2}]});}
  else{const I=iDC()*1.6;plot(c2,L,6,w2-L-8,h2-14,{t0,t1,ymin:-I,ymax:I,ylab:'i (A)',xlab:'t (s)',ytick:['+'+nf(I,2),'−'+nf(I,2)],
      series:[{d:H.map(r=>[r[0],r[1]]),col:CS.muted,w:2.2,dash:[6,4]},{d:H.map(r=>[r[0],r[2]]),col:CS.vel,w:2.4},{d:H.map(r=>[r[0],r[3]/0.9*I*.9]),col:CS.nPole,w:2}]});}
  const cols=E4.eff==='heat'?[CS.muted,CS.heat,CS.heat]:E4.eff==='light'?[CS.muted,CS.vel,CS.ledR]:[CS.muted,CS.vel,CS.nPole];
  const lgEl=$('lg4');const key=lang+E4.eff;if(lgEl._k!==key){lgEl._k=key;lgEl.innerHTML=lg.map((s,i)=>`<span><i style="background:${cols[i]}"></i>${esc(s)}</span>`).join('');}}
function zoneOf(mA){return mA<0.5?0:mA<10?1:mA<30?2:mA<50?3:4;}
function ui4(full){const eff=E4.eff,f=f4();if(full){
    seg('eff4',['heat','light','mag','body'].map(k=>({k,label:T('eff'+k[0].toUpperCase()+k.slice(1))})),eff,k=>{E4.eff=k;reset4();ui4(true);});
    $('hint4').textContent=T('hint4'+eff);$('sim4').hidden=eff==='body';$('body4').hidden=eff!=='body';$('kvc4').hidden=eff==='body';
    $('assume4').textContent=T('assume4'+eff);$('ex4').innerHTML=T('ex'+eff);$('p4').innerHTML=predHTML(P4[eff]);
    $('run4').textContent=T(E4.run?'pause':'run');$('rst4').hidden=eff!=='heat';$('f4V').textContent=nf(f,0)+' Hz';
    if(eff==='body'){seg('bu4',[1.5,12,36,220].map(v=>({k:v,label:nf(v,1)+' V'})),E4.bodyU,k=>{E4.bodyU=k;ui4(true);});
      seg('br4',[{k:20000,label:T('skinDry')},{k:5000,label:T('skinMoist')},{k:1000,label:T('skinWet')}],E4.bodyR,k=>{E4.bodyR=k;ui4(true);});
      const mA=E4.bodyU/E4.bodyR*1000,z=zoneOf(mA);$('bi4').textContent=nf(mA,mA<1?2:1)+' mA';
      const lim=['< 0,5 mA','0,5 – 10 mA','10 – 30 mA','30 – 50 mA','> 50 mA'];
      $('zones4').innerHTML=lim.map((l,i)=>`<div class="zone ${i===z?'on':''}"><b>${lang==='vi'?l:l.replace(/,/g,'.')}</b><span>${T('z'+i)}</span></div>`).join('');}}
  const k=slowK4();$('slowNote4').textContent=k>1?Tf('slowNote',{k:nf(k,0)}):T('realNote');
  if(eff==='body')return;const I=iDC();let html=`<dt>${T('kIdc')}</dt><dd class="num">${nf(I,2,2)} A</dd><dt>${T('kIacR')}</dt><dd class="num">${nf(I,2,2)} A</dd><dt>${T('kIacP')}</dt><dd class="num">${nf(I*Math.SQRT2,2,2)} A</dd>`;
  if(eff==='heat')html+=`<dt>${T('kTD')}</dt><dd class="num">${nf(E4.heat.TD,1,1)} °C</dd><dt>${T('kTA')}</dt><dd class="num">${nf(E4.heat.TA,1,1)} °C</dd><dt>${T('pAvg')}</dt><dd class="num">${nf(U4*U4/R4.heat,0)} W</dd>`;
  else if(eff==='light')html+=`<dt>${T('kBulbD')}</dt><dd class="num">${nf(E4.light.fD*100,0)} %</dd><dt>${T('kBulbA')}</dt><dd class="num">${nf(E4.light.fA*100,0)} %</dd><dt>${T('kLedA')}</dt><dd class="t num">${Tf('ledFlick',{n:nf(f,0)})}</dd>`;
  else html+=`<dt>${T('kNailD')}</dt><dd class="t num">${T('pulled')}</dd><dt>${T('kNailA')}</dt><dd class="t num">${T('pulled')}</dd><dt>${T('kNdD')}</dt><dd class="t num">${T('ndStill')}</dd><dt>${T('kNdA')}</dt><dd class="t num">${f>=10?T('ndBuzz'):Tf('ndOsc',{n:nf(f,0)})}</dd>`;
  $('kv4').innerHTML=html;}
$('p4').addEventListener('click',e=>predClick(P4[E4.eff],e,()=>{$('p4').innerHTML=predHTML(P4[E4.eff]);}));
$('run4').onclick=()=>{E4.run=!E4.run;ui4(true);};$('rst4').onclick=()=>{reset4();ui4();};
$('slow4').onchange=e=>{E4.slow=e.target.checked;E4.H=[];ui4();};$('f4').oninput=e=>{E4.fi=+e.target.value;E4.H=[];ui4(true);};

const VSEL={1:0,2:0,3:0,4:0},VPLAY={};
function renderVideo(n){const list=VIDEOS[n],V=list[VSEL[n]],el=$('v'+n),pl=!!VPLAY[n];el.classList.toggle('playing',pl);
  const dur=V.d==='?'?T('vDurUnk'):V.d;
  el.innerHTML=`<div class="vmedia">${pl?`<div class="player" id="pl${n}"></div>`:`<button class="thumb" data-play="${n}" aria-label="${esc(V.t)}"><span class="ph">${T('vNoThumb')}</span><img alt="" src="media/${V.file.replace('.mp4','.jpg')}"><span class="pbtn"></span>${V.d!=='?'?`<span class="dur">${V.d}</span>`:''}</button>`}</div>
  <div class="vt"><span class="lbl">${T('vLbl')} · ${T('vt_'+V.type)} · ${esc(V.c)} · ${dur}</span><span class="ttl">${esc(V.t)}</span>
  <span class="look"><b>${T('vLook')}</b> ${esc(V.look[lang])}</span>
  <div class="vchips">${list.map((x,i)=>`<button class="chip ${i===VSEL[n]?'on':''}" data-vsel="${n}:${i}">${T(i?'vAlt':'vMain')}</button>`).join('')}<a class="chip" href="https://www.youtube.com/watch?v=${V.id}" target="_blank" rel="noopener">YouTube ↗</a></div>
  <span class="src">${T('vNote')}</span></div>`;
  const img=el.querySelector('img');if(img){img.onerror=()=>{if(!img.dataset.t){img.dataset.t=1;img.src='https://i.ytimg.com/vi/'+V.id+'/hqdefault.jpg';}else img.remove();};}
  if(pl){const box=$('pl'+n),vid=document.createElement('video');vid.controls=true;vid.autoplay=true;vid.playsInline=true;
    vid.onerror=()=>{const f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+V.id+'?autoplay=1&rel=0&playsinline=1';
      f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.title=V.t;box.replaceChildren(f);};
    vid.src='media/'+V.file;box.replaceChildren(vid);}}
document.addEventListener('click',e=>{const p=e.target.closest('[data-play]'),s=e.target.closest('[data-vsel]');
  if(p){VPLAY[+p.dataset.play]=true;renderVideo(+p.dataset.play);}
  else if(s){const [n,i]=s.dataset.vsel.split(':').map(Number);VSEL[n]=i;VPLAY[n]=false;renderVideo(n);}});
function renderMedia(){let h=`<thead><tr><th>${T('mTab')}</th><th>${T('mFile')}</th><th>${T('mVideo')}</th><th>${T('mDur')}</th><th>${T('mType')}</th></tr></thead><tbody>`;
  for(const n of [1,2,3,4])VIDEOS[n].forEach((V,i)=>{h+=`<tr><td>${n}${i?' ('+T('vAlt').toLowerCase()+')':''}</td><td><code>media/${V.file}</code></td><td><a href="https://www.youtube.com/watch?v=${V.id}" target="_blank" rel="noopener">${esc(V.t)}</a> · ${esc(V.c)}</td><td>${V.d}</td><td>${T('vt_'+V.type)}</td></tr>`;});
  $('mediaTbl').innerHTML=h+'</tbody>';}

/* ================= Tab, ngôn ngữ, chế độ GV ================= */
let tab=1;
function setTab(n){tab=n;document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.tab===n));
  for(let k=1;k<=4;k++)$('t'+k).hidden=k!==n;store.set('cudt-tab',String(n));
  if(n===3&&G3.mode==='mag'&&!PHI3)buildPhi3();}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>setTab(+b.dataset.tab));
$('gvBtn').onclick=()=>{const on=!document.body.classList.contains('hideNums');document.body.classList.toggle('hideNums',on);$('gvBtn').setAttribute('aria-pressed',on);};
function applyLang(){document.documentElement.lang=lang;document.title=lang==='vi'?'Cảm ứng điện từ':'Electromagnetic induction';
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=T(el.dataset.i18nHtml));
  $('langBtn').textContent=lang==='vi'?'EN':'VI';
  Object.keys(PRED).forEach(renderPred);Object.keys(CONC).forEach(renderConc);[1,2,3,4].forEach(renderVideo);renderMedia();
  ui1(true);ui2(true);ui3(true);ui4(true);}
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi';applyLang();};

/* ================= Vòng lặp ================= */
setup2();reset4();applyLang();
{const t=+store.get('cudt-tab');setTab(t>=1&&t<=4?t:1);}
let last=performance.now(),uiT=0;
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;uiT+=dt;
  try{
    if(tab===1){step1(dt);draw1();if(uiT>.12){uiT=0;ui1();}}
    else if(tab===2){step2(dt);draw2();if(uiT>.12&&U2.run){uiT=0;ui2();}}
    else if(tab===3){step3(dt);draw3();if(uiT>.12){uiT=0;ui3();}}
    else{step4(dt);draw4();if(uiT>.15){uiT=0;ui4();}}
  }catch(err){console.error(err);}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
